# Ba trạng thái của một lần gửi sticker, dựng qua CHÍNH máy trạng thái của màn
# chat (`chat/hang-cho.ts`) trên bàn thử dev: đang gửi, hỏng còn gửi lại được,
# và hỏng vĩnh viễn không mời thử lại.
appId: com.lakiet.rudi
---
- runFlow: _vao-app-sach.yaml
- openLink: rudi://dev/ui-lab
- extendedWaitUntil:
    visible: "Thử tương tác native"
    timeout: 30000
# Mục này nằm CUỐI bàn thử, sau mục dựng cả tám sticker (tám hàng 120dp), nên
# 30 s cuộn không tới. Không centerElement: bẫy đã ghi với phần tử gần cuối.
- scrollUntilVisible:
    element:
      text: "Chat · sticker đang gửi.*"
    direction: DOWN
    timeout: 90000
    centerElement: false
    # Mặc định đòi phần tử hiện 100%. Tiêu đề này là mục CUỐI bàn thử, nên nó
    # dừng ngay khi tiêu đề vừa ló ra mà chưa đủ 100% và báo không thấy (ảnh
    # 72-hang-cho-FAILED của lượt 03:19 cho thấy đúng cảnh ấy).
    visibilityPercentage: 30
# Tiêu đề mục hiện ra trước, ba hàng trạng thái nằm DƯỚI nó, nên chờ tại chỗ
# là chờ một thứ chưa vào khung. Cuộn tiếp tới chính hàng ấy.
- scrollUntilVisible:
    element:
      text: "Đang gửi…"
    direction: DOWN
    timeout: 60000
    centerElement: false
    visibilityPercentage: 30
- assertVisible: "Thử lại"
# Lỗi vĩnh viễn phải nói ra lý do và KHÔNG mời bấm lại.
- assertVisible: "Sticker này bản app chưa có."
- takeScreenshot: r9-72-hang-cho
