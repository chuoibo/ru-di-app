# Cảnh trên màn thật: danh sách bạn bè rỗng và hai tab lời mời rỗng.
appId: com.lakiet.rudi
---
- runFlow: _vao-app-sach.yaml
- openLink: rudi://dev/ui-lab
- extendedWaitUntil:
    visible: "Thử tương tác native"
    timeout: 30000
# Maestro so TRỌN văn bản node, và tiêu đề mục là «Cảnh rỗng · A/B có Nếp và
# tắt Nếp». Không có `.*` thì không khớp, flow cuộn thẳng qua nó xuống tận mục
# sticker rồi hết giờ (đo 09/09).
- scrollUntilVisible:
    element:
      text: "Cảnh rỗng.*"
    direction: DOWN
    timeout: 60000
    centerElement: false
# Tiêu đề mục hiện ra ở đáy màn, còn hai cột cảnh nằm dưới nó. Cuộn thêm tới
# caption của cảnh đầu rồi mới chụp, không thì ảnh chỉ có cái tiêu đề.
- scrollUntilVisible:
    element:
      text: "Một chiếc ghế được kéo ra.*"
    direction: DOWN
    timeout: 30000
    centerElement: false
    visibilityPercentage: 30
- takeScreenshot: r9-73-canh-ab
- scrollUntilVisible:
    element:
      text: "Một tấm lưới che gần kín.*"
    direction: DOWN
    timeout: 60000
    centerElement: false
    visibilityPercentage: 30
- takeScreenshot: r9-73-canh-moi
