# Chọn một nhánh ảnh của Khám phá rồi cuộn xuống chính các hàng để chụp.
#
# Hai bước cuộn, không phải một: sau mỗi lần chụp màn đang đứng DƯỚI dãy chip,
# còn lần đầu thì đứng TRÊN. Cuộn xuống mốc dưới cùng trước, rồi cuộn ngược lên
# tới chip, thì cả hai vị trí xuất phát đều tới được (đo 08/09: chỉ cuộn xuống
# thì lần thứ hai đỏ «No visible element found»).
appId: com.lakiet.rudi
---
- scrollUntilVisible:
    element:
      text: "Cử chỉ: kéo thả và bộ ảnh"
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "${CHIP}"
    direction: UP
    timeout: 20000
- tapOn: "${CHIP}"
# Mục «Chặng» giờ nằm ngay dưới các bộ dựng Khám phá: căn giữa tiêu đề của nó
# thì ô so sánh và hàng danh sách ở ngay trên còn trọn trong màn.
- scrollUntilVisible:
    element:
      text: "Chặng · renderer live, dữ liệu tổng hợp"
    direction: DOWN
    centerElement: true
    timeout: 20000
- takeScreenshot: ${ANH}
