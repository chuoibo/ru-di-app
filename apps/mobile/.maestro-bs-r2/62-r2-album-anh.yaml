# Album của bản trải nghiệm: nhãn ngày, dấu góc gấp trên ảnh in, và chạm ảnh mở
# đúng ảnh (lỗi F03b: nhãn nói «Mở ảnh» nhưng vào chế độ chọn).
appId: com.lakiet.rudi
---
- runFlow: _vao-app-sach.yaml
- openLink: rudi://trips/team-da-lat/album
- extendedWaitUntil:
    visible: "Những ngày mình đi cùng nhau"
    timeout: 30000
- takeScreenshot: r2-30-album-dau
- tapOn: "Mở ảnh 1"
- extendedWaitUntil:
    visible: "Ảnh 1 · Team Đà Lạt"
    timeout: 20000
- takeScreenshot: r2-31-album-mo-anh
- tapOn: "Đóng"
- extendedWaitUntil:
    visible: "Những ngày mình đi cùng nhau"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Chọn ảnh"
    direction: DOWN
    timeout: 30000
- takeScreenshot: r2-32-album-cuoi
