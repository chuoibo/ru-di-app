# Sở thích: lưới tám ô với glyph gu, ở cỡ chữ do bảng đặt.
appId: com.lakiet.rudi
---
- stopApp
- launchApp
- runFlow: _bo-qua-dev-menu.yaml
- extendedWaitUntil:
    visible: "Rủ Đi thôi!"
    timeout: 150000
- tapOn: "Rủ Đi thôi!"
- extendedWaitUntil:
    visible: "Vào bản trải nghiệm Team Đà Lạt"
    timeout: 30000
- tapOn: "Vào bản trải nghiệm Team Đà Lạt"
- extendedWaitUntil:
    visible: "Cho Rủ Đi biết gu của bạn"
    timeout: 30000
- takeScreenshot: r2-40-so-thich
# Nút chính chỉ đọc «Lưu sở thích» sau khi chọn đủ ba, nên cuộn tới phần ngân
# sách rồi vuốt tiếp, đừng chờ một nhãn chưa tồn tại.
- scrollUntilVisible:
    element:
      text: "Mỗi lần đi chơi, bạn thường tiêu khoảng"
    direction: DOWN
    timeout: 30000
- takeScreenshot: r2-41-so-thich-ngan-sach
- swipe:
    direction: UP
- takeScreenshot: r2-42-so-thich-cuoi
