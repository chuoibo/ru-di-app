# F44 (audit native 09/09): placeholder của ô tìm là chữ của nhà vẽ, một dòng.
# Bàn thử dựng ba ô: câu dài 30 ký tự của Khám phá live, câu của «Đi đâu?», và
# một ô đã gõ. Phép đo nằm ở `kiem-placeholder.mjs` (chiều cao node chữ phải là
# MỘT dòng ở cỡ chữ đang đo); flow này chỉ đưa mục lên màn và chụp.
appId: com.lakiet.rudi
---
- runFlow: _vao-app-sach.yaml
- openLink: rudi://dev/ui-lab
- extendedWaitUntil:
    visible: "Thử tương tác native"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Ô tìm · placeholder dài.*"
    direction: DOWN
    timeout: 60000
    centerElement: false
- scrollUntilVisible:
    element:
      text: "Bún bò Huế O Xuân"
    direction: DOWN
    timeout: 30000
    centerElement: false
    visibilityPercentage: 30
- assertVisible: "Tìm thành phố hoặc tỉnh"
- takeScreenshot: r12-78-o-tim
