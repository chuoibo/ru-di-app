# Một sticker trước tám (review vòng 2 §4): «Chờ tí» vẽ bằng ngôn ngữ Nếp, xem
# trong bubble 120 và trong khay 64 trên bàn thử dev, cùng component chat live.
appId: com.lakiet.rudi
---
- runFlow: _vao-app-sach.yaml
- openLink: rudi://dev/ui-lab
- extendedWaitUntil:
    visible: "Thử tương tác native"
    timeout: 30000
# Không centerElement: với nút gần cuối nội dung, Maestro báo «không thấy» dù nút
# nằm trọn giữa màn (ảnh FAILED lượt tối 08/09) — bẫy đã ghi ở bảng chính.
- scrollUntilVisible:
    element:
      text: "Mở khay sticker"
    direction: DOWN
    timeout: 20000
- assertVisible: "Sticker: Chờ tí"
- takeScreenshot: r4-70-bubble-cho-ti
- tapOn: "Mở khay sticker"
- extendedWaitUntil:
    visible: "Khay sticker"
    timeout: 20000
# Sheet trượt lên: nhãn khay có ngay lúc mount, ô bên trong tới sau vài khung
# hình. assertVisible không chờ (đo 08/09: đỏ ngay khi tấm sheet còn ở đáy).
- extendedWaitUntil:
    visible: "Chờ tí"
    timeout: 20000
- takeScreenshot: r4-70-khay
# Chọn một hình cũ để so bubble: cùng cỡ, cùng chỗ, khác ngôn ngữ vẽ.
- tapOn: "Đi thôi!"
- extendedWaitUntil:
    visible: "Sticker: Đi thôi!"
    timeout: 20000
- takeScreenshot: r4-70-bubble-di-thoi
