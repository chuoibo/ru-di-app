# Bình chọn sau F21: ba lựa chọn đều là hình vẽ theo loại, không còn ảnh stock
# đứng cạnh tên một quán thật. Đường vào giống flow 06 của bảng chính.
appId: com.lakiet.rudi
---
- runFlow: _vao-app-sach.yaml
- tapOn: "Tin nhắn"
- scrollUntilVisible:
    element:
      text: "Xem lịch trình"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Mở bình chọn"
- extendedWaitUntil:
    visible: "BBQ tối thứ Bảy ở đâu?"
    timeout: 30000
- assertVisible: "Still Cafe Đà Lạt"
- takeScreenshot: r3-65-binh-chon
