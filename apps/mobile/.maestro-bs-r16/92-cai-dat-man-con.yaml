# R5: bốn màn con của Cài đặt sau khi bỏ Card — mở bằng deep link ấm, chụp từng
# màn. Fixture không có máy chủ nên Phiên/Đã chặn dừng ở trạng thái lỗi (không
# thẻ) — hàng dữ liệu live không chụp được ở đây, ghi là chưa chứng minh.
appId: com.lakiet.rudi
---
- runFlow: _vao-app-sach.yaml
- openLink: rudi://settings/ve-rudi
- extendedWaitUntil:
    visible: "Điều khoản và dữ liệu"
    timeout: 30000
- takeScreenshot: r16-92-ve-rudi
- openLink: rudi://settings/xoa-tai-khoan
- extendedWaitUntil:
    visible: "Xoá tài khoản là vĩnh viễn."
    timeout: 30000
- takeScreenshot: r16-92-xoa-tai-khoan-1
- tapOn: "Tôi hiểu, tiếp tục"
- extendedWaitUntil:
    visible: "Ô xác nhận xoá"
    timeout: 10000
- takeScreenshot: r16-92-xoa-tai-khoan-2
- openLink: rudi://settings/phien
- extendedWaitUntil:
    visible: "Đăng nhập & phiên"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: r16-92-phien
- openLink: rudi://settings/da-chan
- extendedWaitUntil:
    visible: "Người đã chặn"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: r16-92-da-chan
