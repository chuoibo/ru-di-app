# R5: tờ AI trong chat fixture — quyết định trước («Xem lịch trình»), lý do sau một
# cửa mở; câu «Nhóm sửa được trước khi chốt» không còn (badge «AI nháp» nói một lần).
appId: com.lakiet.rudi
---
- runFlow: _vao-app-sach.yaml
- tapOn: "Tin nhắn"
- scrollUntilVisible:
    element:
      text: "Xem lịch trình"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible: "Rủ Đi đã phác một plan"
- assertVisible: "AI nháp"
- assertNotVisible: ".*Nhóm sửa được trước khi chốt.*"
- takeScreenshot: r16-91-chat-ai
- tapOn: "Vì sao phác vậy"
- extendedWaitUntil:
    visible: ".*đỡ mệt.*"
    timeout: 10000
- takeScreenshot: r16-91-chat-ai-mo
