# Nhánh của flow 41 khi máy chủ KHÔNG có khoá mô hình (AI=0): chat hai người.
#
# Hai class (chủ sản phẩm chốt, thay «cặp chỉ hoi»): chat hai người thường là
# ĐÁM BẠN, nhờ Rủ Đi AI y hệt nhóm (gõ @Rủ Đi, /plan, /chia-bill). Không có
# khoá thì chip trên nút gửi nói thật TRƯỚC khi gửi, tin vẫn vào luồng như tin
# thường và không có lời gọi nào. Khay có «Tờ hẹn» như nhóm, không «Tờ giấy»
# (chỉ cặp đôi mới có), và panel tờ hẹn nói thật AI chưa sẵn sàng. Soi theo
# _30-ai-khong-khoa.
#
# Flow 41 đang ở màn chat của cặp, ô soạn trống.
appId: com.lakiet.rudi
---
- tapOn: "Ô soạn tin"
- inputText: "@Ru Di goi y cho hai minh"
- extendedWaitUntil:
    visible: "Rủ Đi AI chưa sẵn sàng · Gửi như tin thường"
    timeout: 60000
- assertNotVisible: "Chỉ gửi lời nhờ"
- takeScreenshot: 41-ai-chip-chua-san-sang
- tapOn: "Gửi tin nhắn"
- hideKeyboard
- extendedWaitUntil:
    visible: "Tin nhắn: @Ru Di goi y cho hai minh"
    timeout: 60000
- assertNotVisible: "Rủ Đi AI chưa nhận lời nhờ"
# Khay của đám bạn hai người: «Tờ hẹn» như nhóm, và panel nói thật.
- tapOn: "Thêm vào cuộc trò chuyện"
- extendedWaitUntil:
    visible: "Tờ hẹn"
    timeout: 15000
- assertNotVisible: "Tờ giấy"
- tapOn: "Tờ hẹn"
- extendedWaitUntil:
    visible: "AI chưa sẵn sàng. Bạn vẫn có thể tự tạo kèo."
    timeout: 15000
- assertNotVisible: "Hỏi Rủ Đi AI"
- assertVisible: "Tự tạo kèo"
- takeScreenshot: 41-khay-ai-chua-san-sang
- tapOn: "Đóng khay công cụ"
