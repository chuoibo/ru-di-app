# Đăng nhập bằng số C — người LÁI của các flow từ 37 trở đi, và là người xem
# story của người kia ở flow 43. Cần vì flow 46 kết thúc bằng một máy đã đăng
# xuất (nó vừa xoá một tài khoản), còn `_43b` chạy SAU cả bảng.
appId: com.lakiet.rudi
---
- tapOn: "Rủ Đi thôi!"
- extendedWaitUntil:
    visible: "Chào bạn"
    timeout: 30000
- tapOn: "Ô số điện thoại"
- inputText: "${OTP_PHONE_C}"
- hideKeyboard
- tapOn: "Gửi mã"
- extendedWaitUntil:
    visible: "Nhập mã 6 số"
    timeout: 60000
- tapOn: "Ô nhập mã"
- inputText: "${OTP_CODE}"
- runFlow:
    file: _bo-qua-so-thich.yaml
