# Cuộn Khám phá live: chọn điểm đến đầu tiên của stack rồi cuộn xuống/lên.
appId: com.lakiet.rudi
---
# Đo v2 (tái audit 10/09, R2): flow này CHỈ là thao tác. Vào app, warm-up và
# đăng nhập nằm ngoài cửa sổ gfxinfo, do do-motion.sh làm một lần trước; ở đây
# chỉ khẳng định màn xuất phát rồi thao tác, và kết thúc về đúng màn ấy.
- assertVisible: "Khám phá"
- tapOn: "Khám phá"
- openLink: rudi://destinations
- extendedWaitUntil:
    visible: "Đi đâu.*"
    timeout: 30000
- tapOn:
    text: "Chọn .*"
    index: 0
    optional: true
- extendedWaitUntil:
    visible: "Khám phá"
    timeout: 30000
- repeat:
    times: 4
    commands:
      - swipe:
          direction: UP
          duration: 400
      - swipe:
          direction: UP
          duration: 400
      - swipe:
          direction: DOWN
          duration: 400
      - swipe:
          direction: DOWN
          duration: 400
- takeScreenshot: motion-live-m2-cuoi
