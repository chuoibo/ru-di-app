# Push/pop một màn của stack (chọn điểm đến) rồi Back — chuyển cảnh slide, lặp.
# Dùng «Đi đâu?» thay chi tiết địa điểm vì tên địa điểm live không cố định.
appId: com.lakiet.rudi
---
# Đo v2 (tái audit 10/09, R2): flow này CHỈ là thao tác. Vào app, warm-up và
# đăng nhập nằm ngoài cửa sổ gfxinfo, do do-motion.sh làm một lần trước; ở đây
# chỉ khẳng định màn xuất phát rồi thao tác, và kết thúc về đúng màn ấy.
- assertVisible: "Khám phá"
- repeat:
    times: 5
    commands:
      - openLink: rudi://destinations
      - extendedWaitUntil:
          visible: "Đi đâu.*"
          timeout: 20000
      - waitForAnimationToEnd:
          timeout: 1500
      - pressKey: Back
      - waitForAnimationToEnd:
          timeout: 1500
- takeScreenshot: motion-live-m4-cuoi
