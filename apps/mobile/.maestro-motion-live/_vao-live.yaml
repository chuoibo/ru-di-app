# Vào app trên build RELEASE nối stack live: đăng nhập OTP nếu chưa, còn đã
# đăng nhập thì đi thẳng. Mã debug chỉ hợp lệ khi API chạy với log sender
# (`scripts/e2e_slice.sh --keep` đặt MOBILE_OTP_DEBUG_CODE=000000). Số điện
# thoại đi qua -e, không nằm trong file.
#
# Hai điểm vào chưa đăng nhập đều được xử lý (tái audit 10/09, B3): màn chào
# «Rủ Đi thôi!» (bấm rồi nhập OTP) và màn «Chào bạn» (đã qua bìa — nhập OTP
# ngay). Bản trước chỉ rẽ ở «Rủ Đi thôi!» nên vào thẳng «Chào bạn» là bỏ OTP
# rồi chờ «Khám phá» tới timeout.
appId: com.lakiet.rudi
---
- stopApp
- launchApp
- runFlow: _bo-qua-dev-menu.yaml
- extendedWaitUntil:
    visible: "Rủ Đi thôi!|Khám phá|Chưa có nhóm nào|Chào bạn"
    timeout: 120000
- runFlow:
    when:
      visible: "Rủ Đi thôi!"
    commands:
      - tapOn: "Rủ Đi thôi!"
      - extendedWaitUntil:
          visible: "Chào bạn"
          timeout: 30000
      - runFlow: _nhap-otp.yaml
- runFlow:
    when:
      visible: "Chào bạn"
    commands:
      - runFlow: _nhap-otp.yaml
- extendedWaitUntil:
    visible: "Khám phá"
    timeout: 30000
