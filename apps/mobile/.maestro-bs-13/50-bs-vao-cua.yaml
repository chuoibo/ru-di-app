# Bằng chứng đợt «bản sắc» 08/09 (không phải cổng): Welcome, Sở thích với tám
# glyph gu, Khám phá theo nhịp lead → hai ứng viên → hàng, và cảnh «tìm không
# ra» trong empty state. Chỉ chụp; các assert là để biết đang đứng ở màn nào.
appId: com.lakiet.rudi
---
- stopApp
- launchApp
- runFlow: _bo-qua-dev-menu.yaml
- assertNotVisible: "Fetch development servers"
- extendedWaitUntil:
    visible: "Rủ Đi thôi!"
    timeout: 150000
- takeScreenshot: bs-01-welcome
- swipe:
    direction: LEFT
- swipe:
    direction: LEFT
- takeScreenshot: bs-01-welcome-trang-3
- tapOn: "Rủ Đi thôi!"
- extendedWaitUntil:
    visible: "Vào bản trải nghiệm Team Đà Lạt"
    timeout: 30000
- tapOn: "Vào bản trải nghiệm Team Đà Lạt"
- extendedWaitUntil:
    visible: "Cho Rủ Đi biết gu của bạn"
    timeout: 30000
- takeScreenshot: bs-03-so-thich
- tapOn: "Ăn uống"
- tapOn: "Cafe"
- tapOn: "Món local"
- takeScreenshot: bs-03-so-thich-da-chon
- tapOn: "Bỏ qua"
- extendedWaitUntil:
    visible: "Khám phá"
    timeout: 30000
- takeScreenshot: bs-04-kham-pha
- tapOn: "Tìm quán, món…"
- inputText: "zzzz"
- extendedWaitUntil:
    visible: "Chưa thấy nơi phù hợp"
    timeout: 20000
- hideKeyboard
- takeScreenshot: bs-04-tim-khong-ra
- tapOn: "Xóa bộ lọc"
- extendedWaitUntil:
    visible: "Tiệm Nướng Xóm Lèo"
    timeout: 20000
- scroll
- takeScreenshot: bs-04-kham-pha-cuon
- scroll
- takeScreenshot: bs-04-kham-pha-cuon-2
