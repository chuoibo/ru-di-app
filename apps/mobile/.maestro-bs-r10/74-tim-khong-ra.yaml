# Cảnh trên MÀN THẬT, không phải bàn thử.
#
# Ô tìm ở Khám phá không ra kết quả nào thì hiện cảnh `tim-khong-ra`. Cả hai
# nhánh của tab Khám phá (fixture `ExploreScreen` và `ExploreLiveScreen`) dùng
# CÙNG tiêu đề và CÙNG cảnh, nên flow này không phụ thuộc vào việc lượt chạy
# rơi vào nhánh nào.
# `hideKeyboard` đã bị gỡ: trên Android nó bấm Back, và Back ở màn này POP ra
# khỏi tab, nên phép chờ bên dưới đỏ với màn chào trên hình (đo 09/09). Maestro
# đọc cây view nên không cần giấu bàn phím mới thấy chữ.
appId: com.lakiet.rudi
---
- runFlow: _vao-app-sach.yaml
# `_vao-app-sach` kết thúc ở tab Khám phá.
- extendedWaitUntil:
    visible: "Tìm quán, món…"
    timeout: 30000
- tapOn: "Tìm quán, món…"
- inputText: "zzzqqq"
- extendedWaitUntil:
    visible: "Chưa thấy nơi phù hợp"
    timeout: 20000
- takeScreenshot: r10-74-tim-khong-ra
