# Màn lỗi thật có cảnh mặc định `chua-doc-duoc` mà không màn nào phải nhớ gì.
#
# `DiemDenScreen` gọi máy chủ lúc mount. Không có stack thì nó rơi vào
# `ErrorState`, và `ErrorState` tự gắn cảnh — đó là thứ flow này đo.
#
# Bản trước của flow này SAI: nó có thêm một nhánh gõ từ khoá để lấy ô rỗng
# `bo-loc-che-het`, và cho rằng hai nhánh loại trừ nhau. Không: ô tìm hiện ở CẢ
# hai trạng thái, nên nhánh kia vẫn chạy trên màn đang lỗi rồi chờ một kết quả
# không bao giờ tới. Ô `bo-loc-che-het` của màn này chỉ tới được khi có stack
# thật; không có stack thì nói là CHƯA ĐO, đừng bịa một phép chờ.
