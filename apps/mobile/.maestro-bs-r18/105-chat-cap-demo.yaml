# Phase 2: chat của cặp fixture mang hàng ghim «Tờ giấy của hai mình» thay hàng chuyến đi; bấm thì vào không gian giấy.
appId: com.lakiet.rudi
---
- runFlow: _vao-app-sach.yaml
- openLink: rudi://groups/cap-demo/chat
- extendedWaitUntil:
    visible: "Tờ giấy của hai mình"
    timeout: 30000
- assertVisible: "Người ấy"
- assertVisible: "Chưa có tờ nào tuần này. Đi đâu không?"
- takeScreenshot: r18-105-chat
- tapOn:
    id: "hang-to-giay"
- extendedWaitUntil:
    visible: "Rủ đi chơi"
    timeout: 15000
- assertVisible: "Đã giữ"
- takeScreenshot: r18-105-giay
