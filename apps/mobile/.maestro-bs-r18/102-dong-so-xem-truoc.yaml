# Phase 2: đóng sổ có xem trước — số tờ sẽ khoá hiện trước nút; đóng là đóng.
appId: com.lakiet.rudi
---
- runFlow: _vao-app-sach.yaml
- openLink: rudi://groups/cap-demo/to-giay
# The paper surface opens on last week's memory (spec §15.1: the freshest memory
# is the sheet on the table when nothing is in play); «Rủ đi chơi» is the footer.
- extendedWaitUntil:
    visible: "Rủ đi chơi"
    timeout: 30000
- assertVisible: "Ký ức"
- tapOn:
    text: "Rủ đi chơi"
    index: 0
- extendedWaitUntil:
    visible: "Gửi cho người ấy"
    timeout: 15000
- tapOn: "Cài đặt sổ"
- extendedWaitUntil:
    visible: "Đóng sổ"
    timeout: 15000
- tapOn: "Đóng sổ"
- extendedWaitUntil:
    visible: "Đóng sổ hai người?"
    timeout: 15000
- assertVisible: "· 1 tờ đang chờ sẽ huỷ."
- assertVisible: "· Không có lời đề nghị nào đang chờ."
- takeScreenshot: r18-102-xem-truoc
- tapOn:
    text: "Đóng sổ"
    index: 0
- extendedWaitUntil:
    visible: "Sổ này đã đóng"
    timeout: 15000
- assertVisible: "Lập sổ mới"
- takeScreenshot: r18-102-da-dong
