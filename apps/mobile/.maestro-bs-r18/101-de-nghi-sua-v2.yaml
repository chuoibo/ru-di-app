# Phase 2: người kia đề nghị sửa → phiên bản 2 do người kia gửi, hiện đúng cái gì đổi; tôi ừ → chốt.
appId: com.lakiet.rudi
---
- runFlow: _vao-app-sach.yaml
- openLink: rudi://groups/cap-demo/to-giay
# The paper surface opens on last week's memory (spec §15.1: the freshest memory
# is the sheet on the table when nothing is in play); «Rủ đi chơi» is the footer.
- extendedWaitUntil:
    visible: "Rủ đi chơi"
    timeout: 30000
- assertVisible: "Ký ức"
- tapOn:
    text: "Rủ đi chơi"
    index: 0
- extendedWaitUntil:
    visible: "Gửi cho người ấy"
    timeout: 15000
- tapOn: "Gửi cho người ấy"
- extendedWaitUntil:
    visible: "Bản trải nghiệm: đóng vai người ấy"
    timeout: 15000
- tapOn: "Bản trải nghiệm: đóng vai người ấy"
- extendedWaitUntil:
    visible: "(Bản trải nghiệm) Người kia đề nghị sửa giờ"
    timeout: 15000
- tapOn: "(Bản trải nghiệm) Người kia đề nghị sửa giờ"
- extendedWaitUntil:
    visible: "Phiên bản 2 đổi gì so với trước:"
    timeout: 15000
# The fixture's counter-proposal moves 18:30 EARLIER, and its reason says so:
# the direction and the reason have to agree (blind read 12/09, round 2).
- assertVisible: "· Giờ chỗ chính: 18:30 → 18:00"
- assertVisible: "Vì sao sửa: Sớm hơn một chút."
- assertVisible: "Người ấy vừa gửi. Bạn ừ, hay đề nghị sửa?"
- assertVisible: "Ừ"
- assertVisible: "Đề nghị sửa"
- takeScreenshot: r18-101-khac-gi
- tapOn: "Ừ"
- extendedWaitUntil:
    visible: "Đã chốt"
    timeout: 15000
- takeScreenshot: r18-101-chot-v2
