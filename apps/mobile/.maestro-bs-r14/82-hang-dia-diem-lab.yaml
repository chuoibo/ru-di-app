# R3: bàn thử «Khám phá · renderer live» trên ui-lab với trạng thái Không ảnh —
# cùng component PlaceLead/PlaceCompare/PlaceRow, ô loại nơi bằng giấy.
appId: com.lakiet.rudi
---
- runFlow: _vao-app-sach.yaml
- openLink: rudi://dev/ui-lab
- extendedWaitUntil:
    visible: "Thử tương tác native"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Khám phá · renderer live.*"
    direction: DOWN
    timeout: 60000
    centerElement: false
# Cuộn tới ứng viên thứ hai của cặp so sánh để cả lead lẫn cặp nằm trong ảnh.
- scrollUntilVisible:
    element:
      text: "Lẩu gà lá é|Lẩu Gà Lá É.*"
    direction: DOWN
    timeout: 30000
    centerElement: false
    visibilityPercentage: 60
- takeScreenshot: r14-82-lab
