# Tám sticker Nếp trong khay thật và trong bubble thật (PR tám sticker).
# Câu hỏi bảng này trả lời: bộ tám có đọc ra tám HÀNH ĐỘNG khác nhau ở ô 64
# không, và nhãn «Cà phê không?» còn bị cắt không.
appId: com.lakiet.rudi
---
- runFlow: _vao-app-sach.yaml
- openLink: rudi://dev/ui-lab
- extendedWaitUntil:
    visible: "Thử tương tác native"
    timeout: 30000
# Khay TRƯỚC: nút mở khay nằm TRÊN mục tám sticker, nên cuộn xuống mục ấy rồi
# mới đòi cuộn DOWN tới nút là đòi một thứ đã trôi qua phía trên (đo 09/09).
# Không centerElement: bẫy đã ghi với phần tử gần cuối nội dung cuộn.
- scrollUntilVisible:
    element:
      text: "Mở khay sticker"
    direction: DOWN
    timeout: 30000
    centerElement: false
- tapOn: "Mở khay sticker"
- extendedWaitUntil:
    visible: "Khay sticker"
    timeout: 20000
- extendedWaitUntil:
    visible: "Chờ tí"
    timeout: 20000
# Nhãn dài nhất của từ vựng: trước lượt này nó ra «Cà phê khôn…».
- assertVisible: "Cà phê không?"
- takeScreenshot: r13-71-khay-tam-o
- tapOn: "Cà phê không?"
- extendedWaitUntil:
    visible: "Sticker: Cà phê không?"
    timeout: 20000
- takeScreenshot: r13-71-bubble-ca-phe
# Rồi mới tới mục dựng cả tám ở hai cỡ đọc, nằm dưới nút khay.
- scrollUntilVisible:
    element:
      text: "Chat · cả tám sticker ở hai cỡ đọc"
    direction: DOWN
    timeout: 30000
    centerElement: false
- takeScreenshot: r13-71-tam-sticker-tren
- scrollUntilVisible:
    element:
      text: "Tuyệt vời"
    direction: DOWN
    timeout: 30000
    centerElement: false
- takeScreenshot: r13-71-tam-sticker-duoi
