# Chỉ phần Khám phá của bàn thử, để chạy nhanh ở các cỡ chữ: hàng dẫn, ô so
# sánh và hàng danh sách ở nhánh không ảnh, rồi tên dài.
appId: com.lakiet.rudi
---
- runFlow: _vao-app-sach.yaml
- openLink: rudi://dev/ui-lab
- extendedWaitUntil:
    visible: "Thử tương tác native"
    timeout: 30000
- runFlow:
    file: _ca-kham-pha.yaml
    env:
      CHIP: "Không ảnh"
      ANH: "r2-50-lab-kham-pha-khong-anh"
- runFlow:
    file: _ca-kham-pha.yaml
    env:
      CHIP: "Có ảnh"
      ANH: "r2-51-lab-kham-pha-co-anh"
- runFlow:
    file: _ca-kham-pha.yaml
    env:
      CHIP: "Ảnh hỏng"
      ANH: "r2-52-lab-kham-pha-anh-hong"
- runFlow:
    file: _ca-kham-pha.yaml
    env:
      CHIP: "Cặp lệch"
      ANH: "r2-53-lab-kham-pha-cap-lech"
- runFlow:
    file: _ca-kham-pha.yaml
    env:
      CHIP: "Tên dài"
      ANH: "r2-54-lab-kham-pha-ten-dai"
