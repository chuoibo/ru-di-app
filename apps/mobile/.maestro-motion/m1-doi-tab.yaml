# Cổng motion §5 (audit 09/09): đổi tab qua lại — chuỗi thao tác đo frame time.
# Không assert gì ngoài việc màn đổi: số đo lấy từ `dumpsys gfxinfo` bên ngoài.
appId: com.lakiet.rudi
---
# Đo v2 (tái audit 10/09, R2): flow này CHỈ là thao tác. Vào app, warm-up và
# đăng nhập nằm ngoài cửa sổ gfxinfo, do do-motion.sh làm một lần trước; ở đây
# chỉ khẳng định màn xuất phát rồi thao tác, và kết thúc về đúng màn ấy.
- assertVisible: "Khám phá"
- repeat:
    times: 5
    commands:
      - tapOn: "Lên plan"
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn: "Tin nhắn"
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn: "Cá nhân"
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn: "Khám phá"
      - waitForAnimationToEnd:
          timeout: 1500
- takeScreenshot: motion-m1-cuoi
