# F41 (audit native 09/09): hàng sticker hỏng có HAI nút cùng hàng, và «Thử lại»
# từng tràn khỏi mép trái màn — node vẫn có trong cây view, nên `assertVisible`
# XANH trong khi mắt không thấy chữ (ảnh 16 của Codex). Vì thế flow này chỉ đưa
# ba hàng của bàn thử lên màn và chụp; phép đo thật nằm ở `kiem-bounds.mjs`
# (docs/claude/2026-09-10/native-r11), đọc bounds của «Thử lại»/«Bỏ» trong
# hierarchy dump sau flow và đòi cả hai nằm trọn trong bề rộng màn.
#
# Chạy ở 1.0 / 1.3 / 2.0 × sáng / tối bằng `chup-va-do.sh` cùng thư mục.
appId: com.lakiet.rudi
---
- runFlow: _vao-app-sach.yaml
- openLink: rudi://dev/ui-lab
- extendedWaitUntil:
    visible: "Thử tương tác native"
    timeout: 30000
# Maestro so TRỌN văn bản node: tiêu đề mục là «Chat · sticker đang gửi, hỏng,
# và gửi lại», không có `.*` thì không khớp (đo 09/09, flow 73).
- scrollUntilVisible:
    element:
      text: "Chat · sticker đang gửi.*"
    direction: DOWN
    timeout: 60000
    centerElement: false
# Cuộn tới caption của hàng cuối để cả hàng «hỏng, gửi lại được» (hai nút) và
# hàng «hỏng vĩnh viễn» (một nút) cùng nằm trên màn.
- scrollUntilVisible:
    element:
      text: "Hỏng vĩnh viễn.*"
    direction: DOWN
    timeout: 60000
    centerElement: false
    visibilityPercentage: 30
- assertVisible: "Thử lại"
- assertVisible:
    text: "Bỏ"
    index: 0
- takeScreenshot: r11-76-hang-cho
