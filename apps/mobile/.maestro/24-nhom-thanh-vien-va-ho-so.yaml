# M2 trên cửa tài khoản: nhóm mình vừa mở hiện ở Tin nhắn với số liệu của máy
# chủ, roster gọi đúng mình là quản trị, mời một người bằng tên tài khoản (lời
# mời chờ chính người ấy đăng nhập và đồng ý), và tab Cá nhân đọc hồ sơ thật
# rồi sửa được tên.
#
# Tài khoản đi qua `-e` như flow 22/23, nhưng là CẶP RIÊNG (C tạo nhóm, D được
# mời): người của flow 22 đã có nhóm, người của flow 23 đã đăng nhập, nên dùng
# lại thì «Chưa có nhóm nào» sai vì lý do không phải app. D đã tự đặt tên
# «Ban QA» (harness, PATCH /people/me) — từ ADR-0055 lời mời không đặt tên ai,
# và roster phải hiện đúng tên chính D chọn. Harness đăng nhập D qua curl SAU
# flow để chứng minh máy chủ thật sự giữ lời mời (`kiem_may_chu_sau_24`).
appId: com.lakiet.rudi
---
- stopApp
- launchApp
- runFlow: _bo-qua-dev-menu.yaml
- assertNotVisible: "Fetch development servers"
- extendedWaitUntil:
    visible: "Rủ Đi thôi!|Khám phá|Chưa có nhóm nào"
    timeout: 150000
- runFlow: _dang-xuat-neu-co.yaml
- runFlow:
    file: _dang-nhap-tai-khoan.yaml
    env:
      TK: "${TK_C}"
      MK: "${MK_C}"
- extendedWaitUntil:
    visible: "Chưa có nhóm nào"
    timeout: 60000
- tapOn: "Tạo nhóm"
- extendedWaitUntil:
    visible: "Đặt tên cho hội"
    timeout: 30000
- tapOn: "Ô tên nhóm"
- inputText: "Hoi QA"
- hideKeyboard
- tapOn: "Mở nhóm"
- runFlow: _vao-nhom-vua-lap.yaml
# Tin nhắn: danh sách nhóm từ máy chủ, không phải chat fixture.
- tapOn: "Tin nhắn"
- extendedWaitUntil:
    visible: "Hoi QA"
    timeout: 60000
- assertVisible: "1 thành viên · bạn quản trị"
- assertNotVisible: "Nhắn Team Đà Lạt..."
- assertNotVisible: "Dữ liệu demo"
- takeScreenshot: 24-danh-sach-nhom
- tapOn: "Hoi QA"
# M3: bấm hàng mở CHAT; roster nằm sau icon «Thành viên nhóm» ở header.
- extendedWaitUntil:
    visible: "Ô soạn tin"
    timeout: 60000
- tapOn: "Thành viên nhóm"
- extendedWaitUntil:
    visible: "Thành viên"
    timeout: 30000
- assertVisible: "1 đang ở trong nhóm, 0 đang được mời."
# Tài khoản mới mang username làm tên cho tới khi người ấy tự đổi.
- assertVisible: "${TK_C} (bạn)"
- takeScreenshot: 24-thanh-vien
# Mời bằng tên tài khoản: tra username (POST /friends/lookup) rồi tạo một
# membership `invited`. Không bịa id, không đặt tên thay ai.
- tapOn: "Mời bằng tên tài khoản"
- extendedWaitUntil:
    visible: "Mời bằng username"
    timeout: 30000
- tapOn: "Tên tài khoản"
- inputText: "${TK_D}"
- hideKeyboard
- tapOn: "Gửi lời mời"
- extendedWaitUntil:
    visible: "Đã gửi lời mời tới Ban QA."
    timeout: 60000
- takeScreenshot: 24-da-moi
- tapOn: "Về nhóm"
- extendedWaitUntil:
    visible: "1 đang ở trong nhóm, 1 đang được mời."
    timeout: 60000
- assertVisible: "Ban QA"
- assertVisible: "Đã mời, chưa đồng ý"
- takeScreenshot: 24-roster-co-loi-moi
# Cá nhân: hồ sơ của máy chủ, không phải «Minh Anh · Cấp 12».
- tapOn: "Quay lại"
- extendedWaitUntil:
    visible: "Ô soạn tin"
    timeout: 30000
- tapOn: "Quay lại"
- extendedWaitUntil:
    visible: "Tin nhắn"
    timeout: 30000
- tapOn: "Cá nhân"
- extendedWaitUntil:
    visible: "Phiên này: Mật khẩu"
    timeout: 60000
- assertNotVisible: "Minh Anh"
- assertNotVisible: "Dữ liệu demo"
# Không còn chuyến Team Đà Lạt hay «12 huy hiệu» của fixture dưới một hồ sơ thật.
- assertNotVisible: ".*Team Đà Lạt.*"
- assertNotVisible: "12 huy hiệu đã mở khóa"
# Hồ sơ sống (đợt chuyển mình 06/09) in một dòng sự thật «0 bạn bè · 1 nhóm · …» thay ô stat.
- assertVisible: ".*1 nhóm.*"
- takeScreenshot: 24-ho-so-that
- tapOn: "Chỉnh hồ sơ"
- extendedWaitUntil:
    visible: "Lưu hồ sơ"
    timeout: 30000
- tapOn: "Ô tên hiển thị"
- eraseText: 40
- inputText: "An QA"
- hideKeyboard
- tapOn: "Lưu hồ sơ"
- extendedWaitUntil:
    visible: "An QA"
    timeout: 60000
- assertNotVisible: "Lưu hồ sơ"
- takeScreenshot: 24-ho-so-da-sua
