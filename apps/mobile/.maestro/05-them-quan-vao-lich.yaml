# PR claim: "«Thêm vào Đà Lạt cuối tuần» đổi 18:00 thành quán vừa chọn".
appId: com.lakiet.rudi
---
- runFlow: _vao-app-sach.yaml
- scrollUntilVisible:
    element:
      text: "Still Cafe Đà Lạt"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Still Cafe Đà Lạt"
# The place's own line under its name. It was «Cà phê view đồi, không gian yên»
# until commit 4481762f («một dấu cho một địa điểm») rewrote the fixture's
# subtitles; this flow kept asserting the old one and has been red ever since,
# unnoticed because the default table is run by hand, not by CI (12/09).
- extendedWaitUntil:
    visible: "Ghế gỗ, cửa kính, nhạc nhỏ"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Thêm vào Đà Lạt cuối tuần"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Thêm vào Đà Lạt cuối tuần"
# The button navigates straight to the itinerary.
- extendedWaitUntil:
    visible: "18:00"
    timeout: 30000
- assertVisible: "Still Cafe Đà Lạt"
- assertNotVisible: "BBQ bên hồ Tuyền Lâm"
- takeScreenshot: 05-itinerary-updated
