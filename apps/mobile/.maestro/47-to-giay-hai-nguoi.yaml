# Sổ hai người và tờ giấy trên API prod (ADR-0027, Phase 4).
#
# Chạy SAU flow 41 trong cùng lượt: nó để lại một cặp thật giữa C và D, và cặp
# ấy là điều kiện — sổ hai người chỉ sống trong một context `pair`. Chạy sau 46
# cũng an toàn: 46 chỉ xoá F.
#
# Cả thang đồng ý lẫn vòng tờ giấy, qua HAI tài khoản thật trên một máy:
#   C: chat hai người thường là đám bạn, KHÔNG có hàng ghim «Tờ giấy»; vào
#      qua «Cài đặt nhóm» → dòng «Tờ giấy của hai mình» → đề nghị lập sổ.
#   D: cùng lối ấy → «Người ấy đã đề nghị» → Đồng ý → sổ mở → đề nghị bật
#      «Một đôi».
#   C: cùng lối ấy → «Đồng ý là một đôi» → thành cặp đôi.
#   D: giờ là cặp đôi, hàng ghim «Tờ giấy của hai mình» hiện trong chat →
#      «Rủ đi chơi» → bản phác → Gửi.
#   C: hàng ghim → mở tờ → «Ừ» → «Đã chốt».
#
# Vì sao phải hai tài khoản: một bậc đồng ý cần HAI người khác nhau, và «đồng ý»
# một tờ giấy cũng thế (§3.4). Một máy đóng cả hai vai chỉ có ở bản trải nghiệm,
# và bản dựng này tắt cửa fixture.
appId: com.lakiet.rudi
---
- stopApp
- launchApp
- runFlow: _bo-qua-dev-menu.yaml
- extendedWaitUntil:
    visible: "Rủ Đi thôi!|Khám phá|Chưa có nhóm nào"
    timeout: 150000
- runFlow: _dang-xuat-neu-co.yaml
- extendedWaitUntil:
    visible: "Rủ Đi thôi!"
    timeout: 60000
- runFlow: _dang-nhap-c.yaml
- extendedWaitUntil:
    visible: "Khám phá"
    timeout: 60000
# --- C đề nghị lập sổ ---------------------------------------------------------
- tapOn: "Tin nhắn"
- extendedWaitUntil:
    visible: "Nhắn riêng"
    timeout: 60000
- tapOn: "Nhắn riêng"
- extendedWaitUntil:
    visible: "Ô soạn tin"
    timeout: 60000
# Chưa là cặp đôi: không có hàng ghim «Tờ giấy», chat như đám bạn. Lối vào
# không gian giấy (và «Một đôi») là dòng trong cài đặt, có ở mọi chat hai người.
- assertNotVisible: "Tờ giấy của hai mình"
- tapOn: "Cài đặt nhóm"
- tapOn: "Tờ giấy của hai mình"
- extendedWaitUntil:
    visible: "Một chỗ cho chuyện hai mình"
    timeout: 60000
- takeScreenshot: 47a-chua-co-so
- tapOn: "Đề nghị lập sổ"
- extendedWaitUntil:
    visible: "Lập sổ lời hẹn"
    timeout: 30000
- takeScreenshot: 47b-bac-lap-so
- tapOn: "Đề nghị lập sổ"
# Máy chủ đã ghi lời đề nghị và đồng ý của chính người đề nghị.
- extendedWaitUntil:
    visible: "Đã đề nghị.*"
    timeout: 60000
- tapOn: "Để sau"
# --- D nhận lời đề nghị và đồng ý ---------------------------------------------
# Về tới một màn mà `_dang-xuat-neu-co` nhận ra: nó rẽ theo «Khám phá» hoặc
# «Chưa có nhóm nào», và từ không gian giấy thì cả hai đều không thấy — nên nó
# SKIP cả hai nhánh, không đăng xuất ai, và assert kế tiếp đỏ.
- pressKey: Back
- pressKey: Back
- extendedWaitUntil:
    visible: "Khám phá"
    timeout: 30000
- runFlow: _dang-xuat-neu-co.yaml
- extendedWaitUntil:
    visible: "Rủ Đi thôi!"
    timeout: 60000
- runFlow: _dang-nhap-d.yaml
- extendedWaitUntil:
    visible: "Khám phá"
    timeout: 60000
- tapOn: "Tin nhắn"
- extendedWaitUntil:
    visible: "Nhắn riêng"
    timeout: 60000
- tapOn: "Nhắn riêng"
- extendedWaitUntil:
    visible: "Ô soạn tin"
    timeout: 60000
- tapOn: "Cài đặt nhóm"
- tapOn: "Tờ giấy của hai mình"
- extendedWaitUntil:
    visible: "Xem lời đề nghị"
    timeout: 60000
- tapOn: "Xem lời đề nghị"
# Phía NGƯỜI NHẬN: một câu nói ai đề nghị, và một nút để trả lời. Bản đầu hiện
# «chờ người ấy đồng ý» cho cả hai phía, nên người nhận không có việc gì bấm.
- extendedWaitUntil:
    visible: '.*đã đề nghị\. Bạn đồng ý thì sổ mở.*'
    timeout: 30000
- takeScreenshot: 47c-ho-de-nghi
- tapOn: "Đồng ý"
# Opening a notebook does not establish a couple (ADR-0039).
- extendedWaitUntil:
    visible: "Hai người cũng thành một hội"
    timeout: 60000
- assertNotVisible: "Rủ đi chơi"
- tapOn: "Mở sổ cặp đôi"
- tapOn:
    id: "loai-so-doi"
- tapOn: "Đề nghị bật «Một đôi»"
- assertVisible: "Đã đề nghị.*"
- tapOn: "Để sau"
- pressKey: Back
- pressKey: Back
- extendedWaitUntil:
    visible: "Khám phá"
    timeout: 30000
- runFlow: _dang-xuat-neu-co.yaml
- extendedWaitUntil:
    visible: "Rủ Đi thôi!"
    timeout: 60000
- runFlow: _dang-nhap-c.yaml
- extendedWaitUntil:
    visible: "Khám phá"
    timeout: 60000
- tapOn: "Tin nhắn"
- tapOn: "Nhắn riêng"
# Chưa là cặp đôi (mới D đề nghị): vẫn vào qua cài đặt.
- extendedWaitUntil:
    visible: "Ô soạn tin"
    timeout: 60000
- tapOn: "Cài đặt nhóm"
- tapOn: "Tờ giấy của hai mình"
- tapOn: "Mở sổ cặp đôi"
- tapOn: "Đồng ý là một đôi"
# Agreeing closes the sheet by itself; the header now names the couple.
- extendedWaitUntil:
    visible: "Một đôi · .*"
    timeout: 30000
- pressKey: Back
- pressKey: Back
- extendedWaitUntil:
    visible: "Khám phá"
    timeout: 30000
- runFlow: _dang-xuat-neu-co.yaml
- extendedWaitUntil:
    visible: "Rủ Đi thôi!"
    timeout: 60000
- runFlow: _dang-nhap-d.yaml
- extendedWaitUntil:
    visible: "Khám phá"
    timeout: 60000
- tapOn: "Tin nhắn"
- tapOn: "Nhắn riêng"
# Cả hai đã bật «Một đôi»: giờ là cặp đôi, hàng ghim hiện dưới tiêu đề.
- extendedWaitUntil:
    visible: "Tờ giấy của hai mình"
    timeout: 60000
- tapOn: "Tờ giấy của hai mình"
- extendedWaitUntil:
    visible: "Rủ đi chơi"
    timeout: 60000
- takeScreenshot: 47d-so-da-mo
# --- D phác một tờ và gửi -----------------------------------------------------
- tapOn: "Rủ đi chơi"
- extendedWaitUntil:
    visible: "Bản phác"
    timeout: 60000
- takeScreenshot: 47e-ban-phac
# Nhãn đầy đủ, không phải «Gửi»: nút nói nó gửi cho AI.
- tapOn: "Gửi cho người ấy"
- extendedWaitUntil:
    visible: "Đã gửi"
    timeout: 60000
# --- C mở tờ ra và ừ ----------------------------------------------------------
- pressKey: Back
- pressKey: Back
- extendedWaitUntil:
    visible: "Khám phá"
    timeout: 30000
- runFlow: _dang-xuat-neu-co.yaml
- extendedWaitUntil:
    visible: "Rủ Đi thôi!"
    timeout: 60000
- runFlow: _dang-nhap-c.yaml
- extendedWaitUntil:
    visible: "Khám phá"
    timeout: 60000
- tapOn: "Tin nhắn"
- extendedWaitUntil:
    visible: "Nhắn riêng"
    timeout: 60000
- tapOn: "Nhắn riêng"
- extendedWaitUntil:
    visible: "Ô soạn tin"
    timeout: 60000
- tapOn: "Tờ giấy của hai mình"
- extendedWaitUntil:
    visible: "Ừ, hẹn.*"
    timeout: 60000
- takeScreenshot: 47f-nhan-duoc
- tapOn: "Ừ, hẹn.*"
# Hai người đồng ý cùng một phiên bản: máy chủ chốt và sinh kèo.
- extendedWaitUntil:
    visible: "Đã chốt"
    timeout: 60000
- takeScreenshot: 47g-da-chot
