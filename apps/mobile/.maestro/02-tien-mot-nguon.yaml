# Core PR claim: settlement and finance derive from ONE integer-dong split.
# Walked as a person walks it: tabs → Cá nhân → Tài chính → Quyết toán.
# centerElement keeps the row clear of the bottom tab bar + FAB before tapping.
appId: com.lakiet.rudi
---
- runFlow: _vao-app-sach.yaml
- tapOn: "Cá nhân"
- scrollUntilVisible:
    element:
      text: "Tài chính của tôi"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Tài chính của tôi"
# Tài chính là sổ phẳng (đợt chuyển mình 06/09): câu tổng nằm ở phụ đề dòng
# đầu, câu về bộ lọc kỳ là một dòng riêng; assertVisible so trọn văn bản node.
- extendedWaitUntil:
    visible: "Cả chuyến 3.840.000đ · một bill Xóm Lèo 1.280.000đ"
    timeout: 30000
- assertVisible: "Không có dữ liệu tháng khác nên không hiện bộ lọc kỳ."
# Minh Anh (collector, index 0): 173.750đ of the bill + 320.000đ of
# homestay+xăng = 493.750đ. Hand-checked against BILL_ITEMS / OTHER_TRIP_ITEMS.
- assertVisible: "493.750đ"
- assertVisible: "1.106.250đ"
- assertNotVisible: "2.840.000đ"
- takeScreenshot: 02-finance
- scrollUntilVisible:
    element:
      text: "Xem quyết toán"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Xem quyết toán"
- extendedWaitUntil:
    visible: "Quyết toán chuyến đi"
    timeout: 30000
- assertVisible: "3.840.000đ"
# Quyết toán là sổ phẳng: bill và phần còn lại là hai dòng sổ, mỗi dòng một số.
- assertVisible: "Bill Xóm Lèo"
- assertVisible: "1.280.000đ"
- assertVisible: "Homestay + xăng"
- assertVisible: "2.560.000đ"
# Same 1.106.250đ the finance screen printed → one source, not two constants.
- assertVisible: "1.106.250đ"
- assertNotVisible: "2.840.000đ"
- takeScreenshot: 02-settlement
