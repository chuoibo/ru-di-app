# Bạn bè, hai người, một điện thoại (M2): C gửi lời mời kết bạn tới D bằng tên
# tài khoản; D đăng nhập, đồng ý lời mời vào nhóm (từ flow 24) rồi đồng ý kết
# bạn; hai người là bạn trên máy chủ. Chạy SAU flow 24 trong cùng lượt và dùng
# lại đúng cặp C/D của nó — trạng thái ấy là điều kiện: D mang tên «Ban QA» do
# chính D đặt, và có một lời mời vào «Hoi QA» đang chờ.
# Harness kiểm máy chủ sau flow: đăng nhập D qua curl → counts.friends = 1,
# counts.contexts = 1 (kiem_may_chu_sau_25).
appId: com.lakiet.rudi
---
- stopApp
- launchApp
- runFlow: _bo-qua-dev-menu.yaml
- extendedWaitUntil:
    visible: "Rủ Đi thôi!|Khám phá|Chưa có nhóm nào"
    timeout: 150000
- runFlow: _dang-xuat-neu-co.yaml
# --- C: gửi lời mời kết bạn tới D ---------------------------------------------
- runFlow:
    file: _dang-nhap-tai-khoan.yaml
    env:
      TK: "${TK_C}"
      MK: "${MK_C}"
# C có nhóm từ flow 24 → vào thẳng tab.
- extendedWaitUntil:
    visible: "Khám phá"
    timeout: 60000
- tapOn: "Cá nhân"
# The profile tab may still be leaving a screen pushed on it: wait for its own
# heading and the transition's end before looking for a row.
- extendedWaitUntil:
    visible: "Không gian của riêng bạn"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
# The row's subtitle is unique on the tab («Bạn bè» also names the passport count and
# other mounted tabs); centred, so the tab bar and the «Tạo» stamp never cover it.
- scrollUntilVisible:
    element:
      text: "(Bạn bè, lời mời đã nhận và đã gửi|[0-9]+ lời mời kết bạn đang chờ bạn)"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "(Bạn bè, lời mời đã nhận và đã gửi|[0-9]+ lời mời kết bạn đang chờ bạn)"
- extendedWaitUntil:
    visible: "Chưa có bạn nào"
    timeout: 30000
- tapOn: "Thêm bạn bằng tên tài khoản"
- extendedWaitUntil:
    visible: "Ô username bạn"
    timeout: 30000
- takeScreenshot: 25-c-nhap
# Dạng username sai bị chặn ngay trên máy, không gọi máy chủ.
- tapOn: "Ô username bạn"
- inputText: "x!"
- hideKeyboard
- tapOn: "Tìm"
- extendedWaitUntil:
    visible: "Tên tài khoản gồm 3–32 chữ, số, dấu chấm hoặc gạch dưới."
    timeout: 30000
- takeScreenshot: 25-c-hong
- tapOn: "Ô username bạn"
- eraseText: 5
- inputText: "${TK_D}"
- hideKeyboard
- tapOn: "Tìm"
# Tìm được đúng người theo username, mang đúng tên người ấy tự đặt — không phải
# một tên do mô hình hay client đoán. Người tìm thấy hiện bằng đúng hàng người
# của danh sách bạn.
- extendedWaitUntil:
    visible: "Tìm thấy theo username"
    timeout: 30000
- assertVisible: "Ban QA"
- takeScreenshot: 25-c-tim-thay
- tapOn: "Gửi lời mời"
- extendedWaitUntil:
    visible: "Đã gửi lời mời tới Ban QA"
    timeout: 30000
- takeScreenshot: 25-c-da-gui
- tapOn: "Về danh sách bạn"
- extendedWaitUntil:
    visible: "Đã gửi"
    timeout: 30000
- tapOn: "Đã gửi"
- extendedWaitUntil:
    visible: "Ban QA"
    timeout: 30000
- assertVisible: "Đang chờ người ấy trả lời"
- takeScreenshot: 25-c-da-gui-danh-sach
# --- đăng xuất C ---------------------------------------------------------------
- tapOn: "Quay lại"
- tapOn: "Cá nhân"
# The profile tab may still be leaving a screen pushed on it: wait for its own
# heading and the transition's end before looking for a row.
- extendedWaitUntil:
    visible: "Không gian của riêng bạn"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "Tài khoản"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Tài khoản"
- extendedWaitUntil:
    visible: "Đăng xuất"
    timeout: 20000
- tapOn: "Đăng xuất"
- extendedWaitUntil:
    visible: "Rủ Đi thôi!"
    timeout: 30000
# --- D: đồng ý vào nhóm rồi đồng ý kết bạn --------------------------------------
# D được mời nhưng chưa đồng ý: từ B8 (QA UI-073) người vào bằng lời mời đi qua
# Sở thích trước, ô tên điền sẵn tên nhóm đặt; bỏ qua thì về tab Tin nhắn, hàng
# «Hoi QA» nói ai mời (QA UI-080), với «Đồng ý vào nhóm» và «Từ chối».
- runFlow:
    file: _dang-nhap-tai-khoan.yaml
    env:
      TK: "${TK_D}"
      MK: "${MK_D}"
- extendedWaitUntil:
    visible: "Hoi QA"
    timeout: 60000
- assertVisible: ".*mời bạn · .* người trong nhóm"
- assertVisible: "Từ chối"
- takeScreenshot: 25-d-loi-moi-cho
- tapOn: "Đồng ý vào nhóm.*"
- extendedWaitUntil:
    visible: "Khám phá"
    timeout: 60000
- tapOn: "Cá nhân"
# The profile tab may still be leaving a screen pushed on it: wait for its own
# heading and the transition's end before looking for a row.
- extendedWaitUntil:
    visible: "Không gian của riêng bạn"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
# The row's subtitle is unique on the tab («Bạn bè» also names the passport count and
# other mounted tabs); centred, so the tab bar and the «Tạo» stamp never cover it.
- scrollUntilVisible:
    element:
      text: "(Bạn bè, lời mời đã nhận và đã gửi|[0-9]+ lời mời kết bạn đang chờ bạn)"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "(Bạn bè, lời mời đã nhận và đã gửi|[0-9]+ lời mời kết bạn đang chờ bạn)"
- extendedWaitUntil:
    visible: "Đã nhận"
    timeout: 30000
- tapOn: "Đã nhận"
- extendedWaitUntil:
    visible: "An QA"
    timeout: 30000
- assertVisible: "Muốn kết bạn với bạn"
- takeScreenshot: 25-d-da-nhan
- tapOn: "Đồng ý"
- extendedWaitUntil:
    visible: "Không có lời mời nào đang chờ"
    timeout: 30000
- tapOn: "Đã là bạn"
- extendedWaitUntil:
    visible: "An QA"
    timeout: 30000
- assertVisible: "Bạn từ .*"
- takeScreenshot: 25-d-ban-be
