# Chat thật (M3), một người một máy, trên API prod không có khoá Gemini.
#
# Chạy SAU flow 24/25 trong cùng lượt: C có nhóm «Hoi QA» và là bạn của D. Gõ một
# tin → hiện bong bóng; tắt app mở lại → tin còn (đọc từ máy chủ, không phải
# state); giữ lâu → thanh phản ứng → ❤ → chip «❤️ 1» (đếm của máy chủ);
# `/vote Ăn gì? Bún bò | Phở` → thẻ bình chọn với hai lựa chọn, bấm một → lựa chọn
# đó được chọn, chân thẻ «1 phiếu» (qua /votes/{id}/ballots); `@Rủ Đi gợi ý quán` → máy chủ
# không có khoá mô hình → câu nói thật «chưa nối được mô hình» (đường im lặng
# trung thực; đường AI nói thật đo ở `mobile-native-ai` khi có khoá);
# `/chia-bill` → «chưa sẵn sàng trên máy chủ này» (reader không cấu hình).
# Harness kiểm máy chủ sau flow (kiem_may_chu_sau_30): ≥3 tin, một thẻ poll, một
# phản ứng heart của C trên tin đầu.
appId: com.lakiet.rudi
---
- stopApp
- launchApp
- runFlow: _bo-qua-dev-menu.yaml
- extendedWaitUntil:
    visible: "Rủ Đi thôi!|Khám phá|Chưa có nhóm nào"
    timeout: 150000
- runFlow: _dang-xuat-neu-co.yaml
- runFlow:
    file: _dang-nhap-tai-khoan.yaml
    env:
      TK: "${TK_C}"
      MK: "${MK_C}"
- extendedWaitUntil:
    visible: "Khám phá"
    timeout: 60000
- tapOn: "Tin nhắn"
- extendedWaitUntil:
    visible: "Hoi QA"
    timeout: 60000
- tapOn: "Hoi QA"
- extendedWaitUntil:
    visible: "Có hội rồi. Mở lời thôi."
    timeout: 60000
- assertVisible: "Ô soạn tin"
- takeScreenshot: 30-chat-rong
# Gửi một tin.
- tapOn: "Ô soạn tin"
- inputText: "Toi nay an gi moi nguoi"
- tapOn: "Gửi tin nhắn"
- extendedWaitUntil:
    visible: "Toi nay an gi moi nguoi"
    timeout: 30000
- assertNotVisible: "Có hội rồi. Mở lời thôi."
- hideKeyboard
- takeScreenshot: 30-da-gui
# Tắt mở lại: tin đến từ máy chủ, không phải từ state của lần gửi.
- stopApp
- launchApp
- runFlow: _bo-qua-dev-menu.yaml
- extendedWaitUntil:
    visible: "Khám phá"
    timeout: 150000
- tapOn: "Tin nhắn"
- extendedWaitUntil:
    visible: "Hoi QA"
    timeout: 60000
- assertVisible: "Bạn: Toi nay an gi moi nguoi"
- tapOn: "Hoi QA"
- extendedWaitUntil:
    visible: "Toi nay an gi moi nguoi"
    timeout: 60000
# Phản ứng: giữ lâu → thanh → ❤ → chip đếm của máy chủ.
- longPressOn: "Tin nhắn: Toi nay an gi moi nguoi"
- extendedWaitUntil:
    visible: "Thích"
    timeout: 15000
- tapOn: "Thích"
- extendedWaitUntil:
    visible: "❤️ 1"
    timeout: 30000
- takeScreenshot: 30-phan-ung
# Bình chọn bằng lệnh; thẻ poll của máy chủ; bỏ phiếu qua /votes.
- tapOn: "Ô soạn tin"
- inputText: "/vote An gi? Bun bo | Pho"
- tapOn: "Gửi tin nhắn"
- extendedWaitUntil:
    visible: "Bỏ phiếu Bun bo"
    timeout: 60000
- hideKeyboard
- tapOn: "Bỏ phiếu Bun bo"
# B6 (QA UI-065): «của bạn» is no longer printed; the ballot is the radio
# itself, checked, and the count is said once at the foot of the card. On
# Android the radio's name carries its value: «Bỏ phiếu Bun bo, 1 phiếu».
- extendedWaitUntil:
    visible:
      text: ".*1 phiếu.*"
      checked: true
    timeout: 30000
- takeScreenshot: 30-binh-chon
# Gọi AI và /chia-bill rẽ theo máy chủ (lát 7, ADR-0046 đề xuất: tin @ là tin
# thường, câu trả lời là tin trả lời vào đúng tin đó). Ở đây mới GÕ, chưa gửi:
# mỗi nhánh đọc chip trên nút gửi trước rồi tự bấm gửi. Không có khoá (AI=0) →
# chip nói «chưa sẵn sàng · Gửi như tin thường», tin vẫn đi; có khoá (--ai,
# AI=1) → chip «Kèm N tin gần đây», câu trả lời ký «Rủ Đi AI · đọc N tin».
- tapOn: "Ô soạn tin"
- inputText: "@Ru Di goi y quan an"
- runFlow:
    when:
      true: ${AI != "1"}
    file: _30-ai-khong-khoa.yaml
- runFlow:
    when:
      true: ${AI == "1"}
    file: _30-ai-co-khoa.yaml
