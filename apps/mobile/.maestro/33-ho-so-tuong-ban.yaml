# Hồ sơ người khác và tường cá nhân (M8): hàng bạn bè bấm vào được, hồ sơ của
# người ấy đọc từ máy chủ, và bài đăng đi đúng mức người đọc.
#
# Chạy sau flow 32 trong cùng lượt và GIỮ phiên đang sống (C hoặc D — cả hai là
# bạn của nhau từ flow 25), chỉ đăng nhập khi app đang ở màn chào: xin mã lại
# trong nhịp 60 s sẽ bị máy chủ từ chối.
#
# Hai bài được đăng: một «Bạn bè», một «Chỉ mình tôi». Harness kiểm máy chủ sau
# bảng (kiem_may_chu_sau_33): người kia đọc tường của tác giả thấy ĐÚNG bài
# «Bạn bè» và KHÔNG thấy bài «Chỉ mình tôi». Màn hình không tự chứng minh được
# điều đó — nó chỉ là nơi bấm.
appId: com.lakiet.rudi
---
- stopApp
- launchApp
- runFlow: _bo-qua-dev-menu.yaml
- extendedWaitUntil:
    visible: "Rủ Đi thôi!|Khám phá|Chưa có nhóm nào"
    timeout: 150000
- runFlow:
    when:
      visible: "Rủ Đi thôi!"
    file: _dang-nhap-d.yaml
- extendedWaitUntil:
    visible: "Khám phá"
    timeout: 60000
# --- hồ sơ của bạn mình -------------------------------------------------------
- tapOn: "Cá nhân"
# The profile tab may still be leaving a screen pushed on it: wait for its own
# heading and the transition's end before looking for a row.
- extendedWaitUntil:
    visible: "Không gian của riêng bạn"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
# The row's subtitle is unique on the tab («Bạn bè» also names the passport count and
# other mounted tabs); centred, so the tab bar and the «Tạo» stamp never cover it.
- scrollUntilVisible:
    element:
      text: "(Bạn bè, lời mời đã nhận và đã gửi|[0-9]+ lời mời kết bạn đang chờ bạn)"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "(Bạn bè, lời mời đã nhận và đã gửi|[0-9]+ lời mời kết bạn đang chờ bạn)"
- extendedWaitUntil:
    visible: "Xem hồ sơ .*"
    timeout: 60000
- tapOn: "Xem hồ sơ .*"
- extendedWaitUntil:
    visible: "Trang viết được chia sẻ"
    timeout: 60000
- assertVisible: "Tham gia từ tháng .*"
- takeScreenshot: 33-ho-so-ban
- back
- back
# --- tường của chính mình -----------------------------------------------------
# The row sits under the owner's diary shelf (QA UI-153 empty state), below the fold.
- scrollUntilVisible:
    element:
      text: "Bài bạn đã đăng và ai đọc được"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Bài bạn đã đăng và ai đọc được"
- extendedWaitUntil:
    visible: "Hồ sơ của bạn"
    timeout: 60000
# The owner's diary shelf («Những ngày muốn giữ») sits above the posts, so the
# empty-wall line starts below the fold on a phone.
- scrollUntilVisible:
    element:
      text: "Bạn chưa đăng bài nào.*"
    direction: DOWN
    timeout: 30000
- takeScreenshot: 33-tuong-rong
- scrollUntilVisible:
    element:
      text: "Đăng bài mới"
    direction: UP
    timeout: 30000
- tapOn: "Đăng bài mới"
# With the community rollout on, «Đăng bài mới» opens the community composer
# in wall mode: «Riêng tư · Bạn bè» is preselected and the post skips review.
- extendedWaitUntil:
    visible: "Hôm nay có gì đáng nhớ?"
    timeout: 30000
- tapOn:
    id: "community-body"
- inputText: "Chuyen QA cho ban be"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Riêng tư · Bạn bè.*Đã chọn"
    direction: DOWN
    timeout: 20000
- takeScreenshot: 33-chon-muc-doc
- tapOn: "Đăng lên tường"
# Sending lands on the post itself; back returns to the wall, which reloads.
- extendedWaitUntil:
    visible: "Chuyen QA cho ban be"
    timeout: 60000
- back
- extendedWaitUntil:
    visible: "Hồ sơ của bạn"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Chuyen QA cho ban be"
    direction: DOWN
    timeout: 60000
- assertNotVisible: "Bạn chưa đăng bài nào.*"
- takeScreenshot: 33-tuong-cua-toi
# --- bài chỉ mình tôi: cùng màn, khác mức người đọc ---------------------------
- scrollUntilVisible:
    element:
      text: "Đăng bài mới"
    direction: UP
    timeout: 30000
- tapOn: "Đăng bài mới"
- extendedWaitUntil:
    visible: "Hôm nay có gì đáng nhớ?"
    timeout: 30000
- tapOn:
    id: "community-body"
- inputText: "Chi minh toi QA"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Lựa chọn khác"
    direction: DOWN
    timeout: 20000
- tapOn: "Lựa chọn khác"
- scrollUntilVisible:
    element:
      text: "Chỉ mình tôi"
    direction: DOWN
    timeout: 20000
- tapOn: "Chỉ mình tôi"
- assertVisible: "Chỉ mình tôi.*Đã chọn"
- tapOn: "Đăng lên tường"
- extendedWaitUntil:
    visible: "Chi minh toi QA"
    timeout: 60000
- back
- extendedWaitUntil:
    visible: "Hồ sơ của bạn"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Chi minh toi QA"
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Chuyen QA cho ban be"
    direction: DOWN
    timeout: 30000
- takeScreenshot: 33-hai-muc-nguoi-doc
