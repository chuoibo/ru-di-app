# Requires a saved diary with two pages and two synthetic photos on PHOTO_DAY.
appId: com.lakiet.rudi
---
- openLink: "rudi://diaries/${DIARY_ID}"
- extendedWaitUntil:
    visible:
      id: "diary-reader-screen"
    timeout: 30000
- openLink: "rudi://outings/${OUTING_ID}/ending"
- extendedWaitUntil:
    visible:
      id: "diary-ending-screen"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Sửa theo cách mình nhớ"
    direction: DOWN
    timeout: 60000
- tapOn: "Sửa theo cách mình nhớ"
- scrollUntilVisible:
    element:
      text: "Thay ảnh bìa"
    direction: DOWN
- tapOn: "Thay ảnh bìa"
- assertVisible: "Tấm nào mở đầu câu chuyện?"
- tapOn:
    text: "Chọn ảnh ${PHOTO_DAY}"
    index: 1
- assertNotVisible: "Tấm nào mở đầu câu chuyện?"
- scrollUntilVisible:
    element:
      text: "Đưa trang 2 lên trước"
      enabled: true
    direction: DOWN
    timeout: 60000
- tapOn:
    text: "Đưa trang 2 lên trước"
    enabled: true
- scrollUntilVisible:
    element:
      text: "Lưu riêng tư"
    direction: DOWN
    timeout: 60000
- tapOn: "Lưu riêng tư"
- extendedWaitUntil:
    visible: "Đã giữ lại một cuộc đi."
    timeout: 30000
