# Nhánh của flow 30 khi máy chủ CÓ khoá mô hình (--ai, AI=1): lời gọi AI ra một
# thẻ của Rủ Đi AI (mô hình cần thời gian; 120 s là trần), và /chia-bill ra bản
# đọc khoản chi hoặc một trong các câu nói thật của máy chủ — không bao giờ im
# lặng vô danh.
appId: com.lakiet.rudi
---
# The command opens a consent tray; submit the explicit request before waiting.
- hideKeyboard
- assertVisible: "Phần sẽ gửi cùng lời nhờ"
- tapOn: "Chỉ gửi lời nhờ"
- tapOn: "Gửi lời nhờ cho AI"
- extendedWaitUntil:
    visible: "Rủ Đi AI.*"
    timeout: 120000
- assertNotVisible: "AI chưa (sẵn sàng|gom khoản chi được).*"
- assertNotVisible: ".*đang im lặng.*"
- takeScreenshot: 30-ai-tra-loi
- tapOn: "Ô soạn tin"
- inputText: "/chia-bill"
- tapOn: "Gửi tin nhắn"
- hideKeyboard
- assertVisible: "AI chỉ đề xuất ai đã trả bao nhiêu, không ghi gì vào sổ. Cả hội xem lại và xác nhận ở mục Chia bill."
# The tray keeps the choice made for /plan above, so the toggle may already
# read «Gửi kèm tin gần nhất». Either way the request must leave with no chat.
- runFlow:
    when:
      visible: "Chỉ gửi lời nhờ"
    commands:
      - tapOn: "Chỉ gửi lời nhờ"
- assertVisible: ".*Không tin nhắn nào đi kèm.*"
- tapOn: "Gửi lời nhờ cho AI"
- extendedWaitUntil:
    visible: "Rủ Đi AI chưa thấy khoản chi nào có số tiền trong đoạn chat gửi kèm. Bạn gửi kèm tin có số tiền, hoặc thêm khoản chi ở mục Chia bill."
    timeout: 120000
- takeScreenshot: 30-chia-bill-that
