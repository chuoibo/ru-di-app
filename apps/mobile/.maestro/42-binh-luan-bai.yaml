# Bình luận, phản ứng và ảnh trên bài đăng (L3, ADR-0022 §2.1–2.2) trên API prod.
#
# Chạy SAU flow 41 trong cùng lượt, với người đang đăng nhập (C nếu 37 đã chạy,
# D nếu không). Harness đã chuẩn bị bằng curl cho đúng người ấy (chuan_bi_bai_cho_42):
# một ảnh cá nhân tải lên `POST /people/me/photos` và một bài «Bai co anh QA»
# mức «Bạn bè» trỏ vào ảnh ấy. Flow: Cá nhân → «Bài bạn đã đăng và ai đọc được»
# → «Mở bài: Bai co anh QA» → màn chi tiết có «Ảnh bài đăng» (không phải khung
# «Chưa tải được ảnh») → bấm «Thích» → dòng đếm «1 thích · 0 bình luận» → viết «Binh luan QA» →
# «Gửi bình luận» → bình luận hiện → chụp → quay lại → dòng «… · 1 thích · 1 bình
# luận» → trên tường của mình đổi «Ai được bình luận tường tôi» sang «Không ai»
# rồi trả về «Ai đọc được bài» → «Đăng bài mới» có nút «Chọn ảnh» (không lái
# bộ chọn ảnh của hệ thống).
#
# Harness kiểm máy chủ sau flow (kiem_may_chu_sau_42): người kia đọc bài thấy
# comment_count ≥ 1, ❤ ≥ 1, can_comment = true và mở được ảnh (200); B (không
# phải bạn) mở ảnh → 404; canary: chủ tường đặt «nobody» → người kia bình luận
# → 403 và can_comment = false; rồi trả lại «readers».
appId: com.lakiet.rudi
---
- stopApp
- launchApp
- runFlow: _bo-qua-dev-menu.yaml
- extendedWaitUntil:
    visible: "Rủ Đi thôi!|Khám phá|Chưa có nhóm nào"
    timeout: 150000
- runFlow:
    when:
      visible: "Rủ Đi thôi!"
    file: _dang-nhap-d.yaml
- extendedWaitUntil:
    visible: "Khám phá"
    timeout: 60000
- tapOn: "Cá nhân"
# The profile tab may still be leaving a screen pushed on it: wait for its own
# heading and the transition's end before looking for a row.
- extendedWaitUntil:
    visible: "Không gian của riêng bạn"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
# The row sits under the owner's diary shelf (QA UI-153 empty state), below the fold.
- scrollUntilVisible:
    element:
      text: "Bài bạn đã đăng và ai đọc được"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Bài bạn đã đăng và ai đọc được"
# Posts sit below the owner's diary shelf, under the fold on a phone.
- scrollUntilVisible:
    element:
      text: "Mở bài: Bai co anh QA"
    direction: DOWN
    timeout: 60000
- tapOn: "Mở bài: Bai co anh QA"
- extendedWaitUntil:
    visible: "Ảnh bài đăng"
    timeout: 60000
- assertNotVisible: "Chưa tải được ảnh"
# The composer is the post page's last row, under the photo and the empty
# comments; its name opens with the verb (DESIGN.md), not «Ô …».
- scrollUntilVisible:
    element:
      text: "Viết bình luận"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Thích"
- extendedWaitUntil:
    visible: "[1] thích · [0] bình luận"
    timeout: 30000
- tapOn: "Viết bình luận"
- inputText: "Binh luan QA"
- hideKeyboard
- tapOn: "Gửi bình luận"
- extendedWaitUntil:
    visible: "Binh luan QA"
    timeout: 30000
- assertVisible: "[1] thích · [1] bình luận"
- takeScreenshot: 42-chi-tiet-bai
- pressKey: Back
# The wall reloads on focus and starts from the top again.
- scrollUntilVisible:
    element:
      text: ".* · 1 tim · 1 bình luận"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Bình luận: Không ai"
    direction: UP
    timeout: 30000
# Chính sách bình luận của tường mình: đổi rồi trả lại (canary curl đo phần máy chủ).
- tapOn: "Bình luận: Không ai"
- extendedWaitUntil:
    visible: "Tường chỉ để kể; không ai bình luận, kể cả bạn bè."
    timeout: 30000
- takeScreenshot: 42-chinh-sach
- tapOn: "Bình luận: Ai đọc được bài"
- extendedWaitUntil:
    visible: "Ai đọc được bài thì bình luận được."
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Đăng bài mới"
    direction: UP
    timeout: 30000
- tapOn: "Đăng bài mới"
# The community composer (wall mode) is the composer while the rollout is on.
- extendedWaitUntil:
    visible: "Hôm nay có gì đáng nhớ?"
    timeout: 30000
- assertVisible: "Thêm ảnh hoặc video"
- takeScreenshot: 42-dang-bai-co-anh
