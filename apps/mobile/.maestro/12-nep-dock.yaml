# Nếp nổi trên mép màn (ADR-0033), trên bản trải nghiệm nên không cần đăng nhập.
#
# Số 12 chứ không phải 60: quy ước đánh số của `scripts/mobile_native.sh` là
# 00-19 cho bảng MẶC ĐỊNH (chạy trên fixture, không cần máy chủ, đi qua nhánh
# `*)`), 20-89 cho bảng SỐNG và mỗi số ở đó phải tự khai trong `case`. Flow này
# không cần máy chủ nào nên nó thuộc khoảng đầu;
# `tests/test_maestro_flows_are_all_reachable.py` gác đúng chuyện đó.
#
# Chứng minh theo đúng thứ tự người dùng gặp:
#   1. Nếp có mặt sẵn ở tab đầu, nhưng CÀI trong mép: chỉ mép giấy, không đĩa;
#   2. chạm mép thì Nếp ra ngoài nhưng CHƯA mở bảng;
#   3. chạm lần nữa mới mở bảng, và bảng nói đúng màn đang đứng;
#   4. Back đóng bảng, Nếp về lại mép: kéo ra chỉ là bước đầu của hai chạm
#      mở bảng, không phải chỗ nghỉ (ADR-0035);
#   5. kéo ra rồi vuốt sang phải thì Nếp cài lại vào mép;
#   6. kéo ra rồi để yên thì Nếp tự cất về mép (ADR-0035 §2.2).
#
# Bước 1 là lý do bản 23/09 đổi thứ tự. Nếp mặc định nằm ngoài thành một đĩa
# 57dp thì đè chữ trên thẻ (Khám phá) và nuốt cú bấm «Đồng ý» của lời mời vào
# nhóm (flow 25, docs/claude/2026-09-23/nep-nuot-cu-bam-cua-nut.md). Bước 2 là
# lý do flow này tồn tại từ đầu: nếu một chạm vừa lôi Nếp ra vừa bung bảng thì
# một cú chạm lỡ tay vào mép sẽ che mất màn người ta đang đọc.
#
# Không dùng `clearState`: `appId` ở đây là Expo Go dùng chung với lane khác
# (xem đầu `_vao-app-sach.yaml`). Vì thế bước 1 KHÔNG giả định máy sạch: nếu
# lượt trước để Nếp ở ngoài thì vuốt nó vào trước, rồi mới đo.
appId: com.lakiet.rudi
---
- runFlow: _vao-app.yaml

# 1. Nếp có mặt sẵn, cài trong mép
- runFlow:
    when:
      visible:
        id: "nep-dia"
    commands:
      - swipe:
          from:
            id: "nep-dia"
          direction: RIGHT
- extendedWaitUntil:
    visible:
      id: "nep-mep"
    timeout: 30000
- assertNotVisible:
    id: "nep-dia"

# 2. một chạm chỉ kéo Nếp ra, KHÔNG mở bảng
- tapOn:
    id: "nep-mep"
- extendedWaitUntil:
    visible:
      id: "nep-dia"
    timeout: 10000
- assertNotVisible:
    id: "nep-o-nhap"

# 3. chạm lần nữa mới mở bảng, và bảng biết đang ở đâu
- tapOn:
    id: "nep-dia"
- extendedWaitUntil:
    visible:
      id: "nep-ngu-canh"
    timeout: 10000
- assertVisible: "Khám phá"

# 4. Back đóng bảng, Nếp về lại mép chứ không đứng ngoài đè lên trang
- back
- extendedWaitUntil:
    visible:
      id: "nep-mep"
    timeout: 10000
- assertNotVisible:
    id: "nep-dia"
- assertNotVisible:
    id: "nep-o-nhap"

# 5. kéo ra rồi vuốt sang phải thì Nếp cài lại
- tapOn:
    id: "nep-mep"
- extendedWaitUntil:
    visible:
      id: "nep-dia"
    timeout: 10000
- swipe:
    from:
      id: "nep-dia"
    direction: RIGHT
- extendedWaitUntil:
    visible:
      id: "nep-mep"
    timeout: 10000

# 6. kéo ra rồi để yên: Nếp tự cất về mép, không đứng đè lên trang
- tapOn:
    id: "nep-mep"
- extendedWaitUntil:
    visible:
      id: "nep-dia"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "nep-mep"
    timeout: 12000
- assertNotVisible:
    id: "nep-dia"
