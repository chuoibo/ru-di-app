# Đăng nhập bằng tài khoản F — người của L5 (chặn/báo cáo ở flow 45, xoá tài
# khoản ở flow 46). Tách riêng khỏi `_dang-nhap-d.yaml` để không ai lỡ tay xoá
# tài khoản của D, người mà mọi phép kiểm sau bảng còn hỏi tới.
appId: com.lakiet.rudi
---
- runFlow:
    file: _dang-nhap-tai-khoan.yaml
    env:
      TK: "${TK_F}"
      MK: "${MK_F}"
