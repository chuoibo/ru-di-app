# Cửa vào KHÔNG cần ai mời: tài khoản tự quản (ADR-0055) — username + mật
# khẩu → phiên (`POST /auth/login`). Người A là một tài khoản vừa đăng ký qua cửa
# HTTP thật của stack QA cô lập và chưa đăng nhập lần nào, nên đây là lần đầu
# THẬT: rỗng, chưa nhóm, có thể đi qua bước sở thích.
#
# Trước ADR-0055 flow này đi cửa số điện thoại → mã 6 số với mã debug của API;
# phần ấy gỡ cùng cửa. Phần còn lại giữ nguyên: ca âm trước ca dương, trạng
# thái rỗng thật, mở được nhóm, Khám phá đọc danh mục của máy chủ. Harness đã
# tự kiểm bằng curl rằng stack nhận tài khoản tổng hợp và từ chối mật khẩu sai
# TRƯỚC khi chạy flow này, nên một màn đỏ ở đây là app, không phải môi trường.
# Username và mật khẩu đi qua `-e` (TK_A / MK_A), không nằm trong file.
#
# Bản dựng của lượt này KHÔNG có EXPO_PUBLIC_RUDI_FIXTURE: cửa «Vào bản trải
# nghiệm» phải vắng, đúng như trên một bản ship.
appId: com.lakiet.rudi
---
- stopApp
- launchApp
- runFlow: _bo-qua-dev-menu.yaml
- assertNotVisible: "Fetch development servers"
- extendedWaitUntil:
    visible: "Rủ Đi thôi!|Khám phá|Chưa có nhóm nào"
    timeout: 150000
- runFlow: _dang-xuat-neu-co.yaml
- assertVisible: "Rủ Đi thôi!"
- tapOn: "Rủ Đi thôi!"
- extendedWaitUntil:
    visible: "Chào bạn"
    timeout: 30000
- assertNotVisible: "Vào bản trải nghiệm Team Đà Lạt"
- assertNotVisible: "Dữ liệu demo"
- assertNotVisible: "Ô số điện thoại"
- assertNotVisible: "Gửi mã"
- takeScreenshot: 22-man-dang-nhap
# Ca âm trước ca dương: mật khẩu sai phải bị máy chủ từ chối bằng một câu không
# nói username có tồn tại hay không.
- tapOn:
    id: "account-username"
- inputText: "${TK_A}"
- tapOn:
    id: "account-password"
- inputText: "sai-mat-khau-tong-hop"
- hideKeyboard
- tapOn: "Đăng nhập"
- extendedWaitUntil:
    visible: "Tên tài khoản hoặc mật khẩu chưa đúng."
    timeout: 30000
- takeScreenshot: 22-mat-khau-sai
- tapOn:
    id: "account-password"
- eraseText
- inputText: "${MK_A}"
- hideKeyboard
- tapOn: "Đăng nhập"
- runFlow:
    file: _bo-qua-so-thich.yaml
# Người mới, chưa ai mời: đăng nhập xong phải là trạng thái rỗng THẬT, không
# phải tab Khám phá kể chuyện Team Đà Lạt.
- extendedWaitUntil:
    visible: "Chưa có nhóm nào"
    timeout: 60000
- assertNotVisible: "Dữ liệu demo"
# The empty live account has the same tabs as every signed-in account.
- assertVisible: "Khám phá"
- assertNotVisible: "Tôi có lời mời"
- assertVisible: "Thêm bạn bằng tên tài khoản"
- takeScreenshot: 22-chua-co-nhom
# Và dùng được thật: mở một nhóm, vào tới tab.
- tapOn: "Tạo nhóm"
- extendedWaitUntil:
    visible: "Đặt tên cho hội"
    timeout: 30000
- tapOn: "Ô tên nhóm"
- inputText: "Nhom Moi QA"
- hideKeyboard
- tapOn: "Mở nhóm"
- runFlow: _vao-nhom-vua-lap.yaml
- tapOn: "Khám phá"
- extendedWaitUntil:
    visible: "Khám phá"
    timeout: 60000
- assertNotVisible: "Dữ liệu demo"
- assertNotVisible: "3.840.000đ"
- assertNotVisible: "Xóm Lèo"
# Từ M4 Khám phá của một phiên THẬT đọc danh mục từ GET /places: tên thật hiện,
# nhãn «mẫu» và câu chuyện «Team Đà Lạt» của bản fixture không được hiện.
# Khám phá sống dẫn bằng một địa điểm lớn (đợt chuyển mình 06/09); tên ghim có thể nằm dưới nếp gấp.
- scrollUntilVisible:
    element:
      text: "Tiệm Nướng Xóm Lào"
    direction: DOWN
    timeout: 60000
- assertNotVisible: "Gợi ý mẫu.*"
- assertNotVisible: "Mẫu minh hoạ.*"
- assertNotVisible: ".*Team Đà Lạt.*"
- assertNotVisible: "Gần bạn, đúng gu"
- takeScreenshot: 22-trong-nhom-moi
