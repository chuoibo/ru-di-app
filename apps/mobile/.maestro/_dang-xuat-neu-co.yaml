# Return through the product logout door without clearing SecureStore.
# The caller waits for an app screen before this conditional helper.
appId: com.lakiet.rudi
---
- runFlow:
    when:
      visible: "Khám phá"
    commands:
      - tapOn: "Cá nhân"
      - scrollUntilVisible:
          element:
            text: "Tài khoản"
          direction: DOWN
          centerElement: true
          timeout: 30000
      - tapOn: "Tài khoản"
      - extendedWaitUntil:
          visible: "Đăng xuất"
          timeout: 20000
      - tapOn: "Đăng xuất"
      - extendedWaitUntil:
          visible: "Rủ Đi thôi!"
          timeout: 30000
