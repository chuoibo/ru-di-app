# Requires a real synthetic session, composer open, and a synthetic video in the Android picker.
appId: com.lakiet.rudi
---
- extendedWaitUntil:
    visible:
      id: "community-body"
    timeout: 15000
- tapOn:
    id: "community-body"
- inputText: "Synthetic native video trip."
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Thêm ảnh hoặc video"
    direction: DOWN
- tapOn: "Thêm ảnh hoặc video"
- tapOn:
    text: "Video taken.*"
    index: 0
- extendedWaitUntil:
    visible: "Video đã sẵn sàng"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Riêng tư · Bạn bè.*"
    direction: DOWN
- tapOn: "Riêng tư · Bạn bè.*"
- tapOn: "Đăng lên tường"
- extendedWaitUntil:
    visible: "Một câu chuyện"
    timeout: 15000
- assertVisible: "Synthetic native video trip."
- takeScreenshot: community-native-video
