[package]
name = "rudi-chat-crypto"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
openmls = "=0.9.0"
openmls_traits = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
tls_codec = { version = "0.5", features = ["derive", "serde", "mls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
thiserror = "2"
zeroize = { version = "1.9", features = ["derive"] }

[profile.release]
panic = "abort"
strip = "symbols"
