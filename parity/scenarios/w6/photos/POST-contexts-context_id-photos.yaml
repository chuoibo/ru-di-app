      path: '/contexts/{{ctx}}/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.webp, content_type: image/webp, image: {format: webp, width: 64, height: 48, seed: 1, alpha: true}}
  - id: owner_bmp
