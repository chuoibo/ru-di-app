      path: '/contexts/{{ctx}}/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.jpg, content_type: image/jpeg, image: {format: jpeg, width: 1, height: 1, seed: 1}}
  - id: owner_png_rgba
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.png, content_type: image/png, image: {format: png, width: 64, height: 48, seed: 1, alpha: true}}
  - id: owner_png_1x1_transparent
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.png, content_type: image/png, image: {format: png, width: 1, height: 1, alpha: true}}
  - id: owner_png_gray
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.png, content_type: image/png, image: {format: png, width: 64, height: 48, seed: 1, color: gray}}
  - id: owner_png_palette
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.png, content_type: image/png, image: {format: png, width: 64, height: 48, seed: 1, color: palette}}
  - id: owner_png_palette_transparent
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.png, content_type: image/png, image: {format: png, width: 64, height: 48, seed: 1, color: palette, alpha: true}}
  - id: owner_gif
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.gif, content_type: image/gif, image: {format: gif, width: 64, height: 48, seed: 1}}
  - id: owner_gif_transparent
    as: owner
