    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.ppm, content_type: image/x-portable-pixmap, text: "P3\n2 2\n255\n255\n0\n0\n0\n255\n0\n0\n0\n255\n255\n255\n255\n"}
  - id: owner_pgm_ascii
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.pgm, content_type: image/x-portable-graymap, text: "P2\n3 2\n255\n0\n128\n255\n64\n32\n16\n"}
