  # idempotency: the whole multipart body is the fingerprint
  - id: owner_idem_first
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/photos'
      headers:
        idempotency-key: 'w6-group-photo-a'
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.jpg, content_type: image/jpeg, image: {format: jpeg, width: 32, height: 24, seed: 11}}
  - id: owner_idem_replay
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/photos'
      headers:
