# W6 · POST /contexts/{context_id}/photos — a member uploads a group photograph.
# The route reads at most 10 MiB + 1 byte of the file part, then the service checks
# post_group_memory (roles, then active membership) and only then sanitizes: a
# stranger's garbage is 403 and a member's garbage is 415. The sanitizer's matrix
# (formats, alpha, EXIF orientation, truncation, the byte cap and the pixel cap)
# lives here; the other two upload routes repeat a subset. Files are generated by
# the harness from body_parts (nothing binary is committed). Every upload writes
# uploaded_images.storage_key = secrets.token_hex(16), compared as <hex32#n>.
# Texts are sample data (dữ liệu mẫu).
id: w6/photos/post-contexts-context_id-photos
routes: ['POST /contexts/{context_id}/photos']
auth_mode: dev
personas:
  owner: {}
  mate: {}
  invitee: {}
  leaver: {}
  stranger: {}
steps:
  - id: anonymous_upload
    as: anonymous
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.jpg, content_type: image/jpeg, image: {format: jpeg, width: 8, height: 8}}
  - id: anonymous_non_uuid_context
    as: anonymous
    request:
      method: POST
      path: '/contexts/khong-phai-uuid/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.jpg, content_type: image/jpeg, image: {format: jpeg, width: 8, height: 8}}
  # the form is parsed before any dependency runs
  - id: anonymous_multipart_without_boundary
    as: anonymous
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/photos'
      headers:
        content-type: 'multipart/form-data'
      body_raw: 'x'
  - id: anonymous_json_body
    as: anonymous
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/photos'
      headers:
        content-type: 'application/json'
      body_raw: '{}'
  - id: roles_unknown
    as: stranger
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/photos'
      headers:
        x-actor-roles: 'khong-co'
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.jpg, content_type: image/jpeg, image: {format: jpeg, width: 8, height: 8}}
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ nhóm ảnh (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn cùng nhóm (dữ liệu mẫu)"}'
  - id: register_invitee
    as: invitee
    request:
      method: PUT
      path: '/people/{{persona.invitee}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người được mời (dữ liệu mẫu)"}'
  - id: register_leaver
    as: leaver
    request:
      method: PUT
      path: '/people/{{persona.leaver}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người rời nhóm (dữ liệu mẫu)"}'
  - id: register_stranger
    as: stranger
    request:
      method: PUT
      path: '/people/{{persona.stranger}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người lạ (dữ liệu mẫu)"}'
  # path and body errors share one 422 list
  - id: stranger_non_uuid_context
    as: stranger
    request:
      method: POST
      path: '/contexts/khong-phai-uuid/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.jpg, content_type: image/jpeg, image: {format: jpeg, width: 8, height: 8}}
  - id: stranger_non_uuid_context_no_file
    as: stranger
    request:
      method: POST
      path: '/contexts/khong-phai-uuid/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts: []
  - id: stranger_unknown_context
    as: stranger
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.jpg, content_type: image/jpeg, image: {format: jpeg, width: 8, height: 8}}
  # permission before the sanitizer: garbage from a non-member is not 415
  - id: stranger_unknown_context_garbage
    as: stranger
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.jpg, content_type: image/jpeg, text: 'đây không phải ảnh (dữ liệu mẫu)'}
  - id: stranger_unknown_context_over_cap
    as: stranger
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.jpg, content_type: image/jpeg, image: {format: jpeg, width: 8, height: 8, pad_to_bytes: 10485761}}
  - id: stranger_roles_empty_unknown_context
    as: stranger
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/photos'
      headers:
        x-actor-roles: ''
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.jpg, content_type: image/jpeg, image: {format: jpeg, width: 8, height: 8}}
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm ảnh chung (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  - id: owner_invites_invitee
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.invitee}}"}'
  - id: owner_invites_leaver
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.leaver}}"}'
    bind:
      m_leaver: {from: body, pointer: /id, class: uuid}
  - id: leaver_accepts
    as: leaver
    request:
      method: POST
      path: '/memberships/{{m_leaver}}/accept'
  - id: leaver_uploads_while_member
    as: leaver
    request:
      method: POST
      path: '/contexts/{{ctx}}/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.jpg, content_type: image/jpeg, image: {format: jpeg, width: 32, height: 24, seed: 2}}
  - id: leaver_leaves
    as: leaver
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.leaver}}'
  # the permission ladder, all with a valid file
  - id: stranger_uploads
    as: stranger
    request:
      method: POST
      path: '/contexts/{{ctx}}/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.jpg, content_type: image/jpeg, image: {format: jpeg, width: 32, height: 24, seed: 2}}
  - id: stranger_with_contexts_header
    as: stranger
    request:
      method: POST
      path: '/contexts/{{ctx}}/photos'
      headers:
        x-actor-contexts: '{{ctx}}'
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.jpg, content_type: image/jpeg, image: {format: jpeg, width: 32, height: 24, seed: 2}}
  - id: invitee_uploads_before_accepting
    as: invitee
    request:
      method: POST
      path: '/contexts/{{ctx}}/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.jpg, content_type: image/jpeg, image: {format: jpeg, width: 32, height: 24, seed: 2}}
  - id: leaver_uploads_after_leaving
    as: leaver
    request:
      method: POST
      path: '/contexts/{{ctx}}/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.jpg, content_type: image/jpeg, image: {format: jpeg, width: 32, height: 24, seed: 2}}
  - id: mate_roles_guest
    as: mate
    request:
      method: POST
      path: '/contexts/{{ctx}}/photos'
      headers:
        x-actor-roles: 'guest'
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.jpg, content_type: image/jpeg, image: {format: jpeg, width: 32, height: 24, seed: 2}}
  - id: mate_roles_empty
    as: mate
    request:
      method: POST
      path: '/contexts/{{ctx}}/photos'
      headers:
        x-actor-roles: ''
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.jpg, content_type: image/jpeg, image: {format: jpeg, width: 32, height: 24, seed: 2}}
  - id: mate_roles_group_admin_only
    as: mate
    request:
      method: POST
      path: '/contexts/{{ctx}}/photos'
      headers:
        x-actor-roles: 'group_admin'
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.jpg, content_type: image/jpeg, image: {format: jpeg, width: 32, height: 24, seed: 2}}
  - id: mate_uploads_png
    as: mate
    request:
      method: POST
      path: '/contexts/{{ctx}}/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.png, content_type: image/png, image: {format: png, width: 64, height: 48, seed: 3}}
  # the sanitizer's matrix: what goes in, what content_type and size come out
  - id: owner_jpeg
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.jpg, content_type: image/jpeg, image: {format: jpeg, width: 64, height: 48, seed: 1}}
    bind:
      photo: {from: body, pointer: /id, class: uuid}
  - id: owner_jpeg_gray
    as: owner
