# W1 · POST /reports — 201 with id and created_at; the note is never echoed.
# Pydantic caps note at 500 code points on the raw string, before the domain strips it.
id: w1/reports/post-reports
routes: ['POST /reports']
auth_mode: dev
personas:
  reporter: {}
  other: {}
  ghost: {}
steps:
  - id: anonymous_valid_body
    as: anonymous
    request:
      method: POST
      path: '/reports'
      headers:
        content-type: 'application/json'
      body_raw: '{"target_type":"person","target_id":"{{persona.other}}","reason":"spam"}'
  - id: anonymous_malformed_json
    as: anonymous
    request:
      method: POST
      path: '/reports'
      headers:
        content-type: 'application/json'
      body_raw: '{"target_type": '
  - id: anonymous_with_key_is_released
    as: anonymous
    request:
      method: POST
      path: '/reports'
      headers:
        idempotency-key: 'w1-report-anon'
        content-type: 'application/json'
      body_raw: '{"target_type":"person","target_id":"{{persona.other}}","reason":"spam"}'
  # reports.reporter_id is a foreign key into people and nothing checks first
  - id: ghost_reporter_has_no_person_row
    as: ghost
    request:
      method: POST
      path: '/reports'
      headers:
        content-type: 'application/json'
      body_raw: '{"target_type":"person","target_id":"{{persona.other}}","reason":"spam"}'
  - id: register_reporter
    as: reporter
    request:
      method: PUT
      path: '/people/{{persona.reporter}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người báo cáo (dữ liệu mẫu)"}'
  - id: register_other
    as: other
    request:
      method: PUT
      path: '/people/{{persona.other}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người khác (dữ liệu mẫu)"}'
  - id: person_spam_no_note
    as: reporter
    request:
      method: POST
      path: '/reports'
      headers:
        content-type: 'application/json'
      body_raw: '{"target_type":"person","target_id":"{{persona.other}}","reason":"spam"}'
  - id: post_harassment_note_trimmed
    as: reporter
    request:
      method: POST
      path: '/reports'
      headers:
        content-type: 'application/json'
      body_raw: '{"target_type":"post","target_id":"aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee","reason":"harassment","note":"  câu chữ của người gửi  "}'
  - id: comment_impersonation
    as: reporter
    request:
      method: POST
      path: '/reports'
      headers:
        content-type: 'application/json'
      body_raw: '{"target_type":"comment","target_id":"aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee","reason":"impersonation","note":null}'
  - id: message_inappropriate_whitespace_note
    as: reporter
    request:
      method: POST
      path: '/reports'
      headers:
        content-type: 'application/json'
      body_raw: '{"target_type":"message","target_id":"aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee","reason":"inappropriate","note":" \t\n "}'
  - id: story_other_about_self
    as: reporter
    request:
      method: POST
      path: '/reports'
      headers:
        content-type: 'application/json'
      body_raw: '{"target_type":"story","target_id":"{{persona.reporter}}","reason":"other","note":"tự báo"}'
  - id: note_500_ascii
    as: reporter
    request:
      method: POST
      path: '/reports'
      headers:
        content-type: 'application/json'
      body_raw: '{"target_type":"person","target_id":"{{persona.other}}","reason":"spam","note":""}'
  - id: note_501_ascii
    as: reporter
    request:
      method: POST
      path: '/reports'
      headers:
        content-type: 'application/json'
      body_raw: '{"target_type":"person","target_id":"{{persona.other}}","reason":"spam","note":""}'
