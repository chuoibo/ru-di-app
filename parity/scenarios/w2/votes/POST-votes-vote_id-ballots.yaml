# W2 · POST /votes/{id}/ballots — cast or change one's single ballot.
# Refusal order: idempotency key, JSON decode, actor, path + body model, vote
# lookup (404), role + ACTIVE membership (403), closed (409), option not on this
# vote (422). The same person again replaces their row (replaced_previous_ballot).
id: w2/votes/post-votes-vote_id-ballots
routes: ['POST /votes/{vote_id}/ballots']
auth_mode: dev
personas:
  owner: {}
  mate: {}
  invitee: {}
  leaver: {}
  ghost: {}
  stranger: {}
steps:
  - id: anonymous_unknown_vote
    as: anonymous
    request:
      method: POST
      path: '/votes/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee"}'
  # get_actor is a dependency, so 401 wins over the path 422
  - id: anonymous_non_uuid_vote
    as: anonymous
    request:
      method: POST
      path: '/votes/khong-phai-uuid/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee"}'
  # FastAPI decodes a JSON body before resolving dependencies: 422 json_invalid beats 401
  - id: anonymous_malformed_json
    as: anonymous
    request:
      method: POST
      path: '/votes/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id": '
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ nhóm (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn cùng nhóm (dữ liệu mẫu)"}'
  - id: register_invitee
    as: invitee
    request:
      method: PUT
      path: '/people/{{persona.invitee}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người được mời (dữ liệu mẫu)"}'
  - id: register_leaver
    as: leaver
    request:
      method: PUT
      path: '/people/{{persona.leaver}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người sẽ rời nhóm (dữ liệu mẫu)"}'
  - id: register_ghost
    as: ghost
    request:
      method: PUT
      path: '/people/{{persona.ghost}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người sẽ xoá tài khoản (dữ liệu mẫu)"}'
  - id: register_stranger
    as: stranger
    request:
      method: PUT
      path: '/people/{{persona.stranger}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người lạ (dữ liệu mẫu)"}'
  - id: stranger_non_uuid_vote
    as: stranger
    request:
      method: POST
      path: '/votes/khong-phai-uuid/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee"}'
  # path and body errors arrive in one 422 list, path first
  - id: stranger_non_uuid_and_bad_body
    as: stranger
    request:
      method: POST
      path: '/votes/khong-phai-uuid/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"lua-chon-1"}'
  - id: stranger_unknown_vote
    as: stranger
    request:
      method: POST
      path: '/votes/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee"}'
  # body validation runs before the handler: 422 beats the 404
  - id: stranger_unknown_vote_bad_body
    as: stranger
    request:
      method: POST
      path: '/votes/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{}'
  # the vote is looked up before the role check: 404, not 403
  - id: stranger_unknown_vote_roles_empty
    as: stranger
    request:
      method: POST
      path: '/votes/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/ballots'
      headers:
        x-actor-roles: ''
        content-type: 'application/json'
      body_raw: '{"option_id":"aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee"}'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm bỏ phiếu (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  - id: owner_invites_invitee
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.invitee}}"}'
    bind:
      m_invitee: {from: body, pointer: /id, class: uuid}
  - id: owner_invites_leaver
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.leaver}}"}'
    bind:
      m_leaver: {from: body, pointer: /id, class: uuid}
  - id: leaver_accepts
    as: leaver
    request:
      method: POST
      path: '/memberships/{{m_leaver}}/accept'
  - id: owner_invites_ghost
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.ghost}}"}'
    bind:
      m_ghost: {from: body, pointer: /id, class: uuid}
  - id: ghost_accepts
    as: ghost
    request:
      method: POST
      path: '/memberships/{{m_ghost}}/accept'
  - id: owner_creates_vote
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/votes'
      headers:
        content-type: 'application/json'
      body_raw: '{"question":"Tối nay ăn gì? (dữ liệu mẫu)","options":[{"label":"Bún chả"},{"label":"Phở"},{"label":"Cơm tấm"}]}'
    bind:
      vote: {from: body, pointer: /id, class: uuid}
      opt_x: {from: body, pointer: /options/0/id, class: uuid}
      opt_y: {from: body, pointer: /options/1/id, class: uuid}
      opt_z: {from: body, pointer: /options/2/id, class: uuid}
  - id: stranger_creates_other_ctx
    as: stranger
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm của người lạ (dữ liệu mẫu)"}'
    bind:
      other_ctx: {from: body, pointer: /id, class: uuid}
  - id: stranger_creates_own_vote
    as: stranger
    request:
      method: POST
      path: '/contexts/{{other_ctx}}/votes'
      headers:
        content-type: 'application/json'
      body_raw: '{"question":"Nhóm khác hỏi (dữ liệu mẫu)","options":[{"label":"Một"},{"label":"Hai"}]}'
    bind:
      other_vote: {from: body, pointer: /id, class: uuid}
      other_opt: {from: body, pointer: /options/0/id, class: uuid}
  - id: stranger_real_vote
    as: stranger
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"{{opt_x}}"}'
  # membership before the option check: 403, not 422
  - id: stranger_real_vote_foreign_option
    as: stranger
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"{{other_opt}}"}'
  - id: invitee_not_yet_active
    as: invitee
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"{{opt_x}}"}'
  - id: mate_roles_empty
    as: mate
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        x-actor-roles: ''
        content-type: 'application/json'
      body_raw: '{"option_id":"{{opt_x}}"}'
  - id: mate_roles_guest
    as: mate
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        x-actor-roles: 'guest'
        content-type: 'application/json'
      body_raw: '{"option_id":"{{opt_x}}"}'
  - id: mate_roles_unknown
    as: mate
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        x-actor-roles: 'cu-tri'
        content-type: 'application/json'
      body_raw: '{"option_id":"{{opt_x}}"}'
  - id: mate_first_ballot
    as: mate
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"{{opt_x}}"}'
  # the same choice again still rewrites updated_at and says replaced_previous_ballot true
  - id: mate_same_option_again
    as: mate
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"{{opt_x}}"}'
  - id: mate_changes_mind
    as: mate
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"{{opt_y}}"}'
  - id: mate_option_from_other_vote
    as: mate
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"{{other_opt}}"}'
  - id: mate_unknown_option
    as: mate
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee"}'
  - id: mate_uppercase_option_id
    as: mate
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"AAAAAAAA-BBBB-4CCC-8DDD-EEEEEEEEEEEE"}'
  - id: owner_creator_votes
    as: owner
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"{{opt_z}}"}'
  - id: leaver_roles_group_admin_only
    as: leaver
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        x-actor-roles: 'group_admin'
        content-type: 'application/json'
      body_raw: '{"option_id":"{{opt_x}}"}'
  - id: ghost_votes
    as: ghost
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"{{opt_y}}"}'
  - id: stranger_own_vote_with_this_votes_option
    as: stranger
    request:
      method: POST
      path: '/votes/{{other_vote}}/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"{{opt_x}}"}'
  - id: owner_reads_tally
    as: owner
    request:
      method: GET
      path: '/votes/{{vote}}'
  - id: option_id_not_uuid
    as: mate
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"lua-chon-1"}'
  - id: option_id_missing
    as: mate
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{}'
  - id: option_id_null
    as: mate
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":null}'
  - id: option_id_number
    as: mate
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":1}'
  # there is no field for voting on somebody else's behalf
  - id: extra_field_voter_id
    as: mate
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"{{opt_x}}","voter_id":"{{persona.owner}}"}'
  - id: empty_body
    as: mate
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'application/json'
  - id: top_level_array
    as: mate
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '["{{opt_x}}"]'
  - id: text_plain_content_type
    as: mate
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'text/plain'
      body_raw: '{"option_id":"{{opt_x}}"}'
  - id: no_content_type_is_parsed_as_json
    as: mate
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      body_raw: '{"option_id":"{{opt_y}}"}'
  - id: leaver_leaves
    as: leaver
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.leaver}}'
  - id: leaver_after_leaving
    as: leaver
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"{{opt_z}}"}'
  - id: ghost_deletes_account
    as: ghost
    request:
      method: DELETE
      path: '/people/me'
      headers:
        content-type: 'application/json'
      body_raw: '{"confirm":true}'
  - id: ghost_after_deletion
    as: ghost
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"{{opt_z}}"}'
  - id: owner_reads_tally_after_departures
    as: owner
    request:
      method: GET
      path: '/votes/{{vote}}'
  - id: owner_closes_vote
    as: owner
    request:
      method: POST
      path: '/votes/{{vote}}/close'
  - id: mate_ballot_closed
    as: mate
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"{{opt_z}}"}'
  # closed is checked before the option: 409, not 422
  - id: mate_closed_foreign_option
    as: mate
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"{{other_opt}}"}'
  # membership before closed: 403, not 409
  - id: stranger_closed_vote
    as: stranger
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"{{opt_z}}"}'
  - id: mate_closed_bad_body
    as: mate
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"lua-chon-1"}'
  - id: trailing_slash_redirects
    as: mate
    request:
      method: POST
      path: '/votes/{{vote}}/ballots/'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"{{opt_x}}"}'
  - id: get_not_allowed
    as: mate
    request:
      method: GET
      path: '/votes/{{vote}}/ballots'
  - id: owner_creates_second_vote
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/votes'
      headers:
        content-type: 'application/json'
      body_raw: '{"question":"Đi xem phim? (dữ liệu mẫu)","options":[{"label":"Có"},{"label":"Để sau"}]}'
    bind:
      vote2: {from: body, pointer: /id, class: uuid}
      v2_x: {from: body, pointer: /options/0/id, class: uuid}
      v2_y: {from: body, pointer: /options/1/id, class: uuid}
  - id: idem_first
    as: mate
    request:
      method: POST
      path: '/votes/{{vote2}}/ballots'
      headers:
        idempotency-key: 'w2-ballot-a'
        content-type: 'application/json'
      body_raw: '{"option_id":"{{v2_x}}"}'
  - id: idem_replay
    as: mate
    request:
      method: POST
      path: '/votes/{{vote2}}/ballots'
      headers:
        idempotency-key: 'w2-ballot-a'
        content-type: 'application/json'
      body_raw: '{"option_id":"{{v2_x}}"}'
  - id: idem_reuse_different_body
    as: mate
    request:
      method: POST
      path: '/votes/{{vote2}}/ballots'
      headers:
        idempotency-key: 'w2-ballot-a'
        content-type: 'application/json'
      body_raw: '{"option_id":"{{v2_y}}"}'
  - id: idem_second_distinct_key
    as: mate
    request:
      method: POST
      path: '/votes/{{vote2}}/ballots'
      headers:
        idempotency-key: 'w2-ballot-b'
        content-type: 'application/json'
      body_raw: '{"option_id":"{{v2_x}}"}'
  - id: idem_refusal_not_stored
    as: mate
    request:
      method: POST
      path: '/votes/{{vote2}}/ballots'
      headers:
        idempotency-key: 'w2-ballot-c'
        content-type: 'application/json'
      body_raw: '{"option_id":"{{other_opt}}"}'
  # the 422 released the key, so the same key with another body is a fresh request
  - id: idem_same_key_after_refusal
    as: mate
    request:
      method: POST
      path: '/votes/{{vote2}}/ballots'
      headers:
        idempotency-key: 'w2-ballot-c'
        content-type: 'application/json'
      body_raw: '{"option_id":"{{v2_y}}"}'
  # the key scope is the raw X-Actor-ID: the owner's ballot is new, not the mate's replay
  - id: owner_same_key_as_mate
    as: owner
    request:
      method: POST
      path: '/votes/{{vote2}}/ballots'
      headers:
        idempotency-key: 'w2-ballot-a'
        content-type: 'application/json'
      body_raw: '{"option_id":"{{v2_x}}"}'
  - id: owner_closes_second_vote
    as: owner
    request:
      method: POST
      path: '/votes/{{vote2}}/close'
  # a stored 200 replays although the vote is now closed
  - id: idem_replay_after_close
    as: mate
    request:
      method: POST
      path: '/votes/{{vote2}}/ballots'
      headers:
        idempotency-key: 'w2-ballot-a'
        content-type: 'application/json'
      body_raw: '{"option_id":"{{v2_x}}"}'
  - id: idem_new_key_after_close
    as: mate
    request:
      method: POST
      path: '/votes/{{vote2}}/ballots'
      headers:
        idempotency-key: 'w2-ballot-d'
        content-type: 'application/json'
      body_raw: '{"option_id":"{{v2_x}}"}'
  - id: mate_reads_second_vote
    as: mate
    request:
      method: GET
      path: '/votes/{{vote2}}'
