# W2 · votes in prod mode (ADR-0014): identity is the bearer session, X-Actor-*
# is ignored, and roles come from the roster, which always grants member — so
# role_not_permitted cannot happen here and an empty X-Actor-Roles changes nothing.
# The harness seeds a people row and a live session per persona before step one.
id: w2/votes/prod-auth
routes: ['POST /contexts/{context_id}/votes', 'GET /contexts/{context_id}/votes', 'GET /votes/{vote_id}', 'POST /votes/{vote_id}/ballots', 'POST /votes/{vote_id}/close']
auth_mode: prod
personas:
  owner: {}
  mate: {}
  stranger: {}
steps:
  - id: anonymous_create
    as: anonymous
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/votes'
      headers:
        content-type: 'application/json'
      body_raw: '{"question":"Tối nay ăn gì? (dữ liệu mẫu)","options":[{"label":"Bún chả"},{"label":"Phở"}]}'
  # get_actor is a dependency, so 401 wins over the path 422 in prod too
  - id: anonymous_non_uuid_list
    as: anonymous
    request:
      method: GET
      path: '/contexts/khong-phai-uuid/votes'
  - id: anonymous_malformed_json
    as: anonymous
    request:
      method: POST
      path: '/votes/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id": '
  - id: junk_bearer
    as: anonymous
    request:
      method: GET
      path: '/votes/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee'
      headers:
        authorization: 'Bearer khong-phai-token-that'
  - id: basic_scheme
    as: anonymous
    request:
      method: POST
      path: '/votes/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/close'
      headers:
        authorization: 'Basic {{token.owner}}'
  # dev would trust these headers; prod answers 401 Missing bearer session
  - id: actor_headers_ignored
    as: anonymous
    request:
      method: GET
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/votes'
      headers:
        x-actor-id: '{{persona.owner}}'
        x-actor-roles: 'member'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm bỏ phiếu (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  # in dev an empty X-Actor-Roles is 403 role_not_permitted; prod ignores it
  - id: owner_creates_vote_with_empty_roles_header
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/votes'
      headers:
        x-actor-roles: ''
        content-type: 'application/json'
      body_raw: '{"question":"Tối nay ăn gì? (dữ liệu mẫu)","options":[{"label":"Bún chả"},{"label":"Phở"}]}'
    bind:
      vote: {from: body, pointer: /id, class: uuid}
      opt_x: {from: body, pointer: /options/0/id, class: uuid}
      opt_y: {from: body, pointer: /options/1/id, class: uuid}
  - id: stranger_lists_claiming_owner_id
    as: stranger
    request:
      method: GET
      path: '/contexts/{{ctx}}/votes'
      headers:
        x-actor-id: '{{persona.owner}}'
        x-actor-contexts: '{{ctx}}'
  - id: stranger_unknown_vote
    as: stranger
    request:
      method: GET
      path: '/votes/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee'
  - id: stranger_real_vote
    as: stranger
    request:
      method: GET
      path: '/votes/{{vote}}'
  - id: mate_lists
    as: mate
    request:
      method: GET
      path: '/contexts/{{ctx}}/votes'
  # the scheme is matched case-insensitively
  - id: lowercase_scheme_ballot
    as: anonymous
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        authorization: 'bearer {{token.mate}}'
        content-type: 'application/json'
      body_raw: '{"option_id":"{{opt_x}}"}'
  - id: mate_changes_ballot
    as: mate
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"{{opt_y}}"}'
  - id: idem_first
    as: owner
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        idempotency-key: 'w2-prod-a'
        content-type: 'application/json'
      body_raw: '{"option_id":"{{opt_x}}"}'
  - id: idem_replay
    as: owner
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        idempotency-key: 'w2-prod-a'
        content-type: 'application/json'
      body_raw: '{"option_id":"{{opt_x}}"}'
  # the key scope is the bearer digest, so the stranger's request runs and is refused
  - id: stranger_same_key
    as: stranger
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        idempotency-key: 'w2-prod-a'
        content-type: 'application/json'
      body_raw: '{"option_id":"{{opt_x}}"}'
  - id: anonymous_same_key_with_owner_actor_header
    as: anonymous
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        idempotency-key: 'w2-prod-a-{{persona.owner}}'
        x-actor-id: '{{persona.owner}}'
        content-type: 'application/json'
      body_raw: '{"option_id":"{{opt_x}}"}'
  - id: mate_not_creator_close
    as: mate
    request:
      method: POST
      path: '/votes/{{vote}}/close'
  - id: owner_closes
    as: owner
    request:
      method: POST
      path: '/votes/{{vote}}/close'
  - id: mate_ballot_after_close
    as: mate
    request:
      method: POST
      path: '/votes/{{vote}}/ballots'
      headers:
        content-type: 'application/json'
      body_raw: '{"option_id":"{{opt_x}}"}'
  - id: owner_reads_closed
    as: owner
    request:
      method: GET
      path: '/votes/{{vote}}'
  - id: owner_revokes_session
    as: owner
    request:
      method: DELETE
      path: '/sessions/current'
  - id: owner_after_revoke
    as: owner
    request:
      method: GET
      path: '/votes/{{vote}}'
  - id: mate_deletes_account
    as: mate
    request:
      method: DELETE
      path: '/people/me'
      headers:
        content-type: 'application/json'
      body_raw: '{"confirm":true}'
  # erasure revokes every session: 401, not 403
  - id: mate_after_deletion
    as: mate
    request:
      method: GET
      path: '/contexts/{{ctx}}/votes'
  - id: stranger_still_refused
    as: stranger
    request:
      method: POST
      path: '/votes/{{vote}}/close'
