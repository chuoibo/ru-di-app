      body_raw: '{"title":"Chuyến mẫu (dữ liệu mẫu)","starts_on":"2030-01-01","ends_on":"2030-01-02","headcount":4,"budget_per_person_vnd":100000}'
    bind:
      other_outing: {from: body, pointer: /id, class: uuid}
  - id: stranger_real_group
