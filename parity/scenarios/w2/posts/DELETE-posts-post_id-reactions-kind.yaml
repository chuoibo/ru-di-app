# W2 · DELETE /posts/{post_id}/reactions/{kind} — take back one's own reaction, totals back.
# Refusal order: idempotency key, actor, path (post_id UUID + kind enum), readable
# post (404, never 403), role (403). Removing what is not there is still 200.
id: w2/posts/delete-posts-post_id-reactions-kind
routes: ['DELETE /posts/{post_id}/reactions/{kind}']
auth_mode: dev
personas:
  author: {}
  friend: {}
  mate: {}
  stranger: {}
  rival: {}
  ghost: {}
steps:
  - id: anonymous_unknown_post
    as: anonymous
    request:
      method: DELETE
      path: '/posts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/reactions/heart'
  # get_actor is a dependency, so 401 wins over both path 422s
  - id: anonymous_bad_kind
    as: anonymous
    request:
      method: DELETE
      path: '/posts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/reactions/love'
  - id: anonymous_non_uuid_post
    as: anonymous
    request:
      method: DELETE
      path: '/posts/khong-phai-uuid/reactions/heart'
  - id: anonymous_empty_idempotency_key
    as: anonymous
    request:
      method: DELETE
      path: '/posts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/reactions/heart'
      headers:
        idempotency-key: ''
  - id: register_author
    as: author
    request:
      method: PUT
      path: '/people/{{persona.author}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người viết (dữ liệu mẫu)"}'
  - id: register_friend
    as: friend
    request:
      method: PUT
      path: '/people/{{persona.friend}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn thân (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn cùng nhóm (dữ liệu mẫu)"}'
  - id: register_stranger
    as: stranger
    request:
      method: PUT
      path: '/people/{{persona.stranger}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người lạ (dữ liệu mẫu)"}'
  - id: register_rival
    as: rival
    request:
      method: PUT
      path: '/people/{{persona.rival}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người chặn (dữ liệu mẫu)"}'
  - id: register_ghost
    as: ghost
    request:
      method: PUT
      path: '/people/{{persona.ghost}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người sẽ xoá tài khoản (dữ liệu mẫu)"}'
  - id: stranger_non_uuid_post
    as: stranger
    request:
      method: DELETE
      path: '/posts/khong-phai-uuid/reactions/heart'
  - id: stranger_bad_kind_unknown_post
    as: stranger
    request:
      method: DELETE
      path: '/posts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/reactions/love'
  - id: stranger_kind_wrong_case
    as: stranger
    request:
      method: DELETE
      path: '/posts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/reactions/Heart'
  - id: stranger_kind_percent_encoded
    as: stranger
    request:
      method: DELETE
      path: '/posts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/reactions/%68eart'
  # path errors are gathered into one list, post_id first
  - id: stranger_non_uuid_and_bad_kind
    as: stranger
    request:
      method: DELETE
      path: '/posts/khong-phai-uuid/reactions/love'
  # an empty kind is a trailing slash on the POST path: the router redirects
  - id: stranger_empty_kind_redirects
    as: stranger
    request:
      method: DELETE
      path: '/posts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/reactions/'
  - id: stranger_unknown_post
    as: stranger
    request:
      method: DELETE
      path: '/posts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/reactions/heart'
  - id: stranger_uppercase_unknown_post
    as: stranger
    request:
      method: DELETE
      path: '/posts/AAAAAAAA-BBBB-4CCC-8DDD-EEEEEEEEEEEE/reactions/heart'
  - id: stranger_unknown_post_roles_empty
    as: stranger
    request:
      method: DELETE
      path: '/posts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/reactions/heart'
      headers:
        x-actor-roles: ''
  - id: author_creates_group
    as: author
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm gỡ cảm xúc (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  - id: author_invites_mate
    as: author
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      membership_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{membership_mate}}/accept'
  - id: author_asks_friend
    as: author
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.friend}}"}'
    bind:
      friend_request: {from: body, pointer: /id, class: uuid}
  - id: friend_accepts
    as: friend
    request:
      method: POST
      path: '/friends/requests/{{friend_request}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: author_posts_only_me
    as: author
    request:
      method: POST
      path: '/posts'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"Ghi chú riêng (dữ liệu mẫu)","audience":"only_me"}'
    bind:
      post_only_me: {from: body, pointer: /id, class: uuid}
  - id: author_posts_friends
    as: author
    request:
      method: POST
      path: '/posts'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"Cho bạn bè (dữ liệu mẫu)","audience":"friends"}'
    bind:
      post_friends: {from: body, pointer: /id, class: uuid}
  - id: author_posts_group
    as: author
    request:
      method: POST
      path: '/posts'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"Cho nhóm (dữ liệu mẫu)","audience":"group","context_id":"{{ctx}}"}'
    bind:
      post_group: {from: body, pointer: /id, class: uuid}
  - id: author_posts_public
    as: author
    request:
      method: POST
      path: '/posts'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"Cho mọi người (dữ liệu mẫu)","audience":"public"}'
    bind:
      post_public: {from: body, pointer: /id, class: uuid}
  - id: author_hearts_public
    as: author
    request:
      method: POST
      path: '/posts/{{post_public}}/reactions'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"heart"}'
  - id: friend_hearts_public
    as: friend
    request:
      method: POST
      path: '/posts/{{post_public}}/reactions'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"heart"}'
  - id: friend_wows_public
    as: friend
    request:
      method: POST
      path: '/posts/{{post_public}}/reactions'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"wow"}'
  - id: stranger_likes_public
    as: stranger
    request:
      method: POST
      path: '/posts/{{post_public}}/reactions'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"like"}'
  - id: rival_likes_public
    as: rival
    request:
      method: POST
      path: '/posts/{{post_public}}/reactions'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"like"}'
  - id: mate_fires_group
    as: mate
    request:
      method: POST
      path: '/posts/{{post_group}}/reactions'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"fire"}'
  - id: friend_wows_friends
    as: friend
    request:
      method: POST
      path: '/posts/{{post_friends}}/reactions'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"wow"}'
  - id: friend_hearts_friends
    as: friend
    request:
      method: POST
      path: '/posts/{{post_friends}}/reactions'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"heart"}'
  # happy path and its idempotence
  - id: friend_removes_heart_public
    as: friend
    request:
      method: DELETE
      path: '/posts/{{post_public}}/reactions/heart'
  - id: friend_removes_heart_public_again
    as: friend
    request:
      method: DELETE
      path: '/posts/{{post_public}}/reactions/heart'
  - id: friend_removes_kind_never_added
    as: friend
    request:
      method: DELETE
      path: '/posts/{{post_public}}/reactions/sad'
  # only one's own row goes: the author's heart stays
  - id: stranger_removes_heart_not_own
    as: stranger
    request:
      method: DELETE
      path: '/posts/{{post_public}}/reactions/heart'
  - id: author_removes_on_own_only_me
    as: author
    request:
      method: DELETE
      path: '/posts/{{post_only_me}}/reactions/haha'
  - id: stranger_on_only_me
    as: stranger
    request:
      method: DELETE
      path: '/posts/{{post_only_me}}/reactions/haha'
  - id: stranger_on_friends
    as: stranger
    request:
      method: DELETE
      path: '/posts/{{post_friends}}/reactions/wow'
  - id: friend_on_group
    as: friend
    request:
      method: DELETE
      path: '/posts/{{post_group}}/reactions/fire'
  - id: mate_removes_fire_group
    as: mate
    request:
      method: DELETE
      path: '/posts/{{post_group}}/reactions/fire'
  # the body of a DELETE is not read
  - id: stranger_body_is_ignored
    as: stranger
    request:
      method: DELETE
      path: '/posts/{{post_public}}/reactions/like'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"heart"}'
  - id: stranger_roles_advancer_only
    as: stranger
    request:
      method: DELETE
      path: '/posts/{{post_public}}/reactions/like'
      headers:
        x-actor-roles: 'advancer'
  - id: stranger_roles_empty_unreadable
    as: stranger
    request:
      method: DELETE
      path: '/posts/{{post_only_me}}/reactions/like'
      headers:
        x-actor-roles: ''
  - id: stranger_roles_group_admin_only
    as: stranger
    request:
      method: DELETE
      path: '/posts/{{post_public}}/reactions/like'
      headers:
        x-actor-roles: 'group_admin'
  - id: stranger_roles_unknown
    as: stranger
    request:
      method: DELETE
      path: '/posts/{{post_public}}/reactions/like'
      headers:
        x-actor-roles: 'member,thu-quy'
  - id: actor_id_not_uuid
    as: stranger
    request:
      method: DELETE
      path: '/posts/{{post_public}}/reactions/like'
      headers:
        x-actor-id: 'khong-phai-uuid'
  # a block hides the public post both ways, so the blocker cannot take back a reaction
  - id: rival_blocks_author
    as: rival
    request:
      method: POST
      path: '/people/{{persona.author}}/block'
  - id: rival_removes_like_after_blocking
    as: rival
    request:
      method: DELETE
      path: '/posts/{{post_public}}/reactions/like'
  - id: author_sees_rivals_like_still_counted
    as: author
    request:
      method: DELETE
      path: '/posts/{{post_public}}/reactions/sad'
  - id: ghost_hahas_public
    as: ghost
    request:
      method: POST
      path: '/posts/{{post_public}}/reactions'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"haha"}'
  - id: ghost_deletes_account
    as: ghost
    request:
      method: DELETE
      path: '/people/me'
      headers:
        content-type: 'application/json'
      body_raw: '{"confirm":true}'
  - id: ghost_removes_haha_after_deletion
    as: ghost
    request:
      method: DELETE
      path: '/posts/{{post_public}}/reactions/haha'
  - id: mate_refires_group
    as: mate
    request:
      method: POST
      path: '/posts/{{post_group}}/reactions'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"fire"}'
  - id: mate_leaves_group
    as: mate
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.mate}}'
  - id: mate_removes_after_leaving
    as: mate
    request:
      method: DELETE
      path: '/posts/{{post_group}}/reactions/fire'
  # idempotency: DELETE is a write method, so the middleware keys it
  - id: idem_first
    as: friend
    request:
      method: DELETE
      path: '/posts/{{post_friends}}/reactions/wow'
      headers:
        idempotency-key: 'w2-unreact-a'
  - id: idem_replay
    as: friend
    request:
      method: DELETE
      path: '/posts/{{post_friends}}/reactions/wow'
      headers:
        idempotency-key: 'w2-unreact-a'
  - id: friend_rewows_friends
    as: friend
    request:
      method: POST
      path: '/posts/{{post_friends}}/reactions'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"wow"}'
  # the stored answer comes back even though the row exists again
  - id: idem_replay_after_state_changed
    as: friend
    request:
      method: DELETE
      path: '/posts/{{post_friends}}/reactions/wow'
      headers:
        idempotency-key: 'w2-unreact-a'
  - id: idem_reuse_different_kind
    as: friend
    request:
      method: DELETE
      path: '/posts/{{post_friends}}/reactions/heart'
      headers:
        idempotency-key: 'w2-unreact-a'
  - id: idem_reuse_with_body
    as: friend
    request:
      method: DELETE
      path: '/posts/{{post_friends}}/reactions/wow'
      headers:
        idempotency-key: 'w2-unreact-a'
        content-type: 'application/json'
      body_raw: '{}'
  - id: idem_second_distinct_key
    as: friend
    request:
      method: DELETE
      path: '/posts/{{post_friends}}/reactions/wow'
      headers:
        idempotency-key: 'w2-unreact-b'
  - id: idem_refusal_not_stored
    as: friend
    request:
      method: DELETE
      path: '/posts/{{post_only_me}}/reactions/heart'
      headers:
        idempotency-key: 'w2-unreact-c'
  - id: idem_same_key_after_refusal
    as: friend
    request:
      method: DELETE
      path: '/posts/{{post_friends}}/reactions/heart'
      headers:
        idempotency-key: 'w2-unreact-c'
  - id: idem_validation_refusal_not_stored
    as: friend
    request:
      method: DELETE
      path: '/posts/{{post_friends}}/reactions/love'
      headers:
        idempotency-key: 'w2-unreact-d'
  - id: idem_same_key_after_validation_refusal
    as: friend
    request:
      method: DELETE
      path: '/posts/{{post_friends}}/reactions/wow'
      headers:
        idempotency-key: 'w2-unreact-d'
  - id: trailing_slash_redirects
    as: friend
    request:
      method: DELETE
      path: '/posts/{{post_friends}}/reactions/wow/'
  - id: get_not_allowed
    as: friend
    request:
      method: GET
      path: '/posts/{{post_friends}}/reactions/wow'
  - id: post_not_allowed
    as: friend
    request:
      method: POST
      path: '/posts/{{post_friends}}/reactions/wow'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"wow"}'
