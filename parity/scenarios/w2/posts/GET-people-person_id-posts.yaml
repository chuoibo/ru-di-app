# W2 · GET /people/{person_id}/posts — one person's wall, narrowed to the reader.
# Always 200 with a list (empty for an unknown or erased person), so the route
# is no directory of accounts. Every wall here holds only posts this scenario
# wrote, so no step depends on other scenarios.
id: w2/posts/get-people-person_id-posts
routes: ['GET /people/{person_id}/posts']
auth_mode: dev
personas:
  author: {}
  friend: {}
  mate: {}
  stranger: {}
  blocker: {}
  gone: {}
steps:
  - id: anonymous_wall
    as: anonymous
    request:
      method: GET
      path: '/people/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/posts'
  # get_actor is a dependency, so 401 wins over the path and query 422
  - id: anonymous_non_uuid_bad_limit
    as: anonymous
    request:
      method: GET
      path: '/people/khong-phai-uuid/posts?limit=0'
  - id: register_author
    as: author
    request:
      method: PUT
      path: '/people/{{persona.author}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người viết (dữ liệu mẫu)"}'
  - id: register_friend
    as: friend
    request:
      method: PUT
      path: '/people/{{persona.friend}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn thân (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn cùng nhóm (dữ liệu mẫu)"}'
  - id: register_stranger
    as: stranger
    request:
      method: PUT
      path: '/people/{{persona.stranger}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người lạ (dữ liệu mẫu)"}'
  - id: register_blocker
    as: blocker
    request:
      method: PUT
      path: '/people/{{persona.blocker}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người sẽ chặn (dữ liệu mẫu)"}'
  - id: register_gone
    as: gone
    request:
      method: PUT
      path: '/people/{{persona.gone}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người sẽ xoá tài khoản (dữ liệu mẫu)"}'
  - id: stranger_non_uuid_person
    as: stranger
    request:
      method: GET
      path: '/people/khong-phai-uuid/posts'
  # there is no /people/me/posts route: `me` is parsed as an id and refused
  - id: stranger_me_is_not_an_id
    as: stranger
    request:
      method: GET
      path: '/people/me/posts'
  # path and query errors arrive in one 422 list
  - id: stranger_non_uuid_and_bad_limit
    as: stranger
    request:
      method: GET
      path: '/people/khong-phai-uuid/posts?limit=abc'
  - id: stranger_limit_zero
    as: stranger
    request:
      method: GET
      path: '/people/{{persona.author}}/posts?limit=0'
  - id: stranger_limit_101
    as: stranger
    request:
      method: GET
      path: '/people/{{persona.author}}/posts?limit=101'
  # lax int parsing: a float string with a zero fraction is accepted
  - id: stranger_limit_float_zero_fraction
    as: stranger
    request:
      method: GET
      path: '/people/{{persona.author}}/posts?limit=1.0'
  - id: stranger_limit_float
    as: stranger
    request:
      method: GET
      path: '/people/{{persona.author}}/posts?limit=2.5'
  - id: roles_unknown
    as: stranger
    request:
      method: GET
      path: '/people/{{persona.author}}/posts'
      headers:
        x-actor-roles: 'khong-co-role-nay'
  # an unknown person is an empty wall, not 404
  - id: stranger_unknown_person
    as: stranger
    request:
      method: GET
      path: '/people/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/posts'
  # person_id is echoed as parsed: lowercase, hyphenated
  - id: stranger_uppercase_unknown_person
    as: stranger
    request:
      method: GET
      path: '/people/AAAAAAAA-BBBB-4CCC-8DDD-EEEEEEEEEEEE/posts'
  - id: stranger_unhyphenated_unknown_person
    as: stranger
    request:
      method: GET
      path: '/people/aaaaaaaabbbb4ccc8dddeeeeeeeeeeee/posts'
  - id: stranger_empty_wall_before_posts
    as: stranger
    request:
      method: GET
      path: '/people/{{persona.author}}/posts'
  - id: author_asks_friend
    as: author
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.friend}}"}'
    bind:
      friend_request: {from: body, pointer: /id, class: uuid}
  - id: friend_accepts
    as: friend
    request:
      method: POST
      path: '/friends/requests/{{friend_request}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: blocker_asks_author
    as: blocker
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.author}}"}'
    bind:
      blocker_request: {from: body, pointer: /id, class: uuid}
  - id: author_accepts_blocker
    as: author
    request:
      method: POST
      path: '/friends/requests/{{blocker_request}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: author_creates_group
    as: author
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm tường (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  - id: author_invites_mate
    as: author
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      mate_membership: {from: body, pointer: /id, class: uuid}
  - id: author_invites_blocker
    as: author
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.blocker}}"}'
    bind:
      blocker_membership: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{mate_membership}}/accept'
  - id: blocker_accepts_group
    as: blocker
    request:
      method: POST
      path: '/memberships/{{blocker_membership}}/accept'
  - id: author_posts_only_me
    as: author
    request:
      method: POST
      path: '/posts'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"Riêng (dữ liệu mẫu)","audience":"only_me"}'
  - id: author_posts_friends
    as: author
    request:
      method: POST
      path: '/posts'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"Bạn bè (dữ liệu mẫu)","audience":"friends"}'
  - id: author_posts_group
    as: author
    request:
      method: POST
      path: '/posts'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"Nhóm (dữ liệu mẫu)","audience":"group","context_id":"{{ctx}}"}'
  - id: author_posts_public
    as: author
    request:
      method: POST
      path: '/posts'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"Công khai (dữ liệu mẫu)","audience":"public"}'
  - id: mate_posts_public
    as: mate
    request:
      method: POST
      path: '/posts'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"Công khai của bạn cùng nhóm (dữ liệu mẫu)","audience":"public"}'
  - id: blocker_posts_public
    as: blocker
    request:
      method: POST
      path: '/posts'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"Công khai của người sẽ chặn (dữ liệu mẫu)","audience":"public"}'
  - id: author_wall_as_author
    as: author
    request:
      method: GET
      path: '/people/{{persona.author}}/posts'
  - id: author_wall_as_author_limit_1
    as: author
    request:
      method: GET
      path: '/people/{{persona.author}}/posts?limit=1'
  - id: author_wall_as_author_limit_100
    as: author
    request:
      method: GET
      path: '/people/{{persona.author}}/posts?limit=100'
  - id: author_wall_as_friend
    as: friend
    request:
      method: GET
      path: '/people/{{persona.author}}/posts'
  - id: author_wall_as_mate
    as: mate
    request:
      method: GET
      path: '/people/{{persona.author}}/posts'
  - id: author_wall_as_stranger
    as: stranger
    request:
      method: GET
      path: '/people/{{persona.author}}/posts'
  - id: author_wall_as_stranger_with_contexts_header
    as: stranger
    request:
      method: GET
      path: '/people/{{persona.author}}/posts'
      headers:
        x-actor-contexts: '{{ctx}}'
  # reading a wall has no role check
  - id: author_wall_as_stranger_roles_empty
    as: stranger
    request:
      method: GET
      path: '/people/{{persona.author}}/posts'
      headers:
        x-actor-roles: ''
  - id: mate_wall_as_author
    as: author
    request:
      method: GET
      path: '/people/{{persona.mate}}/posts'
  - id: blocker_blocks_author
    as: blocker
    request:
      method: POST
      path: '/people/{{persona.author}}/block'
  # the blocker keeps only the shared group's post
  - id: author_wall_as_blocker_after_block
    as: blocker
    request:
      method: GET
      path: '/people/{{persona.author}}/posts'
  # the blocked author no longer sees the blocker's public post
  - id: blocker_wall_as_author_after_block
    as: author
    request:
      method: GET
      path: '/people/{{persona.blocker}}/posts'
  - id: blocker_wall_as_stranger
    as: stranger
    request:
      method: GET
      path: '/people/{{persona.blocker}}/posts'
  - id: blocker_wall_as_self
    as: blocker
    request:
      method: GET
      path: '/people/{{persona.blocker}}/posts'
  - id: mate_leaves_group
    as: mate
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.mate}}'
  - id: author_wall_as_mate_after_leaving
    as: mate
    request:
      method: GET
      path: '/people/{{persona.author}}/posts'
  - id: gone_posts_public
    as: gone
    request:
      method: POST
      path: '/posts'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"Sắp biến mất (dữ liệu mẫu)","audience":"public"}'
  - id: gone_wall_as_stranger_before_deletion
    as: stranger
    request:
      method: GET
      path: '/people/{{persona.gone}}/posts'
  - id: gone_deletes_account
    as: gone
    request:
      method: DELETE
      path: '/people/me'
      headers:
        content-type: 'application/json'
      body_raw: '{"confirm":true}'
  - id: gone_wall_as_stranger_after_deletion
    as: stranger
    request:
      method: GET
      path: '/people/{{persona.gone}}/posts'
  - id: gone_wall_as_self_after_deletion
    as: gone
    request:
      method: GET
      path: '/people/{{persona.gone}}/posts'
  - id: trailing_slash_redirects
    as: stranger
    request:
      method: GET
      path: '/people/{{persona.author}}/posts/'
  - id: post_not_allowed
    as: author
    request:
      method: POST
      path: '/people/{{persona.author}}/posts'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"x","audience":"only_me"}'
