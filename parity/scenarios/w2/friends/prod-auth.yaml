# W2 · the friend graph in prod mode (ADR-0014): identity is a bearer session
# looked up by digest, X-Actor-* is ignored, roles come from the roster, and an
# ended or revoked session is the same 401 "Session is not valid". The harness
# seeds a people row (display_name = persona name) and a live session per persona.
#
# LIMITER: one step below spends friend_lookup_limit (1 per pass).
id: w2/friends/prod-auth
routes:
  - 'POST /friends/requests'
  - 'POST /friends/requests/{request_id}/respond'
  - 'GET /people/{person_id}/friend-requests'
  - 'GET /people/{person_id}/friends'
  - 'POST /friends/lookup'
auth_mode: prod
personas:
  owner: {}
  mate: {}
  other: {}
  leaver: {}
steps:
  - id: anonymous_send
    as: anonymous
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.mate}}"}'
  - id: anonymous_malformed_json
    as: anonymous
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id": '
  - id: junk_bearer_send
    as: anonymous
    request:
      method: POST
      path: '/friends/requests'
      headers:
        authorization: 'Bearer khong-phai-token-that'
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.mate}}"}'
  - id: basic_scheme_list
    as: anonymous
    request:
      method: GET
      path: '/people/{{persona.other}}/friends'
      headers:
        authorization: 'Basic {{token.other}}'
  # the scheme is matched case-insensitively
  - id: lowercase_scheme_list
    as: anonymous
    request:
      method: GET
      path: '/people/{{persona.other}}/friends'
      headers:
        authorization: 'bearer {{token.other}}'
  # dev would trust these headers; prod answers 401 without a bearer
  - id: actor_headers_ignored_send
    as: anonymous
    request:
      method: POST
      path: '/friends/requests'
      headers:
        x-actor-id: '{{persona.owner}}'
        x-actor-roles: 'member'
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.mate}}"}'
  - id: actor_headers_ignored_respond
    as: anonymous
    request:
      method: POST
      path: '/friends/requests/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/respond'
      headers:
        x-actor-id: '{{persona.mate}}'
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: owner_asks_mate
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.mate}}"}'
    bind:
      owner_to_mate: {from: body, pointer: /id, class: uuid}
  # dev would answer 403 role_not_permitted to an empty X-Actor-Roles; prod reads the roster
  - id: owner_empty_roles_header_ignored
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        x-actor-roles: ''
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.other}}"}'
  # dev would read this as mate and answer 403 is_self; prod is still owner
  - id: owner_x_actor_id_header_ignored
    as: owner
    request:
      method: GET
      path: '/people/{{persona.owner}}/friend-requests?direction=outgoing'
      headers:
        x-actor-id: '{{persona.mate}}'
  - id: mate_incoming
    as: mate
    request:
      method: GET
      path: '/people/{{persona.mate}}/friend-requests'
  - id: mate_reads_owner_requests
    as: mate
    request:
      method: GET
      path: '/people/{{persona.owner}}/friend-requests'
  - id: owner_accepts_own_request
    as: owner
    request:
      method: POST
      path: '/friends/requests/{{owner_to_mate}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/friends/requests/{{owner_to_mate}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: owner_friends
    as: owner
    request:
      method: GET
      path: '/people/{{persona.owner}}/friends'
  - id: mate_reads_owner_friends
    as: mate
    request:
      method: GET
      path: '/people/{{persona.owner}}/friends'
  # the idempotency scope is bearer:<sha256 of the token>
  - id: idem_owner_asks_leaver
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        idempotency-key: 'w2-prod-friend-a'
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.leaver}}"}'
  - id: idem_owner_replay
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        idempotency-key: 'w2-prod-friend-a'
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.leaver}}"}'
  # same key, same body, but no bearer: the raw X-Actor-ID is another scope, so no replay
  - id: idem_same_key_actor_header_scope
    as: anonymous
    request:
      method: POST
      path: '/friends/requests'
      headers:
        idempotency-key: 'w2-prod-friend-a'
        x-actor-id: '{{persona.owner}}'
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.leaver}}"}'
  - id: anonymous_lookup
    as: anonymous
    request:
      method: POST
      path: '/friends/lookup'
      headers:
        content-type: 'application/json'
      body_raw: '{"phone":"03\t99\t00\t00\t06"}'
  # spends 1 of friend_lookup_limit: nobody derives to this sample number (dữ liệu mẫu)
  - id: owner_lookup_unregistered
    as: owner
    request:
      method: POST
      path: '/friends/lookup'
      headers:
        content-type: 'application/json'
      body_raw: '{"phone":"03\t99\t00\t00\t06"}'
  - id: leaver_incoming
    as: leaver
    request:
      method: GET
      path: '/people/{{persona.leaver}}/friend-requests'
  - id: leaver_deletes_account
    as: leaver
    request:
      method: DELETE
      path: '/people/me'
      headers:
        content-type: 'application/json'
      body_raw: '{"confirm":true}'
  # erasure revoked every session of the ended account
  - id: leaver_lists_after_deleting
    as: leaver
    request:
      method: GET
      path: '/people/{{persona.leaver}}/friends'
  - id: owner_outgoing_after_leaver_deleted
    as: owner
    request:
      method: GET
      path: '/people/{{persona.owner}}/friend-requests?direction=outgoing'
  - id: other_signs_out
    as: other
    request:
      method: DELETE
      path: '/sessions/current'
  - id: other_sends_after_sign_out
    as: other
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.mate}}"}'
  - id: other_lists_after_sign_out
    as: other
    request:
      method: GET
      path: '/people/{{persona.other}}/friends'
