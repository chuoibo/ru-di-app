# W2 cross replay · POST /friends/requests (201, one friend_requests row).
# One implementation stores the Idempotency-Key answer and the other answers the
# next request under that key, in both directions: Go must replay what Python
# stored and refuse what Python would refuse, and the reverse. Steps with
# via: python skip core on the candidate; on the reference every step is
# Python. Names are sample data (dữ liệu mẫu).
id: w2/crossreplay/post-friends-requests
routes: ['POST /friends/requests']
auth_mode: dev
personas:
  asker: {}
  first: {}
  second: {}
  third: {}
  fourth: {}
steps:
  - id: register_asker
    as: asker
    request:
      method: PUT
      path: '/people/{{persona.asker}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người hỏi chéo (dữ liệu mẫu)"}'
  - id: register_first
    as: first
    request:
      method: PUT
      path: '/people/{{persona.first}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người được hỏi một (dữ liệu mẫu)"}'
  - id: register_second
    as: second
    request:
      method: PUT
      path: '/people/{{persona.second}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người được hỏi hai (dữ liệu mẫu)"}'
  - id: register_third
    as: third
    request:
      method: PUT
      path: '/people/{{persona.third}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người được hỏi ba (dữ liệu mẫu)"}'
  - id: register_fourth
    as: fourth
    request:
      method: PUT
      path: '/people/{{persona.fourth}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người được hỏi bốn (dữ liệu mẫu)"}'
  # Python stores, Go answers
  - id: python_stores_key
    as: asker
    via: python
    request:
      method: POST
      path: '/friends/requests'
      headers:
        idempotency-key: 'x-friend-a'
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.first}}"}'
  - id: core_replays_python_key
    as: asker
    request:
      method: POST
      path: '/friends/requests'
      headers:
        idempotency-key: 'x-friend-a'
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.first}}"}'
  - id: core_replays_python_key_respaced
    as: asker
    request:
      method: POST
      path: '/friends/requests'
      headers:
        idempotency-key: 'x-friend-a'
        content-type: 'application/json'
      body_raw: '{ "addressee_id" : "{{persona.first}}" }'
  - id: core_refuses_python_key_other_body
    as: asker
    request:
      method: POST
      path: '/friends/requests'
      headers:
        idempotency-key: 'x-friend-a'
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.second}}"}'
  # Go stores, Python answers
  - id: core_stores_key
    as: asker
    request:
      method: POST
      path: '/friends/requests'
      headers:
        idempotency-key: 'x-friend-b'
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.second}}"}'
  - id: python_replays_core_key
    as: asker
    via: python
    request:
      method: POST
      path: '/friends/requests'
      headers:
        idempotency-key: 'x-friend-b'
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.second}}"}'
  - id: python_replays_core_key_respaced
    as: asker
    via: python
    request:
      method: POST
      path: '/friends/requests'
      headers:
        idempotency-key: 'x-friend-b'
        content-type: 'application/json'
      body_raw: '{"addressee_id":   "{{persona.second}}"}'
  - id: python_refuses_core_key_other_body
    as: asker
    via: python
    request:
      method: POST
      path: '/friends/requests'
      headers:
        idempotency-key: 'x-friend-b'
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.third}}"}'
  # a 409 (the pair already holds a live edge) is not stored: whichever side
  # refused, the other side runs the next request under that key
  - id: python_refusal_releases_key
    as: asker
    via: python
    request:
      method: POST
      path: '/friends/requests'
      headers:
        idempotency-key: 'x-friend-c'
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.first}}"}'
  - id: core_uses_key_python_released
    as: asker
    request:
      method: POST
      path: '/friends/requests'
      headers:
        idempotency-key: 'x-friend-c'
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.third}}"}'
  - id: core_refusal_releases_key
    as: asker
    request:
      method: POST
      path: '/friends/requests'
      headers:
        idempotency-key: 'x-friend-d'
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.first}}"}'
  - id: python_uses_key_core_released
    as: asker
    via: python
    request:
      method: POST
      path: '/friends/requests'
      headers:
        idempotency-key: 'x-friend-d'
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.fourth}}"}'
  - id: core_replays_what_python_stored_after_release
    as: asker
    request:
      method: POST
      path: '/friends/requests'
      headers:
        idempotency-key: 'x-friend-d'
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.fourth}}"}'
