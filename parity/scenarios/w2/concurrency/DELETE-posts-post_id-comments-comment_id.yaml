# W2 concurrency · DELETE /posts/{id}/comments/{comment_id}. Copies are released
# together. Under one key the burst deletes once and the other copies replay the
# 204 (through core without content-length, ADR-0029 §2.4
# RESPONSE-204-CONTENT-LENGTH).
# Deleting one comment twice at once without a key is not here: neither Python
# nor Go locks the row, so whether the second copy answers 204 or 404 depends on
# whether it reads before the first one commits. In the union gate of 2026-09-15
# Python answered 204 + 204 in all three reference runs and Go 204 + 404:
# scheduling, not behaviour. Texts are sample data (dữ liệu mẫu).
id: w2/concurrency/delete-posts-post_id-comments-comment_id
routes: ['DELETE /posts/{post_id}/comments/{comment_id}']
auth_mode: dev
personas:
  author: {}
  reader: {}
steps:
  - id: register_author
    as: author
    request:
      method: PUT
      path: '/people/{{persona.author}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người viết (dữ liệu mẫu)"}'
  - id: register_reader
    as: reader
    request:
      method: PUT
      path: '/people/{{persona.reader}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người gỡ bình luận cùng lúc (dữ liệu mẫu)"}'
  - id: author_posts_public
    as: author
    request:
      method: POST
      path: '/posts'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"Bài để gỡ bình luận cùng lúc (dữ liệu mẫu)","audience":"public"}'
    bind:
      post: {from: body, pointer: /id, class: uuid}
  - id: reader_comments_one
    as: reader
    request:
      method: POST
      path: '/posts/{{post}}/comments'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"Bình luận một (dữ liệu mẫu)"}'
    bind:
      c_one: {from: body, pointer: /id, class: uuid}
  - id: reader_comments_two
    as: reader
    request:
      method: POST
      path: '/posts/{{post}}/comments'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"Bình luận hai (dữ liệu mẫu)"}'
    bind:
      c_two: {from: body, pointer: /id, class: uuid}
  - id: same_key_burst
    as: reader
    concurrent: 3
    request:
      method: DELETE
      path: '/posts/{{post}}/comments/{{c_one}}'
      headers:
        idempotency-key: 'c-uncomment-same'
  - id: same_key_other_comment_burst
    as: reader
    concurrent: 2
    request:
      method: DELETE
      path: '/posts/{{post}}/comments/{{c_two}}'
      headers:
        idempotency-key: 'c-uncomment-same'
