# W2 stories with a real photo · GET /stories — the rail with real stories: visibility
# matrix (author, group mate who is not a friend, pending request, friend,
# blocked either way, block lifted, asked again, deleted author, deleted
# reader) and ordering (own first, unseen, newest first; seen per reader).
# Branches that need no story: w2/stories/get-stories.
# Every upload writes uploaded_images.storage_key = secrets.token_hex(16), which
# never reaches the wire; the database lane compares it as <hex32#n> (ADR-0029 §2.4).
id: w2/stories-photo/get-stories
routes: ['GET /stories']
auth_mode: dev
personas:
  viewer: {}
  friend_a: {}
  friend_b: {}
  stranger: {}
steps:
  - id: register_viewer
    as: viewer
    request:
      method: PUT
      path: '/people/{{persona.viewer}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người xem (dữ liệu mẫu)"}'
  - id: register_friend_a
    as: friend_a
    request:
      method: PUT
      path: '/people/{{persona.friend_a}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn A (dữ liệu mẫu)"}'
  - id: register_friend_b
    as: friend_b
    request:
      method: PUT
      path: '/people/{{persona.friend_b}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn B (dữ liệu mẫu)"}'
  - id: register_stranger
    as: stranger
    request:
      method: PUT
      path: '/people/{{persona.stranger}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người lạ (dữ liệu mẫu)"}'
  - id: upload_viewer_photo
    as: viewer
    request:
      method: POST
      path: '/people/me/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_raw: "--parityboundary\r\nContent-Disposition: form-data; name=\"file\"; filename=\"mau.ppm\"\r\nContent-Type: image/x-portable-pixmap\r\n\r\nP3\n1 1\n255\n200 120 40\n\r\n--parityboundary--\r\n"
    bind:
      photo_v: {from: body, pointer: /id, class: uuid}
  - id: upload_friend_a_photo
    as: friend_a
    request:
      method: POST
      path: '/people/me/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_raw: "--parityboundary\r\nContent-Disposition: form-data; name=\"file\"; filename=\"mau.ppm\"\r\nContent-Type: image/x-portable-pixmap\r\n\r\nP3\n1 1\n255\n40 160 90\n\r\n--parityboundary--\r\n"
    bind:
      photo_a: {from: body, pointer: /id, class: uuid}
  - id: upload_friend_b_photo
    as: friend_b
    request:
      method: POST
      path: '/people/me/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_raw: "--parityboundary\r\nContent-Disposition: form-data; name=\"file\"; filename=\"mau.ppm\"\r\nContent-Type: image/x-portable-pixmap\r\n\r\nP3\n1 1\n255\n90 40 160\n\r\n--parityboundary--\r\n"
    bind:
      photo_b: {from: body, pointer: /id, class: uuid}
  - id: viewer_creates_group
    as: viewer
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm story (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  - id: viewer_invites_friend_a
    as: viewer
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.friend_a}}"}'
    bind:
      membership: {from: body, pointer: /id, class: uuid}
  - id: friend_a_joins_group
    as: friend_a
    request:
      method: POST
      path: '/memberships/{{membership}}/accept'
  - id: friend_a_story_one
    as: friend_a
    request:
      method: POST
      path: '/stories'
      headers:
        content-type: 'application/json'
      body_raw: '{"image_url":"/people/{{persona.friend_a}}/photos/{{photo_a}}","caption":"A một"}'
    bind:
      story_a1: {from: body, pointer: /id, class: uuid}
  # an ACTIVE shared group is not friendship: stories have no group arm
  - id: viewer_feed_groupmate_is_not_friend
    as: viewer
    request:
      method: GET
      path: '/stories'
  - id: viewer_story
    as: viewer
    request:
      method: POST
      path: '/stories'
      headers:
        content-type: 'application/json'
      body_raw: '{"image_url":"/people/{{persona.viewer}}/photos/{{photo_v}}"}'
    bind:
      story_v: {from: body, pointer: /id, class: uuid}
  - id: viewer_feed_own_only
    as: viewer
    request:
      method: GET
      path: '/stories'
  - id: viewer_asks_friend_a
    as: viewer
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.friend_a}}"}'
    bind:
      req_a: {from: body, pointer: /id, class: uuid}
  - id: viewer_feed_pending_is_not_friend
    as: viewer
    request:
      method: GET
      path: '/stories'
  - id: friend_a_feed_pending_is_not_friend
    as: friend_a
    request:
      method: GET
      path: '/stories'
  - id: friend_a_accepts
    as: friend_a
    request:
      method: POST
      path: '/friends/requests/{{req_a}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: viewer_feed_friend_unseen
    as: viewer
    request:
      method: GET
      path: '/stories'
  # GET /stories asks for no permission: an empty role list still reads the rail
  - id: viewer_roles_empty_feed
    as: viewer
    request:
      method: GET
      path: '/stories'
      headers:
        x-actor-roles: ''
  - id: viewer_query_string_ignored
    as: viewer
    request:
      method: GET
      path: '/stories?limit=1&author_id={{persona.friend_a}}&include_expired=true'
  - id: friend_b_asks_viewer
    as: friend_b
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.viewer}}"}'
    bind:
      req_b: {from: body, pointer: /id, class: uuid}
  - id: viewer_accepts_friend_b
    as: viewer
    request:
      method: POST
      path: '/friends/requests/{{req_b}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: friend_b_story_one
    as: friend_b
    request:
      method: POST
      path: '/stories'
      headers:
        content-type: 'application/json'
      body_raw: '{"image_url":"/people/{{persona.friend_b}}/photos/{{photo_b}}","caption":"B một"}'
    bind:
      story_b1: {from: body, pointer: /id, class: uuid}
  # two unseen authors: the newer story (B) comes first
  - id: viewer_feed_two_unseen_newest_first
    as: viewer
    request:
      method: GET
      path: '/stories'
  - id: viewer_sees_a1
    as: viewer
    request:
      method: POST
      path: '/stories/{{story_a1}}/seen'
  # A is all seen now, so it drops behind B although nothing about A changed
  - id: viewer_feed_seen_author_last
    as: viewer
    request:
      method: GET
      path: '/stories'
  - id: friend_a_story_two
    as: friend_a
    request:
      method: POST
      path: '/stories'
      headers:
        content-type: 'application/json'
      body_raw: '{"image_url":"/people/{{persona.friend_a}}/photos/{{photo_a}}","caption":"A hai"}'
    bind:
      story_a2: {from: body, pointer: /id, class: uuid}
  # A has something unseen again and its newest story is newer than B's
  - id: viewer_feed_unseen_again_newest_first
    as: viewer
    request:
      method: GET
      path: '/stories'
  - id: viewer_sees_own_story
    as: viewer
    request:
      method: POST
      path: '/stories/{{story_v}}/seen'
  - id: viewer_sees_b1
    as: viewer
    request:
      method: POST
      path: '/stories/{{story_b1}}/seen'
  - id: viewer_sees_a2
    as: viewer
    request:
      method: POST
      path: '/stories/{{story_a2}}/seen'
  # everything seen: own first (all_seen true), then newest first
  - id: viewer_feed_all_seen_newest_first
    as: viewer
    request:
      method: GET
      path: '/stories'
  # seen is per reader: A has not looked at the viewer's story
  - id: friend_a_feed_own_first_then_unseen
    as: friend_a
    request:
      method: GET
      path: '/stories'
  - id: stranger_feed
    as: stranger
    request:
      method: GET
      path: '/stories'
  - id: friend_b_blocks_viewer
    as: friend_b
    request:
      method: POST
      path: '/people/{{persona.viewer}}/block'
  - id: viewer_feed_blocked_by_author
    as: viewer
    request:
      method: GET
      path: '/stories'
  - id: friend_b_feed_blocker_sees_nothing_of_viewer
    as: friend_b
    request:
      method: GET
      path: '/stories'
  - id: friend_b_unblocks_viewer
    as: friend_b
    request:
      method: DELETE
      path: '/people/{{persona.viewer}}/block'
  # a lifted block comes back declined, never as the friendship it ended
  - id: viewer_feed_after_unblock_not_friend
    as: viewer
    request:
      method: GET
      path: '/stories'
  - id: viewer_blocks_friend_a
    as: viewer
    request:
      method: POST
      path: '/people/{{persona.friend_a}}/block'
  - id: viewer_feed_blocker_sees_nothing
    as: viewer
    request:
      method: GET
      path: '/stories'
  - id: friend_a_feed_blocked_by_reader
    as: friend_a
    request:
      method: GET
      path: '/stories'
  - id: viewer_unblocks_friend_a
    as: viewer
    request:
      method: DELETE
      path: '/people/{{persona.friend_a}}/block'
  - id: friend_a_asks_again
    as: friend_a
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.viewer}}"}'
    bind:
      req_a_again: {from: body, pointer: /id, class: uuid}
  - id: viewer_accepts_again
    as: viewer
    request:
      method: POST
      path: '/friends/requests/{{req_a_again}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  # the old story_views rows survived the block: A's stories come back seen
  - id: viewer_feed_refriended
    as: viewer
    request:
      method: GET
      path: '/stories'
  - id: friend_a_deletes_account
    as: friend_a
    request:
      method: DELETE
      path: '/people/me'
      headers:
        content-type: 'application/json'
      body_raw: '{"confirm":true}'
  - id: viewer_feed_after_author_deleted
    as: viewer
    request:
      method: GET
      path: '/stories'
  - id: viewer_deletes_account
    as: viewer
    request:
      method: DELETE
      path: '/people/me'
      headers:
        content-type: 'application/json'
      body_raw: '{"confirm":true}'
  - id: viewer_feed_after_own_account_deleted
    as: viewer
    request:
      method: GET
      path: '/stories'
