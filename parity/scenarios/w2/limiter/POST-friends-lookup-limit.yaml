      path: '/friends/lookup'
      headers:
        content-type: 'application/json'
      body_raw: '{"phone":{"n":1}}'
  # spends 1 (4 of 30)
  - id: spend_04_landline
    as: seeker
    request:
      method: POST
      path: '/friends/lookup'
      headers:
        content-type: 'application/json'
