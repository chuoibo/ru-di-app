# W2 limiter lane · POST /friends/lookup against friend_lookup_limit (30 per
# source address per 60 s, in memory, routes/friends.py). The actor dependency
# runs before the handler and spends nothing; every request that reaches the
# handler spends one, refusals included. `parity run --lane limiter` starts this
# file in a fresh window on each side, so the 31st is refused on both.
#
# Sample numbers (dữ liệu mẫu), split by JSON \t escapes so no digit run reaches
# the repo.
id: w2/limiter/post-friends-lookup-limit
routes: ['POST /friends/lookup', 'POST /identity/person-id']
auth_mode: dev
lane: limiter
personas:
  seeker: {}
steps:
  # spends 0: get_actor refuses before the handler
  - id: anonymous_is_401
    as: anonymous
    request:
      method: POST
      path: '/friends/lookup'
      headers:
        content-type: 'application/json'
      body_raw: '{"phone":"09\t77\t00\t00\t09"}'
  # spends 0: the actor header is refused before the handler
  - id: actor_id_not_uuid
    as: anonymous
    request:
      method: POST
      path: '/friends/lookup'
      headers:
        x-actor-id: 'khong-phai-uuid'
        content-type: 'application/json'
      body_raw: '{"phone":"09\t77\t00\t00\t09"}'
  # spends 0: the idempotency middleware refuses before routing
  - id: empty_idempotency_key
    as: seeker
    request:
      method: POST
      path: '/friends/lookup'
      headers:
        idempotency-key: ''
        content-type: 'application/json'
      body_raw: '{"phone":"09\t77\t00\t00\t09"}'
  # spends 1 (1 of 30)
  - id: spend_01_unknown_number
    as: seeker
    request:
      method: POST
      path: '/friends/lookup'
      headers:
        content-type: 'application/json'
      body_raw: '{"phone":"09\t77\t00\t00\t09"}'
  # spends 1 (2 of 30)
