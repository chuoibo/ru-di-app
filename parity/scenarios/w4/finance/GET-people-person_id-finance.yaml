      path: '/expenses'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","description":"Bữa trưa (dữ liệu mẫu)","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-04T12:00:00+07:00","participants":["{{persona.owner}}","{{persona.mate}}"],"total_amount_vnd":20000}'
    bind:
      lunch: {from: body, pointer: /expense_id, class: uuid}
  - id: owner_confirms_lunch
    as: owner
    request:
      method: POST
      path: '/expenses/{{lunch}}/confirm'
      headers:
        content-type: 'application/json'
      body_raw: '{"proposal":{"context_id":"{{ctx}}","description":"Bữa trưa (dữ liệu mẫu)","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-04T12:00:00+07:00","participants":["{{persona.owner}}","{{persona.mate}}"],"total_amount_vnd":20000},"expected_allocations":{"{{persona.owner}}":10000,"{{persona.mate}}":10000},"acknowledge_as_advancer":true}'
    bind:
      lunch_version: {from: body, pointer: /expense_version_id, class: uuid}
  # a proposal alone is not in the ledger
  - id: third_proposes_unconfirmed
    as: third
    request:
      method: POST
      path: '/expenses'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","description":"Chưa xác nhận (dữ liệu mẫu)","recorded_by_id":"{{persona.third}}","paid_by_id":"{{persona.third}}","verification_scope":"totals_only","occurred_at":"2030-01-04T13:00:00+07:00","participants":["{{persona.owner}}","{{persona.third}}"],"total_amount_vnd":90000}'
  - id: owner_after_expenses
    as: owner
    request:
      method: GET
      path: '/people/{{persona.owner}}/finance'
  - id: mate_after_expenses
    as: mate
    request:
      method: GET
      path: '/people/{{persona.mate}}/finance'
  # a member who shares no expense: counts zero, one group
  - id: third_after_expenses
    as: third
    request:
      method: GET
      path: '/people/{{persona.third}}/finance'
  # batches: one expense each. An obligation merged from two expenses lists
  # source_expense_version_ids sorted by random uuid text, which no two stacks
  # share, so the "first +N" occasion is left out
  - id: owner_batches_dinner
    as: owner
    request:
      method: POST
      path: '/batches'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","expense_version_ids":["{{dinner_version}}"],"due_at":"2030-02-01T12:00:00+07:00"}'
    bind:
      o_dinner: {from: body, pointer: /obligations/0/obligation_id, class: uuid}
  - id: mate_batches_taxi
    as: mate
    request:
      method: POST
      path: '/batches'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","expense_version_ids":["{{taxi_version}}"],"due_at":"2030-02-01T12:00:00+07:00"}'
    bind:
      o_taxi: {from: body, pointer: /obligations/0/obligation_id, class: uuid}
  - id: owner_batches_snack
    as: owner
    request:
      method: POST
      path: '/batches'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","expense_version_ids":["{{snack_version}}"],"due_at":"2030-02-01T12:00:00+07:00"}'
    bind:
      o_snack: {from: body, pointer: /obligations/0/obligation_id, class: uuid}
  - id: owner_batches_breakfast
    as: owner
    request:
      method: POST
      path: '/batches'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","expense_version_ids":["{{breakfast_version}}"],"due_at":"2030-02-01T12:00:00+07:00"}'
    bind:
      o_breakfast: {from: body, pointer: /obligations/0/obligation_id, class: uuid}
  - id: owner_batches_lunch
    as: owner
    request:
      method: POST
      path: '/batches'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","expense_version_ids":["{{lunch_version}}"],"due_at":"2030-02-01T12:00:00+07:00"}'
    bind:
      o_lunch: {from: body, pointer: /obligations/0/obligation_id, class: uuid}
  # a batched but unpaid share still counts as owed
  - id: mate_after_batches
    as: mate
    request:
      method: GET
      path: '/people/{{persona.mate}}/finance'
  # the snack obligation has no description: occasion null
  - id: owner_confirms_snack_receipt
    as: owner
    request:
      method: POST
      path: '/obligations/{{o_snack}}/confirm-receipt'
      headers:
        content-type: 'application/json'
      body_raw: '{"amount_vnd":30000,"idempotency_key":"{{kp}}-aaaaaaaaaaa1"}'
  - id: owner_after_first_receipt
    as: owner
    request:
      method: GET
      path: '/people/{{persona.owner}}/finance'
  - id: mate_after_first_receipt
    as: mate
    request:
      method: GET
      path: '/people/{{persona.mate}}/finance'
  # more than owed: outstanding and receivable clamp at zero
  - id: mate_over_confirms_taxi
    as: mate
    request:
      method: POST
      path: '/obligations/{{o_taxi}}/confirm-receipt'
      headers:
        content-type: 'application/json'
      body_raw: '{"amount_vnd":40000,"idempotency_key":"{{kp}}-aaaaaaaaaaa2"}'
  - id: owner_after_over_receipt
    as: owner
    request:
      method: GET
      path: '/people/{{persona.owner}}/finance'
  - id: mate_after_over_receipt
    as: mate
    request:
      method: GET
      path: '/people/{{persona.mate}}/finance'
  # 21 receipts on the dinner obligation: the movement list stops at 20
  - id: owner_confirms_dinner_receipt_01
    as: owner
    request:
      method: POST
      path: '/obligations/{{o_dinner}}/confirm-receipt'
      headers:
        content-type: 'application/json'
      body_raw: '{"amount_vnd":1000,"idempotency_key":"{{kp}}-bbbbbbbbbb01"}'
  - id: owner_confirms_dinner_receipt_02
    as: owner
    request:
      method: POST
      path: '/obligations/{{o_dinner}}/confirm-receipt'
      headers:
        content-type: 'application/json'
      body_raw: '{"amount_vnd":1000,"idempotency_key":"{{kp}}-bbbbbbbbbb02"}'
  - id: owner_confirms_dinner_receipt_03
    as: owner
    request:
      method: POST
      path: '/obligations/{{o_dinner}}/confirm-receipt'
      headers:
        content-type: 'application/json'
      body_raw: '{"amount_vnd":1000,"idempotency_key":"{{kp}}-bbbbbbbbbb03"}'
  - id: owner_confirms_dinner_receipt_04
    as: owner
    request:
      method: POST
      path: '/obligations/{{o_dinner}}/confirm-receipt'
      headers:
        content-type: 'application/json'
      body_raw: '{"amount_vnd":1000,"idempotency_key":"{{kp}}-bbbbbbbbbb04"}'
  - id: owner_confirms_dinner_receipt_05
    as: owner
    request:
      method: POST
      path: '/obligations/{{o_dinner}}/confirm-receipt'
      headers:
        content-type: 'application/json'
      body_raw: '{"amount_vnd":1000,"idempotency_key":"{{kp}}-bbbbbbbbbb05"}'
  - id: owner_confirms_dinner_receipt_06
    as: owner
    request:
      method: POST
      path: '/obligations/{{o_dinner}}/confirm-receipt'
      headers:
        content-type: 'application/json'
      body_raw: '{"amount_vnd":1000,"idempotency_key":"{{kp}}-bbbbbbbbbb06"}'
  - id: owner_confirms_dinner_receipt_07
