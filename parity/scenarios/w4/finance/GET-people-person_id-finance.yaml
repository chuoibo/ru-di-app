  - id: mate_after_twenty_one_receipts
    as: mate
    request:
      method: GET
      path: '/people/{{persona.mate}}/finance'
  # sums past int64 on one pair (mate owes owner), one receipt of 2**63 - 1 on
  # each of two obligations: collection_obligation_progress casts a single
  # obligation's receipt sum to bigint
  - id: owner_confirms_breakfast_int64_max
    as: owner
    request:
      method: POST
      path: '/obligations/{{o_breakfast}}/confirm-receipt'
      headers:
        content-type: 'application/json'
      body_raw: '{"amount_vnd":9223372036854775807,"idempotency_key":"{{kp}}-cccccccccc01"}'  # repo-guard: allow=long-number reason=int64-receipt-sum-probe
  - id: owner_confirms_lunch_int64_max
    as: owner
    request:
      method: POST
      path: '/obligations/{{o_lunch}}/confirm-receipt'
      headers:
        content-type: 'application/json'
      body_raw: '{"amount_vnd":9223372036854775807,"idempotency_key":"{{kp}}-cccccccccc02"}'  # repo-guard: allow=long-number reason=int64-receipt-sum-probe
  # collected past int64 for the owner, paid past int64 for the mate
  - id: owner_after_int64_receipts
    as: owner
    request:
      method: GET
      path: '/people/{{persona.owner}}/finance'
  - id: mate_after_int64_receipts
    as: mate
    request:
      method: GET
      path: '/people/{{persona.mate}}/finance'
  - id: third_after_int64_receipts
    as: third
    request:
      method: GET
      path: '/people/{{persona.third}}/finance'
  # leaving drops the group count; the ledger keeps every figure
  - id: mate_leaves
    as: mate
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.mate}}'
  - id: mate_after_leaving
    as: mate
    request:
      method: GET
      path: '/people/{{persona.mate}}/finance'
  - id: undeclared_query_ignored
    as: owner
    request:
      method: GET
      path: '/people/{{persona.owner}}/finance?limit=1'
  - id: trailing_slash_redirects
    as: owner
    request:
      method: GET
      path: '/people/{{persona.owner}}/finance/'
  - id: post_not_allowed
    as: owner
    request:
      method: POST
      path: '/people/{{persona.owner}}/finance'
      headers:
        content-type: 'application/json'
      body_raw: '{}'
