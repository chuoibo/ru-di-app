  # 17 two-byte letters: 34 bytes, over the 32-byte kind limit
  - id: owner_surcharge_kind_over_32_bytes
    as: owner
    request:
      method: POST
      path: '/expenses'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"items_reviewed","occurred_at":"2030-01-04T08:00:00+07:00","participants":["{{persona.owner}}"],"total_amount_vnd":1100,"items":[{"item_id":"pho","amount_vnd":1000,"shared_by":["{{persona.owner}}"]}],"surcharges":[{"surcharge_id":"phi","kind":"ơơơơơơơơơơơơơơơơơ","amount_vnd":100,"mode":"even"}]}'
