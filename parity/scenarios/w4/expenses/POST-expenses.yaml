    request:
      method: POST
      path: '/expenses'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-04T08:00:00+07:00","participants":["{{persona.owner}}"],"total_amount_vnd":18446744073709551616}'  # repo-guard: allow=long-number reason=int64-overflow-probe
  - id: owner_total_below_int64
    as: owner
    request:
      method: POST
      path: '/expenses'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-04T08:00:00+07:00","participants":["{{persona.owner}}"],"total_amount_vnd":-9223372036854775809}'  # repo-guard: allow=long-number reason=int64-overflow-probe
  # an item past int64 next to a valid total
  - id: owner_item_past_int64
    as: owner
    request:
      method: POST
      path: '/expenses'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"items_reviewed","occurred_at":"2030-01-04T08:00:00+07:00","participants":["{{persona.owner}}"],"total_amount_vnd":1000,"items":[{"item_id":"pho","amount_vnd":9223372036854775808,"shared_by":["{{persona.owner}}"]}]}'  # repo-guard: allow=long-number reason=int64-overflow-probe
