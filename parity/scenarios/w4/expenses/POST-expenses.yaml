        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-04T08:00:00+07:00","participants":["{{persona.owner}}"],"total_amount_vnd":1000000000001}'  # repo-guard: allow=long-number reason=allocator-ceiling-probe
  # a JSON integer past int64 is still an integer to pydantic: AMOUNT_TOO_LARGE
