# W4 concurrency · POST /bills with lines under distinct keys (201). Three
# copies are released together and each writes its own bill with two lines
# and the owner suggested on both. The line rows of the copies differ only by
# the bill they belong to, and the share rows only by the line; each copy's
# answer numbers its bill id first, and the database lane tells the rows apart
# by the ids it has numbered. The first burst sends identical bodies, the
# second numbers each copy's line names. Each line names one person: two
# people on one line are ordered by their ids, which change with every
# repeat of a burst scenario and would make the reference differ from itself.
# Nothing unique spans two bills, so no copy can lose a database race. Texts
# are sample data (dữ liệu mẫu).
id: w4/concurrency/post-bills-lines
routes: ['POST /bills']
auth_mode: dev
personas:
  owner: {}
  mate: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ nhóm quét nhiều dòng cùng lúc (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn quét nhiều dòng cùng lúc (dữ liệu mẫu)"}'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm quét nhiều dòng cùng lúc (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  - id: distinct_key_burst_same_lines
    as: owner
    concurrent: 3
    request:
      method: POST
      path: '/bills'
      headers:
        idempotency-key: 'c-bill-lines-{{burst}}'
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":75000,"confidence":70,"needs_review":true,"items":[{"item_key":"pho","name":"Phở (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":60000,"suggested_participant_ids":["{{persona.owner}}"]},{"item_key":"tra","name":"Trà (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":15000,"suggested_participant_ids":["{{persona.owner}}"]}],"surcharges":[{"surcharge_key":"vat","kind":"VAT","amount_vnd":6000,"mode":"proportional"}],"discounts":[{"discount_key":"giam","amount_vnd":1000,"scope":"item","item_key":"tra"}]}'
  - id: distinct_key_burst_numbered_lines
    as: mate
    concurrent: 3
    request:
      method: POST
      path: '/bills'
      headers:
        idempotency-key: 'c-bill-lines-numbered-{{burst}}'
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":40000,"confidence":60,"needs_review":false,"items":[{"item_key":"bun-{{burst}}","name":"Bún số {{burst}} (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":30000,"suggested_participant_ids":["{{persona.mate}}"]},{"item_key":"nuoc","name":"Nước (dữ liệu mẫu)","quantity":2,"unit_price_vnd":5000,"line_total_vnd":10000,"suggested_participant_ids":["{{persona.mate}}"]}]}'
