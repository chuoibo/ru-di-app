# W4 concurrency · POST /expenses/{id}/confirm without an Idempotency-Key.
# Copies of one body are released together. get_expense locks the expenses row
# FOR UPDATE and the version number is MAX + 1 read under that lock, so the
# copies queue and write versions 1, 2 and 3, never two of one number. The
# bodies are identical, so which copy wrote which version cannot show: the
# responses order by their version number, their version ids are numbered in
# that order, and the confirmed allocation rows, equal once masked, are told
# apart by those already-numbered version ids. A later confirmation continues
# at version 4. No balances read here: the reference repeats a burst scenario
# with fresh persona ids, and balances list people in uuid order. Amounts are
# integer VND; texts are sample data (dữ liệu mẫu).
id: w4/concurrency/post-expenses-expense_id-confirm-unkeyed
routes: ['POST /expenses/{expense_id}/confirm']
auth_mode: dev
personas:
  owner: {}
  mate: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ nhóm xác nhận dồn (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn xác nhận dồn (dữ liệu mẫu)"}'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm xác nhận dồn (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  - id: owner_proposes_dinner
    as: owner
    request:
      method: POST
      path: '/expenses'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","description":"Bữa tối dồn (dữ liệu mẫu)","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-02T19:00:00+07:00","participants":["{{persona.owner}}","{{persona.mate}}"],"total_amount_vnd":120000}'
    bind:
      dinner: {from: body, pointer: /expense_id, class: uuid}
  - id: unkeyed_burst_three_versions
    as: owner
    concurrent: 3
    request:
      method: POST
      path: '/expenses/{{dinner}}/confirm'
      headers:
        content-type: 'application/json'
      body_raw: '{"proposal":{"context_id":"{{ctx}}","description":"Bữa tối dồn (dữ liệu mẫu)","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-02T19:00:00+07:00","participants":["{{persona.owner}}","{{persona.mate}}"],"total_amount_vnd":120000},"expected_allocations":{"{{persona.owner}}":60000,"{{persona.mate}}":60000},"acknowledge_as_advancer":true}'
  - id: mate_confirms_after_burst
    as: mate
    request:
      method: POST
      path: '/expenses/{{dinner}}/confirm'
      headers:
        content-type: 'application/json'
      body_raw: '{"proposal":{"context_id":"{{ctx}}","description":"Bữa tối dồn (dữ liệu mẫu)","recorded_by_id":"{{persona.mate}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-02T19:00:00+07:00","participants":["{{persona.owner}}","{{persona.mate}}"],"total_amount_vnd":120001},"expected_allocations":{"{{persona.owner}}":60001,"{{persona.mate}}":60000}}'
  # only the newest version counts: the owner's share of version 4
  - id: owner_reads_finance
    as: owner
    request:
      method: GET
      path: '/people/{{persona.owner}}/finance'
