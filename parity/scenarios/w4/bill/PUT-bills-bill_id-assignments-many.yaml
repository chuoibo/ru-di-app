# W4 · PUT /bills/{bill_id}/assignments naming one person on two or more lines
# in one write, the common use. Every share on the named lines is deleted and
# rewritten as confirmed by the caller; the new rows of one person differ only
# by the line they point to, which the database lane now tells apart by the
# line ids it has already numbered. The same key twice keeps its first
# position and its last list; one person twice on one line is still the
# uncaught unique violation (500) even when the other lines are fine. Texts
# are sample data (dữ liệu mẫu).
id: w4/bill/put-bills-bill_id-assignments-many
routes: ['PUT /bills/{bill_id}/assignments', 'GET /bills/{bill_id}', 'POST /bills/{bill_id}/split']
auth_mode: dev
personas:
  owner: {}
  mate: {}
  third: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ nhóm gán nhiều món (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn gán nhiều món (dữ liệu mẫu)"}'
  - id: register_third
    as: third
    request:
      method: PUT
      path: '/people/{{persona.third}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người thứ ba gán nhiều món (dữ liệu mẫu)"}'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm gán nhiều món (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  - id: owner_invites_third
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.third}}"}'
    bind:
      m_third: {from: body, pointer: /id, class: uuid}
  - id: third_accepts
    as: third
    request:
      method: POST
      path: '/memberships/{{m_third}}/accept'
  - id: owner_creates_bill
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":200000,"items_total_vnd":190000,"confidence":75,"needs_review":true,"items":[{"item_key":"pho","name":"Phở bò (dữ liệu mẫu)","quantity":2,"unit_price_vnd":50000,"line_total_vnd":100000,"suggested_participant_ids":["{{persona.owner}}"]},{"item_key":"Nem","name":"Nem rán (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":45000,"suggested_participant_ids":["{{persona.third}}"]},{"item_key":"tra","name":"Trà đá (dữ liệu mẫu)","quantity":3,"unit_price_vnd":5000,"line_total_vnd":15000,"suggested_participant_ids":["{{persona.mate}}"]},{"item_key":"banh","name":"Bánh flan (dữ liệu mẫu)","quantity":2,"unit_price_vnd":15000,"line_total_vnd":30000,"suggested_participant_ids":[]}],"surcharges":[{"surcharge_key":"phi","kind":"service","amount_vnd":10000,"mode":"even"}]}'
    bind:
      bill: {from: body, pointer: /id, class: uuid}
  # one person on two lines in one write
  - id: owner_assigns_mate_to_pho_and_nem
    as: owner
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        content-type: 'application/json'
      body_raw: '{"assignments":[{"item_key":"pho","participant_ids":["{{persona.mate}}"]},{"item_key":"Nem","participant_ids":["{{persona.mate}}"]}]}'
  # two people on two lines: four rows, two per person, two per line
  - id: owner_assigns_two_people_to_two_lines
    as: owner
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        content-type: 'application/json'
      body_raw: '{"assignments":[{"item_key":"tra","participant_ids":["{{persona.third}}","{{persona.owner}}"]},{"item_key":"banh","participant_ids":["{{persona.owner}}","{{persona.third}}"]}]}'
  - id: owner_reads_after_two_writes
    as: owner
    request:
      method: GET
      path: '/bills/{{bill}}'
  # every person on every line: all shares replaced in one write
  - id: mate_assigns_everyone_everywhere
    as: mate
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        content-type: 'application/json'
      body_raw: '{"assignments":[{"item_key":"banh","participant_ids":["{{persona.owner}}","{{persona.mate}}","{{persona.third}}"]},{"item_key":"Nem","participant_ids":["{{persona.third}}","{{persona.mate}}","{{persona.owner}}"]},{"item_key":"pho","participant_ids":["{{persona.mate}}","{{persona.owner}}","{{persona.third}}"]},{"item_key":"tra","participant_ids":["{{persona.owner}}","{{persona.third}}","{{persona.mate}}"]}]}'
  - id: owner_splits_everyone_everywhere
    as: owner
    request:
      method: POST
      path: '/bills/{{bill}}/split'
      headers:
        content-type: 'application/json'
      body_raw: '{"for_ledger":true,"paid_by_id":"{{persona.third}}"}'
  # the same key twice with a person on another line: pho keeps its first
  # position and takes its last list
  - id: owner_repeats_pho_around_tra
    as: owner
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        content-type: 'application/json'
      body_raw: '{"assignments":[{"item_key":"pho","participant_ids":["{{persona.owner}}"]},{"item_key":"tra","participant_ids":["{{persona.third}}"]},{"item_key":"pho","participant_ids":["{{persona.third}}","{{persona.mate}}"]}]}'
  # one person on two lines is fine; the same person twice on the second line is a 500
  - id: owner_duplicate_on_the_second_line
    as: owner
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        content-type: 'application/json'
      body_raw: '{"assignments":[{"item_key":"Nem","participant_ids":["{{persona.mate}}"]},{"item_key":"banh","participant_ids":["{{persona.mate}}","{{persona.mate}}"]}]}'
  - id: owner_reads_after_the_500
    as: owner
    request:
      method: GET
      path: '/bills/{{bill}}'
  # an unknown key after a known one refuses the write before any delete
  - id: owner_many_with_unknown_last
    as: owner
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        content-type: 'application/json'
      body_raw: '{"assignments":[{"item_key":"Nem","participant_ids":["{{persona.owner}}"]},{"item_key":"banh","participant_ids":["{{persona.owner}}"]},{"item_key":"khong-co","participant_ids":["{{persona.owner}}"]}]}'
  # clearing two lines at once, then the split cannot project
  - id: third_clears_two_lines
    as: third
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        content-type: 'application/json'
      body_raw: '{"assignments":[{"item_key":"Nem","participant_ids":[]},{"item_key":"banh","participant_ids":[]}]}'
  - id: third_splits_with_cleared_lines
    as: third
    request:
      method: POST
      path: '/bills/{{bill}}/split'
      headers:
        content-type: 'application/json'
      body_raw: '{}'
  # idempotency with a many-line write, replayed after the state moved on
  - id: owner_key_many_first
    as: owner
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        idempotency-key: 'w4-assign-many-a'
        content-type: 'application/json'
      body_raw: '{"assignments":[{"item_key":"Nem","participant_ids":["{{persona.owner}}"]},{"item_key":"banh","participant_ids":["{{persona.owner}}"]}]}'
  - id: mate_moves_banh_without_key
    as: mate
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        content-type: 'application/json'
      body_raw: '{"assignments":[{"item_key":"banh","participant_ids":["{{persona.mate}}","{{persona.third}}"]}]}'
  - id: owner_key_many_replay
    as: owner
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        idempotency-key: 'w4-assign-many-a'
        content-type: 'application/json'
      body_raw: '{ "assignments": [ {"item_key": "Nem", "participant_ids": ["{{persona.owner}}"]}, {"item_key": "banh", "participant_ids": ["{{persona.owner}}"]} ] }'
  - id: owner_reads_at_the_end
    as: owner
    request:
      method: GET
      path: '/bills/{{bill}}'
