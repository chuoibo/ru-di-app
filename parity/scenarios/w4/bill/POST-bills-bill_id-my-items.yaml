# W4 · POST /bills/{bill_id}/my-items — the caller's complete set of claimed
# lines. Order: idempotency key, JSON, actor, path and body validation (the
# body cannot name a person: extra keys are refused), bill exists (404), role +
# ACTIVE membership (403), then the bill and its lines are locked FOR UPDATE:
# any unknown key is 422 unknown_bill_item before anything changes; every share
# of the caller on this bill (suggested or confirmed) is deleted and the
# requested keys, de-duplicated, are written back as confirmed by the caller.
# Other people's shares are untouched. Texts are sample data (dữ liệu mẫu).
id: w4/bill/post-bills-bill_id-my-items
routes: ['POST /bills/{bill_id}/my-items']
auth_mode: dev
personas:
  owner: {}
  mate: {}
  third: {}
  invitee: {}
  stranger: {}
steps:
  - id: anonymous_unknown_bill
    as: anonymous
    request:
      method: POST
      path: '/bills/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/my-items'
      headers:
        content-type: 'application/json'
      body_raw: '{"item_keys":[]}'
  # FastAPI decodes a JSON body before resolving the actor: 422 beats 401
  - id: anonymous_malformed_json
    as: anonymous
    request:
      method: POST
      path: '/bills/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/my-items'
      headers:
        content-type: 'application/json'
      body_raw: '{"item_keys": '
  - id: actor_id_not_uuid
    as: stranger
    request:
      method: POST
      path: '/bills/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/my-items'
      headers:
        x-actor-id: 'khong-phai-uuid'
        content-type: 'application/json'
      body_raw: '{"item_keys":[]}'
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ nhóm (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn cùng nhóm (dữ liệu mẫu)"}'
  - id: register_third
    as: third
    request:
      method: PUT
      path: '/people/{{persona.third}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người thứ ba (dữ liệu mẫu)"}'
  - id: register_invitee
    as: invitee
    request:
      method: PUT
      path: '/people/{{persona.invitee}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người được mời (dữ liệu mẫu)"}'
  - id: register_stranger
    as: stranger
    request:
      method: PUT
      path: '/people/{{persona.stranger}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người lạ (dữ liệu mẫu)"}'
  - id: stranger_non_uuid_bill
    as: stranger
    request:
      method: POST
      path: '/bills/khong-phai-uuid/my-items'
      headers:
        content-type: 'application/json'
      body_raw: '{"item_keys":[]}'
  - id: stranger_unknown_bill
    as: stranger
    request:
      method: POST
      path: '/bills/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/my-items'
      headers:
        content-type: 'application/json'
      body_raw: '{"item_keys":["pho"]}'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm tự nhận món (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  - id: owner_invites_third
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.third}}"}'
    bind:
      m_third: {from: body, pointer: /id, class: uuid}
  - id: third_accepts
    as: third
    request:
      method: POST
      path: '/memberships/{{m_third}}/accept'
  - id: owner_invites_invitee
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.invitee}}"}'
  - id: owner_creates_bill
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":175000,"items_total_vnd":175000,"confidence":80,"needs_review":true,"items":[{"item_key":"pho","name":"Phở bò (dữ liệu mẫu)","quantity":2,"unit_price_vnd":50000,"line_total_vnd":100000,"suggested_participant_ids":["{{persona.owner}}"]},{"item_key":"Nem","name":"Nem rán (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":60000,"suggested_participant_ids":["{{persona.mate}}"]},{"item_key":"tra","name":"Trà đá (dữ liệu mẫu)","quantity":3,"unit_price_vnd":5000,"line_total_vnd":15000,"suggested_participant_ids":[]}]}'
    bind:
      bill: {from: body, pointer: /id, class: uuid}
  - id: stranger_real_bill
    as: stranger
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        content-type: 'application/json'
      body_raw: '{"item_keys":["pho"]}'
  - id: invitee_claims
    as: invitee
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        content-type: 'application/json'
      body_raw: '{"item_keys":["pho"]}'
  - id: mate_roles_empty
    as: mate
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        x-actor-roles: ''
        content-type: 'application/json'
      body_raw: '{"item_keys":["pho"]}'
  # one unknown key refuses the whole claim; the owner's suggested share on pho stays
  - id: owner_claims_unknown_item
    as: owner
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        content-type: 'application/json'
      body_raw: '{"item_keys":["pho","khong-co"]}'
  - id: owner_claims_item_key_other_case
    as: owner
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        content-type: 'application/json'
      body_raw: '{"item_keys":["nem"]}'
  # the mate's suggested share on Nem goes and pho comes back confirmed; the
  # owner's suggestion on pho is untouched
  - id: mate_claims_pho
    as: mate
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        content-type: 'application/json'
      body_raw: '{"item_keys":["pho"]}'
  # a repeated key lands once; the owner's suggestion on pho goes
  - id: owner_claims_tra_twice
    as: owner
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        content-type: 'application/json'
      body_raw: '{"item_keys":["tra","tra"]}'
  # every line now has shares and every share is confirmed
  - id: third_claims_nem
    as: third
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        content-type: 'application/json'
      body_raw: '{"item_keys":["Nem"]}'
  - id: mate_repeats_the_same_claim
    as: mate
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        content-type: 'application/json'
      body_raw: '{"item_keys":["pho"]}'
  # the empty list releases every line the mate held
  - id: mate_releases_everything
    as: mate
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        content-type: 'application/json'
      body_raw: '{"item_keys":[]}'
  # pydantic: the body cannot name anybody; strict strings; 64-char keys
  - id: owner_names_someone_else
    as: owner
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        content-type: 'application/json'
      body_raw: '{"item_keys":["pho"],"participant_id":"{{persona.mate}}"}'
  - id: owner_invalid_item_keys
    as: owner
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        content-type: 'application/json'
      body_raw: '{"item_keys":["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",7,null]}'
  - id: owner_item_keys_not_a_list
    as: owner
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        content-type: 'application/json'
      body_raw: '{"item_keys":"pho"}'
  - id: owner_creates_bill_without_lines
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":0,"confidence":0,"needs_review":false,"items":[]}'
    bind:
      empty_bill: {from: body, pointer: /id, class: uuid}
  - id: owner_claims_nothing_on_bill_without_lines
    as: owner
    request:
      method: POST
      path: '/bills/{{empty_bill}}/my-items'
      headers:
        content-type: 'application/json'
      body_raw: '{"item_keys":[]}'
  - id: owner_claims_on_bill_without_lines
    as: owner
    request:
      method: POST
      path: '/bills/{{empty_bill}}/my-items'
      headers:
        content-type: 'application/json'
      body_raw: '{"item_keys":["pho"]}'
  # idempotency: replay after the state moved on, reuse, a refusal that releases
  - id: owner_key_first
    as: owner
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        idempotency-key: 'w4-claim-a'
        content-type: 'application/json'
      body_raw: '{"item_keys":["Nem"]}'
  - id: owner_claims_tra_without_key
    as: owner
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        content-type: 'application/json'
      body_raw: '{"item_keys":["tra"]}'
  - id: owner_key_replay_spaced
    as: owner
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        idempotency-key: 'w4-claim-a'
        content-type: 'application/json'
      body_raw: '{ "item_keys" : [ "Nem" ] }'
  - id: owner_key_reused_repeated_key
    as: owner
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        idempotency-key: 'w4-claim-a'
        content-type: 'application/json'
      body_raw: '{"item_keys":["Nem","Nem"]}'
  - id: owner_key_refused_unknown_item
    as: owner
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        idempotency-key: 'w4-claim-b'
        content-type: 'application/json'
      body_raw: '{"item_keys":["khong-co"]}'
  - id: owner_key_after_refusal
    as: owner
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        idempotency-key: 'w4-claim-b'
        content-type: 'application/json'
      body_raw: '{"item_keys":["pho"]}'
  - id: mate_leaves
    as: mate
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.mate}}'
  - id: mate_claims_after_leaving
    as: mate
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        content-type: 'application/json'
      body_raw: '{"item_keys":["pho"]}'
  - id: get_not_allowed
    as: owner
    request:
      method: GET
      path: '/bills/{{bill}}/my-items'
