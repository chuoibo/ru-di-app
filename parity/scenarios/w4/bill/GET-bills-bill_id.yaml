# W4 · GET /bills/{bill_id} — read one bill draft with its lines, shares,
# surcharges and discounts. Order: actor, path, bill exists (404, before any
# permission check), role + ACTIVE membership of the bill's group (403).
# assignment_state is derived on every read: confirmed only when every line
# has shares and every share is confirmed. Texts are sample data (dữ liệu mẫu).
id: w4/bill/get-bills-bill_id
routes: ['GET /bills/{bill_id}']
auth_mode: dev
personas:
  owner: {}
  mate: {}
  invitee: {}
  stranger: {}
steps:
  - id: anonymous_unknown_bill
    as: anonymous
    request:
      method: GET
      path: '/bills/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee'
  - id: anonymous_non_uuid_bill
    as: anonymous
    request:
      method: GET
      path: '/bills/khong-phai-uuid'
  - id: actor_id_not_uuid
    as: stranger
    request:
      method: GET
      path: '/bills/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee'
      headers:
        x-actor-id: 'khong-phai-uuid'
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ nhóm (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn cùng nhóm (dữ liệu mẫu)"}'
  - id: register_invitee
    as: invitee
    request:
      method: PUT
      path: '/people/{{persona.invitee}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người được mời (dữ liệu mẫu)"}'
  - id: register_stranger
    as: stranger
    request:
      method: PUT
      path: '/people/{{persona.stranger}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người lạ (dữ liệu mẫu)"}'
  - id: stranger_non_uuid_bill
    as: stranger
    request:
      method: GET
      path: '/bills/khong-phai-uuid'
  - id: stranger_unknown_bill
    as: stranger
    request:
      method: GET
      path: '/bills/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm đọc hoá đơn (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  - id: owner_invites_invitee
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.invitee}}"}'
  - id: owner_creates_bill
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":180000,"items_total_vnd":175000,"confidence":80,"needs_review":true,"items":[{"item_key":"pho","name":"Phở bò (dữ liệu mẫu)","quantity":2,"unit_price_vnd":50000,"line_total_vnd":100000,"suggested_participant_ids":["{{persona.owner}}"]},{"item_key":"Nem","name":"Nem rán (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":60000,"suggested_participant_ids":["{{persona.mate}}"]},{"item_key":"tra","name":"Trà đá (dữ liệu mẫu)","quantity":3,"unit_price_vnd":5000,"line_total_vnd":15000,"suggested_participant_ids":[]}],"surcharges":[{"surcharge_key":"vat","kind":"VAT","amount_vnd":12000,"mode":"proportional"},{"surcharge_key":"phi","kind":"service","amount_vnd":5000,"mode":"even"}],"discounts":[{"discount_key":"voucher","amount_vnd":2000,"scope":"global_proportional"},{"discount_key":"giam-pho","amount_vnd":10000,"scope":"item","item_key":"pho"}]}'
    bind:
      bill: {from: body, pointer: /id, class: uuid}
  - id: stranger_real_bill
    as: stranger
    request:
      method: GET
      path: '/bills/{{bill}}'
  - id: stranger_claims_context_header
    as: stranger
    request:
      method: GET
      path: '/bills/{{bill}}'
      headers:
        x-actor-contexts: '{{ctx}}'
  - id: invitee_reads
    as: invitee
    request:
      method: GET
      path: '/bills/{{bill}}'
  - id: mate_roles_empty
    as: mate
    request:
      method: GET
      path: '/bills/{{bill}}'
      headers:
        x-actor-roles: ''
  # loaded from the database now, not echoed from the write
  - id: owner_reads_suggested_bill
    as: owner
    request:
      method: GET
      path: '/bills/{{bill}}'
  - id: mate_reads_with_group_admin_role_only
    as: mate
    request:
      method: GET
      path: '/bills/{{bill}}'
      headers:
        x-actor-roles: 'group_admin'
  - id: owner_creates_bill_without_lines
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":0,"confidence":0,"needs_review":false,"items":[]}'
    bind:
      empty_bill: {from: body, pointer: /id, class: uuid}
  - id: owner_reads_bill_without_lines
    as: owner
    request:
      method: GET
      path: '/bills/{{empty_bill}}'
  - id: owner_creates_bill_at_bigint_ceiling
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":9223372036854775807,"items_total_vnd":9223372036854775807,"confidence":100,"needs_review":false,"items":[{"item_key":"tran","name":"Món trần (dữ liệu mẫu)","quantity":2147483647,"unit_price_vnd":-9223372036854775808,"line_total_vnd":9223372036854775807,"suggested_participant_ids":[]}]}'  # repo-guard: allow=long-number reason=bigint-ceiling-probe
    bind:
      big_bill: {from: body, pointer: /id, class: uuid}
  - id: mate_reads_bill_at_bigint_ceiling
    as: mate
    request:
      method: GET
      path: '/bills/{{big_bill}}'
  # every line assigned by a person: assignment_state confirmed
  - id: mate_claims_nem
    as: mate
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        content-type: 'application/json'
      body_raw: '{"item_keys":["Nem"]}'
  - id: owner_assigns_pho
    as: owner
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        content-type: 'application/json'
      body_raw: '{"assignments":[{"item_key":"pho","participant_ids":["{{persona.owner}}","{{persona.mate}}"]}]}'
  - id: owner_assigns_tra
    as: owner
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        content-type: 'application/json'
      body_raw: '{"assignments":[{"item_key":"tra","participant_ids":["{{persona.owner}}"]}]}'
  - id: owner_reads_confirmed_bill
    as: owner
    request:
      method: GET
      path: '/bills/{{bill}}'
  # a line with no shares is not confirmed and is not a suggestion either
  - id: owner_clears_tra
    as: owner
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        content-type: 'application/json'
      body_raw: '{"assignments":[{"item_key":"tra","participant_ids":[]}]}'
  - id: mate_reads_line_without_shares
    as: mate
    request:
      method: GET
      path: '/bills/{{bill}}'
  - id: mate_leaves
    as: mate
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.mate}}'
  - id: mate_reads_after_leaving
    as: mate
    request:
      method: GET
      path: '/bills/{{bill}}'
  # the shares still name the person who left
  - id: owner_reads_after_mate_left
    as: owner
    request:
      method: GET
      path: '/bills/{{bill}}'
  - id: undeclared_query_ignored
    as: owner
    request:
      method: GET
      path: '/bills/{{bill}}?context_id=x'
  - id: trailing_slash_redirects
    as: owner
    request:
      method: GET
      path: '/bills/{{bill}}/'
  - id: post_not_allowed
    as: owner
    request:
      method: POST
      path: '/bills/{{bill}}'
      headers:
        content-type: 'application/json'
      body_raw: '{}'
