# W4 · POST /bills — store a scanned bill draft: lines, AI-suggested shares,
# surcharges and discounts. Nothing reaches the ledger. Order: idempotency key,
# JSON, actor, body validation (including the discount scope/target model
# validator), role + ACTIVE membership of body.context_id (403), every
# suggested participant is an ACTIVE member (422), items_total_vnd equals the
# sum of line_total_vnd in Python ints (422), then the insert in a savepoint:
# a unique violation is 409 with the constraint's code in capitals. A value
# past bigint that passes every check is a 500 from the database.
# Amounts are integer VND; texts are sample data (dữ liệu mẫu).
id: w4/bill/post-bills
routes: ['POST /bills']
auth_mode: dev
personas:
  owner: {}
  mate: {}
  invitee: {}
  stranger: {}
steps:
  - id: anonymous_creates
    as: anonymous
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee","printed_total_vnd":null,"items_total_vnd":0,"confidence":0,"needs_review":false,"items":[]}'
  # FastAPI decodes a JSON body before resolving the actor: 422 beats 401
  - id: anonymous_malformed_json
    as: anonymous
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id": '
  - id: actor_id_not_uuid
    as: stranger
    request:
      method: POST
      path: '/bills'
      headers:
        x-actor-id: 'khong-phai-uuid'
        content-type: 'application/json'
      body_raw: '{"context_id":"aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee","printed_total_vnd":null,"items_total_vnd":0,"confidence":0,"needs_review":false,"items":[]}'
  - id: roles_unknown
    as: stranger
    request:
      method: POST
      path: '/bills'
      headers:
        x-actor-roles: 'member,thu-quy'
        content-type: 'application/json'
      body_raw: '{"context_id":"aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee","printed_total_vnd":null,"items_total_vnd":0,"confidence":0,"needs_review":false,"items":[]}'
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ nhóm (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn cùng nhóm (dữ liệu mẫu)"}'
  - id: register_invitee
    as: invitee
    request:
      method: PUT
      path: '/people/{{persona.invitee}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người được mời (dữ liệu mẫu)"}'
  - id: register_stranger
    as: stranger
    request:
      method: PUT
      path: '/people/{{persona.stranger}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người lạ (dữ liệu mẫu)"}'
  # an unknown group and a group the caller is not in refuse the same way
  - id: stranger_unknown_context
    as: stranger
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee","printed_total_vnd":null,"items_total_vnd":0,"confidence":0,"needs_review":false,"items":[]}'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm quét hoá đơn (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  - id: owner_invites_invitee
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.invitee}}"}'
  - id: stranger_real_context
    as: stranger
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":0,"confidence":0,"needs_review":false,"items":[]}'
  - id: stranger_claims_context_header
    as: stranger
    request:
      method: POST
      path: '/bills'
      headers:
        x-actor-contexts: '{{ctx}}'
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":0,"confidence":0,"needs_review":false,"items":[]}'
  - id: invitee_creates
    as: invitee
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":0,"confidence":0,"needs_review":false,"items":[]}'
  - id: mate_roles_empty
    as: mate
    request:
      method: POST
      path: '/bills'
      headers:
        x-actor-roles: ''
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":0,"confidence":0,"needs_review":false,"items":[]}'
  # an invitation is not membership; a literal id names nobody. Named once each,
  # in byte order
  - id: owner_suggests_non_members
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":30000,"confidence":70,"needs_review":true,"items":[{"item_key":"pho","name":"Phở (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":20000,"suggested_participant_ids":["{{persona.owner}}","ffffffff-ffff-4fff-8fff-ffffffffffff","{{persona.invitee}}"]},{"item_key":"tra","name":"Trà (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":10000,"suggested_participant_ids":["{{persona.stranger}}","{{persona.stranger}}"]}]}'
  # the membership rule is checked before the declared total
  - id: owner_non_member_and_total_mismatch
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":1,"confidence":70,"needs_review":true,"items":[{"item_key":"pho","name":"Phở (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":20000,"suggested_participant_ids":["{{persona.stranger}}"]}]}'
  - id: owner_items_total_above_lines
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":30001,"confidence":70,"needs_review":true,"items":[{"item_key":"pho","name":"Phở (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":20000,"suggested_participant_ids":["{{persona.owner}}"]},{"item_key":"tra","name":"Trà (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":10000,"suggested_participant_ids":[]}]}'
  # surcharges stay outside the sum of the lines
  - id: owner_items_total_includes_surcharge
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":22000,"confidence":70,"needs_review":true,"items":[{"item_key":"pho","name":"Phở (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":20000,"suggested_participant_ids":["{{persona.owner}}"]}],"surcharges":[{"surcharge_key":"vat","kind":"VAT","amount_vnd":2000,"mode":"proportional"}]}'
  # the sum of two lines at the bigint ceiling is printed whole in the detail
  - id: owner_line_sum_past_int64
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":9223372036854775807,"confidence":70,"needs_review":true,"items":[{"item_key":"a","name":"Món một (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":9223372036854775807,"suggested_participant_ids":[]},{"item_key":"b","name":"Món hai (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":9223372036854775807,"suggested_participant_ids":[]}]}'  # repo-guard: allow=long-number reason=int64-line-sum-probe
  # three lines out of order in byte terms, one without a suggestion, both
  # surcharge modes and both discount scopes
  - id: owner_creates_full_bill
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":180000,"items_total_vnd":175000,"confidence":80,"needs_review":true,"items":[{"item_key":"pho","name":"Phở bò (dữ liệu mẫu)","quantity":2,"unit_price_vnd":50000,"line_total_vnd":100000,"suggested_participant_ids":["{{persona.owner}}"]},{"item_key":"Nem","name":"Nem rán (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":60000,"suggested_participant_ids":["{{persona.mate}}"]},{"item_key":"tra","name":"Trà đá (dữ liệu mẫu)","quantity":3,"unit_price_vnd":5000,"line_total_vnd":15000,"suggested_participant_ids":[]}],"surcharges":[{"surcharge_key":"vat","kind":"VAT","amount_vnd":12000,"mode":"proportional"},{"surcharge_key":"phi","kind":"service","amount_vnd":5000,"mode":"even"}],"discounts":[{"discount_key":"voucher","amount_vnd":2000,"scope":"global_proportional"},{"discount_key":"giam-pho","amount_vnd":10000,"scope":"item","item_key":"pho"}]}'
  # no lines at all; surcharges and discounts left to their defaults
  - id: owner_creates_bill_without_lines
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":0,"confidence":0,"needs_review":false,"items":[]}'
  - id: owner_creates_bill_at_bigint_ceiling
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":9223372036854775807,"items_total_vnd":9223372036854775807,"confidence":100,"needs_review":false,"items":[{"item_key":"tran","name":"Món trần (dữ liệu mẫu)","quantity":1,"unit_price_vnd":-9223372036854775808,"line_total_vnd":9223372036854775807,"suggested_participant_ids":["{{persona.mate}}"]}]}'  # repo-guard: allow=long-number reason=bigint-ceiling-probe
  - id: mate_creates_bill
    as: mate
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":0,"items_total_vnd":1,"confidence":50,"needs_review":false,"items":[{"item_key":"keo","name":"Kẹo (dữ liệu mẫu)","quantity":1,"unit_price_vnd":0,"line_total_vnd":1,"suggested_participant_ids":["{{persona.owner}}","{{persona.mate}}"]}]}'
  # unique constraints inside the savepoint: 409 with the code in capitals
  - id: owner_duplicate_item_key
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":2,"confidence":70,"needs_review":true,"items":[{"item_key":"pho","name":"Phở (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":1,"suggested_participant_ids":[]},{"item_key":"pho","name":"Phở nữa (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":1,"suggested_participant_ids":[]}]}'
  - id: owner_duplicate_surcharge_key
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":1,"confidence":70,"needs_review":true,"items":[{"item_key":"pho","name":"Phở (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":1,"suggested_participant_ids":[]}],"surcharges":[{"surcharge_key":"phi","kind":"service","amount_vnd":1,"mode":"even"},{"surcharge_key":"phi","kind":"VAT","amount_vnd":1,"mode":"proportional"}]}'
  - id: owner_duplicate_discount_key
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":1,"confidence":70,"needs_review":true,"items":[{"item_key":"pho","name":"Phở (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":1,"suggested_participant_ids":[]}],"discounts":[{"discount_key":"giam","amount_vnd":1,"scope":"global_proportional"},{"discount_key":"giam","amount_vnd":1,"scope":"item","item_key":"pho"}]}'
  # any other constraint is BILL_WRITE_CONFLICT: one person suggested twice
  - id: owner_duplicate_suggested_participant
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":1,"confidence":70,"needs_review":true,"items":[{"item_key":"pho","name":"Phở (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":1,"suggested_participant_ids":["{{persona.mate}}","{{persona.mate}}"]}]}'
  # the Python sum matches, the bigint column cannot hold it: a 500
  - id: owner_items_total_past_bigint
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":9223372036854775808,"confidence":70,"needs_review":true,"items":[{"item_key":"a","name":"Món một (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":9223372036854775807,"suggested_participant_ids":[]},{"item_key":"b","name":"Món hai (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":1,"suggested_participant_ids":[]}]}'  # repo-guard: allow=long-number reason=bigint-overflow-probe
  # pydantic: the discount model validator, both directions
  - id: owner_discount_scope_target_mismatch
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":1,"confidence":70,"needs_review":true,"items":[{"item_key":"pho","name":"Phở (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":1,"suggested_participant_ids":[]}],"discounts":[{"discount_key":"a","amount_vnd":1,"scope":"item"},{"discount_key":"b","amount_vnd":1,"scope":"global_proportional","item_key":"pho"}]}'
  # pydantic: length and number bounds (item_key 65 chars, kind 33 chars,
  # confidence 101, quantity 0, line 0, surcharge 0)
  - id: owner_field_bounds
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":-1,"items_total_vnd":0,"confidence":101,"needs_review":true,"items":[{"item_key":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","name":"Phở (dữ liệu mẫu)","quantity":0,"unit_price_vnd":null,"line_total_vnd":0,"suggested_participant_ids":[]}],"surcharges":[{"surcharge_key":"phi","kind":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","amount_vnd":0,"mode":"even"}]}'
  # pydantic: required-but-nullable fields left out
  - id: owner_nullable_fields_missing
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","items_total_vnd":1,"confidence":70,"needs_review":true,"items":[{"item_key":"pho","name":"Phở (dữ liệu mẫu)","quantity":1,"line_total_vnd":1,"suggested_participant_ids":[]}]}'
  # pydantic: strict kinds, a lax uuid and an unknown key
  - id: owner_wrong_types
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":"0","items_total_vnd":1.0,"confidence":70,"needs_review":"true","items":[{"item_key":"pho","name":"Phở (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":1,"suggested_participant_ids":["khong-phai-uuid"],"share":1}]}'
  # idempotency: replay, key order and spacing, reuse, refusals that release
  - id: owner_key_first
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        idempotency-key: 'w4-bill-a'
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":20000,"items_total_vnd":20000,"confidence":60,"needs_review":false,"items":[{"item_key":"bun","name":"Bún chả (dữ liệu mẫu)","quantity":1,"unit_price_vnd":20000,"line_total_vnd":20000,"suggested_participant_ids":["{{persona.owner}}"]}]}'
  - id: owner_key_replay_reordered
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        idempotency-key: 'w4-bill-a'
        content-type: 'application/json'
      body_raw: '{ "items": [{"suggested_participant_ids": ["{{persona.owner}}"], "line_total_vnd": 20000, "unit_price_vnd": 20000, "quantity": 1, "name": "Bún chả (dữ liệu mẫu)", "item_key": "bun"}], "needs_review": false, "confidence": 60, "items_total_vnd": 20000, "printed_total_vnd": 20000, "context_id": "{{ctx}}" }'
  - id: owner_key_reused_other_body
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        idempotency-key: 'w4-bill-a'
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":20000,"items_total_vnd":20000,"confidence":60,"needs_review":true,"items":[{"item_key":"bun","name":"Bún chả (dữ liệu mẫu)","quantity":1,"unit_price_vnd":20000,"line_total_vnd":20000,"suggested_participant_ids":["{{persona.owner}}"]}]}'
  - id: owner_key_refused_mismatch
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        idempotency-key: 'w4-bill-b'
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":2,"confidence":60,"needs_review":false,"items":[{"item_key":"bun","name":"Bún (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":1,"suggested_participant_ids":[]}]}'
  - id: owner_key_after_mismatch
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        idempotency-key: 'w4-bill-b'
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":1,"confidence":60,"needs_review":false,"items":[{"item_key":"bun","name":"Bún (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":1,"suggested_participant_ids":[]}]}'
  - id: owner_key_refused_conflict
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        idempotency-key: 'w4-bill-c'
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":2,"confidence":60,"needs_review":false,"items":[{"item_key":"x","name":"Một (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":1,"suggested_participant_ids":[]},{"item_key":"x","name":"Hai (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":1,"suggested_participant_ids":[]}]}'
  - id: owner_key_after_conflict
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        idempotency-key: 'w4-bill-c'
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":2,"confidence":60,"needs_review":false,"items":[{"item_key":"x","name":"Một (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":1,"suggested_participant_ids":[]},{"item_key":"y","name":"Hai (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":1,"suggested_participant_ids":[]}]}'
  - id: mate_leaves
    as: mate
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.mate}}'
  - id: mate_creates_after_leaving
    as: mate
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":0,"confidence":0,"needs_review":false,"items":[]}'
  - id: owner_suggests_the_leaver
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":1,"confidence":70,"needs_review":true,"items":[{"item_key":"pho","name":"Phở (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":1,"suggested_participant_ids":["{{persona.mate}}"]}]}'
  - id: get_not_allowed
    as: owner
    request:
      method: GET
      path: '/bills'
  - id: trailing_slash_redirects
    as: owner
    request:
      method: POST
      path: '/bills/'
      headers:
        content-type: 'application/json'
      body_raw: '{}'
