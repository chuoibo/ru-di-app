# W4 cross replay · POST /bills/{id}/my-items (200, the caller's shares on the
# bill replaced by the requested lines). A claim stored under a key by one
# implementation is replayed by the other with the bill as it was then; the
# same keys in another order, or a repeated key, are another request. A 403
# (no role) and a 422 (an unknown line) are not stored by either side.
# Texts are sample data (dữ liệu mẫu).
id: w4/crossreplay/post-bills-bill_id-my-items
routes: ['POST /bills/{bill_id}/my-items']
auth_mode: dev
personas:
  owner: {}
  mate: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ nhóm nhận món chéo (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn nhận món chéo (dữ liệu mẫu)"}'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm nhận món chéo (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  - id: owner_creates_bill
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":95000,"items_total_vnd":95000,"confidence":80,"needs_review":true,"items":[{"item_key":"pho","name":"Phở (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":50000,"suggested_participant_ids":["{{persona.owner}}"]},{"item_key":"tra","name":"Trà (dữ liệu mẫu)","quantity":2,"unit_price_vnd":15000,"line_total_vnd":30000,"suggested_participant_ids":["{{persona.mate}}"]},{"item_key":"nem","name":"Nem (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":15000,"suggested_participant_ids":[]}]}'
    bind:
      bill: {from: body, pointer: /id, class: uuid}
  # Python stores, Go answers
  - id: python_stores_key
    as: mate
    via: python
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        idempotency-key: 'x-claim-a'
        content-type: 'application/json'
      body_raw: '{"item_keys":["pho"]}'
  - id: mate_claims_tra_without_key
    as: mate
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        content-type: 'application/json'
      body_raw: '{"item_keys":["tra"]}'
  - id: core_replays_python_key
    as: mate
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        idempotency-key: 'x-claim-a'
        content-type: 'application/json'
      body_raw: '{"item_keys":["pho"]}'
  - id: core_replays_python_key_spaced
    as: mate
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        idempotency-key: 'x-claim-a'
        content-type: 'application/json'
      body_raw: '{ "item_keys" : [ "pho" ] }'
  - id: core_refuses_python_key_repeated_key
    as: mate
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        idempotency-key: 'x-claim-a'
        content-type: 'application/json'
      body_raw: '{"item_keys":["pho","pho"]}'
  # Go stores, Python answers
  - id: core_stores_key
    as: owner
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        idempotency-key: 'x-claim-b'
        content-type: 'application/json'
      body_raw: '{"item_keys":["tra","tra"]}'
  - id: python_replays_core_key
    as: owner
    via: python
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        idempotency-key: 'x-claim-b'
        content-type: 'application/json'
      body_raw: '{"item_keys":["tra","tra"]}'
  - id: python_replays_core_key_spaced
    as: owner
    via: python
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        idempotency-key: 'x-claim-b'
        content-type: 'application/json'
      body_raw: '{"item_keys": ["tra", "tra"]}'
  - id: python_refuses_core_key_deduplicated_body
    as: owner
    via: python
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        idempotency-key: 'x-claim-b'
        content-type: 'application/json'
      body_raw: '{"item_keys":["tra"]}'
  # a 403 (no role) is not stored
  - id: python_refusal_releases_key
    as: owner
    via: python
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        idempotency-key: 'x-claim-c'
        x-actor-roles: ''
        content-type: 'application/json'
      body_raw: '{"item_keys":["pho"]}'
  - id: core_uses_key_python_released
    as: owner
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        idempotency-key: 'x-claim-c'
        content-type: 'application/json'
      body_raw: '{"item_keys":["pho"]}'
  # a 422 (a line the bill does not have) is not stored
  - id: core_refusal_releases_key
    as: mate
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        idempotency-key: 'x-claim-d'
        content-type: 'application/json'
      body_raw: '{"item_keys":["khong-co"]}'
  - id: python_uses_key_core_released
    as: mate
    via: python
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        idempotency-key: 'x-claim-d'
        content-type: 'application/json'
      body_raw: '{"item_keys":[]}'
  - id: core_replays_what_python_stored_after_release
    as: mate
    request:
      method: POST
      path: '/bills/{{bill}}/my-items'
      headers:
        idempotency-key: 'x-claim-d'
        content-type: 'application/json'
      body_raw: '{"item_keys":[]}'
