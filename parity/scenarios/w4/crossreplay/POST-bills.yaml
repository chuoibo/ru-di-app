# W4 cross replay · POST /bills (201, a bills row with its lines, shares,
# surcharges and discounts). A bill written through one implementation with a
# key is replayed, not written twice, by the other; the fingerprint is
# canonical JSON (sorted object keys, compact, UTF-8 kept raw; arrays keep
# their order), so key order and spacing still replay across implementations.
# A 403, a 422 from the service and a 409 from a unique constraint are not
# stored by either side. Texts are sample data (dữ liệu mẫu).
id: w4/crossreplay/post-bills
routes: ['POST /bills']
auth_mode: dev
personas:
  owner: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ nhóm hoá đơn chéo (dữ liệu mẫu)"}'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm hoá đơn chéo (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  # Python stores, Go answers
  - id: python_stores_key
    as: owner
    via: python
    request:
      method: POST
      path: '/bills'
      headers:
        idempotency-key: 'x-bill-a'
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":55000,"items_total_vnd":50000,"confidence":75,"needs_review":true,"items":[{"item_key":"pho","name":"Phở <b>&\"bò\"</b> 🙂 (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":50000,"suggested_participant_ids":["{{persona.owner}}"]}],"surcharges":[{"surcharge_key":"vat","kind":"VAT","amount_vnd":5000,"mode":"proportional"}]}'
  - id: core_replays_python_key
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        idempotency-key: 'x-bill-a'
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":55000,"items_total_vnd":50000,"confidence":75,"needs_review":true,"items":[{"item_key":"pho","name":"Phở <b>&\"bò\"</b> 🙂 (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":50000,"suggested_participant_ids":["{{persona.owner}}"]}],"surcharges":[{"surcharge_key":"vat","kind":"VAT","amount_vnd":5000,"mode":"proportional"}]}'
  - id: core_replays_python_key_reordered
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        idempotency-key: 'x-bill-a'
        content-type: 'application/json'
      body_raw: '{ "surcharges" : [ { "mode" : "proportional", "amount_vnd" : 5000, "kind" : "VAT", "surcharge_key" : "vat" } ], "items" : [ { "suggested_participant_ids" : [ "{{persona.owner}}" ], "line_total_vnd" : 50000, "unit_price_vnd" : null, "quantity" : 1, "name" : "Phở <b>&\"bò\"</b> 🙂 (dữ liệu mẫu)", "item_key" : "pho" } ], "needs_review" : true, "confidence" : 75, "items_total_vnd" : 50000, "printed_total_vnd" : 55000, "context_id" : "{{ctx}}" }'
  - id: core_refuses_python_key_other_body
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        idempotency-key: 'x-bill-a'
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":55000,"items_total_vnd":50000,"confidence":76,"needs_review":true,"items":[{"item_key":"pho","name":"Phở <b>&\"bò\"</b> 🙂 (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":50000,"suggested_participant_ids":["{{persona.owner}}"]}],"surcharges":[{"surcharge_key":"vat","kind":"VAT","amount_vnd":5000,"mode":"proportional"}]}'
  # Go stores, Python answers
  - id: core_stores_key
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        idempotency-key: 'x-bill-b'
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":30000,"confidence":90,"needs_review":false,"items":[{"item_key":"tra","name":"Trà (dữ liệu mẫu)","quantity":2,"unit_price_vnd":15000,"line_total_vnd":30000,"suggested_participant_ids":[]}],"discounts":[{"discount_key":"giam","amount_vnd":1000,"scope":"item","item_key":"tra"}]}'
  - id: python_replays_core_key
    as: owner
    via: python
    request:
      method: POST
      path: '/bills'
      headers:
        idempotency-key: 'x-bill-b'
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":30000,"confidence":90,"needs_review":false,"items":[{"item_key":"tra","name":"Trà (dữ liệu mẫu)","quantity":2,"unit_price_vnd":15000,"line_total_vnd":30000,"suggested_participant_ids":[]}],"discounts":[{"discount_key":"giam","amount_vnd":1000,"scope":"item","item_key":"tra"}]}'
  - id: python_replays_core_key_reordered
    as: owner
    via: python
    request:
      method: POST
      path: '/bills'
      headers:
        idempotency-key: 'x-bill-b'
        content-type: 'application/json'
      body_raw: '{"discounts": [{"item_key": "tra", "scope": "item", "amount_vnd": 1000, "discount_key": "giam"}], "items": [{"suggested_participant_ids": [], "line_total_vnd": 30000, "unit_price_vnd": 15000, "quantity": 2, "name": "Trà (dữ liệu mẫu)", "item_key": "tra"}], "needs_review": false, "confidence": 90, "items_total_vnd": 30000, "printed_total_vnd": null, "context_id": "{{ctx}}"}'
  - id: python_refuses_core_key_other_body
    as: owner
    via: python
    request:
      method: POST
      path: '/bills'
      headers:
        idempotency-key: 'x-bill-b'
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":30000,"confidence":90,"needs_review":false,"items":[{"item_key":"tra","name":"Trà (dữ liệu mẫu)","quantity":2,"unit_price_vnd":15000,"line_total_vnd":30000,"suggested_participant_ids":[]}]}'
  # a 403 (no role) is not stored: the same request then writes on the other side
  - id: python_refusal_releases_key
    as: owner
    via: python
    request:
      method: POST
      path: '/bills'
      headers:
        idempotency-key: 'x-bill-c'
        x-actor-roles: ''
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":0,"confidence":10,"needs_review":true,"items":[]}'
  - id: core_uses_key_python_released
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        idempotency-key: 'x-bill-c'
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":0,"confidence":10,"needs_review":true,"items":[]}'
  # a 422 from the service (the declared total) is not stored
  - id: core_refusal_releases_key
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        idempotency-key: 'x-bill-d'
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":2,"confidence":10,"needs_review":true,"items":[{"item_key":"keo","name":"Kẹo (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":1,"suggested_participant_ids":[]}]}'
  - id: python_uses_key_core_released
    as: owner
    via: python
    request:
      method: POST
      path: '/bills'
      headers:
        idempotency-key: 'x-bill-d'
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":1,"confidence":10,"needs_review":true,"items":[{"item_key":"keo","name":"Kẹo (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":1,"suggested_participant_ids":[]}]}'
  - id: core_replays_what_python_stored_after_release
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        idempotency-key: 'x-bill-d'
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":1,"confidence":10,"needs_review":true,"items":[{"item_key":"keo","name":"Kẹo (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":1,"suggested_participant_ids":[]}]}'
  # a 409 from a unique constraint is not stored either
  - id: python_conflict_releases_key
    as: owner
    via: python
    request:
      method: POST
      path: '/bills'
      headers:
        idempotency-key: 'x-bill-e'
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":1,"confidence":10,"needs_review":true,"items":[{"item_key":"keo","name":"Kẹo (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":1,"suggested_participant_ids":[]}],"surcharges":[{"surcharge_key":"phi","kind":"service","amount_vnd":1,"mode":"even"},{"surcharge_key":"phi","kind":"service","amount_vnd":2,"mode":"even"}]}'
  - id: core_uses_key_after_conflict
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        idempotency-key: 'x-bill-e'
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":null,"items_total_vnd":1,"confidence":10,"needs_review":true,"items":[{"item_key":"keo","name":"Kẹo (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":1,"suggested_participant_ids":[]}],"surcharges":[{"surcharge_key":"phi","kind":"service","amount_vnd":1,"mode":"even"}]}'
