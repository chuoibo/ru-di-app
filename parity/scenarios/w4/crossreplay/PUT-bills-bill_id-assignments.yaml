# W4 cross replay · PUT /bills/{id}/assignments (200, shares on the named lines
# deleted and rewritten as confirmed). An assignment stored under a key by one
# implementation is replayed by the other, with the bill as it was then, even
# after the shares moved on; another body or another bill under the key is
# refused. A 422 (a non-member named) and a 409 (an unknown line) are not
# stored by either side. Texts are sample data (dữ liệu mẫu).
id: w4/crossreplay/put-bills-bill_id-assignments
routes: ['PUT /bills/{bill_id}/assignments']
auth_mode: dev
personas:
  owner: {}
  mate: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ nhóm chia món chéo (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn chia món chéo (dữ liệu mẫu)"}'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm chia món chéo (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  - id: owner_creates_bill
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":80000,"items_total_vnd":80000,"confidence":80,"needs_review":true,"items":[{"item_key":"pho","name":"Phở (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":50000,"suggested_participant_ids":["{{persona.owner}}"]},{"item_key":"tra","name":"Trà (dữ liệu mẫu)","quantity":2,"unit_price_vnd":15000,"line_total_vnd":30000,"suggested_participant_ids":["{{persona.mate}}"]}]}'
    bind:
      bill: {from: body, pointer: /id, class: uuid}
  - id: owner_creates_other_bill
    as: owner
    request:
      method: POST
      path: '/bills'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","printed_total_vnd":80000,"items_total_vnd":80000,"confidence":80,"needs_review":true,"items":[{"item_key":"pho","name":"Phở (dữ liệu mẫu)","quantity":1,"unit_price_vnd":null,"line_total_vnd":50000,"suggested_participant_ids":["{{persona.owner}}"]},{"item_key":"tra","name":"Trà (dữ liệu mẫu)","quantity":2,"unit_price_vnd":15000,"line_total_vnd":30000,"suggested_participant_ids":["{{persona.mate}}"]}]}'
    bind:
      other_bill: {from: body, pointer: /id, class: uuid}
  # Python stores, Go answers
  - id: python_stores_key
    as: owner
    via: python
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        idempotency-key: 'x-assign-a'
        content-type: 'application/json'
      body_raw: '{"assignments":[{"item_key":"pho","participant_ids":["{{persona.mate}}","{{persona.owner}}"]}]}'
  - id: owner_moves_pho_without_key
    as: owner
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        content-type: 'application/json'
      body_raw: '{"assignments":[{"item_key":"pho","participant_ids":["{{persona.owner}}"]}]}'
  - id: core_replays_python_key
    as: owner
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        idempotency-key: 'x-assign-a'
        content-type: 'application/json'
      body_raw: '{"assignments":[{"item_key":"pho","participant_ids":["{{persona.mate}}","{{persona.owner}}"]}]}'
  - id: core_replays_python_key_reordered
    as: owner
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        idempotency-key: 'x-assign-a'
        content-type: 'application/json'
      body_raw: '{ "assignments" : [ { "participant_ids" : [ "{{persona.mate}}", "{{persona.owner}}" ], "item_key" : "pho" } ] }'
  # participants in another order are another request
  - id: core_refuses_python_key_other_body
    as: owner
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        idempotency-key: 'x-assign-a'
        content-type: 'application/json'
      body_raw: '{"assignments":[{"item_key":"pho","participant_ids":["{{persona.owner}}","{{persona.mate}}"]}]}'
  - id: core_refuses_python_key_other_bill
    as: owner
    request:
      method: PUT
      path: '/bills/{{other_bill}}/assignments'
      headers:
        idempotency-key: 'x-assign-a'
        content-type: 'application/json'
      body_raw: '{"assignments":[{"item_key":"pho","participant_ids":["{{persona.mate}}","{{persona.owner}}"]}]}'
  # Go stores, Python answers
  - id: core_stores_key
    as: owner
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        idempotency-key: 'x-assign-b'
        content-type: 'application/json'
      body_raw: '{"assignments":[{"item_key":"tra","participant_ids":["{{persona.owner}}"]},{"item_key":"pho","participant_ids":["{{persona.mate}}"]}]}'
  - id: python_replays_core_key
    as: owner
    via: python
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        idempotency-key: 'x-assign-b'
        content-type: 'application/json'
      body_raw: '{"assignments":[{"item_key":"tra","participant_ids":["{{persona.owner}}"]},{"item_key":"pho","participant_ids":["{{persona.mate}}"]}]}'
  - id: python_replays_core_key_reordered
    as: owner
    via: python
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        idempotency-key: 'x-assign-b'
        content-type: 'application/json'
      body_raw: '{"assignments": [{"participant_ids": ["{{persona.owner}}"], "item_key": "tra"}, {"participant_ids": ["{{persona.mate}}"], "item_key": "pho"}]}'
  # the assignments in another order are another request
  - id: python_refuses_core_key_other_body
    as: owner
    via: python
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        idempotency-key: 'x-assign-b'
        content-type: 'application/json'
      body_raw: '{"assignments":[{"item_key":"pho","participant_ids":["{{persona.mate}}"]},{"item_key":"tra","participant_ids":["{{persona.owner}}"]}]}'
  # a 422 (a name the group does not contain) is not stored
  - id: python_refusal_releases_key
    as: owner
    via: python
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        idempotency-key: 'x-assign-c'
        content-type: 'application/json'
      body_raw: '{"assignments":[{"item_key":"tra","participant_ids":["ffffffff-ffff-4fff-8fff-ffffffffffff"]}]}'
  - id: core_uses_key_python_released
    as: owner
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        idempotency-key: 'x-assign-c'
        content-type: 'application/json'
      body_raw: '{"assignments":[{"item_key":"tra","participant_ids":["{{persona.mate}}"]}]}'
  # a 409 (a line the bill does not have) is not stored
  - id: core_refusal_releases_key
    as: owner
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        idempotency-key: 'x-assign-d'
        content-type: 'application/json'
      body_raw: '{"assignments":[{"item_key":"khong-co","participant_ids":["{{persona.mate}}"]}]}'
  - id: python_uses_key_core_released
    as: owner
    via: python
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        idempotency-key: 'x-assign-d'
        content-type: 'application/json'
      body_raw: '{"assignments":[{"item_key":"pho","participant_ids":["{{persona.owner}}","{{persona.mate}}"]}]}'
  - id: core_replays_what_python_stored_after_release
    as: owner
    request:
      method: PUT
      path: '/bills/{{bill}}/assignments'
      headers:
        idempotency-key: 'x-assign-d'
        content-type: 'application/json'
      body_raw: '{"assignments":[{"item_key":"pho","participant_ids":["{{persona.owner}}","{{persona.mate}}"]}]}'
