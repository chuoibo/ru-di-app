# W4 · budget in prod auth mode (ADR-0014): identity is a bearer session read by
# digest; X-Actor-* headers are ignored, and membership comes from the roster.
# The harness seeds a people row and a live session per persona before step one.
# Amounts are integer VND; texts are sample data (dữ liệu mẫu).
id: w4/budget/prod-auth
routes: ['GET /contexts/{context_id}/budget']
auth_mode: prod
personas:
  owner: {}
  mate: {}
  stranger: {}
steps:
  - id: anonymous_missing_bearer
    as: anonymous
    request:
      method: GET
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/budget'
  - id: junk_bearer
    as: anonymous
    request:
      method: GET
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/budget'
      headers:
        authorization: 'Bearer khong-phai-token-that'
  - id: basic_scheme
    as: anonymous
    request:
      method: GET
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/budget?candidate_per_person_vnd=1'
      headers:
        authorization: 'Basic {{token.owner}}'
  # dev would trust these headers; prod answers 401 Missing bearer session
  - id: actor_headers_ignored
    as: anonymous
    request:
      method: GET
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/budget'
      headers:
        x-actor-id: '{{persona.owner}}'
        x-actor-roles: 'member'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm ngân sách prod (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  # in dev an empty X-Actor-Roles is 403 role_not_permitted; prod ignores it
  - id: owner_reads_empty_roles_header
    as: owner
    request:
      method: GET
      path: '/contexts/{{ctx}}/budget'
      headers:
        x-actor-roles: ''
  - id: owner_non_uuid_context
    as: owner
    request:
      method: GET
      path: '/contexts/khong-phai-uuid/budget'
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  - id: owner_creates_finished_trip
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/outings'
      headers:
        content-type: 'application/json'
      body_raw: '{"title":"Chuyến cũ (dữ liệu mẫu)","starts_on":"2020-01-01","ends_on":"2020-01-03","headcount":2,"budget_per_person_vnd":60000}'
  - id: owner_proposes_dinner
    as: owner
    request:
      method: POST
      path: '/expenses'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","description":"Bữa tối qua phiên (dữ liệu mẫu)","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2020-01-02T19:00:00+07:00","participants":["{{persona.owner}}","{{persona.mate}}"],"total_amount_vnd":100000}'
    bind:
      dinner: {from: body, pointer: /expense_id, class: uuid}
  - id: owner_confirms_dinner
    as: owner
    request:
      method: POST
      path: '/expenses/{{dinner}}/confirm'
      headers:
        content-type: 'application/json'
      body_raw: '{"proposal":{"context_id":"{{ctx}}","description":"Bữa tối qua phiên (dữ liệu mẫu)","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2020-01-02T19:00:00+07:00","participants":["{{persona.owner}}","{{persona.mate}}"],"total_amount_vnd":100000},"expected_allocations":{"{{persona.owner}}":50000,"{{persona.mate}}":50000},"acknowledge_as_advancer":true}'
  - id: mate_reads_with_candidate
    as: mate
    request:
      method: GET
      path: '/contexts/{{ctx}}/budget?candidate_per_person_vnd=60000'
  - id: owner_lowercase_scheme_reads
    as: anonymous
    request:
      method: GET
      path: '/contexts/{{ctx}}/budget'
      headers:
        authorization: 'bearer {{token.owner}}'
  - id: stranger_reads_claiming_owner
    as: stranger
    request:
      method: GET
      path: '/contexts/{{ctx}}/budget'
      headers:
        x-actor-id: '{{persona.owner}}'
        x-actor-contexts: '{{ctx}}'
  - id: stranger_bad_candidate
    as: stranger
    request:
      method: GET
      path: '/contexts/{{ctx}}/budget?candidate_per_person_vnd=1.5'
  - id: mate_leaves
    as: mate
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.mate}}'
  - id: mate_after_leaving
    as: mate
    request:
      method: GET
      path: '/contexts/{{ctx}}/budget'
