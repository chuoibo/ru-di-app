# W4 · POST /batches/{id}/publish — publishes that succeed. Each link answers
# guest_links[].path = "/g/" + secrets.token_urlsafe(32). The harness names a
# run of exactly 43 base64url characters by first appearance (<token43#n>), so
# a replay that returns another token, or a token of another length, shows.
# Links come one per sender, sorted by the sender's uuid bytes; persona ids are
# fixed per scenario, so that order is the same on both stacks.
# The second group binds its token by name and opens the guest page with it.
# Texts are sample data (dữ liệu mẫu).
id: w4/batches/post-batches-batch_id-publish-success
routes: ['POST /batches/{batch_id}/publish']
auth_mode: dev
personas:
  owner: {}
  mate: {}
  third: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ đợt thu (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn thứ nhất (dữ liệu mẫu)"}'
  - id: register_third
    as: third
    request:
      method: PUT
      path: '/people/{{persona.third}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn thứ hai (dữ liệu mẫu)"}'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm ba người (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  - id: owner_invites_third
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.third}}"}'
    bind:
      m_third: {from: body, pointer: /id, class: uuid}
  - id: third_accepts
    as: third
    request:
      method: POST
      path: '/memberships/{{m_third}}/accept'
  - id: owner_proposes_dinner
    as: owner
    request:
      method: POST
      path: '/expenses'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","description":"Bữa tối ba người (dữ liệu mẫu)","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-02T19:00:00+07:00","participants":["{{persona.owner}}","{{persona.mate}}","{{persona.third}}"],"total_amount_vnd":90000}'
    bind:
      dinner: {from: body, pointer: /expense_id, class: uuid}
  - id: owner_confirms_dinner_acknowledged
    as: owner
    request:
      method: POST
      path: '/expenses/{{dinner}}/confirm'
      headers:
        content-type: 'application/json'
      body_raw: '{"proposal":{"context_id":"{{ctx}}","description":"Bữa tối ba người (dữ liệu mẫu)","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-02T19:00:00+07:00","participants":["{{persona.owner}}","{{persona.mate}}","{{persona.third}}"],"total_amount_vnd":90000},"expected_allocations":{"{{persona.owner}}":30000,"{{persona.mate}}":30000,"{{persona.third}}":30000},"acknowledge_as_advancer":true}'
    bind:
      dinner_v: {from: body, pointer: /expense_version_id, class: uuid}
  - id: owner_batches_dinner
    as: owner
    request:
      method: POST
      path: '/batches'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","expense_version_ids":["{{dinner_v}}"],"due_at":"2030-02-01T12:00:00+07:00"}'
    bind:
      batch: {from: body, pointer: /batch_id, class: uuid}
  # two senders, two links; the tokens are not bound by name
  - id: owner_publishes_with_key
    as: owner
    request:
      method: POST
      path: '/batches/{{batch}}/publish'
      headers:
        idempotency-key: 'w4-pub-ok-a'
        content-type: 'application/json'
      body_raw: '{"delivery_method":"personal_link","guest_link_expires_at":"2030-03-01T12:00:00+07:00"}'
  # the stored response comes back: the same two tokens, in the same places
  - id: owner_replays_same_key
    as: owner
    request:
      method: POST
      path: '/batches/{{batch}}/publish'
      headers:
        idempotency-key: 'w4-pub-ok-a'
        content-type: 'application/json'
      body_raw: '{"delivery_method":"personal_link","guest_link_expires_at":"2030-03-01T12:00:00+07:00"}'
  - id: owner_replays_canonically_equal_body
    as: owner
    request:
      method: POST
      path: '/batches/{{batch}}/publish'
      headers:
        idempotency-key: 'w4-pub-ok-a'
        content-type: 'application/json'
      body_raw: '{ "guest_link_expires_at": "2030-03-01T12:00:00+07:00", "delivery_method": "personal_link" }'
  - id: owner_same_key_other_body
    as: owner
    request:
      method: POST
      path: '/batches/{{batch}}/publish'
      headers:
        idempotency-key: 'w4-pub-ok-a'
        content-type: 'application/json'
      body_raw: '{"delivery_method":"personal_link","guest_link_expires_at":"2030-04-01T12:00:00+07:00"}'
  - id: owner_publishes_again_without_key
    as: owner
    request:
      method: POST
      path: '/batches/{{batch}}/publish'
      headers:
        content-type: 'application/json'
      body_raw: '{"delivery_method":"personal_link","guest_link_expires_at":"2030-03-01T12:00:00+07:00"}'
  - id: owner_publishes_again_new_key
    as: owner
    request:
      method: POST
      path: '/batches/{{batch}}/publish'
      headers:
        idempotency-key: 'w4-pub-ok-b'
        content-type: 'application/json'
      body_raw: '{"delivery_method":"personal_link","guest_link_expires_at":"2030-03-01T12:00:00+07:00"}'
  - id: mate_publishes_published
    as: mate
    request:
      method: POST
      path: '/batches/{{batch}}/publish'
      headers:
        content-type: 'application/json'
      body_raw: '{"delivery_method":"personal_link","guest_link_expires_at":"2030-03-01T12:00:00+07:00"}'
  - id: owner_reads_obligations
    as: owner
    request:
      method: GET
      path: '/batches/{{batch}}/obligations'
  - id: owner_lists_context_batches
    as: owner
    request:
      method: GET
      path: '/contexts/{{ctx}}/batches'
  # a second group with one sender; its token is bound by name
  - id: mate_creates_pair_group
    as: mate
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm hai người (dữ liệu mẫu)"}'
    bind:
      ctx2: {from: body, pointer: /id, class: uuid}
  - id: mate_invites_owner
    as: mate
    request:
      method: POST
      path: '/contexts/{{ctx2}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.owner}}"}'
    bind:
      m_owner2: {from: body, pointer: /id, class: uuid}
  - id: owner_accepts_pair_group
    as: owner
    request:
      method: POST
      path: '/memberships/{{m_owner2}}/accept'
  - id: mate_proposes_taxi
    as: mate
    request:
      method: POST
      path: '/expenses'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx2}}","description":"Taxi hai người (dữ liệu mẫu)","recorded_by_id":"{{persona.mate}}","paid_by_id":"{{persona.mate}}","verification_scope":"totals_only","occurred_at":"2030-01-05T22:00:00+07:00","participants":["{{persona.owner}}","{{persona.mate}}"],"total_amount_vnd":50000}'
    bind:
      taxi: {from: body, pointer: /expense_id, class: uuid}
  - id: mate_confirms_taxi_acknowledged
    as: mate
    request:
      method: POST
      path: '/expenses/{{taxi}}/confirm'
      headers:
        content-type: 'application/json'
      body_raw: '{"proposal":{"context_id":"{{ctx2}}","description":"Taxi hai người (dữ liệu mẫu)","recorded_by_id":"{{persona.mate}}","paid_by_id":"{{persona.mate}}","verification_scope":"totals_only","occurred_at":"2030-01-05T22:00:00+07:00","participants":["{{persona.owner}}","{{persona.mate}}"],"total_amount_vnd":50000},"expected_allocations":{"{{persona.owner}}":25000,"{{persona.mate}}":25000},"acknowledge_as_advancer":true}'
    bind:
      taxi_v: {from: body, pointer: /expense_version_id, class: uuid}
  - id: mate_batches_taxi
    as: mate
    request:
      method: POST
      path: '/batches'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx2}}","expense_version_ids":["{{taxi_v}}"],"due_at":"2030-02-01T12:00:00+07:00"}'
    bind:
      batch2: {from: body, pointer: /batch_id, class: uuid}
  - id: mate_publishes_pair_batch
    as: mate
    request:
      method: POST
      path: '/batches/{{batch2}}/publish'
      headers:
        content-type: 'application/json'
      body_raw: '{"delivery_method":"personal_link","guest_link_expires_at":"2030-03-01T12:00:00Z"}'
    bind:
      tok: {from: body, pointer: /guest_links/0/path, regex: '^/g/([A-Za-z0-9_-]+)$', class: token}
  - id: guest_opens_page
    as: anonymous
    request:
      method: GET
      path: '/g/{{tok}}'
  - id: guest_opens_page_again
    as: anonymous
    request:
      method: GET
      path: '/g/{{tok}}'
  - id: mate_reads_pair_obligations
    as: mate
    request:
      method: GET
      path: '/batches/{{batch2}}/obligations'
