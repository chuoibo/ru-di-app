# W4 · GET /batches/{id}/obligations and GET /contexts/{id}/batches after a
# publish that succeeds: the board and the round list carry what the guests did
# through their links. One dinner split equally makes two senders owe the owner
# 30000 each. The first sender reports the transfer twice (the board keeps the
# earliest time), the second objects twice with two reasons (the first reason
# wins) and asks how the number was reached (not a dispute). The owner then
# confirms both obligations, one receipt naming the sender's report: confirmed,
# reported and disputed are counted apart. The guest routes are still Python on
# both stacks; they only write the rows these reads derive from. Links come one
# per sender in uuid order of the sender, which the fixed persona ids make the
# same on both stacks. Amounts are integer VND; texts are sample data
# (dữ liệu mẫu).
id: w4/batches/get-batches-batch_id-obligations-guest
routes: ['GET /batches/{batch_id}/obligations', 'GET /contexts/{context_id}/batches', 'POST /batches/{batch_id}/publish']
auth_mode: dev
personas:
  owner: {}
  mate: {}
  third: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ đợt có khách (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Khách thứ nhất (dữ liệu mẫu)"}'
  - id: register_third
    as: third
    request:
      method: PUT
      path: '/people/{{persona.third}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Khách thứ hai (dữ liệu mẫu)"}'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm có link khách (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  - id: owner_invites_third
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.third}}"}'
    bind:
      m_third: {from: body, pointer: /id, class: uuid}
  - id: third_accepts
    as: third
    request:
      method: POST
      path: '/memberships/{{m_third}}/accept'
  - id: owner_proposes_dinner
    as: owner
    request:
      method: POST
      path: '/expenses'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","description":"Bữa tối có link khách (dữ liệu mẫu)","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-02T19:00:00+07:00","participants":["{{persona.owner}}","{{persona.mate}}","{{persona.third}}"],"total_amount_vnd":90000}'
    bind:
      dinner: {from: body, pointer: /expense_id, class: uuid}
  - id: owner_confirms_dinner_acknowledged
    as: owner
    request:
      method: POST
      path: '/expenses/{{dinner}}/confirm'
      headers:
        content-type: 'application/json'
      body_raw: '{"proposal":{"context_id":"{{ctx}}","description":"Bữa tối có link khách (dữ liệu mẫu)","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-02T19:00:00+07:00","participants":["{{persona.owner}}","{{persona.mate}}","{{persona.third}}"],"total_amount_vnd":90000},"expected_allocations":{"{{persona.owner}}":30000,"{{persona.mate}}":30000,"{{persona.third}}":30000},"acknowledge_as_advancer":true}'
    bind:
      dinner_v: {from: body, pointer: /expense_version_id, class: uuid}
  - id: owner_batches_dinner
    as: owner
    request:
      method: POST
      path: '/batches'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","expense_version_ids":["{{dinner_v}}"],"due_at":"2030-02-01T12:00:00+07:00"}'
    bind:
      batch: {from: body, pointer: /batch_id, class: uuid}
  - id: owner_lists_frozen_round
    as: owner
    request:
      method: GET
      path: '/contexts/{{ctx}}/batches'
  - id: owner_publishes
    as: owner
    request:
      method: POST
      path: '/batches/{{batch}}/publish'
      headers:
        content-type: 'application/json'
      body_raw: '{"delivery_method":"personal_link","guest_link_expires_at":"2030-03-01T12:00:00.25+07:00"}'
    bind:
      tok_a: {from: body, pointer: /guest_links/0/path, regex: '^/g/([A-Za-z0-9_-]+)$', class: token}
      ob_a: {from: body, pointer: /guest_links/0/obligations/0/obligation_id, class: uuid}
      tok_b: {from: body, pointer: /guest_links/1/path, regex: '^/g/([A-Za-z0-9_-]+)$', class: token}
      ob_b: {from: body, pointer: /guest_links/1/obligations/0/obligation_id, class: uuid}
  # status published, published_at set, nobody has done anything yet
  - id: owner_board_published
    as: owner
    request:
      method: GET
      path: '/batches/{{batch}}/obligations'
  - id: mate_lists_published_round
    as: mate
    request:
      method: GET
      path: '/contexts/{{ctx}}/batches'
  # the first sender says they transferred it, twice
  - id: guest_a_reports_paid
    as: anonymous
    request:
      method: POST
      path: '/g/{{tok_a}}/da-chuyen'
      headers:
        content-type: 'application/x-www-form-urlencoded'
      body_raw: 'obligation_id={{ob_a}}'
    bind:
      report_a: {from: body, pointer: /payment_report_id, class: uuid}
  - id: owner_board_reported
    as: owner
    request:
      method: GET
      path: '/batches/{{batch}}/obligations'
  - id: guest_a_reports_paid_again
    as: anonymous
    request:
      method: POST
      path: '/g/{{tok_a}}/da-chuyen'
      headers:
        content-type: 'application/x-www-form-urlencoded'
      body_raw: 'obligation_id={{ob_a}}'
  - id: owner_board_reported_twice
    as: owner
    request:
      method: GET
      path: '/batches/{{batch}}/obligations'
  # the second sender objects twice, then asks how the number was reached
  - id: guest_b_objects_amount
    as: anonymous
    request:
      method: POST
      path: '/g/{{tok_b}}/doi-so-tien'
      headers:
        content-type: 'application/x-www-form-urlencoded'
      body_raw: 'obligation_id={{ob_b}}&reason=amount_too_high'
  - id: third_board_disputed
    as: third
    request:
      method: GET
      path: '/batches/{{batch}}/obligations'
  - id: guest_b_objects_other_reason
    as: anonymous
    request:
      method: POST
      path: '/g/{{tok_b}}/doi-so-tien'
      headers:
        content-type: 'application/x-www-form-urlencoded'
      body_raw: 'obligation_id={{ob_b}}&reason=did_not_join'
  - id: guest_b_asks_how
    as: anonymous
    request:
      method: POST
      path: '/g/{{tok_b}}/xin-cach-tinh'
      headers:
        content-type: 'application/x-www-form-urlencoded'
      body_raw: 'obligation_id={{ob_b}}'
  - id: mate_board_first_reason_wins
    as: mate
    request:
      method: GET
      path: '/batches/{{batch}}/obligations'
  - id: owner_lists_disputed_round
    as: owner
    request:
      method: GET
      path: '/contexts/{{ctx}}/batches'
  # the recipient confirms both: a report does not move the status, a receipt does
  - id: owner_confirms_with_report_id
    as: owner
    request:
      method: POST
      path: '/obligations/{{ob_a}}/confirm-receipt'
      headers:
        content-type: 'application/json'
      body_raw: '{"amount_vnd":30000,"idempotency_key":"{{dinner}}","payment_report_id":"{{report_a}}"}'
  - id: owner_confirms_disputed_part
    as: owner
    request:
      method: POST
      path: '/obligations/{{ob_b}}/confirm-receipt'
      headers:
        content-type: 'application/json'
      body_raw: '{"amount_vnd":10000,"idempotency_key":"{{dinner_v}}"}'
  - id: owner_board_confirmed_reported_disputed
    as: owner
    request:
      method: GET
      path: '/batches/{{batch}}/obligations'
  - id: third_lists_confirmed_round
    as: third
    request:
      method: GET
      path: '/contexts/{{ctx}}/batches'
  - id: owner_publishes_again
    as: owner
    request:
      method: POST
      path: '/batches/{{batch}}/publish'
      headers:
        content-type: 'application/json'
      body_raw: '{"delivery_method":"personal_link","guest_link_expires_at":"2030-03-01T12:00:00+07:00"}'
