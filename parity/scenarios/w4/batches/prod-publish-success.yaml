# W4 · POST /batches/{id}/publish in prod auth mode, on a batch that is ready:
# the path the dev headers used to hide. A session never carries batch_owner;
# the service derives it from the batch for the owner alone, so the owner
# publishes (200) while the other member and a stranger stay 403
# role_not_permitted. The owner's key replays the same tokens; the same key
# from another bearer runs as that bearer and is refused. The link opens the
# guest page, and members then read the published board and round list. The
# harness seeds a people row and a live session per persona. Amounts are
# integer VND; texts are sample data (dữ liệu mẫu).
id: w4/batches/prod-publish-success
routes: ['POST /batches', 'POST /batches/{batch_id}/publish', 'GET /batches/{batch_id}/obligations', 'GET /contexts/{context_id}/batches']
auth_mode: prod
personas:
  owner: {}
  mate: {}
  stranger: {}
steps:
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm gửi đợt prod (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  - id: owner_proposes_dinner
    as: owner
    request:
      method: POST
      path: '/expenses'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","description":"Bữa tối gửi prod (dữ liệu mẫu)","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-02T19:00:00+07:00","participants":["{{persona.owner}}","{{persona.mate}}"],"total_amount_vnd":100000}'
    bind:
      dinner: {from: body, pointer: /expense_id, class: uuid}
  - id: owner_confirms_dinner_acknowledged
    as: owner
    request:
      method: POST
      path: '/expenses/{{dinner}}/confirm'
      headers:
        content-type: 'application/json'
      body_raw: '{"proposal":{"context_id":"{{ctx}}","description":"Bữa tối gửi prod (dữ liệu mẫu)","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-02T19:00:00+07:00","participants":["{{persona.owner}}","{{persona.mate}}"],"total_amount_vnd":100000},"expected_allocations":{"{{persona.owner}}":50000,"{{persona.mate}}":50000},"acknowledge_as_advancer":true}'
    bind:
      dinner_v: {from: body, pointer: /expense_version_id, class: uuid}
  - id: owner_creates_batch
    as: owner
    request:
      method: POST
      path: '/batches'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","due_at":"2030-02-01T12:00:00+07:00"}'
    bind:
      batch: {from: body, pointer: /batch_id, class: uuid}
  - id: mate_publishes_ready_batch
    as: mate
    request:
      method: POST
      path: '/batches/{{batch}}/publish'
      headers:
        content-type: 'application/json'
      body_raw: '{"delivery_method":"personal_link","guest_link_expires_at":"2030-03-01T12:00:00+07:00"}'
  - id: stranger_publishes_ready_batch
    as: stranger
    request:
      method: POST
      path: '/batches/{{batch}}/publish'
      headers:
        x-actor-id: '{{persona.owner}}'
        x-actor-roles: 'member,batch_owner'
        content-type: 'application/json'
      body_raw: '{"delivery_method":"personal_link","guest_link_expires_at":"2030-03-01T12:00:00+07:00"}'
  # dev would refuse an empty X-Actor-Roles; prod ignores it
  - id: owner_publishes_with_key
    as: owner
    request:
      method: POST
      path: '/batches/{{batch}}/publish'
      headers:
        idempotency-key: 'w4-prod-pub-a'
        x-actor-roles: ''
        content-type: 'application/json'
      body_raw: '{"delivery_method":"personal_link","guest_link_expires_at":"2030-03-01T12:00:00+07:00"}'
    bind:
      tok: {from: body, pointer: /guest_links/0/path, regex: '^/g/([A-Za-z0-9_-]+)$', class: token}
  - id: owner_replays_key
    as: owner
    request:
      method: POST
      path: '/batches/{{batch}}/publish'
      headers:
        idempotency-key: 'w4-prod-pub-a'
        content-type: 'application/json'
      body_raw: '{"delivery_method":"personal_link","guest_link_expires_at":"2030-03-01T12:00:00+07:00"}'
  # the key scope is the bearer digest: the mate's request runs and is refused
  - id: mate_same_key
    as: mate
    request:
      method: POST
      path: '/batches/{{batch}}/publish'
      headers:
        idempotency-key: 'w4-prod-pub-a'
        content-type: 'application/json'
      body_raw: '{"delivery_method":"personal_link","guest_link_expires_at":"2030-03-01T12:00:00+07:00"}'
  - id: guest_opens_page
    as: anonymous
    request:
      method: GET
      path: '/g/{{tok}}'
  - id: mate_reads_published_board
    as: mate
    request:
      method: GET
      path: '/batches/{{batch}}/obligations'
  - id: mate_lists_published_round
    as: mate
    request:
      method: GET
      path: '/contexts/{{ctx}}/batches'
  - id: stranger_reads_published_board
    as: stranger
    request:
      method: GET
      path: '/batches/{{batch}}/obligations'
  - id: owner_publishes_again
    as: owner
    request:
      method: POST
      path: '/batches/{{batch}}/publish'
      headers:
        content-type: 'application/json'
      body_raw: '{"delivery_method":"personal_link","guest_link_expires_at":"2030-03-01T12:00:00+07:00"}'
