# W5 · GET /g/{token}/khong-phai-toi: the "this link is not mine" page. It shows
# the claimed name and who recorded it, never an amount. Both senders' names carry
# markup, quotes, an ampersand, an apostrophe, RTL marks and an emoji. The button
# disappears once three objections were used on the link (per-link count, not per
# obligation), and the POST behind it is then 429. After "not me" the link is
# revoked: this page is 409 LINK_NOT_ACTIVE while the home page renders the
# revoked state. HEAD is 405, a trailing slash 307, an unknown token the HTML
# 404. Texts are sample data (dữ liệu mẫu).
id: w5/guests/get-g-token-khong-phai-toi
routes: ['GET /g/{token}/khong-phai-toi', 'POST /g/{token}/khong-phai-toi']
auth_mode: dev
personas:
  owner: {}
  mate: {}
  third: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ đợt (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Khách <script>một</script> & \"kép\" ''đơn'' +=` \u202e \ud83d\ude00 (dữ liệu mẫu)"}'
  - id: register_third
    as: third
    request:
      method: PUT
      path: '/people/{{persona.third}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Khách <b>hai</b> & \u200f (dữ liệu mẫu)"}'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm không phải tôi (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
      kp: {from: body, pointer: /id, regex: '^(.{23})', class: uuid}
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  - id: owner_invites_third
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.third}}"}'
    bind:
      m_third: {from: body, pointer: /id, class: uuid}
  - id: third_accepts
    as: third
    request:
      method: POST
      path: '/memberships/{{m_third}}/accept'
  - id: owner_proposes_dinner
    as: owner
    request:
      method: POST
      path: '/expenses'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","description":"Bữa tối ba người (dữ liệu mẫu)","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-02T19:00:00+07:00","participants":["{{persona.owner}}","{{persona.mate}}","{{persona.third}}"],"total_amount_vnd":90000}'
    bind:
      dinner: {from: body, pointer: /expense_id, class: uuid}
  - id: owner_confirms_dinner
    as: owner
    request:
      method: POST
      path: '/expenses/{{dinner}}/confirm'
      headers:
        content-type: 'application/json'
      body_raw: '{"proposal":{"context_id":"{{ctx}}","description":"Bữa tối ba người (dữ liệu mẫu)","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-02T19:00:00+07:00","participants":["{{persona.owner}}","{{persona.mate}}","{{persona.third}}"],"total_amount_vnd":90000},"expected_allocations":{"{{persona.owner}}":30000,"{{persona.mate}}":30000,"{{persona.third}}":30000},"acknowledge_as_advancer":true}'
    bind:
      dinner_v: {from: body, pointer: /expense_version_id, class: uuid}
  - id: owner_batches
    as: owner
    request:
      method: POST
      path: '/batches'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","expense_version_ids":["{{dinner_v}}"],"due_at":"2030-02-01T12:00:00+07:00"}'
    bind:
      batch: {from: body, pointer: /batch_id, class: uuid}
  - id: owner_publishes
    as: owner
    request:
      method: POST
      path: '/batches/{{batch}}/publish'
      headers:
        content-type: 'application/json'
      body_raw: '{"delivery_method":"personal_link","guest_link_expires_at":"2030-03-01T12:00:00+07:00"}'
    bind:
      tok_a: {from: body, pointer: /guest_links/0/path, regex: '^/g/([A-Za-z0-9_-]+)$', class: token}
      ob_a: {from: body, pointer: /guest_links/0/obligations/0/obligation_id, class: uuid}
      tok_b: {from: body, pointer: /guest_links/1/path, regex: '^/g/([A-Za-z0-9_-]+)$', class: token}
      ob_b: {from: body, pointer: /guest_links/1/obligations/0/obligation_id, class: uuid}
  - id: guest_a_opens_not_me
    as: anonymous
    request:
      method: GET
      path: '/g/{{tok_a}}/khong-phai-toi'
  - id: guest_a_opens_not_me_again
    as: anonymous
    request:
      method: GET
      path: '/g/{{tok_a}}/khong-phai-toi'
  - id: not_me_query_ignored
    as: anonymous
    request:
      method: GET
      path: '/g/{{tok_a}}/khong-phai-toi?obligation_id={{ob_a}}'
  # three objections use the link-wide quota the page reads
  - id: guest_a_objects_amount_1
    as: anonymous
    request:
      method: POST
      path: '/g/{{tok_a}}/doi-so-tien'
      headers:
        content-type: 'application/x-www-form-urlencoded'
      body_raw: 'obligation_id={{ob_a}}&reason=amount_too_high'
  - id: guest_a_objects_amount_2
    as: anonymous
    request:
      method: POST
      path: '/g/{{tok_a}}/doi-so-tien'
      headers:
        content-type: 'application/x-www-form-urlencoded'
      body_raw: 'obligation_id={{ob_a}}&reason=did_not_join'
  - id: guest_a_objects_amount_3
    as: anonymous
    request:
      method: POST
      path: '/g/{{tok_a}}/doi-so-tien'
      headers:
        content-type: 'application/x-www-form-urlencoded'
      body_raw: 'obligation_id={{ob_a}}&reason=other'
  - id: guest_a_not_me_page_quota_used
    as: anonymous
    request:
      method: GET
      path: '/g/{{tok_a}}/khong-phai-toi'
  - id: guest_a_not_me_after_quota
    as: anonymous
    request:
      method: POST
      path: '/g/{{tok_a}}/khong-phai-toi'
  # once the other sender says not me, the page refuses and the home page says revoked
  - id: guest_b_opens_not_me
    as: anonymous
    request:
      method: GET
      path: '/g/{{tok_b}}/khong-phai-toi'
  - id: guest_b_says_not_me
    as: anonymous
    request:
      method: POST
      path: '/g/{{tok_b}}/khong-phai-toi'
  - id: guest_b_not_me_page_after
    as: anonymous
    request:
      method: GET
      path: '/g/{{tok_b}}/khong-phai-toi'
  - id: guest_b_home_revoked
    as: anonymous
    request:
      method: GET
      path: '/g/{{tok_b}}'
  - id: head_not_me
    as: anonymous
    request:
      method: HEAD
      path: '/g/{{tok_a}}/khong-phai-toi'
  - id: not_me_trailing_slash
    as: anonymous
    request:
      method: GET
      path: '/g/{{tok_a}}/khong-phai-toi/'
  - id: unknown_token_not_me
    as: anonymous
    request:
      method: GET
      path: '/g/khong-co-link-nay-khong-co-link-nay-khong-c/khong-phai-toi'
