# W5 · GET /g/{token}: the guest page. The token is the capability; there is no
# actor. One dinner split three ways makes two senders owe the owner, and each
# link renders its own envelope only. The owner's name and the dinner label carry
# markup, quotes, an ampersand, an apostrophe, RTL marks and an emoji, so the
# page pins autoescaping byte for byte (markupsafe leaves +, = and backticks alone). The page is read fresh, reported,
# confirmed by the receiver, disputed and revoked. A GET writes: the first one
# stamps guest_links.first_opened_at. Framework doors (HEAD, trailing slash, 405,
# the bare prefix) and token shapes (unknown, 32 and 128 characters, too short,
# too long, off-pattern) close the file. Expired links are not covered: the
# format has no clock step. Amounts are integer VND; texts are sample data
# (dữ liệu mẫu).
id: w5/guests/get-g-token
routes: ['GET /g/{token}']
auth_mode: dev
personas:
  owner: {}
  mate: {}
  third: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ <script>alert(1)</script> & \"kép\" ''đơn'' a+b=c `x` \u202e\u200f \ud83d\ude00 (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Khách <i>một</i> & ''nháy'' (dữ liệu mẫu)"}'
  - id: register_third
    as: third
    request:
      method: PUT
      path: '/people/{{persona.third}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Khách hai \"trích\" (dữ liệu mẫu)"}'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm <b>link</b> khách & bạn (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
      kp: {from: body, pointer: /id, regex: '^(.{23})', class: uuid}
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  - id: owner_invites_third
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.third}}"}'
    bind:
      m_third: {from: body, pointer: /id, class: uuid}
  - id: third_accepts
    as: third
    request:
      method: POST
      path: '/memberships/{{m_third}}/accept'
  - id: owner_proposes_dinner
    as: owner
    request:
      method: POST
      path: '/expenses'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","description":"Bữa <b>tối</b> & ''lẩu'' \"cay\" 1+1=2 `nướng` \u202e \ud83d\ude00 (dữ liệu mẫu)","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-02T19:00:00+07:00","participants":["{{persona.owner}}","{{persona.mate}}","{{persona.third}}"],"total_amount_vnd":90000}'
    bind:
      dinner: {from: body, pointer: /expense_id, class: uuid}
  - id: owner_confirms_dinner
    as: owner
    request:
      method: POST
      path: '/expenses/{{dinner}}/confirm'
      headers:
        content-type: 'application/json'
      body_raw: '{"proposal":{"context_id":"{{ctx}}","description":"Bữa <b>tối</b> & ''lẩu'' \"cay\" 1+1=2 `nướng` \u202e \ud83d\ude00 (dữ liệu mẫu)","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-02T19:00:00+07:00","participants":["{{persona.owner}}","{{persona.mate}}","{{persona.third}}"],"total_amount_vnd":90000},"expected_allocations":{"{{persona.owner}}":30000,"{{persona.mate}}":30000,"{{persona.third}}":30000},"acknowledge_as_advancer":true}'
    bind:
      dinner_v: {from: body, pointer: /expense_version_id, class: uuid}
  - id: owner_batches
    as: owner
    request:
      method: POST
      path: '/batches'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","expense_version_ids":["{{dinner_v}}"],"due_at":"2030-02-01T12:00:00+07:00"}'
    bind:
      batch: {from: body, pointer: /batch_id, class: uuid}
  - id: owner_publishes
    as: owner
    request:
      method: POST
      path: '/batches/{{batch}}/publish'
      headers:
        content-type: 'application/json'
      body_raw: '{"delivery_method":"personal_link","guest_link_expires_at":"2030-03-01T12:00:00+07:00"}'
    bind:
      tok_a: {from: body, pointer: /guest_links/0/path, regex: '^/g/([A-Za-z0-9_-]+)$', class: token}
      ob_a: {from: body, pointer: /guest_links/0/obligations/0/obligation_id, class: uuid}
      tok_b: {from: body, pointer: /guest_links/1/path, regex: '^/g/([A-Za-z0-9_-]+)$', class: token}
      ob_b: {from: body, pointer: /guest_links/1/obligations/0/obligation_id, class: uuid}
  # a link nobody opened yet: the first GET stamps first_opened_at, the second writes nothing
  - id: guest_a_opens
    as: anonymous
    request:
      method: GET
      path: '/g/{{tok_a}}'
  - id: guest_a_opens_again
    as: anonymous
    request:
      method: GET
      path: '/g/{{tok_a}}'
  - id: guest_a_opens_with_query
    as: anonymous
    request:
      method: GET
      path: '/g/{{tok_a}}?utm_source=chat&x=%3Cb%3E'
  # the other sender's link carries the other envelope and nothing else
  - id: guest_b_opens
    as: anonymous
    request:
      method: GET
      path: '/g/{{tok_b}}'
  # reported, confirmed, disputed and revoked, each read back on the page
  - id: guest_a_reports_paid
    as: anonymous
    request:
      method: POST
      path: '/g/{{tok_a}}/da-chuyen'
      headers:
        content-type: 'application/x-www-form-urlencoded'
      body_raw: 'obligation_id={{ob_a}}'
  - id: guest_a_page_reported
    as: anonymous
    request:
      method: GET
      path: '/g/{{tok_a}}'
  - id: owner_confirms_b_received
    as: owner
    request:
      method: POST
      path: '/obligations/{{ob_b}}/confirm-receipt'
      headers:
        content-type: 'application/json'
      body_raw: '{"amount_vnd":30000,"idempotency_key":"{{kp}}-aaaaaaaaaaaa"}'
  - id: guest_b_page_confirmed
    as: anonymous
    request:
      method: GET
      path: '/g/{{tok_b}}'
  - id: guest_b_objects_amount
    as: anonymous
    request:
      method: POST
      path: '/g/{{tok_b}}/doi-so-tien'
      headers:
        content-type: 'application/x-www-form-urlencoded'
      body_raw: 'obligation_id={{ob_b}}&reason=amount_too_high'
  - id: guest_b_page_confirmed_disputed
    as: anonymous
    request:
      method: GET
      path: '/g/{{tok_b}}'
  - id: guest_a_says_not_me
    as: anonymous
    request:
      method: POST
      path: '/g/{{tok_a}}/khong-phai-toi'
  - id: guest_a_page_revoked
    as: anonymous
    request:
      method: GET
      path: '/g/{{tok_a}}'
  - id: guest_a_page_revoked_again
    as: anonymous
    request:
      method: GET
      path: '/g/{{tok_a}}'
  # framework doors under /g: HEAD is not GET here, a trailing slash redirects
  - id: head_page
    as: anonymous
    request:
      method: HEAD
      path: '/g/{{tok_b}}'
  - id: page_trailing_slash
    as: anonymous
    request:
      method: GET
      path: '/g/{{tok_b}}/'
  - id: post_to_page
    as: anonymous
    request:
      method: POST
      path: '/g/{{tok_b}}'
  - id: options_page
    as: anonymous
    request:
      method: OPTIONS
      path: '/g/{{tok_b}}'
  - id: prefix_alone
    as: anonymous
    request:
      method: GET
      path: '/g'
  - id: prefix_slash
    as: anonymous
    request:
      method: GET
      path: '/g/'
  # token shapes: length and pattern are checked before any lookup
  - id: unknown_token_43
    as: anonymous
    request:
      method: GET
      path: '/g/khong-co-link-nay-khong-co-link-nay-khong-c'
  - id: unknown_token_min_length
    as: anonymous
    request:
      method: GET
      path: '/g/link-da-bi-cat-link-da-bi-cat-li'
  - id: unknown_token_max_length
    as: anonymous
    request:
      method: GET
      path: '/g/link-dai-van-hop-le-link-dai-van-hop-le-link-dai-van-hop-le-link-dai-van-hop-le-link-dai-van-hop-le-link-dai-van-hop-le-link-dai'
  - id: unknown_token_trailing_slash
    as: anonymous
    request:
      method: GET
      path: '/g/khong-co-link-nay-khong-co-link-nay-khong-c/'
  - id: token_too_short
    as: anonymous
    request:
      method: GET
      path: '/g/link-da-bi-cat-link-da-bi-cat-l'
  - id: token_too_long
    as: anonymous
    request:
      method: GET
      path: '/g/link-dai-van-hop-le-link-dai-van-hop-le-link-dai-van-hop-le-link-dai-van-hop-le-link-dai-van-hop-le-link-dai-van-hop-le-link-daix'
  - id: token_with_dot
    as: anonymous
    request:
      method: GET
      path: '/g/khong-co-link-nay-khong-co-link-nay-khong.c'
  - id: token_with_encoded_dot
    as: anonymous
    request:
      method: GET
      path: '/g/khong-co-link-nay-khong-co-link-nay-khong%2Ec'
  - id: token_with_encoded_slash
    as: anonymous
    request:
      method: GET
      path: '/g/khong-co-link-nay%2Fkhong-co-link-nay-khong-co'
