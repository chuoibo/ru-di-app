# W5 concurrency · POST /g/{token}/khong-phai-toi, one batch per sender.
# get_guest_envelope locks the
# link row (with its envelope, batch version and batch) FOR UPDATE, so two
# presses at once serialize: the first revokes and renders the confirmation, the
# second reads the revoked row and is 409 LINK_NOT_ACTIVE. One audit event is
# written. Under one header key the second copy replays the first page instead.
# Texts are sample data (dữ liệu mẫu).
id: w5/concurrency/post-g-token-khong-phai-toi
routes: ['POST /g/{token}/khong-phai-toi']
auth_mode: dev
personas:
  owner: {}
  mate: {}
  third: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ đợt không phải tôi cùng lúc (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Khách một (dữ liệu mẫu)"}'
  - id: register_third
    as: third
    request:
      method: PUT
      path: '/people/{{persona.third}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Khách hai (dữ liệu mẫu)"}'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm không phải tôi cùng lúc (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
      kp: {from: body, pointer: /id, regex: '^(.{23})', class: uuid}
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  - id: owner_invites_third
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.third}}"}'
    bind:
      m_third: {from: body, pointer: /id, class: uuid}
  - id: third_accepts
    as: third
    request:
      method: POST
      path: '/memberships/{{m_third}}/accept'
  - id: owner_proposes_meal_a
    as: owner
    request:
      method: POST
      path: '/expenses'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","description":"Bữa trưa với khách a (dữ liệu mẫu)","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-02T12:00:00+07:00","participants":["{{persona.owner}}","{{persona.mate}}"],"total_amount_vnd":60000}'
    bind:
      meal_a: {from: body, pointer: /expense_id, class: uuid}
  - id: owner_confirms_meal_a
    as: owner
    request:
      method: POST
      path: '/expenses/{{meal_a}}/confirm'
      headers:
        content-type: 'application/json'
      body_raw: '{"proposal":{"context_id":"{{ctx}}","description":"Bữa trưa với khách a (dữ liệu mẫu)","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-02T12:00:00+07:00","participants":["{{persona.owner}}","{{persona.mate}}"],"total_amount_vnd":60000},"expected_allocations":{"{{persona.owner}}":30000,"{{persona.mate}}":30000},"acknowledge_as_advancer":true}'
    bind:
      meal_a_v: {from: body, pointer: /expense_version_id, class: uuid}
  - id: owner_batches_a
    as: owner
    request:
      method: POST
      path: '/batches'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","expense_version_ids":["{{meal_a_v}}"],"due_at":"2030-02-01T12:00:00+07:00"}'
    bind:
      batch_a: {from: body, pointer: /batch_id, class: uuid}
  - id: owner_publishes_a
    as: owner
    request:
      method: POST
      path: '/batches/{{batch_a}}/publish'
      headers:
        content-type: 'application/json'
      body_raw: '{"delivery_method":"personal_link","guest_link_expires_at":"2030-03-01T12:00:00+07:00"}'
    bind:
      tok_a: {from: body, pointer: /guest_links/0/path, regex: '^/g/([A-Za-z0-9_-]+)$', class: token}
      ob_a: {from: body, pointer: /guest_links/0/obligations/0/obligation_id, class: uuid}
  - id: owner_proposes_meal_b
    as: owner
    request:
      method: POST
      path: '/expenses'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","description":"Bữa trưa với khách b (dữ liệu mẫu)","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-03T12:00:00+07:00","participants":["{{persona.owner}}","{{persona.third}}"],"total_amount_vnd":60000}'
    bind:
      meal_b: {from: body, pointer: /expense_id, class: uuid}
  - id: owner_confirms_meal_b
    as: owner
    request:
      method: POST
      path: '/expenses/{{meal_b}}/confirm'
      headers:
        content-type: 'application/json'
      body_raw: '{"proposal":{"context_id":"{{ctx}}","description":"Bữa trưa với khách b (dữ liệu mẫu)","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-03T12:00:00+07:00","participants":["{{persona.owner}}","{{persona.third}}"],"total_amount_vnd":60000},"expected_allocations":{"{{persona.owner}}":30000,"{{persona.third}}":30000},"acknowledge_as_advancer":true}'
    bind:
      meal_b_v: {from: body, pointer: /expense_version_id, class: uuid}
  - id: owner_batches_b
    as: owner
    request:
      method: POST
      path: '/batches'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","expense_version_ids":["{{meal_b_v}}"],"due_at":"2030-02-01T12:00:00+07:00"}'
    bind:
      batch_b: {from: body, pointer: /batch_id, class: uuid}
  - id: owner_publishes_b
    as: owner
    request:
      method: POST
      path: '/batches/{{batch_b}}/publish'
      headers:
        content-type: 'application/json'
      body_raw: '{"delivery_method":"personal_link","guest_link_expires_at":"2030-03-01T12:00:00+07:00"}'
    bind:
      tok_b: {from: body, pointer: /guest_links/0/path, regex: '^/g/([A-Za-z0-9_-]+)$', class: token}
      ob_b: {from: body, pointer: /guest_links/0/obligations/0/obligation_id, class: uuid}
  - id: not_me_twice_at_once
    as: anonymous
    concurrent: 2
    request:
      method: POST
      path: '/g/{{tok_a}}/khong-phai-toi'
  - id: not_me_same_header_key_at_once
    as: anonymous
    concurrent: 2
    request:
      method: POST
      path: '/g/{{tok_b}}/khong-phai-toi'
      headers:
        idempotency-key: '{{kp}}-bebebebebebe'
