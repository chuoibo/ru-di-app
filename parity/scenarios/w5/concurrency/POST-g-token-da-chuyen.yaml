# W5 concurrency · POST /g/{token}/da-chuyen. Copies are released together. Each
# sender gets a batch of their own, so no answer depends on persona uuid order.
# get_payment_report_target locks the guest_links row FOR UPDATE until commit, so
# copies on one link run one after another and each reads the reports the earlier
# ones committed: two copies write two reports; two copies with one body
# idempotency_key write one report and both answer it; four copies on a fresh
# link are three 201 and one 403 report_budget_available. Under one header key
# one copy runs and the other replays it. Which copy wins differs between runs;
# the set of answers and rows does not. Amounts are integer VND; texts are sample
# data (dữ liệu mẫu).
id: w5/concurrency/post-g-token-da-chuyen
routes: ['POST /g/{token}/da-chuyen']
auth_mode: dev
personas:
  owner: {}
  mate: {}
  third: {}
  fourth: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ đợt báo cùng lúc (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Khách một (dữ liệu mẫu)"}'
  - id: register_third
    as: third
    request:
      method: PUT
      path: '/people/{{persona.third}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Khách hai (dữ liệu mẫu)"}'
  - id: register_fourth
    as: fourth
    request:
      method: PUT
      path: '/people/{{persona.fourth}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Khách ba (dữ liệu mẫu)"}'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm báo cùng lúc (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
      kp: {from: body, pointer: /id, regex: '^(.{23})', class: uuid}
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  - id: owner_invites_third
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.third}}"}'
    bind:
      m_third: {from: body, pointer: /id, class: uuid}
  - id: third_accepts
    as: third
    request:
      method: POST
      path: '/memberships/{{m_third}}/accept'
  - id: owner_invites_fourth
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.fourth}}"}'
    bind:
      m_fourth: {from: body, pointer: /id, class: uuid}
  - id: fourth_accepts
    as: fourth
    request:
      method: POST
      path: '/memberships/{{m_fourth}}/accept'
  - id: owner_proposes_meal_a
    as: owner
    request:
      method: POST
      path: '/expenses'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","description":"Bữa trưa với khách a (dữ liệu mẫu)","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-02T12:00:00+07:00","participants":["{{persona.owner}}","{{persona.mate}}"],"total_amount_vnd":60000}'
    bind:
      meal_a: {from: body, pointer: /expense_id, class: uuid}
  - id: owner_confirms_meal_a
    as: owner
    request:
      method: POST
      path: '/expenses/{{meal_a}}/confirm'
      headers:
        content-type: 'application/json'
      body_raw: '{"proposal":{"context_id":"{{ctx}}","description":"Bữa trưa với khách a (dữ liệu mẫu)","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-02T12:00:00+07:00","participants":["{{persona.owner}}","{{persona.mate}}"],"total_amount_vnd":60000},"expected_allocations":{"{{persona.owner}}":30000,"{{persona.mate}}":30000},"acknowledge_as_advancer":true}'
    bind:
      meal_a_v: {from: body, pointer: /expense_version_id, class: uuid}
  - id: owner_batches_a
    as: owner
    request:
      method: POST
      path: '/batches'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","expense_version_ids":["{{meal_a_v}}"],"due_at":"2030-02-01T12:00:00+07:00"}'
    bind:
      batch_a: {from: body, pointer: /batch_id, class: uuid}
  - id: owner_publishes_a
    as: owner
    request:
      method: POST
      path: '/batches/{{batch_a}}/publish'
      headers:
        content-type: 'application/json'
      body_raw: '{"delivery_method":"personal_link","guest_link_expires_at":"2030-03-01T12:00:00+07:00"}'
    bind:
      tok_a: {from: body, pointer: /guest_links/0/path, regex: '^/g/([A-Za-z0-9_-]+)$', class: token}
      ob_a: {from: body, pointer: /guest_links/0/obligations/0/obligation_id, class: uuid}
  - id: owner_proposes_meal_b
    as: owner
    request:
      method: POST
      path: '/expenses'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","description":"Bữa trưa với khách b (dữ liệu mẫu)","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-03T12:00:00+07:00","participants":["{{persona.owner}}","{{persona.third}}"],"total_amount_vnd":60000}'
    bind:
      meal_b: {from: body, pointer: /expense_id, class: uuid}
  - id: owner_confirms_meal_b
    as: owner
    request:
      method: POST
      path: '/expenses/{{meal_b}}/confirm'
      headers:
        content-type: 'application/json'
      body_raw: '{"proposal":{"context_id":"{{ctx}}","description":"Bữa trưa với khách b (dữ liệu mẫu)","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-03T12:00:00+07:00","participants":["{{persona.owner}}","{{persona.third}}"],"total_amount_vnd":60000},"expected_allocations":{"{{persona.owner}}":30000,"{{persona.third}}":30000},"acknowledge_as_advancer":true}'
    bind:
      meal_b_v: {from: body, pointer: /expense_version_id, class: uuid}
  - id: owner_batches_b
    as: owner
    request:
      method: POST
      path: '/batches'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","expense_version_ids":["{{meal_b_v}}"],"due_at":"2030-02-01T12:00:00+07:00"}'
    bind:
      batch_b: {from: body, pointer: /batch_id, class: uuid}
  - id: owner_publishes_b
    as: owner
    request:
      method: POST
      path: '/batches/{{batch_b}}/publish'
      headers:
        content-type: 'application/json'
      body_raw: '{"delivery_method":"personal_link","guest_link_expires_at":"2030-03-01T12:00:00+07:00"}'
    bind:
      tok_b: {from: body, pointer: /guest_links/0/path, regex: '^/g/([A-Za-z0-9_-]+)$', class: token}
      ob_b: {from: body, pointer: /guest_links/0/obligations/0/obligation_id, class: uuid}
  - id: owner_proposes_meal_c
    as: owner
    request:
      method: POST
      path: '/expenses'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","description":"Bữa trưa với khách c (dữ liệu mẫu)","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-04T12:00:00+07:00","participants":["{{persona.owner}}","{{persona.fourth}}"],"total_amount_vnd":60000}'
    bind:
      meal_c: {from: body, pointer: /expense_id, class: uuid}
  - id: owner_confirms_meal_c
    as: owner
    request:
      method: POST
      path: '/expenses/{{meal_c}}/confirm'
      headers:
        content-type: 'application/json'
      body_raw: '{"proposal":{"context_id":"{{ctx}}","description":"Bữa trưa với khách c (dữ liệu mẫu)","recorded_by_id":"{{persona.owner}}","paid_by_id":"{{persona.owner}}","verification_scope":"totals_only","occurred_at":"2030-01-04T12:00:00+07:00","participants":["{{persona.owner}}","{{persona.fourth}}"],"total_amount_vnd":60000},"expected_allocations":{"{{persona.owner}}":30000,"{{persona.fourth}}":30000},"acknowledge_as_advancer":true}'
    bind:
      meal_c_v: {from: body, pointer: /expense_version_id, class: uuid}
  - id: owner_batches_c
    as: owner
    request:
      method: POST
      path: '/batches'
      headers:
        content-type: 'application/json'
      body_raw: '{"context_id":"{{ctx}}","expense_version_ids":["{{meal_c_v}}"],"due_at":"2030-02-01T12:00:00+07:00"}'
    bind:
      batch_c: {from: body, pointer: /batch_id, class: uuid}
  - id: owner_publishes_c
    as: owner
    request:
      method: POST
      path: '/batches/{{batch_c}}/publish'
      headers:
        content-type: 'application/json'
      body_raw: '{"delivery_method":"personal_link","guest_link_expires_at":"2030-03-01T12:00:00+07:00"}'
    bind:
      tok_c: {from: body, pointer: /guest_links/0/path, regex: '^/g/([A-Za-z0-9_-]+)$', class: token}
      ob_c: {from: body, pointer: /guest_links/0/obligations/0/obligation_id, class: uuid}
  - id: report_twice_at_once
    as: anonymous
    concurrent: 2
    request:
      method: POST
      path: '/g/{{tok_a}}/da-chuyen'
      headers:
        content-type: 'application/x-www-form-urlencoded'
      body_raw: 'obligation_id={{ob_a}}'
  - id: report_same_body_key_at_once
    as: anonymous
    concurrent: 2
    request:
      method: POST
      path: '/g/{{tok_b}}/da-chuyen'
      headers:
        content-type: 'application/x-www-form-urlencoded'
      body_raw: 'obligation_id={{ob_b}}&idempotency_key={{kp}}-eeeeeeeeeeee'
  - id: report_four_at_once
    as: anonymous
    concurrent: 4
    request:
      method: POST
      path: '/g/{{tok_c}}/da-chuyen'
      headers:
        content-type: 'application/x-www-form-urlencoded'
      body_raw: 'obligation_id={{ob_c}}'
  - id: report_same_header_key_at_once
    as: anonymous
    concurrent: 2
    request:
      method: POST
      path: '/g/{{tok_a}}/da-chuyen'
      headers:
        content-type: 'application/x-www-form-urlencoded'
        idempotency-key: '{{kp}}-dadadadadada'
      body_raw: 'obligation_id={{ob_a}}'
  - id: browser_reports_at_once
    as: anonymous
    concurrent: 2
    request:
      method: POST
      path: '/g/{{tok_b}}/da-chuyen'
      headers:
        content-type: 'application/x-www-form-urlencoded'
        accept: 'text/html'
      body_raw: 'obligation_id={{ob_b}}'
  - id: owner_rounds_after_bursts
    as: owner
    request:
      method: GET
      path: '/contexts/{{ctx}}/batches'
