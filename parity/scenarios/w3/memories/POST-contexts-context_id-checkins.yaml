# W3 · POST /contexts/{id}/checkins — the group was at a catalogue place.
# Order: idempotency key shape, JSON decode, actor, path + body model, role +
# ACTIVE membership, then an unknown place_id is 422. Name and coordinates come
# from the places table; the answer is a MemoryResponse with float lat/lng.
id: w3/memories/post-contexts-context_id-checkins
routes: ['POST /contexts/{context_id}/checkins']
auth_mode: dev
personas:
  owner: {}
  mate: {}
  invitee: {}
  stranger: {}
steps:
  - id: anonymous_unknown_context
    as: anonymous
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/checkins'
      headers:
        content-type: 'application/json'
      body_raw: '{"place_id":"p-quan-oc-di-be"}'
  - id: anonymous_non_uuid_context
    as: anonymous
    request:
      method: POST
      path: '/contexts/khong-phai-uuid/checkins'
      headers:
        content-type: 'application/json'
      body_raw: '{"place_id":"p-quan-oc-di-be"}'
  - id: anonymous_malformed_json
    as: anonymous
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/checkins'
      headers:
        content-type: 'application/json'
      body_raw: '{"place_id": '
  - id: anonymous_empty_idempotency_key
    as: anonymous
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/checkins'
      headers:
        idempotency-key: ''
        content-type: 'application/json'
      body_raw: '{"place_id":"p-quan-oc-di-be"}'
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ nhóm (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn cùng nhóm (dữ liệu mẫu)"}'
  - id: register_invitee
    as: invitee
    request:
      method: PUT
      path: '/people/{{persona.invitee}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người được mời (dữ liệu mẫu)"}'
  - id: register_stranger
    as: stranger
    request:
      method: PUT
      path: '/people/{{persona.stranger}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người lạ (dữ liệu mẫu)"}'
  - id: stranger_unknown_context
    as: stranger
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/checkins'
      headers:
        content-type: 'application/json'
      body_raw: '{"place_id":"p-quan-oc-di-be"}'
  # membership is decided before the place is looked up
  - id: stranger_unknown_context_unknown_place
    as: stranger
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/checkins'
      headers:
        content-type: 'application/json'
      body_raw: '{"place_id":"p-khong-co-that"}'
  - id: stranger_unknown_context_bad_body
    as: stranger
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/checkins'
      headers:
        content-type: 'application/json'
      body_raw: '{}'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm kỷ niệm (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  - id: owner_invites_invitee
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.invitee}}"}'
  - id: stranger_real_context
    as: stranger
    request:
      method: POST
      path: '/contexts/{{ctx}}/checkins'
      headers:
        content-type: 'application/json'
      body_raw: '{"place_id":"p-quan-oc-di-be"}'
  - id: invitee_checks_in
    as: invitee
    request:
      method: POST
      path: '/contexts/{{ctx}}/checkins'
      headers:
        content-type: 'application/json'
      body_raw: '{"place_id":"p-quan-oc-di-be"}'
  - id: mate_roles_empty
    as: mate
    request:
      method: POST
      path: '/contexts/{{ctx}}/checkins'
      headers:
        x-actor-roles: ''
        content-type: 'application/json'
      body_raw: '{"place_id":"p-quan-oc-di-be"}'
  - id: mate_checks_in
    as: mate
    request:
      method: POST
      path: '/contexts/{{ctx}}/checkins'
      headers:
        content-type: 'application/json'
      body_raw: '{"place_id":"p-quan-oc-di-be"}'
  - id: mate_checks_in_with_caption
    as: mate
    request:
      method: POST
      path: '/contexts/{{ctx}}/checkins'
      headers:
        content-type: 'application/json'
      body_raw: '{"place_id":"p-lung-chung-cafe","caption":"Tới rồi (dữ liệu mẫu)"}'
  - id: mate_checks_in_same_place_again
    as: mate
    request:
      method: POST
      path: '/contexts/{{ctx}}/checkins'
      headers:
        content-type: 'application/json'
      body_raw: '{"place_id":"p-quan-oc-di-be"}'
  - id: mate_unknown_place
    as: mate
    request:
      method: POST
      path: '/contexts/{{ctx}}/checkins'
      headers:
        content-type: 'application/json'
      body_raw: '{"place_id":"p-khong-co-that"}'
  - id: mate_place_wrong_case
    as: mate
    request:
      method: POST
      path: '/contexts/{{ctx}}/checkins'
      headers:
        content-type: 'application/json'
      body_raw: '{"place_id":"P-QUAN-OC-DI-BE"}'
  - id: mate_place_leading_space
    as: mate
    request:
      method: POST
      path: '/contexts/{{ctx}}/checkins'
      headers:
        content-type: 'application/json'
      body_raw: '{"place_id":" p-quan-oc-di-be"}'
  - id: owner_roles_group_admin_only
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/checkins'
      headers:
        x-actor-roles: 'group_admin'
        content-type: 'application/json'
      body_raw: '{"place_id":"p-quan-oc-di-be"}'
  - id: caption_null
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/checkins'
      headers:
        content-type: 'application/json'
      body_raw: '{"place_id":"p-quan-oc-di-be","caption":null}'
  - id: place_missing
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/checkins'
      headers:
        content-type: 'application/json'
      body_raw: '{"caption":"Không nói ở đâu (dữ liệu mẫu)"}'
  - id: place_empty
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/checkins'
      headers:
        content-type: 'application/json'
      body_raw: '{"place_id":""}'
  - id: place_number
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/checkins'
      headers:
        content-type: 'application/json'
      body_raw: '{"place_id":5}'
  - id: caption_number
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/checkins'
      headers:
        content-type: 'application/json'
      body_raw: '{"place_id":"p-quan-oc-di-be","caption":5}'
  # the body cannot move the place: coordinates are unknown fields
  - id: extra_field_lat_lng
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/checkins'
      headers:
        content-type: 'application/json'
      body_raw: '{"place_id":"p-quan-oc-di-be","lat":0.0,"lng":0.0}'
  - id: extra_field_image_url
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/checkins'
      headers:
        content-type: 'application/json'
      body_raw: '{"place_id":"p-quan-oc-di-be","image_url":"/contexts/{{ctx}}/photos/cccccccc-dddd-4eee-8fff-aaaaaaaaaaaa"}'
  - id: top_level_array
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/checkins'
      headers:
        content-type: 'application/json'
      body_raw: '[]'
  - id: owner_lists_checkins
    as: owner
    request:
      method: GET
      path: '/contexts/{{ctx}}/memories?kind=checkin'
  # idempotency
  - id: idem_first
    as: mate
    request:
      method: POST
      path: '/contexts/{{ctx}}/checkins'
      headers:
        idempotency-key: 'w3-checkin-a'
        content-type: 'application/json'
      body_raw: '{"place_id":"p-lung-chung-cafe"}'
  - id: idem_replay
    as: mate
    request:
      method: POST
      path: '/contexts/{{ctx}}/checkins'
      headers:
        idempotency-key: 'w3-checkin-a'
        content-type: 'application/json'
      body_raw: '{"place_id":"p-lung-chung-cafe"}'
  - id: idem_reuse_different_body
    as: mate
    request:
      method: POST
      path: '/contexts/{{ctx}}/checkins'
      headers:
        idempotency-key: 'w3-checkin-a'
        content-type: 'application/json'
      body_raw: '{"place_id":"p-quan-oc-di-be"}'
  - id: idem_refusal_not_stored
    as: mate
    request:
      method: POST
      path: '/contexts/{{ctx}}/checkins'
      headers:
        idempotency-key: 'w3-checkin-b'
        content-type: 'application/json'
      body_raw: '{"place_id":"p-khong-co-that"}'
  - id: idem_same_key_after_refusal
    as: mate
    request:
      method: POST
      path: '/contexts/{{ctx}}/checkins'
      headers:
        idempotency-key: 'w3-checkin-b'
        content-type: 'application/json'
      body_raw: '{"place_id":"p-quan-oc-di-be"}'
  - id: idem_key_too_long
    as: mate
    request:
      method: POST
      path: '/contexts/{{ctx}}/checkins'
      headers:
        idempotency-key: 'kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk'
        content-type: 'application/json'
      body_raw: '{"place_id":"p-quan-oc-di-be"}'
  - id: trailing_slash_redirects
    as: mate
    request:
      method: POST
      path: '/contexts/{{ctx}}/checkins/'
      headers:
        content-type: 'application/json'
      body_raw: '{"place_id":"p-quan-oc-di-be"}'
  - id: get_not_allowed
    as: mate
    request:
      method: GET
      path: '/contexts/{{ctx}}/checkins'
