# W3 · memories in prod auth mode (ADR-0014): identity is a bearer session read
# by digest; X-Actor-* headers are ignored, so neither a claimed id nor a claimed
# context opens a wall, and an empty roles header takes nothing away.
# The harness seeds a people row and a live session per persona before step one.
id: w3/memories/prod-auth
routes: ['POST /contexts/{context_id}/memories', 'POST /contexts/{context_id}/checkins', 'GET /contexts/{context_id}/memories', 'GET /contexts/{context_id}/widget', 'POST /contexts/{context_id}/memories/{memory_id}/reactions', 'DELETE /contexts/{context_id}/memories/{memory_id}/reactions', 'POST /contexts/{context_id}/memories/{memory_id}/comments', 'GET /contexts/{context_id}/memories/{memory_id}/comments']
auth_mode: prod
personas:
  owner: {}
  mate: {}
  stranger: {}
steps:
  - id: anonymous_post_memory
    as: anonymous
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/memories'
      headers:
        content-type: 'application/json'
      body_raw: '{"image_url":"/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/photos/cccccccc-dddd-4eee-8fff-aaaaaaaaaaaa"}'
  - id: junk_bearer_wall
    as: anonymous
    request:
      method: GET
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/memories'
      headers:
        authorization: 'Bearer khong-phai-token-that'
  - id: basic_scheme_widget
    as: anonymous
    request:
      method: GET
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/widget'
      headers:
        authorization: 'Basic {{token.owner}}'
  - id: actor_headers_ignored_checkin
    as: anonymous
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/checkins'
      headers:
        x-actor-id: '{{persona.owner}}'
        x-actor-roles: 'member'
        content-type: 'application/json'
      body_raw: '{"place_id":"p-quan-oc-di-be"}'
  - id: anonymous_malformed_json_comment
    as: anonymous
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/memories/bbbbbbbb-cccc-4ddd-8eee-ffffffffffff/comments'
      headers:
        content-type: 'application/json'
      body_raw: '{"body": '
  - id: anonymous_non_uuid_reaction
    as: anonymous
    request:
      method: POST
      path: '/contexts/khong-phai-uuid/memories/khong-phai-uuid/reactions'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm kỷ niệm prod (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  - id: mate_posts_photo_empty_roles_header
    as: mate
    request:
      method: POST
      path: '/contexts/{{ctx}}/memories'
      headers:
        x-actor-roles: ''
        content-type: 'application/json'
      body_raw: '{"image_url":"/contexts/{{ctx}}/photos/cccccccc-dddd-4eee-8fff-aaaaaaaaaaaa","caption":"Ảnh qua phiên (dữ liệu mẫu)"}'
    bind:
      photo: {from: body, pointer: /id, class: uuid}
  - id: owner_checks_in
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/checkins'
      headers:
        content-type: 'application/json'
      body_raw: '{"place_id":"p-quan-oc-di-be"}'
  - id: stranger_reads_wall_claiming_owner
    as: stranger
    request:
      method: GET
      path: '/contexts/{{ctx}}/memories'
      headers:
        x-actor-id: '{{persona.owner}}'
        x-actor-contexts: '{{ctx}}'
  - id: owner_hearts_photo
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/memories/{{photo}}/reactions'
  - id: owner_hearts_photo_again
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/memories/{{photo}}/reactions'
  - id: mate_comments
    as: mate
    request:
      method: POST
      path: '/contexts/{{ctx}}/memories/{{photo}}/comments'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"Qua phiên (dữ liệu mẫu)"}'
  - id: owner_reads_comments
    as: owner
    request:
      method: GET
      path: '/contexts/{{ctx}}/memories/{{photo}}/comments'
  - id: owner_widget
    as: owner
    request:
      method: GET
      path: '/contexts/{{ctx}}/widget'
  - id: mate_reads_wall
    as: mate
    request:
      method: GET
      path: '/contexts/{{ctx}}/memories'
  - id: idem_first
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/memories/{{photo}}/comments'
      headers:
        idempotency-key: 'w3-prod-m'
        content-type: 'application/json'
      body_raw: '{"body":"Một lần thôi (dữ liệu mẫu)"}'
  - id: idem_replay
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/memories/{{photo}}/comments'
      headers:
        idempotency-key: 'w3-prod-m'
        content-type: 'application/json'
      body_raw: '{"body":"Một lần thôi (dữ liệu mẫu)"}'
  # the key scope is the bearer digest, so the stranger's request runs and is refused
  - id: stranger_same_key
    as: stranger
    request:
      method: POST
      path: '/contexts/{{ctx}}/memories/{{photo}}/comments'
      headers:
        idempotency-key: 'w3-prod-m'
        content-type: 'application/json'
      body_raw: '{"body":"Một lần thôi (dữ liệu mẫu)"}'
  - id: owner_takes_back_heart
    as: owner
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/memories/{{photo}}/reactions'
  - id: mate_deletes_account
    as: mate
    request:
      method: DELETE
      path: '/people/me'
      headers:
        content-type: 'application/json'
      body_raw: '{"confirm":true}'
  - id: mate_after_deletion
    as: mate
    request:
      method: GET
      path: '/contexts/{{ctx}}/widget'
  - id: owner_revokes_session
    as: owner
    request:
      method: DELETE
      path: '/sessions/current'
  - id: owner_after_revoke
    as: owner
    request:
      method: GET
      path: '/contexts/{{ctx}}/memories'
