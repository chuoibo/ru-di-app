# W3 · GET /contexts/{id}/memories/{memory_id}/comments — oldest first.
# Order: actor, both path ids, role + ACTIVE membership, memory in this group
# (404). Names are read from people per comment at call time.
id: w3/memories/get-contexts-context_id-memories-memory_id-comments
routes: ['GET /contexts/{context_id}/memories/{memory_id}/comments']
auth_mode: dev
personas:
  owner: {}
  mate: {}
  invitee: {}
  leaver: {}
  stranger: {}
steps:
  - id: anonymous_unknown
    as: anonymous
    request:
      method: GET
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/memories/bbbbbbbb-cccc-4ddd-8eee-ffffffffffff/comments'
  - id: anonymous_non_uuid_both
    as: anonymous
    request:
      method: GET
      path: '/contexts/khong-phai-uuid/memories/khong-phai-uuid/comments'
  - id: roles_unknown_non_uuid_both
    as: stranger
    request:
      method: GET
      path: '/contexts/khong-phai-uuid/memories/khong-phai-uuid/comments'
      headers:
        x-actor-roles: 'member,thu-quy'
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ nhóm (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn cùng nhóm (dữ liệu mẫu)"}'
  - id: register_invitee
    as: invitee
    request:
      method: PUT
      path: '/people/{{persona.invitee}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người được mời (dữ liệu mẫu)"}'
  - id: register_leaver
    as: leaver
    request:
      method: PUT
      path: '/people/{{persona.leaver}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người sẽ rời nhóm (dữ liệu mẫu)"}'
  - id: register_stranger
    as: stranger
    request:
      method: PUT
      path: '/people/{{persona.stranger}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người lạ (dữ liệu mẫu)"}'
  - id: stranger_non_uuid_both
    as: stranger
    request:
      method: GET
      path: '/contexts/khong-phai-uuid/memories/khong-phai-uuid/comments'
  - id: stranger_unknown_both
    as: stranger
    request:
      method: GET
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/memories/bbbbbbbb-cccc-4ddd-8eee-ffffffffffff/comments'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm kỷ niệm (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  - id: owner_creates_other_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm khác (dữ liệu mẫu)"}'
    bind:
      ctx_b: {from: body, pointer: /id, class: uuid}
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  - id: owner_invites_invitee
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.invitee}}"}'
  - id: owner_invites_leaver
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.leaver}}"}'
    bind:
      m_leaver: {from: body, pointer: /id, class: uuid}
  - id: leaver_accepts
    as: leaver
    request:
      method: POST
      path: '/memberships/{{m_leaver}}/accept'
  - id: owner_posts_photo
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/memories'
      headers:
        content-type: 'application/json'
      body_raw: '{"image_url":"/contexts/{{ctx}}/photos/cccccccc-dddd-4eee-8fff-aaaaaaaaaaaa"}'
    bind:
      photo: {from: body, pointer: /id, class: uuid}
  - id: owner_posts_second_photo
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/memories'
      headers:
        content-type: 'application/json'
      body_raw: '{"image_url":"/contexts/{{ctx}}/photos/cccccccc-dddd-4eee-8fff-aaaaaaaaaaaa"}'
    bind:
      photo_two: {from: body, pointer: /id, class: uuid}
  - id: owner_posts_in_other_group
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx_b}}/memories'
      headers:
        content-type: 'application/json'
      body_raw: '{"image_url":"/contexts/{{ctx_b}}/photos/cccccccc-dddd-4eee-8fff-aaaaaaaaaaaa"}'
    bind:
      photo_b: {from: body, pointer: /id, class: uuid}
  - id: owner_no_comments_yet
    as: owner
    request:
      method: GET
      path: '/contexts/{{ctx}}/memories/{{photo}}/comments'
  - id: mate_comments
    as: mate
    request:
      method: POST
      path: '/contexts/{{ctx}}/memories/{{photo}}/comments'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"Một (dữ liệu mẫu)"}'
  - id: leaver_comments
    as: leaver
    request:
      method: POST
      path: '/contexts/{{ctx}}/memories/{{photo}}/comments'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"Hai (dữ liệu mẫu)"}'
  - id: owner_comments
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/memories/{{photo}}/comments'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"Ba (dữ liệu mẫu)"}'
  - id: mate_comments_second_photo
    as: mate
    request:
      method: POST
      path: '/contexts/{{ctx}}/memories/{{photo_two}}/comments'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"Ảnh khác (dữ liệu mẫu)"}'
  - id: owner_comments_in_other_group
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx_b}}/memories/{{photo_b}}/comments'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"Nhóm khác (dữ liệu mẫu)"}'
  - id: mate_reads
    as: mate
    request:
      method: GET
      path: '/contexts/{{ctx}}/memories/{{photo}}/comments'
  - id: owner_reads_second_photo
    as: owner
    request:
      method: GET
      path: '/contexts/{{ctx}}/memories/{{photo_two}}/comments'
  - id: stranger_real_memory
    as: stranger
    request:
      method: GET
      path: '/contexts/{{ctx}}/memories/{{photo}}/comments'
  - id: stranger_claims_context_header
    as: stranger
    request:
      method: GET
      path: '/contexts/{{ctx}}/memories/{{photo}}/comments'
      headers:
        x-actor-contexts: '{{ctx}}'
  - id: invitee_reads
    as: invitee
    request:
      method: GET
      path: '/contexts/{{ctx}}/memories/{{photo}}/comments'
  - id: mate_unknown_memory
    as: mate
    request:
      method: GET
      path: '/contexts/{{ctx}}/memories/bbbbbbbb-cccc-4ddd-8eee-ffffffffffff/comments'
  - id: mate_other_groups_memory_via_this_context
    as: mate
    request:
      method: GET
      path: '/contexts/{{ctx}}/memories/{{photo_b}}/comments'
  - id: mate_roles_empty
    as: mate
    request:
      method: GET
      path: '/contexts/{{ctx}}/memories/{{photo}}/comments'
      headers:
        x-actor-roles: ''
  - id: mate_roles_group_admin_only
    as: mate
    request:
      method: GET
      path: '/contexts/{{ctx}}/memories/{{photo}}/comments'
      headers:
        x-actor-roles: 'group_admin'
  - id: leaver_leaves
    as: leaver
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.leaver}}'
  - id: leaver_reads_after_leaving
    as: leaver
    request:
      method: GET
      path: '/contexts/{{ctx}}/memories/{{photo}}/comments'
  - id: owner_reads_after_leaver_left
    as: owner
    request:
      method: GET
      path: '/contexts/{{ctx}}/memories/{{photo}}/comments'
  - id: mate_renames_self
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn cùng nhóm đổi tên (dữ liệu mẫu)"}'
  - id: owner_reads_after_rename
    as: owner
    request:
      method: GET
      path: '/contexts/{{ctx}}/memories/{{photo}}/comments'
  - id: mate_deletes_account
    as: mate
    request:
      method: DELETE
      path: '/people/me'
      headers:
        content-type: 'application/json'
      body_raw: '{"confirm":true}'
  - id: owner_reads_after_author_deleted
    as: owner
    request:
      method: GET
      path: '/contexts/{{ctx}}/memories/{{photo}}/comments'
  - id: undeclared_query_ignored
    as: owner
    request:
      method: GET
      path: '/contexts/{{ctx}}/memories/{{photo}}/comments?limit=1'
  - id: trailing_slash_redirects
    as: owner
    request:
      method: GET
      path: '/contexts/{{ctx}}/memories/{{photo}}/comments/'
  - id: delete_not_allowed
    as: owner
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/memories/{{photo}}/comments'
