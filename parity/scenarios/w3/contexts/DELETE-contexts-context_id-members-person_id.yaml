# W3 · DELETE /contexts/{id}/members/{person_id} — leave a group; 204, no body.
# Order: idempotency key shape, actor, both path ids, role, ACTIVE membership,
# is_self (nobody removes somebody else, an admin included), then a pair is
# 409 not_a_group. The row becomes LEFT with left_at; nothing is deleted.
id: w3/contexts/delete-contexts-context_id-members-person_id
routes: ['DELETE /contexts/{context_id}/members/{person_id}']
auth_mode: dev
personas:
  owner: {}
  mate: {}
  second: {}
  invitee: {}
  ghost: {}
  stranger: {}
steps:
  - id: anonymous_unknown
    as: anonymous
    request:
      method: DELETE
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/members/bbbbbbbb-cccc-4ddd-8eee-ffffffffffff'
  - id: anonymous_non_uuid_both
    as: anonymous
    request:
      method: DELETE
      path: '/contexts/khong-phai-uuid/members/khong-phai-uuid'
  - id: anonymous_empty_idempotency_key
    as: anonymous
    request:
      method: DELETE
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/members/bbbbbbbb-cccc-4ddd-8eee-ffffffffffff'
      headers:
        idempotency-key: ''
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ nhóm (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn cùng nhóm (dữ liệu mẫu)"}'
  - id: register_second
    as: second
    request:
      method: PUT
      path: '/people/{{persona.second}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Thành viên thứ hai (dữ liệu mẫu)"}'
  - id: register_invitee
    as: invitee
    request:
      method: PUT
      path: '/people/{{persona.invitee}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người được mời (dữ liệu mẫu)"}'
  - id: register_ghost
    as: ghost
    request:
      method: PUT
      path: '/people/{{persona.ghost}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người sẽ xoá tài khoản (dữ liệu mẫu)"}'
  - id: register_stranger
    as: stranger
    request:
      method: PUT
      path: '/people/{{persona.stranger}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người lạ (dữ liệu mẫu)"}'
  # two path errors arrive in one 422 list
  - id: stranger_non_uuid_both
    as: stranger
    request:
      method: DELETE
      path: '/contexts/khong-phai-uuid/members/khong-phai-uuid'
  - id: stranger_non_uuid_person
    as: stranger
    request:
      method: DELETE
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/members/khong-phai-uuid'
  - id: stranger_unknown_context_self
    as: stranger
    request:
      method: DELETE
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/members/{{persona.stranger}}'
  - id: stranger_roles_empty_unknown_context
    as: stranger
    request:
      method: DELETE
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/members/{{persona.stranger}}'
      headers:
        x-actor-roles: ''
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm rời đi (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  - id: owner_invites_second
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.second}}"}'
    bind:
      m_second: {from: body, pointer: /id, class: uuid}
  - id: second_accepts
    as: second
    request:
      method: POST
      path: '/memberships/{{m_second}}/accept'
  - id: owner_invites_invitee
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.invitee}}"}'
  - id: owner_invites_ghost
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.ghost}}"}'
    bind:
      m_ghost: {from: body, pointer: /id, class: uuid}
  - id: ghost_accepts
    as: ghost
    request:
      method: POST
      path: '/memberships/{{m_ghost}}/accept'
  - id: stranger_real_context_self
    as: stranger
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.stranger}}'
  - id: stranger_removes_mate
    as: stranger
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.mate}}'
  # an admin cannot remove anybody either: 403 is_self
  - id: owner_removes_mate
    as: owner
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.mate}}'
  # an invitation cannot be declined through this door
  - id: invitee_declines_by_leaving
    as: invitee
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.invitee}}'
  - id: mate_roles_empty_leaves
    as: mate
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.mate}}'
      headers:
        x-actor-roles: ''
  - id: mate_removes_unknown_person
    as: mate
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee'
  - id: mate_leaves_with_ignored_body
    as: mate
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.owner}}"}'
  - id: mate_leaves_again
    as: mate
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.mate}}'
  - id: mate_reads_members_after_leaving
    as: mate
    request:
      method: GET
      path: '/contexts/{{ctx}}/members'
  - id: owner_reads_members_after_mate_left
    as: owner
    request:
      method: GET
      path: '/contexts/{{ctx}}/members'
  - id: owner_reinvites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate_again: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts_again
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate_again}}/accept'
  - id: mate_roles_group_admin_only_leaves
    as: mate
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.mate}}'
      headers:
        x-actor-roles: 'group_admin'
  - id: ghost_deletes_account
    as: ghost
    request:
      method: DELETE
      path: '/people/me'
      headers:
        content-type: 'application/json'
      body_raw: '{"confirm":true}'
  - id: ghost_leaves_after_deletion
    as: ghost
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.ghost}}'
  # nothing keeps the last admin in the group
  - id: owner_leaves
    as: owner
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.owner}}'
  - id: second_invites_after_admin_left
    as: second
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.stranger}}"}'
  - id: second_reads_members
    as: second
    request:
      method: GET
      path: '/contexts/{{ctx}}/members'
  - id: second_asks_mate_to_be_friends
    as: second
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.mate}}"}'
    bind:
      friend_request: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts_friendship
    as: mate
    request:
      method: POST
      path: '/friends/requests/{{friend_request}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: second_opens_pair_with_mate
    as: second
    request:
      method: POST
      path: '/people/{{persona.mate}}/dm'
    bind:
      pair: {from: body, pointer: /id, class: uuid}
  - id: second_leaves_pair
    as: second
    request:
      method: DELETE
      path: '/contexts/{{pair}}/members/{{persona.second}}'
  - id: mate_removes_second_from_pair
    as: mate
    request:
      method: DELETE
      path: '/contexts/{{pair}}/members/{{persona.second}}'
  # idempotency; a replayed 204 carries content-length: 0 from the middleware
  - id: second_as_group_admin_invites_mate
    as: second
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        x-actor-roles: 'member,group_admin'
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate_third: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts_third_time
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate_third}}/accept'
  - id: idem_first
    as: mate
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.mate}}'
      headers:
        idempotency-key: 'w3-leave-a'
  - id: idem_replay
    as: mate
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.mate}}'
      headers:
        idempotency-key: 'w3-leave-a'
  - id: idem_reuse_other_path
    as: mate
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.second}}'
      headers:
        idempotency-key: 'w3-leave-a'
  # a 409 is not stored and releases the key
  - id: idem_refusal_not_stored
    as: second
    request:
      method: DELETE
      path: '/contexts/{{pair}}/members/{{persona.second}}'
      headers:
        idempotency-key: 'w3-leave-b'
  - id: idem_same_key_after_refusal
    as: second
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.second}}'
      headers:
        idempotency-key: 'w3-leave-b'
  - id: idem_key_too_long
    as: second
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.second}}'
      headers:
        idempotency-key: 'kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk'
  - id: trailing_slash_redirects
    as: second
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.second}}/'
  - id: get_not_allowed
    as: second
    request:
      method: GET
      path: '/contexts/{{ctx}}/members/{{persona.second}}'
