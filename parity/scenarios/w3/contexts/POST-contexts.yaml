# W3 · POST /contexts — create a group; the creator becomes its ACTIVE admin.
# Refusal order: idempotency key shape, JSON decode, actor, body model, role,
# then the actor must be a registered person (409). The name is stored as
# sent: no strip on create, unlike PATCH.
id: w3/contexts/post-contexts
routes: ['POST /contexts']
auth_mode: dev
personas:
  owner: {}
  mate: {}
  late: {}
  ghost: {}
  stranger: {}
steps:
  - id: anonymous_creates
    as: anonymous
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm mới (dữ liệu mẫu)"}'
  # FastAPI decodes a JSON body before resolving dependencies: 422 beats 401
  - id: anonymous_malformed_json
    as: anonymous
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name": '
  # the idempotency middleware answers before routing and before the actor
  - id: anonymous_empty_idempotency_key
    as: anonymous
    request:
      method: POST
      path: '/contexts'
      headers:
        idempotency-key: ''
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm mới (dữ liệu mẫu)"}'
  # get_actor raises before body validation errors are reported: 401
  - id: anonymous_invalid_body
    as: anonymous
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{}'
  - id: actor_id_not_uuid
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        x-actor-id: 'khong-phai-uuid'
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm mới (dữ liệu mẫu)"}'
  - id: roles_unknown
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        x-actor-roles: 'member,thu-quy'
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm mới (dữ liệu mẫu)"}'
  - id: contexts_header_not_uuid
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        x-actor-contexts: 'khong-phai-uuid'
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm mới (dữ liệu mẫu)"}'
  # nobody wrote a people row for this id yet: 409 person_not_registered
  - id: unregistered_creates
    as: stranger
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm mới (dữ liệu mẫu)"}'
  # the role check runs before the registration check
  - id: unregistered_roles_empty
    as: stranger
    request:
      method: POST
      path: '/contexts'
      headers:
        x-actor-roles: ''
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm mới (dữ liệu mẫu)"}'
  - id: unregistered_invalid_body
    as: stranger
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":""}'
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ nhóm (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn cùng nhóm (dữ liệu mẫu)"}'
  - id: register_ghost
    as: ghost
    request:
      method: PUT
      path: '/people/{{persona.ghost}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người sẽ xoá tài khoản (dữ liệu mẫu)"}'
  - id: owner_creates
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm đi Đà Lạt (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  # the creator's membership is admin, ACTIVE, joined in the same transaction
  - id: owner_reads_members
    as: owner
    request:
      method: GET
      path: '/contexts/{{ctx}}/members'
  - id: owner_reads_context
    as: owner
    request:
      method: GET
      path: '/contexts/{{ctx}}'
  # names are not unique
  - id: owner_creates_same_name_again
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm đi Đà Lạt (dữ liệu mẫu)"}'
  - id: owner_roles_empty
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        x-actor-roles: ''
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm mới (dữ liệu mẫu)"}'
  - id: owner_roles_advancer_only
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        x-actor-roles: 'advancer'
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm mới (dữ liệu mẫu)"}'
  - id: owner_roles_group_admin_only
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        x-actor-roles: 'group_admin'
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm mới (dữ liệu mẫu)"}'
  - id: name_with_spaces_kept
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"  Nhóm có khoảng trắng (dữ liệu mẫu)  "}'
  # PATCH refuses a blank name; create accepts one
  - id: name_only_spaces
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"   "}'
  - id: name_empty
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":""}'
  # lengths count code points: 200 three-byte letters pass, 201 do not
  - id: name_200_letters
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"ạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạ"}'
  - id: name_201_letters
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"ạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạạ"}'
  - id: name_number
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":7}'
  - id: name_null
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":null}'
  - id: missing_name
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{}'
  - id: extra_field_theme
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm có theme (dữ liệu mẫu)","theme":"bien-dem"}'
  - id: extra_field_kind
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm đôi (dữ liệu mẫu)","kind":"pair"}'
  - id: top_level_array
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '[]'
  # no content-type: FastAPI still parses the body as JSON
  - id: no_content_type
    as: owner
    request:
      method: POST
      path: '/contexts'
      body_raw: '{"display_name":"Nhóm mới (dữ liệu mẫu)"}'
  - id: text_plain_content_type
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'text/plain'
      body_raw: '{"display_name":"Nhóm mới (dữ liệu mẫu)"}'
  - id: ghost_creates_before_deletion
    as: ghost
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm mới (dữ liệu mẫu)"}'
  - id: ghost_deletes_account
    as: ghost
    request:
      method: DELETE
      path: '/people/me'
      headers:
        content-type: 'application/json'
      body_raw: '{"confirm":true}'
  # dev trusts the header and the anonymised people row still exists
  - id: ghost_creates_after_deletion
    as: ghost
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm mới (dữ liệu mẫu)"}'
  # idempotency
  - id: idem_first
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        idempotency-key: 'w3-ctx-a'
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm mới (dữ liệu mẫu)"}'
  - id: idem_replay
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        idempotency-key: 'w3-ctx-a'
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm mới (dữ liệu mẫu)"}'
  - id: idem_replay_reordered_spaces
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        idempotency-key: 'w3-ctx-a'
        content-type: 'application/json'
      body_raw: '{ "display_name" : "Nhóm mới (dữ liệu mẫu)" }'
  - id: idem_reuse_different_body
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        idempotency-key: 'w3-ctx-a'
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm khác (dữ liệu mẫu)"}'
  # the key scope is the raw X-Actor-ID, so another actor writes for real
  - id: idem_same_key_other_actor
    as: mate
    request:
      method: POST
      path: '/contexts'
      headers:
        idempotency-key: 'w3-ctx-a'
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm mới (dữ liệu mẫu)"}'
  # a 409 is not stored and releases the key
  - id: idem_refusal_not_stored
    as: late
    request:
      method: POST
      path: '/contexts'
      headers:
        idempotency-key: 'w3-ctx-b'
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm mới (dữ liệu mẫu)"}'
  - id: register_late
    as: late
    request:
      method: PUT
      path: '/people/{{persona.late}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người đến sau (dữ liệu mẫu)"}'
  - id: idem_same_key_after_refusal
    as: late
    request:
      method: POST
      path: '/contexts'
      headers:
        idempotency-key: 'w3-ctx-b'
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm mới (dữ liệu mẫu)"}'
  - id: idem_validation_refusal_not_stored
    as: late
    request:
      method: POST
      path: '/contexts'
      headers:
        idempotency-key: 'w3-ctx-c'
        content-type: 'application/json'
      body_raw: '{"display_name":""}'
  - id: idem_same_key_after_validation_refusal
    as: late
    request:
      method: POST
      path: '/contexts'
      headers:
        idempotency-key: 'w3-ctx-c'
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm mới (dữ liệu mẫu)"}'
  - id: idem_key_too_long
    as: late
    request:
      method: POST
      path: '/contexts'
      headers:
        idempotency-key: 'kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk'
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm mới (dữ liệu mẫu)"}'
  - id: trailing_slash_redirects
    as: owner
    request:
      method: POST
      path: '/contexts/'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm mới (dữ liệu mẫu)"}'
  - id: get_not_allowed
    as: owner
    request:
      method: GET
      path: '/contexts'
  - id: put_not_allowed
    as: owner
    request:
      method: PUT
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm mới (dữ liệu mẫu)"}'
