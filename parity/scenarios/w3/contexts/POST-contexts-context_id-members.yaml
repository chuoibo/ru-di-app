# W3 · POST /contexts/{id}/members — a group admin names a person to invite.
# Refusal order: idempotency key shape, JSON decode, actor, path + body model,
# role (group_admin from this group's roster, or in dev from X-Actor-Roles)
# before ACTIVE membership, then pair 409, unregistered person 409, and an
# open membership 409. Rejoining after leaving is a new row.
id: w3/contexts/post-contexts-context_id-members
routes: ['POST /contexts/{context_id}/members']
auth_mode: dev
personas:
  owner: {}
  mate: {}
  invitee: {}
  leaver: {}
  ghost: {}
  stranger: {}
  late: {}
steps:
  - id: anonymous_unknown_context
    as: anonymous
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
  - id: anonymous_non_uuid_context
    as: anonymous
    request:
      method: POST
      path: '/contexts/khong-phai-uuid/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
  - id: anonymous_malformed_json
    as: anonymous
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id": '
  - id: anonymous_empty_idempotency_key
    as: anonymous
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/members'
      headers:
        idempotency-key: ''
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
  - id: anonymous_invalid_body
    as: anonymous
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"khong-phai-uuid"}'
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ nhóm (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn cùng nhóm (dữ liệu mẫu)"}'
  - id: register_invitee
    as: invitee
    request:
      method: PUT
      path: '/people/{{persona.invitee}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người được mời (dữ liệu mẫu)"}'
  - id: register_leaver
    as: leaver
    request:
      method: PUT
      path: '/people/{{persona.leaver}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người sẽ rời nhóm (dữ liệu mẫu)"}'
  - id: register_ghost
    as: ghost
    request:
      method: PUT
      path: '/people/{{persona.ghost}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người sẽ xoá tài khoản (dữ liệu mẫu)"}'
  - id: register_stranger
    as: stranger
    request:
      method: PUT
      path: '/people/{{persona.stranger}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người lạ (dữ liệu mẫu)"}'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm mời người (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  # the role is checked before membership: a plain member is refused by role
  - id: stranger_unknown_context
    as: stranger
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
  - id: stranger_as_group_admin_unknown_context
    as: stranger
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/members'
      headers:
        x-actor-roles: 'member,group_admin'
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
  - id: stranger_as_group_admin_real_context
    as: stranger
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        x-actor-roles: 'member,group_admin'
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
  - id: stranger_non_uuid_context
    as: stranger
    request:
      method: POST
      path: '/contexts/khong-phai-uuid/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
  - id: stranger_unknown_context_bad_body
    as: stranger
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"khong-phai-uuid"}'
  # path and body errors arrive in one 422 list, path first
  - id: stranger_non_uuid_and_bad_body
    as: stranger
    request:
      method: POST
      path: '/contexts/khong-phai-uuid/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"khong-phai-uuid"}'
  - id: owner_invites_unregistered
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"cccccccc-dddd-4eee-8fff-aaaaaaaaaaaa"}'
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  # an INVITED row is open: uq_memberships_open_per_person answers 409
  - id: owner_invites_mate_again
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  - id: owner_invites_mate_while_active
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
  - id: owner_invites_self
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.owner}}"}'
  - id: mate_invites_invitee
    as: mate
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.invitee}}"}'
  # dev only: a group_admin role in the header is enough for any ACTIVE member
  - id: mate_as_group_admin_invites_invitee
    as: mate
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        x-actor-roles: 'member,group_admin'
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.invitee}}"}'
    bind:
      m_invitee: {from: body, pointer: /id, class: uuid}
  - id: invitee_as_group_admin_invites_leaver
    as: invitee
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        x-actor-roles: 'member,group_admin'
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.leaver}}"}'
  # the roster makes the creator group_admin even with an empty roles header
  - id: owner_roles_empty_invites_leaver
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        x-actor-roles: ''
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.leaver}}"}'
    bind:
      m_leaver: {from: body, pointer: /id, class: uuid}
  - id: leaver_accepts
    as: leaver
    request:
      method: POST
      path: '/memberships/{{m_leaver}}/accept'
  - id: leaver_leaves
    as: leaver
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.leaver}}'
  - id: leaver_as_group_admin_invites_stranger
    as: leaver
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        x-actor-roles: 'member,group_admin'
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.stranger}}"}'
  - id: owner_reinvites_leaver
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.leaver}}"}'
  - id: owner_reads_members
    as: owner
    request:
      method: GET
      path: '/contexts/{{ctx}}/members'
  - id: ghost_deletes_account
    as: ghost
    request:
      method: DELETE
      path: '/people/me'
      headers:
        content-type: 'application/json'
      body_raw: '{"confirm":true}'
  # the anonymised people row still exists, so the invitation is written
  - id: owner_invites_deleted_person
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.ghost}}"}'
  - id: owner_invites_uppercase_unregistered
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"CCCCCCCC-DDDD-4EEE-8FFF-AAAAAAAAAAAA"}'
  - id: person_id_missing
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{}'
  - id: person_id_null
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":null}'
  - id: person_id_number
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":7}'
  - id: extra_field_role
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.stranger}}","role":"admin"}'
  - id: top_level_array
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '[]'
  - id: owner_asks_mate_to_be_friends
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.mate}}"}'
    bind:
      friend_request: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts_friendship
    as: mate
    request:
      method: POST
      path: '/friends/requests/{{friend_request}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: owner_opens_pair_with_mate
    as: owner
    request:
      method: POST
      path: '/people/{{persona.mate}}/dm'
    bind:
      pair: {from: body, pointer: /id, class: uuid}
  # a pair membership has role member, so the role check refuses first
  - id: owner_invites_into_pair
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.stranger}}"}'
  - id: owner_as_group_admin_invites_into_pair
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/members'
      headers:
        x-actor-roles: 'member,group_admin'
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.stranger}}"}'
  - id: owner_as_group_admin_invites_unregistered_into_pair
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/members'
      headers:
        x-actor-roles: 'member,group_admin'
        content-type: 'application/json'
      body_raw: '{"person_id":"cccccccc-dddd-4eee-8fff-aaaaaaaaaaaa"}'
  # idempotency
  - id: idem_first
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        idempotency-key: 'w3-invite-a'
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.stranger}}"}'
  - id: idem_replay
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        idempotency-key: 'w3-invite-a'
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.stranger}}"}'
  - id: idem_reuse_different_body
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        idempotency-key: 'w3-invite-a'
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
  - id: idem_reuse_other_context
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/members'
      headers:
        idempotency-key: 'w3-invite-a'
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.stranger}}"}'
  # a 409 is not stored and releases the key
  - id: idem_refusal_not_stored
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        idempotency-key: 'w3-invite-b'
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.late}}"}'
  - id: register_late
    as: late
    request:
      method: PUT
      path: '/people/{{persona.late}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người đến sau (dữ liệu mẫu)"}'
  - id: idem_same_key_after_refusal
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        idempotency-key: 'w3-invite-b'
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.late}}"}'
  - id: idem_key_too_long
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        idempotency-key: 'kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk'
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.late}}"}'
  - id: trailing_slash_redirects
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members/'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.late}}"}'
  - id: put_not_allowed
    as: owner
    request:
      method: PUT
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.late}}"}'
