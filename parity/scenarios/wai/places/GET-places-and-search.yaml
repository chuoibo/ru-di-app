# WAI · the catalogue and one card off it.
#
#   GET  /places              mixed: scored rows, then optional model reasons
#   GET  /places/{place_id}   mixed: one card, `match` only for a session
#
# POST /places/search used to share this file. ADR-0051 moved its model call
# into the Go core and deleted the Python side, so there is nothing left to
# compare it with; its steps went with it (the Go evidence:
# internal/routes/places_search_shortlist_postgres_test.go). The two paths
# below that only look like the search -- a GET on it, with and without a
# trailing slash -- stay: they are answered by the GET routes.
#
# WHAT THIS FILE PROVES, and what it cannot:
#
# The parity stacks run with NO model, so the reasons take their unavailable
# branch -- not an error but a shaped answer: the two GETs return the full
# catalogue with every card in the server's own words. Both sides are
# deterministic there, so parity compares them exactly. Since ADR-0051 the
# Python side has no model path at all, so this is also the only branch it
# has.
#
# What no parity run can reach is the branch where a real model answered;
# internal/aiharness/timquan and TestPlacesBrowseAsksTheModelAboutTheTopRowsOnly
# are its evidence.
#
# `match` is the other half worth pinning: signed out it is null, because a
# match percentage is a statement about particular people and an anonymous
# reader is nobody. Same row, two readers, two answers -- a port that computed
# the card once and served it to everybody passes every anonymous test.
id: wai/places/get-places-and-search
routes:
  - 'GET /places'
  - 'GET /places/{place_id}'
auth_mode: dev
personas:
  reader: {}
steps:
  - id: register_reader
    as: reader
    request:
      method: PUT
      path: '/people/{{persona.reader}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người đọc (dữ liệu mẫu)"}'

  # --- the catalogue ------------------------------------------------------
  - id: catalogue_anonymous
    as: anonymous
    request:
      method: GET
      path: '/places'

  - id: catalogue_with_session
    as: reader
    request:
      method: GET
      path: '/places'

  - id: catalogue_by_destination
    as: anonymous
    request:
      method: GET
      path: '/places?destination=d-da-lat'

  - id: catalogue_other_destination
    as: anonymous
    request:
      method: GET
      path: '/places?destination=d-tphcm'

  - id: catalogue_unknown_destination
    as: anonymous
    request:
      method: GET
      path: '/places?destination=khong-co-noi-nay'

  - id: catalogue_by_category
    as: anonymous
    request:
      method: GET
      path: '/places?category=cafe'

  - id: catalogue_category_nobody_used
    as: anonymous
    request:
      method: GET
      path: '/places?category=khong-ai-dung-loai-nay'

  - id: catalogue_free_text
    as: anonymous
    request:
      method: GET
      path: '/places?q=cafe'

  - id: catalogue_free_text_no_match
    as: anonymous
    request:
      method: GET
      path: '/places?q=khong-tim-thay-gi-het'

  # `context_id` is accepted and not yet used; it must still validate.
  - id: catalogue_with_context_id
    as: reader
    request:
      method: GET
      path: '/places?context_id=abcdefab-cdef-4abc-8def-abcdefabcdef'

  - id: catalogue_context_id_not_uuid
    as: reader
    request:
      method: GET
      path: '/places?context_id=khong-phai-uuid'

  - id: catalogue_every_filter_at_once
    as: reader
    request:
      method: GET
      path: '/places?destination=d-da-lat&category=cafe&q=vintage'

  - id: catalogue_empty_query_values
    as: anonymous
    request:
      method: GET
      path: '/places?destination=&category=&q='

  # --- one card -----------------------------------------------------------
  # Signed out the card carries `match: null`; with a session it carries a
  # score. Two readers, one row.
  - id: card_anonymous
    as: anonymous
    request:
      method: GET
      path: '/places/p-an-cafe-da-lat'

  - id: card_with_session
    as: reader
    request:
      method: GET
      path: '/places/p-an-cafe-da-lat'

  - id: card_unknown_place
    as: anonymous
    request:
      method: GET
      path: '/places/khong-co-dia-diem-nay'

  # `/places/search` has no GET, so Starlette's scan lands it here as a place
  # id and it answers 404 -- the right answer for a path with no GET.
  - id: search_path_as_a_place_id
    as: anonymous
    request:
      method: GET
      path: '/places/search'

  - id: card_trailing_slash
    as: anonymous
    request:
      method: GET
      path: '/places/p-an-cafe-da-lat/'

  # --- framework shapes ---------------------------------------------------
  - id: catalogue_post_not_allowed
    as: reader
    request:
      method: POST
      path: '/places'
      headers:
        content-type: 'application/json'
      body_raw: '{}'

  - id: search_get_not_allowed
    as: reader
    request:
      method: GET
      path: '/places/search/'

  - id: catalogue_junk_actor_headers
    as: anonymous
    request:
      method: GET
      path: '/places'
      headers:
        x-actor-id: 'khong-phai-uuid'
        x-actor-roles: 'emperor'
