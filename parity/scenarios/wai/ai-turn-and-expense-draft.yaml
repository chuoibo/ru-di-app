# WAI · expense-draft: lối vào AI cũ còn lại của chat.
#
# Tên file và `id` giữ nguyên để bằng chứng cũ (docs/migration/live-go-25-route-wai.md)
# còn trỏ đúng. Nửa `ai-turn` đã bị xoá cùng route ở cả Go lẫn Python theo
# ADR-0036 §2.1 (AI chỉ chạy khi được gọi tường minh qua hàng đợi lời gọi), nên
# không còn gì để so: cả hai stack cùng trả 404 cho nó.
#
# Không stack nào trong tầng parity được cấp khoá provider, nên cả hai bên đều
# tất định: brain trả thẻ rỗng. Đó chính là thứ đáng so — cùng một hình dạng từ
# chối, cùng một mã, cùng một chỗ dừng trước khi tiêu tiền. Không cần stub:
# thiếu khoá là một câu trả lời, không phải một lỗ hổng đo đạc.
#
# Ghi chú cho người đọc sau: từ 23-09-2026 engine AI nhóm và feed thay đổi
# BẬT MẶC ĐỊNH ở prod, và khi bật thì route này bị `internal/chatassist` niêm
# phong thành `403 explicit_invocation_required` — một đổi hành vi **có chủ ý**
# theo ADR-0031, không phải hồi quy. Tầng parity đặt RÕ
# `MOBILE_CHAT_CHANGES_CANDIDATE=0` trong `scripts/parity_stacks.sh`, nên ở đây
# nó vẫn là cổng cũ và vẫn phải khớp Python. Nghĩa là kịch bản này đo đường
# legacy, KHÔNG đo thứ production đang phục vụ cho route này; đường đó do
# `scripts/chat_e2e_go.sh` đo.
id: wai/ai-turn-and-expense-draft
routes: ['POST /contexts/{context_id}/messages/{message_id}/expense-draft']
auth_mode: dev
personas:
  owner: {}
  member: {}
  stranger: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người mở phòng AI (dữ liệu mẫu)"}'
  - id: register_member
    as: member
    request:
      method: PUT
      path: '/people/{{persona.member}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Thành viên gọi AI (dữ liệu mẫu)"}'
  - id: register_stranger
    as: stranger
    request:
      method: PUT
      path: '/people/{{persona.stranger}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người ngoài gọi AI (dữ liệu mẫu)"}'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Phòng gọi AI (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  - id: owner_invites_member
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.member}}"}'
    bind:
      membership: {from: body, pointer: /id, class: uuid}
  - id: member_accepts
    as: member
    request:
      method: POST
      path: '/memberships/{{membership}}/accept'
  - id: owner_sends_message
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/messages'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"text","body":"Tối qua cả nhóm ăn hết một trăm nghìn"}'
    bind:
      msg: {from: body, pointer: /id, class: uuid}

  # expense-draft
  - id: anonymous_drafts_expense
    as: anonymous
    request:
      method: POST
      path: '/contexts/{{ctx}}/messages/{{msg}}/expense-draft'
      headers:
        content-type: 'application/json'
  - id: stranger_drafts_expense
    as: stranger
    request:
      method: POST
      path: '/contexts/{{ctx}}/messages/{{msg}}/expense-draft'
      headers:
        content-type: 'application/json'
  - id: owner_drafts_expense
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/messages/{{msg}}/expense-draft'
      headers:
        content-type: 'application/json'
  - id: owner_drafts_expense_again
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/messages/{{msg}}/expense-draft'
      headers:
        content-type: 'application/json'
  - id: owner_drafts_expense_unknown_message
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/messages/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/expense-draft'
      headers:
        content-type: 'application/json'
  - id: owner_deletes_message
    as: owner
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/messages/{{msg}}'
  - id: owner_drafts_expense_on_deleted
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/messages/{{msg}}/expense-draft'
      headers:
        content-type: 'application/json'
