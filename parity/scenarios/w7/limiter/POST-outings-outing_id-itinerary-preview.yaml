# W7 limiter lane · POST /outings/{outing_id}/itinerary/preview. The only route of this
# wave with in-memory state: a fixed window of 30 calls a minute per actor id
# (app/api/main.py:151). The check is the FIRST thing the handler does, before the trip
# row is read, so a caller who has spent the window is refused even for a trip that does
# not exist -- which is what lets this file spend the window with nothing set up and no
# rows written. Thirty calls answer 404, the thirty-first is 429, and the window is NOT
# extended by the refusal, so the counter stays where it was. This scenario carries
# `lane: limiter` because the main run and the canary repeat the corpus, and a refusal
# that depends on how many calls came before must not fall on whichever pass met the
# window first. Texts are sample data (dữ liệu mẫu).
id: w7/limiter/post-outings-outing_id-itinerary-preview
routes: ['POST /outings/{outing_id}/itinerary/preview']
auth_mode: dev
lane: limiter
personas:
  owner: {}
  mate: {}
