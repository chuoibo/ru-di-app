      path: '/contexts/{{ctx}}/outings'
      headers:
        content-type: 'application/json'
      body_raw: '{"title":"Chuyến số chuỗi (dữ liệu mẫu)","starts_on":"2026-03-14","ends_on":"2026-03-16","headcount":"4","budget_per_person_vnd":450000}'
  - id: owner_headcount_bool
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/outings'
      headers:
        content-type: 'application/json'
      body_raw: '{"title":"Chuyến số chân trị (dữ liệu mẫu)","starts_on":"2026-03-14","ends_on":"2026-03-16","headcount":true,"budget_per_person_vnd":450000}'
  - id: owner_budget_negative
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/outings'
      headers:
        content-type: 'application/json'
      body_raw: '{"title":"Chuyến âm tiền (dữ liệu mẫu)","starts_on":"2026-03-14","ends_on":"2026-03-16","headcount":4,"budget_per_person_vnd":-1}'
  - id: owner_budget_float
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/outings'
      headers:
        content-type: 'application/json'
      body_raw: '{"title":"Chuyến tiền lẻ (dữ liệu mẫu)","starts_on":"2026-03-14","ends_on":"2026-03-16","headcount":4,"budget_per_person_vnd":450000.5}'
  - id: owner_budget_zero
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/outings'
      headers:
        content-type: 'application/json'
      body_raw: '{"title":"Chuyến không ngân sách (dữ liệu mẫu)","starts_on":"2026-03-20","ends_on":"2026-03-20","headcount":1,"budget_per_person_vnd":0}'
    bind:
      outing_zero: {from: body, pointer: /id, class: uuid}
  - id: owner_extra_field
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/outings'
      headers:
        content-type: 'application/json'
      body_raw: '{"title":"Chuyến thừa khoá (dữ liệu mẫu)","starts_on":"2026-03-14","ends_on":"2026-03-16","headcount":4,"budget_per_person_vnd":450000,"khong_biet":1}'
  # the trips that go in
  - id: owner_creates_trip
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/outings'
      headers:
        content-type: 'application/json'
      body_raw: '{"title":"Đà Lạt ba ngày (dữ liệu mẫu)","starts_on":"2026-03-14","ends_on":"2026-03-16","headcount":4,"budget_per_person_vnd":450000}'
    bind:
      outing: {from: body, pointer: /id, class: uuid}
  - id: owner_creates_one_day_trip
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/outings'
      headers:
        content-type: 'application/json'
      body_raw: '{"title":"Một ngày trong phố (dữ liệu mẫu)","starts_on":"2026-04-02","ends_on":"2026-04-02","headcount":2,"budget_per_person_vnd":180000}'
  - id: owner_title_is_trimmed
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/outings'
      headers:
        content-type: 'application/json'
      body_raw: '{"title":"   Có khoảng trắng hai đầu (dữ liệu mẫu)   ","starts_on":"2026-05-05","ends_on":"2026-05-06","headcount":3,"budget_per_person_vnd":220000}'
  - id: mate_creates_trip
    as: mate
    request:
