    request:
      method: POST
      path: '/contexts/{{ctx}}/outings'
      headers:
        idempotency-key: 'c70f0001-aaaa-4aaa-8aaa-aaaaaaaaaaa1'
        content-type: 'application/json'
      body_raw: '{"title":"Chuyến có khoá (dữ liệu mẫu)","starts_on":"2026-07-10","ends_on":"2026-07-12","headcount":5,"budget_per_person_vnd":520000}'
  - id: owner_same_key_other_body
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/outings'
      headers:
