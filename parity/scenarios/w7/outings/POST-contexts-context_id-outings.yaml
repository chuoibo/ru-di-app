  - id: owner_ends_before_starts
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/outings'
      headers:
        content-type: 'application/json'
      body_raw: '{"title":"Chuyến ngược ngày (dữ liệu mẫu)","starts_on":"2026-03-16","ends_on":"2026-03-14","headcount":4,"budget_per_person_vnd":450000}'
  - id: owner_starts_on_not_a_date
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/outings'
      headers:
        content-type: 'application/json'
      body_raw: '{"title":"Chuyến sai ngày (dữ liệu mẫu)","starts_on":"14-03-2026","ends_on":"2026-03-16","headcount":4,"budget_per_person_vnd":450000}'
  - id: owner_starts_on_datetime
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/outings'
      headers:
        content-type: 'application/json'
      body_raw: '{"title":"Chuyến kèm giờ (dữ liệu mẫu)","starts_on":"2026-03-14T08:00:00Z","ends_on":"2026-03-16","headcount":4,"budget_per_person_vnd":450000}'
  - id: owner_headcount_zero
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/outings'
      headers:
        content-type: 'application/json'
      body_raw: '{"title":"Chuyến không người (dữ liệu mẫu)","starts_on":"2026-03-14","ends_on":"2026-03-16","headcount":0,"budget_per_person_vnd":450000}'
  - id: owner_headcount_over_ceiling
    as: owner
