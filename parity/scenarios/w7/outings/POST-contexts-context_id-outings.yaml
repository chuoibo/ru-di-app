# W7 · POST /contexts/{context_id}/outings: open a trip on a group's calendar (F15).
# Order: idempotency header, actor, path uuid, body model, then one permission whose
# only fact is ACTIVE membership -- so an unknown context and a group the caller is not
# in answer the same 403, and the context is never read. There is no group-kind gate
# here, so a member of a pair opens a trip inside the two-person conversation and gets
# a 201. Dates and money are integers and plain dates; the trip starts with no stops,
# timeline_revision 0, itinerary_version 1 and an empty days list. Texts are sample
# data (dữ liệu mẫu).
id: w7/outings/post-contexts-context_id-outings
routes: ['POST /contexts/{context_id}/outings']
auth_mode: dev
personas:
  owner: {}
  mate: {}
  stranger: {}
steps:
  - id: anonymous_creates
    as: anonymous
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/outings'
      headers:
        content-type: 'application/json'
      body_raw: '{"title":"Chuyến ẩn danh (dữ liệu mẫu)","starts_on":"2026-03-14","ends_on":"2026-03-16","headcount":4,"budget_per_person_vnd":450000}'
  - id: anonymous_non_uuid_context
    as: anonymous
    request:
      method: POST
      path: '/contexts/khong-phai-uuid/outings'
      headers:
        content-type: 'application/json'
      body_raw: '{"title":"Chuyến ẩn danh (dữ liệu mẫu)","starts_on":"2026-03-14","ends_on":"2026-03-16","headcount":4,"budget_per_person_vnd":450000}'
  - id: anonymous_empty_idempotency_key
    as: anonymous
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/outings'
      headers:
        idempotency-key: ''
        content-type: 'application/json'
      body_raw: '{"title":"Chuyến ẩn danh (dữ liệu mẫu)","starts_on":"2026-03-14","ends_on":"2026-03-16","headcount":4,"budget_per_person_vnd":450000}'
  - id: actor_id_not_uuid
    as: owner
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/outings'
      headers:
        x-actor-id: 'khong-phai-uuid'
        content-type: 'application/json'
      body_raw: '{"title":"Chuyến hỏng (dữ liệu mẫu)","starts_on":"2026-03-14","ends_on":"2026-03-16","headcount":4,"budget_per_person_vnd":450000}'
  - id: roles_unknown
    as: owner
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/outings'
      headers:
        x-actor-roles: 'khong-co'
        content-type: 'application/json'
      body_raw: '{"title":"Chuyến hỏng (dữ liệu mẫu)","starts_on":"2026-03-14","ends_on":"2026-03-16","headcount":4,"budget_per_person_vnd":450000}'
  - id: owner_path_not_uuid_with_bad_body
    as: owner
    request:
      method: POST
      path: '/contexts/khong-phai-uuid/outings'
      headers:
        content-type: 'application/json'
      body_raw: '{"title":""}'
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ nhóm (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn đồng hành (dữ liệu mẫu)"}'
  - id: register_stranger
    as: stranger
    request:
      method: PUT
      path: '/people/{{persona.stranger}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người lạ (dữ liệu mẫu)"}'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm đi chơi (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  # an unknown context and a group the caller is not in are the same 403
  - id: owner_creates_on_unknown_context
    as: owner
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/outings'
      headers:
        content-type: 'application/json'
      body_raw: '{"title":"Chuyến không nhóm (dữ liệu mẫu)","starts_on":"2026-03-14","ends_on":"2026-03-16","headcount":4,"budget_per_person_vnd":450000}'
  - id: stranger_creates
    as: stranger
    request:
      method: POST
      path: '/contexts/{{ctx}}/outings'
      headers:
        content-type: 'application/json'
      body_raw: '{"title":"Chuyến người lạ (dữ liệu mẫu)","starts_on":"2026-03-14","ends_on":"2026-03-16","headcount":4,"budget_per_person_vnd":450000}'
  - id: owner_creates_as_guest_role
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/outings'
      headers:
        x-actor-roles: 'guest'
        content-type: 'application/json'
      body_raw: '{"title":"Chuyến vai khách (dữ liệu mẫu)","starts_on":"2026-03-14","ends_on":"2026-03-16","headcount":4,"budget_per_person_vnd":450000}'
  - id: owner_creates_with_empty_roles
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/outings'
      headers:
        x-actor-roles: ''
        content-type: 'application/json'
      body_raw: '{"title":"Chuyến không vai (dữ liệu mẫu)","starts_on":"2026-03-14","ends_on":"2026-03-16","headcount":4,"budget_per_person_vnd":450000}'
  # the body model, refused before any row is read
  - id: owner_body_missing
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/outings'
  - id: owner_body_empty_object
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/outings'
      headers:
        content-type: 'application/json'
