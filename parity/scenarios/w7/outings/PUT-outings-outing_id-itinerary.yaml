        content-type: 'application/json'
      body_raw: '{"expected_revision":0,"stops":[],"days":[]}'
  - id: anonymous_non_uuid_outing
    as: anonymous
    request:
      method: PUT
      path: '/outings/khong-phai-uuid/itinerary'
