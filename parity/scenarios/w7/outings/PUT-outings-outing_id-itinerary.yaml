# W7 · PUT /outings/{outing_id}/itinerary: the v2 plan — stops with ids, days with a
# transport mode, anchors, durations and a meeting point. The header idempotency-key is
# DECLARED on this route, so leaving it out is a body-shaped 422 from FastAPI while an
# empty one is the middleware's own 422. Order after that: actor, path uuid, body model,
# the trip row (404 in Vietnamese here, English on /timeline), ACTIVE membership,
# expected_revision (409, and a different sentence from /timeline's), every day inside
# the trip, anchors inside their day, every stop id known or `tmp-`, every stop's day
# configured, every place in the catalogue, then the write. The save is one unit of work:
# survivors keep their rows and their check-ins, `tmp-` ids become real ones and the
# anchors are rewritten to match. Four shapes are exercised on purpose: a permutation
# that keeps every stop, a save that drops stops, a save that adds one, and a save that
# changes nothing. A replay is re-authorized before the stored body is handed back.
# Texts are sample data (dữ liệu mẫu).
id: w7/outings/put-outings-outing_id-itinerary
routes: ['PUT /outings/{outing_id}/itinerary']
auth_mode: dev
personas:
  owner: {}
  mate: {}
  stranger: {}
steps:
  - id: anonymous_saves
    as: anonymous
    request:
      method: PUT
      path: '/outings/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/itinerary'
      headers:
        idempotency-key: 'c72f0001-aaaa-4aaa-8aaa-aaaaaaaaaaa1'
        content-type: 'application/json'
      body_raw: '{"expected_revision":0,"stops":[],"days":[]}'
  - id: anonymous_without_key
    as: anonymous
    request:
      method: PUT
      path: '/outings/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/itinerary'
