# W7 cross replay · PUT /outings/{outing_id}/itinerary. This route does not let the
# middleware answer a replay on its own: the stored body carries private meeting points,
# so the route re-proves session and membership before handing it back, and the replay
# reaches the handler either way. A 200 stored by one path replays through the other with
# Idempotency-Replayed: true and writes nothing; after the saver leaves the group the
# same replay is refused instead. Go serves none of these routes yet, so both paths reach
# Python. Texts are sample data (dữ liệu mẫu).
id: w7/crossreplay/put-outings-outing_id-itinerary
routes: ['PUT /outings/{outing_id}/itinerary']
auth_mode: dev
personas:
  owner: {}
  mate: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ nhóm (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn đồng hành (dữ liệu mẫu)"}'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm phát lại lịch trình (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  - id: owner_creates_trip
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/outings'
      headers:
        content-type: 'application/json'
      body_raw: '{"title":"Đà Lạt ba ngày (dữ liệu mẫu)","starts_on":"2026-03-14","ends_on":"2026-03-16","headcount":4,"budget_per_person_vnd":450000}'
    bind:
      outing: {from: body, pointer: /id, class: uuid}
  - id: python_saves_itinerary
    as: owner
    via: python
    request:
      method: PUT
      path: '/outings/{{outing}}/itinerary'
      headers:
        idempotency-key: 'c7bf0001-aaaa-4aaa-8aaa-aaaaaaaaaaa1'
        content-type: 'application/json'
      body_raw: '{"expected_revision":0,"stops":[{"id":"tmp-don","at":"07:30","label":"Đón nhau (dữ liệu mẫu)","day":"2026-03-14","meeting_point":{"lat":11.9404,"lng":108.4419,"label":"Cổng chợ (dữ liệu mẫu)"}}],"days":[{"day":"2026-03-14","transport_mode":"motorbike","start_at":"07:00"}]}'
  - id: front_replays_python
    as: owner
    request:
      method: PUT
      path: '/outings/{{outing}}/itinerary'
      headers:
        idempotency-key: 'c7bf0001-aaaa-4aaa-8aaa-aaaaaaaaaaa1'
        content-type: 'application/json'
      body_raw: '{"expected_revision":0,"stops":[{"id":"tmp-don","at":"07:30","label":"Đón nhau (dữ liệu mẫu)","day":"2026-03-14","meeting_point":{"lat":11.9404,"lng":108.4419,"label":"Cổng chợ (dữ liệu mẫu)"}}],"days":[{"day":"2026-03-14","transport_mode":"motorbike","start_at":"07:00"}]}'
  - id: front_saves_itinerary
    as: mate
    request:
      method: PUT
      path: '/outings/{{outing}}/itinerary'
      headers:
        idempotency-key: 'c7bf0002-aaaa-4aaa-8aaa-aaaaaaaaaaa2'
        content-type: 'application/json'
      body_raw: '{"expected_revision":1,"stops":[{"id":"tmp-cafe","at":"08:00","label":"Cà phê sáng (dữ liệu mẫu)","day":"2026-03-14","place_id":"p-lung-chung-cafe"}],"days":[{"day":"2026-03-14","transport_mode":"walk","start_at":"07:30"}]}'
  - id: python_replays_front
    as: mate
    via: python
    request:
      method: PUT
      path: '/outings/{{outing}}/itinerary'
      headers:
        idempotency-key: 'c7bf0002-aaaa-4aaa-8aaa-aaaaaaaaaaa2'
        content-type: 'application/json'
      body_raw: '{"expected_revision":1,"stops":[{"id":"tmp-cafe","at":"08:00","label":"Cà phê sáng (dữ liệu mẫu)","day":"2026-03-14","place_id":"p-lung-chung-cafe"}],"days":[{"day":"2026-03-14","transport_mode":"walk","start_at":"07:30"}]}'
  - id: python_stale_revision_frees_key
    as: owner
    via: python
    request:
      method: PUT
      path: '/outings/{{outing}}/itinerary'
      headers:
        idempotency-key: 'c7bf0003-aaaa-4aaa-8aaa-aaaaaaaaaaa3'
        content-type: 'application/json'
      body_raw: '{"expected_revision":0,"stops":[],"days":[]}'
  - id: front_uses_the_freed_key
    as: owner
    request:
      method: PUT
      path: '/outings/{{outing}}/itinerary'
      headers:
        idempotency-key: 'c7bf0003-aaaa-4aaa-8aaa-aaaaaaaaaaa3'
        content-type: 'application/json'
      body_raw: '{"expected_revision":0,"stops":[],"days":[]}'
  - id: mate_leaves_group
    as: mate
    request:
      method: DELETE
      path: '/contexts/{{ctx}}/members/{{persona.mate}}'
  - id: python_replays_after_leaving
    as: mate
    via: python
    request:
      method: PUT
      path: '/outings/{{outing}}/itinerary'
      headers:
        idempotency-key: 'c7bf0002-aaaa-4aaa-8aaa-aaaaaaaaaaa2'
        content-type: 'application/json'
      body_raw: '{"expected_revision":1,"stops":[{"id":"tmp-cafe","at":"08:00","label":"Cà phê sáng (dữ liệu mẫu)","day":"2026-03-14","place_id":"p-lung-chung-cafe"}],"days":[{"day":"2026-03-14","transport_mode":"walk","start_at":"07:30"}]}'
  - id: front_replays_after_leaving
    as: mate
    request:
      method: PUT
      path: '/outings/{{outing}}/itinerary'
      headers:
        idempotency-key: 'c7bf0002-aaaa-4aaa-8aaa-aaaaaaaaaaa2'
        content-type: 'application/json'
      body_raw: '{"expected_revision":1,"stops":[{"id":"tmp-cafe","at":"08:00","label":"Cà phê sáng (dữ liệu mẫu)","day":"2026-03-14","place_id":"p-lung-chung-cafe"}],"days":[{"day":"2026-03-14","transport_mode":"walk","start_at":"07:30"}]}'
  - id: front_lists_trips
    as: owner
    request:
      method: GET
      path: '/contexts/{{ctx}}/outings'
