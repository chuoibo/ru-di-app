# W7 cross replay · POST /outing-stops/{stop_id}/checkins. A 201 stored by one path
# replays as 201 through the other and writes no second row, so the outing's
# timeline_revision moves once. The 409 of a second arrival frees the key, which is the
# behaviour that keeps a retry honest: the same key then works for a different stop. Go
# serves none of these routes yet, so both paths reach Python. Texts are sample data
# (dữ liệu mẫu).
id: w7/crossreplay/post-outing-stops-stop_id-checkins
routes: ['POST /outing-stops/{stop_id}/checkins']
auth_mode: dev
personas:
  owner: {}
  mate: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ nhóm (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn đồng hành (dữ liệu mẫu)"}'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm phát lại điểm danh (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  - id: owner_invites_mate
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  - id: owner_creates_trip
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/outings'
      headers:
        content-type: 'application/json'
      body_raw: '{"title":"Đà Lạt ba ngày (dữ liệu mẫu)","starts_on":"2026-03-14","ends_on":"2026-03-16","headcount":4,"budget_per_person_vnd":450000}'
    bind:
      outing: {from: body, pointer: /id, class: uuid}
  - id: owner_saves_timeline
    as: owner
    request:
      method: PUT
      path: '/outings/{{outing}}/timeline'
      headers:
        content-type: 'application/json'
      body_raw: '{"stops":[{"at":"07:30","label":"Đón nhau (dữ liệu mẫu)"},{"at":"08:00","label":"Cà phê sáng (dữ liệu mẫu)"}]}'
    bind:
      stop_pickup: {from: body, pointer: /stops/0/id, class: uuid}
      stop_coffee: {from: body, pointer: /stops/1/id, class: uuid}
  - id: python_checks_in
    as: owner
    via: python
    request:
      method: POST
      path: '/outing-stops/{{stop_pickup}}/checkins'
      headers:
        idempotency-key: 'c7cf0001-aaaa-4aaa-8aaa-aaaaaaaaaaa1'
  - id: front_replays_python
    as: owner
    request:
      method: POST
      path: '/outing-stops/{{stop_pickup}}/checkins'
      headers:
        idempotency-key: 'c7cf0001-aaaa-4aaa-8aaa-aaaaaaaaaaa1'
  - id: front_checks_in
    as: mate
    request:
      method: POST
      path: '/outing-stops/{{stop_pickup}}/checkins'
      headers:
        idempotency-key: 'c7cf0002-aaaa-4aaa-8aaa-aaaaaaaaaaa2'
  - id: python_replays_front
    as: mate
    via: python
    request:
      method: POST
      path: '/outing-stops/{{stop_pickup}}/checkins'
      headers:
        idempotency-key: 'c7cf0002-aaaa-4aaa-8aaa-aaaaaaaaaaa2'
  - id: python_second_arrival_frees_key
    as: owner
    via: python
    request:
      method: POST
      path: '/outing-stops/{{stop_pickup}}/checkins'
      headers:
        idempotency-key: 'c7cf0003-aaaa-4aaa-8aaa-aaaaaaaaaaa3'
  - id: front_uses_the_freed_key
    as: owner
    request:
      method: POST
      path: '/outing-stops/{{stop_coffee}}/checkins'
      headers:
        idempotency-key: 'c7cf0003-aaaa-4aaa-8aaa-aaaaaaaaaaa3'
  - id: python_reads_checkins
    as: owner
    via: python
    request:
      method: GET
      path: '/outings/{{outing}}/checkins'
  - id: front_reads_checkins
    as: owner
    request:
      method: GET
      path: '/outings/{{outing}}/checkins'
  - id: front_lists_trips
    as: owner
    request:
      method: GET
      path: '/contexts/{{ctx}}/outings'
