# W8 concurrency · PUT …/notebook/constraints/{kind}. Three writes of one line at once
# queue on the notebook row and read the line after the lock: versions 1, 2 and 3, no
# lost update. Under one header key: one write, two replays. Texts are sample data.
id: w8/concurrency/put-contexts-context_id-notebook-constraints-kind
routes: ['PUT /contexts/{context_id}/notebook/constraints/{kind}']
auth_mode: dev
personas:
  owner: {}
  mate: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người mở sổ (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người kia (dữ liệu mẫu)"}'
  - id: owner_asks_mate_friendship
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.mate}}"}'
    bind:
      fr_owner_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts_owner_friendship
    as: mate
    request:
      method: POST
      path: '/friends/requests/{{fr_owner_mate}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: owner_opens_pair
    as: owner
    request:
      method: POST
      path: '/people/{{persona.mate}}/dm'
    bind:
      pair: {from: body, pointer: /id, class: uuid}
  - id: owner_proposes_lap_so
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
    bind:
      lap_so: {from: body, pointer: /id, class: uuid}
  - id: mate_grants_lap_so
    as: mate
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals/{{lap_so}}/grant'
  - id: owner_puts_three_at_once
    as: owner
    concurrent: 3
    request:
      method: PUT
      path: '/contexts/{{pair}}/notebook/constraints/dung'
      headers:
        content-type: 'application/json'
      body_raw: '{"content":"Đừng hẹn sớm (dữ liệu mẫu)"}'
  - id: owner_same_key_three_at_once
    as: owner
    concurrent: 3
    request:
      method: PUT
      path: '/contexts/{{pair}}/notebook/constraints/khong_an_duoc'
      headers:
        idempotency-key: 'w8-c-rang-buoc'
        content-type: 'application/json'
      body_raw: '{"content":"Không ăn hành (dữ liệu mẫu)"}'
