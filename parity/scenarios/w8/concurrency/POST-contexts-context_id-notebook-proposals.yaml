# W8 concurrency · POST …/notebook/proposals. The notebook row is the lock: three lap_so
# offers at once on a pair with no cycle yet open one cycle and write ONE offer; the two
# that queue behind it find it standing and return it (2026-09-23, one offer per rung).
# The other person asking for the same rung is told to answer it (409
# consent_proposal_pending) and does, by the id read from the notebook.
# Three bat_doi offers under one header key are one offer, one 201 and two replays.
# Texts are sample data (dữ liệu mẫu).
id: w8/concurrency/post-contexts-context_id-notebook-proposals
routes: ['POST /contexts/{context_id}/notebook/proposals']
auth_mode: dev
personas:
  owner: {}
  mate: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người mở sổ (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người kia (dữ liệu mẫu)"}'
  - id: owner_asks_mate_friendship
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.mate}}"}'
    bind:
      fr_owner_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts_owner_friendship
    as: mate
    request:
      method: POST
      path: '/friends/requests/{{fr_owner_mate}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: owner_opens_pair
    as: owner
    request:
      method: POST
      path: '/people/{{persona.mate}}/dm'
    bind:
      pair: {from: body, pointer: /id, class: uuid}
  # a first write on a pair with no notebook row races on its unique; make the row first
  - id: owner_creates_notebook_row
    as: owner
    request:
      method: DELETE
      path: '/contexts/{{pair}}/notebook/consents/doc_chat'
  - id: owner_proposes_three_at_once
    as: owner
    concurrent: 3
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
  - id: mate_proposes_lap_so
    as: mate
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
  - id: mate_reads_the_standing_offer
    as: mate
    request:
      method: GET
      path: '/contexts/{{pair}}/notebook'
    bind:
      lap_so: {from: body, pointer: /pending_proposals/0/id, class: uuid}
  - id: mate_grants_lap_so
    as: mate
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals/{{lap_so}}/grant'
  - id: owner_same_key_three_at_once
    as: owner
    concurrent: 3
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        idempotency-key: 'w8-c-de-nghi'
        content-type: 'application/json'
      body_raw: '{"purpose":"bat_doi"}'
