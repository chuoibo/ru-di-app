# W8 concurrency · POST …/notebook/close and its preview. Three previews at once agree.
# Three closes carrying one revision queue on the notebook row: one closes the cycle and
# cancels the pending offer, two recompute and answer 409 notebook_revision_stale.
# Under one header key on the closed notebook: one 204, two replays. Texts are sample data.
id: w8/concurrency/post-contexts-context_id-notebook-close
routes: ['POST /contexts/{context_id}/notebook/close', 'POST /contexts/{context_id}/notebook/close/preview']
auth_mode: dev
personas:
  owner: {}
  mate: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người mở sổ (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người kia (dữ liệu mẫu)"}'
  - id: owner_asks_mate_friendship
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.mate}}"}'
    bind:
      fr_owner_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts_owner_friendship
    as: mate
    request:
      method: POST
      path: '/friends/requests/{{fr_owner_mate}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: owner_opens_pair
    as: owner
    request:
      method: POST
      path: '/people/{{persona.mate}}/dm'
    bind:
      pair: {from: body, pointer: /id, class: uuid}
  - id: owner_proposes_lap_so
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
    bind:
      lap_so: {from: body, pointer: /id, class: uuid}
  - id: mate_grants_lap_so
    as: mate
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals/{{lap_so}}/grant'
  - id: owner_proposes_doc_chat
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"doc_chat"}'
  - id: owner_previews_three_at_once
    as: owner
    concurrent: 3
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/close/preview'
  - id: owner_previews
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/close/preview'
    bind:
      rev: {from: body, pointer: /revision, class: token}
  - id: owner_closes_three_at_once
    as: owner
    concurrent: 3
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/close'
      headers:
        content-type: 'application/json'
      body_raw: '{"revision":"{{rev}}"}'
  - id: mate_same_key_three_at_once
    as: mate
    concurrent: 3
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/close'
      headers:
        idempotency-key: 'w8-c-dong-so'
        content-type: 'application/json'
      body_raw: '{"revision":"e3b0c44298fc1c14"}'
