# W8 concurrency · DELETE …/notebook/constraints/{kind}. Three deletes of one line at
# once: one removes it, two find nothing. All 204. Texts are sample data (dữ liệu mẫu).
id: w8/concurrency/delete-contexts-context_id-notebook-constraints-kind
routes: ['DELETE /contexts/{context_id}/notebook/constraints/{kind}']
auth_mode: dev
personas:
  owner: {}
  mate: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người mở sổ (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người kia (dữ liệu mẫu)"}'
  - id: owner_asks_mate_friendship
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.mate}}"}'
    bind:
      fr_owner_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts_owner_friendship
    as: mate
    request:
      method: POST
      path: '/friends/requests/{{fr_owner_mate}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: owner_opens_pair
    as: owner
    request:
      method: POST
      path: '/people/{{persona.mate}}/dm'
    bind:
      pair: {from: body, pointer: /id, class: uuid}
  - id: owner_proposes_lap_so
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
    bind:
      lap_so: {from: body, pointer: /id, class: uuid}
  - id: mate_grants_lap_so
    as: mate
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals/{{lap_so}}/grant'
  - id: owner_puts
    as: owner
    request:
      method: PUT
      path: '/contexts/{{pair}}/notebook/constraints/dung'
      headers:
        content-type: 'application/json'
      body_raw: '{"content":"Đừng hẹn sớm (dữ liệu mẫu)"}'
  - id: owner_deletes_three_at_once
    as: owner
    concurrent: 3
    request:
      method: DELETE
      path: '/contexts/{{pair}}/notebook/constraints/dung'
