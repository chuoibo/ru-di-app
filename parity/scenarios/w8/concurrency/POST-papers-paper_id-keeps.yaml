# W8 concurrency · POST /papers/{id}/keeps. Three lines at once on a recorded outing are
# three rows and one move to da_giu, 201 each; under one header key, one row and two
# replays. Texts are sample data (dữ liệu mẫu).
id: w8/concurrency/post-papers-paper_id-keeps
routes: ['POST /papers/{paper_id}/keeps']
auth_mode: dev
personas:
  owner: {}
  mate: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người mở sổ (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người kia (dữ liệu mẫu)"}'
  - id: owner_asks_mate_friendship
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.mate}}"}'
    bind:
      fr_owner_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts_owner_friendship
    as: mate
    request:
      method: POST
      path: '/friends/requests/{{fr_owner_mate}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: owner_opens_pair
    as: owner
    request:
      method: POST
      path: '/people/{{persona.mate}}/dm'
    bind:
      pair: {from: body, pointer: /id, class: uuid}
  - id: plan_owner_drafts
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/papers/draft'
    bind:
      paper: {from: body, pointer: /id, class: uuid}
  - id: plan_owner_dates
    as: owner
    request:
      method: PATCH
      path: '/papers/{{paper}}/draft'
      headers:
        content-type: 'application/json'
      body_raw: '{"content":{"ngay":"2026-09-01","chang":[{"gio":"19:00","viec":"Ăn tối (dữ liệu mẫu)"}]}}'
  - id: plan_owner_sends
    as: owner
    request:
      method: POST
      path: '/papers/{{paper}}/send'
      headers:
        content-type: 'application/json'
      body_raw: '{"version":1}'
  - id: plan_mate_agrees
    as: mate
    request:
      method: POST
      path: '/papers/{{paper}}/versions/1/responses'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"dong_y"}'
  - id: owner_records_done
    as: owner
    request:
      method: POST
      path: '/papers/{{paper}}/done'
  - id: mate_keeps_three_at_once
    as: mate
    concurrent: 3
    request:
      method: POST
      path: '/papers/{{paper}}/keeps'
      headers:
        content-type: 'application/json'
      body_raw: '{"line":"Tiếng mưa trên mái tôn (dữ liệu mẫu)"}'
  - id: owner_same_key_three_at_once
    as: owner
    concurrent: 3
    request:
      method: POST
      path: '/papers/{{paper}}/keeps'
      headers:
        idempotency-key: 'w8-c-giu'
        content-type: 'application/json'
      body_raw: '{"line":"Đèn vàng quán cóc (dữ liệu mẫu)"}'
  - id: owner_lists
    as: owner
    request:
      method: GET
      path: '/contexts/{{pair}}/papers'
