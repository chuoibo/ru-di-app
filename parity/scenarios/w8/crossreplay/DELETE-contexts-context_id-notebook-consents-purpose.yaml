# W8 cross replay · DELETE /contexts/{context_id}/notebook/consents/{purpose}. A 2xx stored under a header key by one side is replayed by
# the other; another request under that key is 422 idempotency_key_reuse; a refusal
# frees the key. Go serves none of these routes yet, so both paths reach Python; the
# file is here for when one side is Go. Texts are sample data (dữ liệu mẫu).
id: w8/crossreplay/delete-contexts-context_id-notebook-consents-purpose
routes: ['DELETE /contexts/{context_id}/notebook/consents/{purpose}']
auth_mode: dev
personas:
  owner: {}
  mate: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người mở sổ (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người kia (dữ liệu mẫu)"}'
  - id: owner_asks_mate_friendship
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.mate}}"}'
    bind:
      fr_owner_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts_owner_friendship
    as: mate
    request:
      method: POST
      path: '/friends/requests/{{fr_owner_mate}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: owner_opens_pair
    as: owner
    request:
      method: POST
      path: '/people/{{persona.mate}}/dm'
    bind:
      pair: {from: body, pointer: /id, class: uuid}
  - id: owner_proposes_lap_so
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
    bind:
      lap_so: {from: body, pointer: /id, class: uuid}
  - id: mate_grants_lap_so
    as: mate
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals/{{lap_so}}/grant'
  - id: owner_proposes_doc_chat
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"doc_chat"}'
    bind:
      doc_chat: {from: body, pointer: /id, class: uuid}
  - id: mate_grants_doc_chat
    as: mate
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals/{{doc_chat}}/grant'
  - id: python_revokes
    as: mate
    via: python
    request:
      method: DELETE
      path: '/contexts/{{pair}}/notebook/consents/doc_chat'
      headers:
        idempotency-key: 'w8-x-thu-hoi-a'
  - id: front_replays
    as: mate
    request:
      method: DELETE
      path: '/contexts/{{pair}}/notebook/consents/doc_chat'
      headers:
        idempotency-key: 'w8-x-thu-hoi-a'
  - id: front_other_purpose_same_key
    as: mate
    request:
      method: DELETE
      path: '/contexts/{{pair}}/notebook/consents/bat_doi'
      headers:
        idempotency-key: 'w8-x-thu-hoi-a'
  - id: front_unknown_purpose
    as: mate
    request:
      method: DELETE
      path: '/contexts/{{pair}}/notebook/consents/khong_co'
      headers:
        idempotency-key: 'w8-x-thu-hoi-b'
  - id: python_same_key_known_purpose
    as: mate
    via: python
    request:
      method: DELETE
      path: '/contexts/{{pair}}/notebook/consents/lap_so'
      headers:
        idempotency-key: 'w8-x-thu-hoi-b'
  - id: front_replays_python
    as: mate
    request:
      method: DELETE
      path: '/contexts/{{pair}}/notebook/consents/lap_so'
      headers:
        idempotency-key: 'w8-x-thu-hoi-b'
  - id: front_reads
    as: owner
    request:
      method: GET
      path: '/contexts/{{pair}}/notebook'
