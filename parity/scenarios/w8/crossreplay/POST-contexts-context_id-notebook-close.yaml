# W8 cross replay · POST /contexts/{context_id}/notebook/close. A 2xx stored under a header key by one side is replayed by
# the other; another request under that key is 422 idempotency_key_reuse; a refusal
# frees the key. Go serves none of these routes yet, so both paths reach Python; the
# file is here for when one side is Go. Texts are sample data (dữ liệu mẫu).
id: w8/crossreplay/post-contexts-context_id-notebook-close
routes: ['POST /contexts/{context_id}/notebook/close']
auth_mode: dev
personas:
  owner: {}
  mate: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người mở sổ (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người kia (dữ liệu mẫu)"}'
  - id: owner_asks_mate_friendship
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.mate}}"}'
    bind:
      fr_owner_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts_owner_friendship
    as: mate
    request:
      method: POST
      path: '/friends/requests/{{fr_owner_mate}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: owner_opens_pair
    as: owner
    request:
      method: POST
      path: '/people/{{persona.mate}}/dm'
    bind:
      pair: {from: body, pointer: /id, class: uuid}
  - id: owner_proposes_lap_so
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
    bind:
      lap_so: {from: body, pointer: /id, class: uuid}
  - id: mate_grants_lap_so
    as: mate
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals/{{lap_so}}/grant'
  - id: owner_drafts
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/papers/draft'
    bind:
      paper: {from: body, pointer: /id, class: uuid}
  - id: owner_previews
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/close/preview'
    bind:
      rev: {from: body, pointer: /revision, class: token}
  - id: python_closes
    as: owner
    via: python
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/close'
      headers:
        idempotency-key: 'w8-x-dong-so-a'
        content-type: 'application/json'
      body_raw: '{"revision":"{{rev}}"}'
  - id: front_replays
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/close'
      headers:
        idempotency-key: 'w8-x-dong-so-a'
        content-type: 'application/json'
      body_raw: '{"revision":"{{rev}}"}'
  - id: front_other_revision_same_key
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/close'
      headers:
        idempotency-key: 'w8-x-dong-so-a'
        content-type: 'application/json'
      body_raw: '{"revision":"e3b0c44298fc1c14"}'
  # 409 frees the key
  - id: front_stale_refused
    as: mate
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/close'
      headers:
        idempotency-key: 'w8-x-dong-so-b'
        content-type: 'application/json'
      body_raw: '{"revision":"{{rev}}"}'
  - id: mate_previews_closed
    as: mate
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/close/preview'
    bind:
      rev_closed: {from: body, pointer: /revision, class: token}
  - id: python_same_key_other_revision
    as: mate
    via: python
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/close'
      headers:
        idempotency-key: 'w8-x-dong-so-b'
        content-type: 'application/json'
      body_raw: '{"revision":"{{rev_closed}}"}'
  - id: front_replays_python
    as: mate
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/close'
      headers:
        idempotency-key: 'w8-x-dong-so-b'
        content-type: 'application/json'
      body_raw: '{"revision":"{{rev_closed}}"}'
  - id: front_reads_dropped_draft
    as: owner
    request:
      method: GET
      path: '/papers/{{paper}}'
