# W8 cross replay · POST /contexts/{context_id}/notebook/proposals/{proposal_id}/grant. A 2xx stored under a header key by one side is replayed by
# the other; another request under that key is 422 idempotency_key_reuse; a refusal
# frees the key. Go serves none of these routes yet, so both paths reach Python; the
# file is here for when one side is Go. Texts are sample data (dữ liệu mẫu).
id: w8/crossreplay/post-contexts-context_id-notebook-proposals-proposal_id-grant
routes: ['POST /contexts/{context_id}/notebook/proposals/{proposal_id}/grant']
auth_mode: dev
personas:
  owner: {}
  mate: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người mở sổ (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người kia (dữ liệu mẫu)"}'
  - id: owner_asks_mate_friendship
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.mate}}"}'
    bind:
      fr_owner_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts_owner_friendship
    as: mate
    request:
      method: POST
      path: '/friends/requests/{{fr_owner_mate}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: owner_opens_pair
    as: owner
    request:
      method: POST
      path: '/people/{{persona.mate}}/dm'
    bind:
      pair: {from: body, pointer: /id, class: uuid}
  - id: owner_proposes
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
    bind:
      lap_so: {from: body, pointer: /id, class: uuid}
  - id: front_grants
    as: mate
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals/{{lap_so}}/grant'
      headers:
        idempotency-key: 'w8-x-dong-y-a'
  - id: python_replays
    as: mate
    via: python
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals/{{lap_so}}/grant'
      headers:
        idempotency-key: 'w8-x-dong-y-a'
  - id: python_same_key_with_body
    as: mate
    via: python
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals/{{lap_so}}/grant'
      headers:
        idempotency-key: 'w8-x-dong-y-a'
        content-type: 'application/json'
      body_raw: '{}'
  - id: owner_proposes_doc_chat
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"doc_chat"}'
    bind:
      doc_chat: {from: body, pointer: /id, class: uuid}
  # 403 frees the key
  - id: python_owner_grants_own
    as: owner
    via: python
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals/{{doc_chat}}/grant'
      headers:
        idempotency-key: 'w8-x-dong-y-b'
  - id: front_mate_grants_same_key
    as: mate
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals/{{doc_chat}}/grant'
      headers:
        idempotency-key: 'w8-x-dong-y-b'
  - id: python_mate_replays
    as: mate
    via: python
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals/{{doc_chat}}/grant'
      headers:
        idempotency-key: 'w8-x-dong-y-b'
  - id: python_reads
    as: owner
    via: python
    request:
      method: GET
      path: '/contexts/{{pair}}/notebook'
