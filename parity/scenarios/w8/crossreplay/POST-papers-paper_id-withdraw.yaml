# W8 cross replay · POST /papers/{paper_id}/withdraw. A 2xx stored under a header key by one side is replayed by
# the other; another request under that key is 422 idempotency_key_reuse; a refusal
# frees the key. Go serves none of these routes yet, so both paths reach Python; the
# file is here for when one side is Go. Texts are sample data (dữ liệu mẫu).
id: w8/crossreplay/post-papers-paper_id-withdraw
routes: ['POST /papers/{paper_id}/withdraw']
auth_mode: dev
personas:
  owner: {}
  mate: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người mở sổ (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người kia (dữ liệu mẫu)"}'
  - id: owner_asks_mate_friendship
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.mate}}"}'
    bind:
      fr_owner_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts_owner_friendship
    as: mate
    request:
      method: POST
      path: '/friends/requests/{{fr_owner_mate}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: owner_opens_pair
    as: owner
    request:
      method: POST
      path: '/people/{{persona.mate}}/dm'
    bind:
      pair: {from: body, pointer: /id, class: uuid}
  - id: sheet_owner_drafts
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/papers/draft'
    bind:
      paper: {from: body, pointer: /id, class: uuid}
  - id: sheet_owner_sends
    as: owner
    request:
      method: POST
      path: '/papers/{{paper}}/send'
      headers:
        content-type: 'application/json'
      body_raw: '{"version":1}'
  - id: front_withdraws
    as: owner
    request:
      method: POST
      path: '/papers/{{paper}}/withdraw'
      headers:
        idempotency-key: 'w8-x-rut-a'
        content-type: 'application/json'
      body_raw: '{"version":1}'
  - id: python_replays
    as: owner
    via: python
    request:
      method: POST
      path: '/papers/{{paper}}/withdraw'
      headers:
        idempotency-key: 'w8-x-rut-a'
        content-type: 'application/json'
      body_raw: '{"version":1}'
  - id: python_other_version_same_key
    as: owner
    via: python
    request:
      method: POST
      path: '/papers/{{paper}}/withdraw'
      headers:
        idempotency-key: 'w8-x-rut-a'
        content-type: 'application/json'
      body_raw: '{"version":2}'
  - id: second_owner_drafts
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/papers/draft'
    bind:
      paper_2: {from: body, pointer: /id, class: uuid}
  - id: second_owner_sends
    as: owner
    request:
      method: POST
      path: '/papers/{{paper_2}}/send'
      headers:
        content-type: 'application/json'
      body_raw: '{"version":1}'
  - id: mate_views_second
    as: mate
    request:
      method: POST
      path: '/papers/{{paper_2}}/versions/1/viewed'
  - id: python_not_withdrawable
    as: owner
    via: python
    request:
      method: POST
      path: '/papers/{{paper_2}}/withdraw'
      headers:
        idempotency-key: 'w8-x-rut-b'
        content-type: 'application/json'
      body_raw: '{"version":1}'
  - id: front_same_key_again
    as: owner
    request:
      method: POST
      path: '/papers/{{paper_2}}/withdraw'
      headers:
        idempotency-key: 'w8-x-rut-b'
        content-type: 'application/json'
      body_raw: '{"version":1}'
