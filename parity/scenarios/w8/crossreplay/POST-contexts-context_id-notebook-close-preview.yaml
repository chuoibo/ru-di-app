# W8 cross replay · POST /contexts/{context_id}/notebook/close/preview. A 2xx stored under a header key by one side is replayed by
# the other; another request under that key is 422 idempotency_key_reuse; a refusal
# frees the key. Go serves none of these routes yet, so both paths reach Python; the
# file is here for when one side is Go. Texts are sample data (dữ liệu mẫu).
id: w8/crossreplay/post-contexts-context_id-notebook-close-preview
routes: ['POST /contexts/{context_id}/notebook/close/preview']
auth_mode: dev
personas:
  owner: {}
  mate: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người mở sổ (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người kia (dữ liệu mẫu)"}'
  - id: owner_asks_mate_friendship
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.mate}}"}'
    bind:
      fr_owner_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts_owner_friendship
    as: mate
    request:
      method: POST
      path: '/friends/requests/{{fr_owner_mate}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: owner_opens_pair
    as: owner
    request:
      method: POST
      path: '/people/{{persona.mate}}/dm'
    bind:
      pair: {from: body, pointer: /id, class: uuid}
  - id: owner_proposes_lap_so
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
    bind:
      lap_so: {from: body, pointer: /id, class: uuid}
  - id: mate_grants_lap_so
    as: mate
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals/{{lap_so}}/grant'
  - id: owner_proposes_doc_chat
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"doc_chat"}'
  - id: python_previews
    as: owner
    via: python
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/close/preview'
      headers:
        idempotency-key: 'w8-x-xem-truoc-a'
    bind:
      rev: {from: body, pointer: /revision, class: token}
  - id: owner_proposes_bat_doi
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"bat_doi"}'
  - id: front_replays_stale
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/close/preview'
      headers:
        idempotency-key: 'w8-x-xem-truoc-a'
  - id: front_same_key_with_body
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/close/preview'
      headers:
        idempotency-key: 'w8-x-xem-truoc-a'
        content-type: 'application/json'
      body_raw: '{}'
  - id: front_previews_now
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/close/preview'
    bind:
      rev_now: {from: body, pointer: /revision, class: token}
  - id: python_closes_replayed_revision
    as: owner
    via: python
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/close'
      headers:
        content-type: 'application/json'
      body_raw: '{"revision":"{{rev}}"}'
  - id: front_closes_current
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/close'
      headers:
        content-type: 'application/json'
      body_raw: '{"revision":"{{rev_now}}"}'
