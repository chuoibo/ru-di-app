# W8 cross replay · PUT /contexts/{context_id}/notebook/constraints/{kind}. A 2xx stored under a header key by one side is replayed by
# the other; another request under that key is 422 idempotency_key_reuse; a refusal
# frees the key. Go serves none of these routes yet, so both paths reach Python; the
# file is here for when one side is Go. Texts are sample data (dữ liệu mẫu).
id: w8/crossreplay/put-contexts-context_id-notebook-constraints-kind
routes: ['PUT /contexts/{context_id}/notebook/constraints/{kind}']
auth_mode: dev
personas:
  owner: {}
  mate: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người mở sổ (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người kia (dữ liệu mẫu)"}'
  - id: owner_asks_mate_friendship
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.mate}}"}'
    bind:
      fr_owner_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts_owner_friendship
    as: mate
    request:
      method: POST
      path: '/friends/requests/{{fr_owner_mate}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: owner_opens_pair
    as: owner
    request:
      method: POST
      path: '/people/{{persona.mate}}/dm'
    bind:
      pair: {from: body, pointer: /id, class: uuid}
  - id: owner_proposes_lap_so
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
    bind:
      lap_so: {from: body, pointer: /id, class: uuid}
  - id: mate_grants_lap_so
    as: mate
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals/{{lap_so}}/grant'
  - id: python_puts
    as: owner
    via: python
    request:
      method: PUT
      path: '/contexts/{{pair}}/notebook/constraints/dung'
      headers:
        idempotency-key: 'w8-x-rang-buoc-a'
        content-type: 'application/json'
      body_raw: '{"content":"Đừng hẹn sớm (dữ liệu mẫu)"}'
  - id: front_replays
    as: owner
    request:
      method: PUT
      path: '/contexts/{{pair}}/notebook/constraints/dung'
      headers:
        idempotency-key: 'w8-x-rang-buoc-a'
        content-type: 'application/json'
      body_raw: '{"content":"Đừng hẹn sớm (dữ liệu mẫu)"}'
  - id: front_other_content_same_key
    as: owner
    request:
      method: PUT
      path: '/contexts/{{pair}}/notebook/constraints/dung'
      headers:
        idempotency-key: 'w8-x-rang-buoc-a'
        content-type: 'application/json'
      body_raw: '{"content":"Đừng hẹn muộn (dữ liệu mẫu)"}'
  - id: front_puts
    as: owner
    request:
      method: PUT
      path: '/contexts/{{pair}}/notebook/constraints/khong_an_duoc'
      headers:
        idempotency-key: 'w8-x-rang-buoc-b'
        content-type: 'application/json'
      body_raw: '{"content":"Không ăn hành (dữ liệu mẫu)"}'
  - id: python_replays_front
    as: owner
    via: python
    request:
      method: PUT
      path: '/contexts/{{pair}}/notebook/constraints/khong_an_duoc'
      headers:
        idempotency-key: 'w8-x-rang-buoc-b'
        content-type: 'application/json'
      body_raw: '{"content":"Không ăn hành (dữ liệu mẫu)"}'
  - id: python_blank_refused
    as: owner
    via: python
    request:
      method: PUT
      path: '/contexts/{{pair}}/notebook/constraints/dung'
      headers:
        idempotency-key: 'w8-x-rang-buoc-c'
        content-type: 'application/json'
      body_raw: '{"content":"   "}'
  - id: front_same_key_valid
    as: owner
    request:
      method: PUT
      path: '/contexts/{{pair}}/notebook/constraints/dung'
      headers:
        idempotency-key: 'w8-x-rang-buoc-c'
        content-type: 'application/json'
      body_raw: '{"content":"Đừng đi xa (dữ liệu mẫu)"}'
  - id: python_reads_versions
    as: mate
    via: python
    request:
      method: GET
      path: '/contexts/{{pair}}/notebook'
