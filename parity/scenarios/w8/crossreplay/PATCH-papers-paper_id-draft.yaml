# W8 cross replay · PATCH /papers/{paper_id}/draft. A 2xx stored under a header key by one side is replayed by
# the other; another request under that key is 422 idempotency_key_reuse; a refusal
# frees the key. Go serves none of these routes yet, so both paths reach Python; the
# file is here for when one side is Go. Texts are sample data (dữ liệu mẫu).
id: w8/crossreplay/patch-papers-paper_id-draft
routes: ['PATCH /papers/{paper_id}/draft']
auth_mode: dev
personas:
  owner: {}
  mate: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người mở sổ (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người kia (dữ liệu mẫu)"}'
  - id: owner_asks_mate_friendship
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.mate}}"}'
    bind:
      fr_owner_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts_owner_friendship
    as: mate
    request:
      method: POST
      path: '/friends/requests/{{fr_owner_mate}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: owner_opens_pair
    as: owner
    request:
      method: POST
      path: '/people/{{persona.mate}}/dm'
    bind:
      pair: {from: body, pointer: /id, class: uuid}
  - id: owner_drafts
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/papers/draft'
    bind:
      paper: {from: body, pointer: /id, class: uuid}
  - id: python_edits
    as: owner
    via: python
    request:
      method: PATCH
      path: '/papers/{{paper}}/draft'
      headers:
        idempotency-key: 'w8-x-sua-a'
        content-type: 'application/json'
      body_raw: '{"content":{"ngay":"2026-09-01","chang":[{"gio":"19:00","viec":"Ăn tối (dữ liệu mẫu)"}]}}'
  - id: front_replays
    as: owner
    request:
      method: PATCH
      path: '/papers/{{paper}}/draft'
      headers:
        idempotency-key: 'w8-x-sua-a'
        content-type: 'application/json'
      body_raw: '{"content":{"ngay":"2026-09-01","chang":[{"gio":"19:00","viec":"Ăn tối (dữ liệu mẫu)"}]}}'
  - id: front_other_day_same_key
    as: owner
    request:
      method: PATCH
      path: '/papers/{{paper}}/draft'
      headers:
        idempotency-key: 'w8-x-sua-a'
        content-type: 'application/json'
      body_raw: '{"content":{"ngay":"2031-12-31","chang":[{"gio":"19:00","viec":"Ăn tối (dữ liệu mẫu)"}]}}'
  - id: front_bad_hour
    as: owner
    request:
      method: PATCH
      path: '/papers/{{paper}}/draft'
      headers:
        idempotency-key: 'w8-x-sua-b'
        content-type: 'application/json'
      body_raw: '{"content":{"ngay":"2026-09-01","chang":[{"gio":"25:00","viec":"Ăn (dữ liệu mẫu)"}]}}'
  - id: python_same_key_valid
    as: owner
    via: python
    request:
      method: PATCH
      path: '/papers/{{paper}}/draft'
      headers:
        idempotency-key: 'w8-x-sua-b'
        content-type: 'application/json'
      body_raw: '{"content":{"ngay":"2031-12-31","chang":[{"gio":"19:00","viec":"Ăn tối (dữ liệu mẫu)"}]}}'
  - id: front_replays_python
    as: owner
    request:
      method: PATCH
      path: '/papers/{{paper}}/draft'
      headers:
        idempotency-key: 'w8-x-sua-b'
        content-type: 'application/json'
      body_raw: '{"content":{"ngay":"2031-12-31","chang":[{"gio":"19:00","viec":"Ăn tối (dữ liệu mẫu)"}]}}'
  - id: front_reads
    as: owner
    request:
      method: GET
      path: '/papers/{{paper}}'
