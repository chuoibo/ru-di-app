# W8 · GET /papers/{id}. An unknown id is 404 paper_not_found; a real sheet read by
# somebody outside the pair is 404 notebook_not_found instead. Roles are checked before
# may_view_paper, so the dev roles header turns mate's 404 on owner's draft into 403.
# The sheet is read through its whole life: versions with my_response, their_agreed and
# viewed_by_recipient_at (the sender's only), outing_id, co_the_ghi_da_di, keeps, and a
# plan that stays readable after the notebook closed. Texts are sample data.
id: w8/pair_papers/get-papers-paper_id
routes: ['GET /papers/{paper_id}']
auth_mode: dev
personas:
  owner: {}
  mate: {}
  stranger: {}
steps:
  - id: anonymous_reads_unknown
    as: anonymous
    request:
      method: GET
      path: '/papers/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee'
  - id: stranger_reads_unknown
    as: stranger
    request:
      method: GET
      path: '/papers/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee'
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người mở sổ (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người kia (dữ liệu mẫu)"}'
  - id: owner_asks_mate_friendship
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.mate}}"}'
    bind:
      fr_owner_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts_owner_friendship
    as: mate
    request:
      method: POST
      path: '/friends/requests/{{fr_owner_mate}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: owner_opens_pair
    as: owner
    request:
      method: POST
      path: '/people/{{persona.mate}}/dm'
    bind:
      pair: {from: body, pointer: /id, class: uuid}
  - id: owner_proposes_lap_so
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
    bind:
      lap_so: {from: body, pointer: /id, class: uuid}
  - id: mate_grants_lap_so
    as: mate
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals/{{lap_so}}/grant'
  - id: owner_drafts
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/papers/draft'
    bind:
      paper: {from: body, pointer: /id, class: uuid}
  - id: owner_reads_draft
    as: owner
    request:
      method: GET
      path: '/papers/{{paper}}'
  - id: mate_reads_owner_draft
    as: mate
    request:
      method: GET
      path: '/papers/{{paper}}'
  - id: stranger_reads_real_paper
    as: stranger
    request:
      method: GET
      path: '/papers/{{paper}}'
  - id: stranger_reads_real_paper_as_advancer
    as: stranger
    request:
      method: GET
      path: '/papers/{{paper}}'
      headers:
        x-actor-roles: 'advancer'
  - id: mate_reads_owner_draft_as_advancer
    as: mate
    request:
      method: GET
      path: '/papers/{{paper}}'
      headers:
        x-actor-roles: 'advancer'
  - id: owner_edits
    as: owner
    request:
      method: PATCH
      path: '/papers/{{paper}}/draft'
      headers:
        content-type: 'application/json'
      body_raw: '{"content":{"ngay":"2026-09-01","chang":[{"gio":"18:15","viec":"Phở gánh (dữ liệu mẫu)","place_id":"cccccccc-dddd-4eee-8fff-aaaaaaaaaaaa","can_kiem":false},{"gio":"19:45","viec":"Kem Tràng Tiền (dữ liệu mẫu)"}]},"ly_do":"Tuần này trời mát (dữ liệu mẫu)"}'
  - id: owner_reads_edited
    as: owner
    request:
      method: GET
      path: '/papers/{{paper}}'
  - id: owner_sends
    as: owner
    request:
      method: POST
      path: '/papers/{{paper}}/send'
      headers:
        content-type: 'application/json'
      body_raw: '{"version":1}'
  - id: owner_reads_sent
    as: owner
    request:
      method: GET
      path: '/papers/{{paper}}'
  - id: mate_reads_sent
    as: mate
    request:
      method: GET
      path: '/papers/{{paper}}'
  - id: mate_views
    as: mate
    request:
      method: POST
      path: '/papers/{{paper}}/versions/1/viewed'
  - id: owner_reads_seen
    as: owner
    request:
      method: GET
      path: '/papers/{{paper}}'
  - id: mate_reads_seen
    as: mate
    request:
      method: GET
      path: '/papers/{{paper}}'
  - id: mate_counter_proposes
    as: mate
    request:
      method: POST
      path: '/papers/{{paper}}/versions/1/responses'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"de_nghi_sua","content":{"ngay":"2026-09-01","chang":[{"gio":"19:00","viec":"Bún bò (dữ liệu mẫu)"}]},"ly_do":"Muộn hơn chút (dữ liệu mẫu)"}'
  - id: owner_reads_two_versions
    as: owner
    request:
      method: GET
      path: '/papers/{{paper}}'
  - id: mate_reads_two_versions
    as: mate
    request:
      method: GET
      path: '/papers/{{paper}}'
  - id: owner_agrees_v2
    as: owner
    request:
      method: POST
      path: '/papers/{{paper}}/versions/2/responses'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"dong_y"}'
  - id: mate_reads_plan
    as: mate
    request:
      method: GET
      path: '/papers/{{paper}}'
  - id: owner_records_done
    as: owner
    request:
      method: POST
      path: '/papers/{{paper}}/done'
  - id: mate_keeps
    as: mate
    request:
      method: POST
      path: '/papers/{{paper}}/keeps'
      headers:
        content-type: 'application/json'
      body_raw: '{"line":"Quán nhỏ đầu hẻm (dữ liệu mẫu)"}'
  - id: owner_reads_kept
    as: owner
    request:
      method: GET
      path: '/papers/{{paper}}'
  - id: owner_reads_trailing_slash
    as: owner
    request:
      method: GET
      path: '/papers/{{paper}}/'
  - id: owner_reads_uppercase_id
    as: owner
    request:
      method: GET
      path: '/papers/AAAAAAAA-BBBB-4CCC-8DDD-EEEEEEEEEEEE'
  - id: owner_drafts_second
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/papers/draft'
    bind:
      paper_2: {from: body, pointer: /id, class: uuid}
  - id: owner_previews_close
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/close/preview'
    bind:
      rev: {from: body, pointer: /revision, class: token}
  - id: owner_closes
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/close'
      headers:
        content-type: 'application/json'
      body_raw: '{"revision":"{{rev}}"}'
  - id: mate_reads_kept_after_close
    as: mate
    request:
      method: GET
      path: '/papers/{{paper}}'
  - id: owner_reads_dropped_draft
    as: owner
    request:
      method: GET
      path: '/papers/{{paper_2}}'
  # bo is not nhap: the other person may read it now
  - id: mate_reads_dropped_draft
    as: mate
    request:
      method: GET
      path: '/papers/{{paper_2}}'
