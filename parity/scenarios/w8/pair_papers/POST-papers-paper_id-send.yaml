# W8 · POST /papers/{id}/send. The sheet and pair, then roles, is_draft_owner (404
# paper_not_found for anybody else, including the author of a later version) and
# version_current (409 paper_version_stale), then the transition from nhap (409
# paper_wrong_state). Sending stamps the version, writes the sender's dong_y and moves
# the sheet to da_gui. Every sheet here is temporary. Texts are sample data.
id: w8/pair_papers/post-papers-paper_id-send
routes: ['POST /papers/{paper_id}/send']
auth_mode: dev
personas:
  owner: {}
  mate: {}
  stranger: {}
steps:
  - id: anonymous_sends
    as: anonymous
    request:
      method: POST
      path: '/papers/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/send'
      headers:
        content-type: 'application/json'
      body_raw: '{"version":1}'
  - id: stranger_sends_unknown
    as: stranger
    request:
      method: POST
      path: '/papers/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/send'
      headers:
        content-type: 'application/json'
      body_raw: '{"version":1}'
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người mở sổ (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người kia (dữ liệu mẫu)"}'
  - id: owner_asks_mate_friendship
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.mate}}"}'
    bind:
      fr_owner_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts_owner_friendship
    as: mate
    request:
      method: POST
      path: '/friends/requests/{{fr_owner_mate}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: owner_opens_pair
    as: owner
    request:
      method: POST
      path: '/people/{{persona.mate}}/dm'
    bind:
      pair: {from: body, pointer: /id, class: uuid}
  - id: owner_drafts
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/papers/draft'
    bind:
      paper: {from: body, pointer: /id, class: uuid}
  - id: mate_sends_owner_draft
    as: mate
    request:
      method: POST
      path: '/papers/{{paper}}/send'
      headers:
        content-type: 'application/json'
      body_raw: '{"version":1}'
  - id: stranger_sends_real_paper
    as: stranger
    request:
      method: POST
      path: '/papers/{{paper}}/send'
      headers:
        content-type: 'application/json'
      body_raw: '{"version":1}'
  - id: owner_sends_as_advancer
    as: owner
    request:
      method: POST
      path: '/papers/{{paper}}/send'
      headers:
        x-actor-roles: 'advancer'
        content-type: 'application/json'
      body_raw: '{"version":1}'
  - id: owner_sends_version_2
    as: owner
    request:
      method: POST
      path: '/papers/{{paper}}/send'
      headers:
        content-type: 'application/json'
      body_raw: '{"version":2}'
  - id: owner_version_zero
    as: owner
    request:
      method: POST
      path: '/papers/{{paper}}/send'
      headers:
        content-type: 'application/json'
      body_raw: '{"version":0}'
  - id: owner_version_string
    as: owner
    request:
      method: POST
      path: '/papers/{{paper}}/send'
      headers:
        content-type: 'application/json'
      body_raw: '{"version":"1"}'
  - id: owner_version_float
    as: owner
    request:
      method: POST
      path: '/papers/{{paper}}/send'
      headers:
        content-type: 'application/json'
      body_raw: '{"version":1.0}'
  - id: owner_version_bool
    as: owner
    request:
      method: POST
      path: '/papers/{{paper}}/send'
      headers:
        content-type: 'application/json'
      body_raw: '{"version":true}'
  - id: owner_version_missing
    as: owner
    request:
      method: POST
      path: '/papers/{{paper}}/send'
      headers:
        content-type: 'application/json'
      body_raw: '{}'
  - id: owner_sends
    as: owner
    request:
      method: POST
      path: '/papers/{{paper}}/send'
      headers:
        content-type: 'application/json'
      body_raw: '{"version":1}'
  - id: mate_reads_sent
    as: mate
    request:
      method: GET
      path: '/papers/{{paper}}'
  - id: owner_sends_again
    as: owner
    request:
      method: POST
      path: '/papers/{{paper}}/send'
      headers:
        content-type: 'application/json'
      body_raw: '{"version":1}'
  - id: owner_sends_again_version_2
    as: owner
    request:
      method: POST
      path: '/papers/{{paper}}/send'
      headers:
        content-type: 'application/json'
      body_raw: '{"version":2}'
  - id: mate_sends_sent
    as: mate
    request:
      method: POST
      path: '/papers/{{paper}}/send'
      headers:
        content-type: 'application/json'
      body_raw: '{"version":1}'
  - id: mate_skips
    as: mate
    request:
      method: POST
      path: '/papers/{{paper}}/skip'
  - id: owner_drafts_second
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/papers/draft'
    bind:
      paper_2: {from: body, pointer: /id, class: uuid}
  - id: owner_skips_second
    as: owner
    request:
      method: POST
      path: '/papers/{{paper_2}}/skip'
  - id: owner_sends_skipped
    as: owner
    request:
      method: POST
      path: '/papers/{{paper_2}}/send'
      headers:
        content-type: 'application/json'
      body_raw: '{"version":1}'
  - id: owner_drafts_third
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/papers/draft'
    bind:
      paper_3: {from: body, pointer: /id, class: uuid}
  - id: owner_sends_with_header_key
    as: owner
    request:
      method: POST
      path: '/papers/{{paper_3}}/send'
      headers:
        idempotency-key: 'w8-gui-a'
        content-type: 'application/json'
      body_raw: '{"version":1}'
  - id: owner_replays_header_key
    as: owner
    request:
      method: POST
      path: '/papers/{{paper_3}}/send'
      headers:
        idempotency-key: 'w8-gui-a'
        content-type: 'application/json'
      body_raw: '{"version":1}'
  - id: owner_header_key_other_version
    as: owner
    request:
      method: POST
      path: '/papers/{{paper_3}}/send'
      headers:
        idempotency-key: 'w8-gui-a'
        content-type: 'application/json'
      body_raw: '{"version":2}'
  - id: mate_counter_proposes
    as: mate
    request:
      method: POST
      path: '/papers/{{paper_3}}/versions/1/responses'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"de_nghi_sua","content":{"ngay":"2026-09-01","chang":[{"gio":"19:00","viec":"Ăn tối (dữ liệu mẫu)"}]}}'
  # owner still owns the draft; v2 is current, but the sheet is da_gui
  - id: owner_sends_v2
    as: owner
    request:
      method: POST
      path: '/papers/{{paper_3}}/send'
      headers:
        content-type: 'application/json'
      body_raw: '{"version":2}'
  - id: mate_sends_own_v2
    as: mate
    request:
      method: POST
      path: '/papers/{{paper_3}}/send'
      headers:
        content-type: 'application/json'
      body_raw: '{"version":2}'
  - id: owner_reads_third
    as: owner
    request:
      method: GET
      path: '/papers/{{paper_3}}'
