# W8 · PATCH /papers/{id}/draft. Body validation first (the generated corpus defers this
# route: `ngay` is a date). Then the sheet: unknown 404 paper_not_found, outside the
# pair 404 notebook_not_found, the other person 404 paper_not_found, dev roles 403,
# and a sheet no longer nhap 409 paper_wrong_state. Version 1 is rewritten in place;
# ly_do is stripped and blank becomes null. Hostile texts include HTML, a right-to-left
# override, emoji at the bound, NUL and a lone surrogate. Texts are sample data.
id: w8/pair_papers/patch-papers-paper_id-draft
routes: ['PATCH /papers/{paper_id}/draft']
auth_mode: dev
personas:
  owner: {}
  mate: {}
  stranger: {}
steps:
  - id: anonymous_edits_unknown
    as: anonymous
    request:
      method: PATCH
      path: '/papers/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/draft'
      headers:
        content-type: 'application/json'
      body_raw: '{"content":{"ngay":"2026-09-01","chang":[{"gio":"19:00","viec":"Ăn tối (dữ liệu mẫu)"}]}}'
  - id: stranger_edits_unknown
    as: stranger
    request:
      method: PATCH
      path: '/papers/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/draft'
      headers:
        content-type: 'application/json'
      body_raw: '{"content":{"ngay":"2026-09-01","chang":[{"gio":"19:00","viec":"Ăn tối (dữ liệu mẫu)"}]}}'
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người mở sổ (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người kia (dữ liệu mẫu)"}'
  - id: owner_asks_mate_friendship
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.mate}}"}'
    bind:
      fr_owner_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts_owner_friendship
    as: mate
    request:
      method: POST
      path: '/friends/requests/{{fr_owner_mate}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: owner_opens_pair
    as: owner
    request:
      method: POST
      path: '/people/{{persona.mate}}/dm'
    bind:
      pair: {from: body, pointer: /id, class: uuid}
  - id: owner_proposes_lap_so
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
    bind:
      lap_so: {from: body, pointer: /id, class: uuid}
  - id: mate_grants_lap_so
    as: mate
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals/{{lap_so}}/grant'
  - id: owner_drafts
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/papers/draft'
    bind:
      paper: {from: body, pointer: /id, class: uuid}
  - id: mate_edits_owner_draft
    as: mate
    request:
      method: PATCH
      path: '/papers/{{paper}}/draft'
      headers:
        content-type: 'application/json'
      body_raw: '{"content":{"ngay":"2026-09-01","chang":[{"gio":"19:00","viec":"Ăn tối (dữ liệu mẫu)"}]}}'
