# W8 pair papers in prod auth mode (ADR-0014). Every door is 401 without a live bearer,
# before the sheet is looked up; X-Actor-* headers change nothing. One sheet walks from
# draft to a kept line on sessions, a second is withdrawn and a third skipped. The same
# draft key under the other person's session runs again and meets the open sheet.
# Texts are sample data (dữ liệu mẫu).
id: w8/pair_papers/prod-auth
routes: ['GET /contexts/{context_id}/papers', 'POST /contexts/{context_id}/papers/draft', 'GET /papers/{paper_id}', 'PATCH /papers/{paper_id}/draft', 'POST /papers/{paper_id}/send', 'POST /papers/{paper_id}/versions/{version}/viewed', 'POST /papers/{paper_id}/versions/{version}/responses', 'POST /papers/{paper_id}/withdraw', 'POST /papers/{paper_id}/skip', 'POST /papers/{paper_id}/done', 'POST /papers/{paper_id}/keeps']
auth_mode: prod
personas:
  owner: {}
  mate: {}
  stranger: {}
steps:
  - id: anonymous_lists
    as: anonymous
    request:
      method: GET
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/papers'
  - id: junk_bearer_drafts
    as: anonymous
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/papers/draft'
      headers:
        authorization: 'Bearer khong-phai-token-that'
  - id: dev_headers_without_bearer
    as: anonymous
    request:
      method: GET
      path: '/papers/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee'
      headers:
        x-actor-id: '{{persona.owner}}'
        x-actor-roles: 'member'
  - id: anonymous_keeps_blank
    as: anonymous
    request:
      method: POST
      path: '/papers/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/keeps'
      headers:
        content-type: 'application/json'
      body_raw: '{"line":" "}'
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người mở sổ (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người kia (dữ liệu mẫu)"}'
  - id: owner_asks_mate_friendship
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.mate}}"}'
    bind:
      fr_owner_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts_owner_friendship
    as: mate
    request:
      method: POST
      path: '/friends/requests/{{fr_owner_mate}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: owner_opens_pair
    as: owner
    request:
      method: POST
      path: '/people/{{persona.mate}}/dm'
    bind:
      pair: {from: body, pointer: /id, class: uuid}
  - id: owner_drafts_with_header_key
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/papers/draft'
      headers:
        idempotency-key: 'w8-prod-phac'
    bind:
      paper: {from: body, pointer: /id, class: uuid}
  - id: owner_replays_header_key
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/papers/draft'
      headers:
        idempotency-key: 'w8-prod-phac'
  - id: mate_same_key_own_session
    as: mate
    request:
      method: POST
      path: '/contexts/{{pair}}/papers/draft'
      headers:
        idempotency-key: 'w8-prod-phac'
  - id: mate_reads_owner_draft
    as: mate
    request:
      method: GET
      path: '/papers/{{paper}}'
  - id: stranger_reads_claiming_owner
    as: stranger
    request:
      method: GET
      path: '/papers/{{paper}}'
  - id: stranger_reads_claiming_owner_header
    as: stranger
    request:
      method: GET
      path: '/papers/{{paper}}'
      headers:
        x-actor-id: '{{persona.owner}}'
  - id: owner_dates
    as: owner
    request:
      method: PATCH
      path: '/papers/{{paper}}/draft'
      headers:
        content-type: 'application/json'
      body_raw: '{"content":{"ngay":"2026-09-01","chang":[{"gio":"19:00","viec":"Ăn tối (dữ liệu mẫu)"}]}}'
  - id: junk_bearer_reads
    as: anonymous
    request:
      method: GET
      path: '/papers/{{paper}}'
      headers:
        authorization: 'Bearer khong-phai-token-that'
  - id: junk_bearer_lists
    as: anonymous
    request:
      method: GET
      path: '/contexts/{{pair}}/papers'
      headers:
        authorization: 'Bearer khong-phai-token-that'
  - id: junk_bearer_edits
    as: anonymous
    request:
      method: PATCH
      path: '/papers/{{paper}}/draft'
      headers:
        authorization: 'Bearer khong-phai-token-that'
        content-type: 'application/json'
      body_raw: '{"content":{"ngay":"2026-09-01","chang":[{"gio":"19:00","viec":"Ăn tối (dữ liệu mẫu)"}]}}'
  - id: junk_bearer_sends
    as: anonymous
    request:
      method: POST
      path: '/papers/{{paper}}/send'
      headers:
        authorization: 'Bearer khong-phai-token-that'
        content-type: 'application/json'
      body_raw: '{"version":1}'
  - id: owner_sends_with_guest_roles_header
    as: owner
    request:
      method: POST
      path: '/papers/{{paper}}/send'
      headers:
        x-actor-roles: 'guest'
        content-type: 'application/json'
      body_raw: '{"version":1}'
  - id: mate_lists
    as: mate
    request:
      method: GET
      path: '/contexts/{{pair}}/papers'
  - id: junk_bearer_views
    as: anonymous
    request:
      method: POST
      path: '/papers/{{paper}}/versions/1/viewed'
      headers:
        authorization: 'Bearer khong-phai-token-that'
  - id: mate_views
    as: mate
    request:
      method: POST
      path: '/papers/{{paper}}/versions/1/viewed'
  - id: junk_bearer_responds
    as: anonymous
    request:
      method: POST
      path: '/papers/{{paper}}/versions/1/responses'
      headers:
        authorization: 'Bearer khong-phai-token-that'
        content-type: 'application/json'
      body_raw: '{"kind":"dong_y"}'
  - id: mate_counter_proposes
    as: mate
    request:
      method: POST
      path: '/papers/{{paper}}/versions/1/responses'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"de_nghi_sua","content":{"ngay":"2026-09-01","chang":[{"gio":"20:00","viec":"Chè (dữ liệu mẫu)"}]}}'
  - id: owner_views_v2
    as: owner
    request:
      method: POST
      path: '/papers/{{paper}}/versions/2/viewed'
  - id: owner_agrees_v2
    as: owner
    request:
      method: POST
      path: '/papers/{{paper}}/versions/2/responses'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"dong_y"}'
  - id: junk_bearer_records_done
    as: anonymous
    request:
      method: POST
      path: '/papers/{{paper}}/done'
      headers:
        authorization: 'Bearer khong-phai-token-that'
  - id: mate_records_done
    as: mate
    request:
      method: POST
      path: '/papers/{{paper}}/done'
  - id: junk_bearer_keeps
    as: anonymous
    request:
      method: POST
      path: '/papers/{{paper}}/keeps'
      headers:
        authorization: 'Bearer khong-phai-token-that'
        content-type: 'application/json'
      body_raw: '{"line":"Một dòng (dữ liệu mẫu)"}'
  - id: owner_keeps
    as: owner
    request:
      method: POST
      path: '/papers/{{paper}}/keeps'
      headers:
        content-type: 'application/json'
      body_raw: '{"line":"Quán nhỏ đầu hẻm (dữ liệu mẫu)"}'
  - id: mate_reads_kept
    as: mate
    request:
      method: GET
      path: '/papers/{{paper}}'
  - id: withdrawn_owner_drafts
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/papers/draft'
    bind:
      paper_2: {from: body, pointer: /id, class: uuid}
  - id: withdrawn_owner_sends
    as: owner
    request:
      method: POST
      path: '/papers/{{paper_2}}/send'
      headers:
        content-type: 'application/json'
      body_raw: '{"version":1}'
  - id: junk_bearer_withdraws
    as: anonymous
    request:
      method: POST
      path: '/papers/{{paper_2}}/withdraw'
      headers:
        authorization: 'Bearer khong-phai-token-that'
        content-type: 'application/json'
      body_raw: '{"version":1}'
  - id: stranger_withdraws
    as: stranger
    request:
      method: POST
      path: '/papers/{{paper_2}}/withdraw'
      headers:
        content-type: 'application/json'
      body_raw: '{"version":1}'
  - id: owner_withdraws
    as: owner
    request:
      method: POST
      path: '/papers/{{paper_2}}/withdraw'
      headers:
        content-type: 'application/json'
      body_raw: '{"version":1}'
  - id: mate_drafts
    as: mate
    request:
      method: POST
      path: '/contexts/{{pair}}/papers/draft'
    bind:
      paper_3: {from: body, pointer: /id, class: uuid}
  - id: junk_bearer_skips
    as: anonymous
    request:
      method: POST
      path: '/papers/{{paper_3}}/skip'
      headers:
        authorization: 'Bearer khong-phai-token-that'
  - id: owner_skips_mates_draft
    as: owner
    request:
      method: POST
      path: '/papers/{{paper_3}}/skip'
  - id: mate_skips
    as: mate
    request:
      method: POST
      path: '/papers/{{paper_3}}/skip'
  - id: owner_lists_end
    as: owner
    request:
      method: GET
      path: '/contexts/{{pair}}/papers'
