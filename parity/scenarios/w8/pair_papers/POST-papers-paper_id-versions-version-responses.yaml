      body_raw: '{"kind":"de_nghi_sua","content":{"ngay":"2026-09-01","chang":[{"gio":"19:30","viec":"Lẩu nấm (dữ liệu mẫu)"}]},"ly_do":"  Muộn hơn nửa tiếng (dữ liệu mẫu)  "}'
