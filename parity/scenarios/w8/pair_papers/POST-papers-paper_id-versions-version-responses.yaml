# W8 · POST /papers/{id}/versions/{version}/responses. A body told apart by `kind`
# (the generated corpus defers the route: the path version is an int). The version must
# exist, then roles, then version_current before is_not_version_sender. dong_y from the
# second person makes chot and one outing in the same request; a repeated dong_y is
# answered with the sheet's state now. de_nghi_sua writes a new version sent and agreed
# by its author, and is 409 paper_frozen on a plan. Texts are sample data.
id: w8/pair_papers/post-papers-paper_id-versions-version-responses
routes: ['POST /papers/{paper_id}/versions/{version}/responses']
auth_mode: dev
personas:
  owner: {}
  mate: {}
  stranger: {}
steps:
  - id: anonymous_responds
    as: anonymous
    request:
      method: POST
      path: '/papers/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/versions/1/responses'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"dong_y"}'
  - id: stranger_responds_unknown
    as: stranger
    request:
      method: POST
      path: '/papers/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/versions/1/responses'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"dong_y"}'
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người mở sổ (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người kia (dữ liệu mẫu)"}'
  - id: owner_asks_mate_friendship
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.mate}}"}'
    bind:
      fr_owner_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts_owner_friendship
    as: mate
    request:
      method: POST
      path: '/friends/requests/{{fr_owner_mate}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: owner_opens_pair
    as: owner
    request:
      method: POST
      path: '/people/{{persona.mate}}/dm'
    bind:
      pair: {from: body, pointer: /id, class: uuid}
  - id: owner_proposes_lap_so
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
    bind:
      lap_so: {from: body, pointer: /id, class: uuid}
  - id: mate_grants_lap_so
    as: mate
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals/{{lap_so}}/grant'
  - id: owner_drafts
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/papers/draft'
    bind:
      paper: {from: body, pointer: /id, class: uuid}
  - id: owner_agrees_own_draft
    as: owner
    request:
      method: POST
      path: '/papers/{{paper}}/versions/1/responses'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"dong_y"}'
  - id: mate_agrees_owner_draft
    as: mate
    request:
      method: POST
      path: '/papers/{{paper}}/versions/1/responses'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"dong_y"}'
  - id: owner_counter_own_draft
    as: owner
    request:
      method: POST
      path: '/papers/{{paper}}/versions/1/responses'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"de_nghi_sua","content":{"ngay":"2026-09-01","chang":[{"gio":"19:00","viec":"Ăn tối (dữ liệu mẫu)"}]}}'
  - id: owner_dates
    as: owner
    request:
      method: PATCH
      path: '/papers/{{paper}}/draft'
      headers:
        content-type: 'application/json'
      body_raw: '{"content":{"ngay":"2026-09-01","chang":[{"gio":"19:00","viec":"Ăn tối (dữ liệu mẫu)"}]}}'
  - id: owner_sends
    as: owner
    request:
      method: POST
      path: '/papers/{{paper}}/send'
      headers:
        content-type: 'application/json'
      body_raw: '{"version":1}'
  - id: owner_agrees_own_sent
    as: owner
    request:
