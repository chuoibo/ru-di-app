# W8 · POST /contexts/{id}/notebook/proposals. Asking writes the asker's own grant. A
# rung above lap_so is 409 consent_missing until the cycle is active, whether nothing,
# a pending cycle or a closed one stands; lap_so itself may be asked again at any time
# and piles up offers. A pair whose other member ended their account has one active
# member and no cycle: 409 cycle_not_active. The header key replays, and the same key
# from the other person runs again. Texts are sample data (dữ liệu mẫu).
id: w8/pair_notebooks/post-contexts-context_id-notebook-proposals
routes: ['POST /contexts/{context_id}/notebook/proposals']
auth_mode: dev
personas:
  owner: {}
  mate: {}
  leaver: {}
  stranger: {}
steps:
  - id: anonymous_proposes
    as: anonymous
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
  - id: stranger_proposes_unknown
    as: stranger
    request:
      method: POST
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người mở sổ (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người kia (dữ liệu mẫu)"}'
  - id: register_leaver
    as: leaver
    request:
      method: PUT
      path: '/people/{{persona.leaver}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người rời đi (dữ liệu mẫu)"}'
  - id: owner_asks_mate_friendship
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.mate}}"}'
    bind:
      fr_owner_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts_owner_friendship
    as: mate
    request:
      method: POST
      path: '/friends/requests/{{fr_owner_mate}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: owner_opens_pair
    as: owner
    request:
      method: POST
      path: '/people/{{persona.mate}}/dm'
    bind:
      pair: {from: body, pointer: /id, class: uuid}
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm bạn không phải sổ đôi (dữ liệu mẫu)"}'
    bind:
      grp: {from: body, pointer: /id, class: uuid}
  - id: owner_asks_leaver_friendship
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.leaver}}"}'
    bind:
      fr_owner_leaver: {from: body, pointer: /id, class: uuid}
  - id: leaver_accepts_owner_friendship
    as: leaver
    request:
      method: POST
      path: '/friends/requests/{{fr_owner_leaver}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: owner_opens_lone
    as: owner
    request:
      method: POST
      path: '/people/{{persona.leaver}}/dm'
    bind:
      lone: {from: body, pointer: /id, class: uuid}
  - id: owner_proposes_in_group
    as: owner
    request:
      method: POST
      path: '/contexts/{{grp}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
  - id: stranger_proposes_in_pair
    as: stranger
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
  # the body is validated before the pair is looked up
  - id: stranger_unknown_purpose_in_pair
    as: stranger
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"khong_co"}'
  - id: owner_proposes_bat_doi_first
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"bat_doi"}'
  - id: owner_proposes_doc_chat_first
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"doc_chat"}'
  - id: owner_proposes_as_advancer
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        x-actor-roles: 'advancer'
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
  - id: owner_proposes_lap_so
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
    bind:
      p1: {from: body, pointer: /id, class: uuid}
  - id: owner_proposes_lap_so_again
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
    bind:
      p2: {from: body, pointer: /id, class: uuid}
  - id: mate_proposes_lap_so
    as: mate
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
    bind:
      p3: {from: body, pointer: /id, class: uuid}
  - id: owner_proposes_bat_doi_while_pending
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"bat_doi"}'
  - id: mate_grants_p1
    as: mate
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals/{{p1}}/grant'
  - id: owner_proposes_bat_doi
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"bat_doi"}'
    bind:
      p4: {from: body, pointer: /id, class: uuid}
  - id: mate_proposes_doc_chat
    as: mate
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"doc_chat"}'
  - id: owner_proposes_lap_so_while_active
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
  - id: owner_reads_offers
    as: owner
    request:
      method: GET
      path: '/contexts/{{pair}}/notebook'
  - id: owner_purpose_uppercase
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"LAP_SO"}'
  - id: owner_purpose_missing
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{}'
  - id: owner_purpose_null
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":null}'
  - id: owner_purpose_number
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":2}'
  - id: owner_extra_field
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so","cycle_id":"aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee"}'
  - id: owner_purpose_list
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":["lap_so"]}'
  - id: owner_header_key
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        idempotency-key: 'w8-de-nghi-a'
        content-type: 'application/json'
      body_raw: '{"purpose":"doc_chat"}'
  - id: owner_replays_header_key
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        idempotency-key: 'w8-de-nghi-a'
        content-type: 'application/json'
      body_raw: '{"purpose":"doc_chat"}'
  - id: owner_header_key_other_body
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        idempotency-key: 'w8-de-nghi-a'
        content-type: 'application/json'
      body_raw: '{"purpose":"bat_doi"}'
  - id: owner_empty_header_key
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        idempotency-key: ''
        content-type: 'application/json'
      body_raw: '{"purpose":"doc_chat"}'
  # dev scope is the raw X-Actor-ID: mate's request runs
  - id: mate_uses_owner_header_key
    as: mate
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        idempotency-key: 'w8-de-nghi-a'
        content-type: 'application/json'
      body_raw: '{"purpose":"doc_chat"}'
  - id: leaver_ends_account
    as: leaver
    request:
      method: DELETE
      path: '/people/me'
      headers:
        content-type: 'application/json'
      body_raw: '{"confirm":true}'
  # one active member and no cycle yet
  - id: owner_proposes_in_lone_pair
    as: owner
    request:
      method: POST
      path: '/contexts/{{lone}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
  - id: leaver_proposes_after_leaving
    as: leaver
    request:
      method: POST
      path: '/contexts/{{lone}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
  - id: owner_previews_close
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/close/preview'
    bind:
      rev: {from: body, pointer: /revision, class: token}
  - id: owner_closes
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/close'
      headers:
        content-type: 'application/json'
      body_raw: '{"revision":"{{rev}}"}'
  - id: owner_proposes_bat_doi_after_close
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"bat_doi"}'
  - id: owner_proposes_lap_so_new_cycle
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
  - id: owner_reads_new_cycle
    as: owner
    request:
      method: GET
      path: '/contexts/{{pair}}/notebook'
  - id: mate_blocks_owner
    as: mate
    request:
      method: POST
      path: '/people/{{persona.owner}}/block'
  # a block does not close the notebook
  - id: owner_proposes_after_block
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
