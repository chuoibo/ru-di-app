# W8 · PUT …/notebook/constraints/{kind}. The body is validated first (FastAPI), then the
# kind (404 constraint_kind_unknown, before the context), then the pair, roles, and a
# cycle: none at all is 409 cycle_not_active, while a pending cycle already takes one.
# Each write bumps the owner's version. Content is stripped after the 1..200 bound is
# checked on the raw text; blank after stripping is 422. Hostile texts include HTML, a
# right-to-left override, a zero-width space, emoji at the bound, NUL and a lone
# surrogate. Texts are sample data (dữ liệu mẫu).
id: w8/pair_notebooks/put-contexts-context_id-notebook-constraints-kind
routes: ['PUT /contexts/{context_id}/notebook/constraints/{kind}']
auth_mode: dev
personas:
  owner: {}
  mate: {}
  stranger: {}
steps:
  - id: anonymous_puts
    as: anonymous
    request:
      method: PUT
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/notebook/constraints/dung'
      headers:
        content-type: 'application/json'
      body_raw: '{"content":"Đừng (dữ liệu mẫu)"}'
  - id: stranger_unknown_kind_unknown_context
    as: stranger
    request:
      method: PUT
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/notebook/constraints/so_thich'
      headers:
        content-type: 'application/json'
      body_raw: '{"content":"Cà phê (dữ liệu mẫu)"}'
  - id: stranger_unknown_kind_blank_body
    as: stranger
    request:
      method: PUT
      path: '/contexts/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/notebook/constraints/so_thich'
      headers:
        content-type: 'application/json'
      body_raw: '{"content":"   "}'
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người mở sổ (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người kia (dữ liệu mẫu)"}'
  - id: owner_asks_mate_friendship
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.mate}}"}'
    bind:
      fr_owner_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts_owner_friendship
    as: mate
    request:
      method: POST
      path: '/friends/requests/{{fr_owner_mate}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: owner_opens_pair
    as: owner
    request:
      method: POST
      path: '/people/{{persona.mate}}/dm'
    bind:
      pair: {from: body, pointer: /id, class: uuid}
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm bạn không phải sổ đôi (dữ liệu mẫu)"}'
    bind:
      grp: {from: body, pointer: /id, class: uuid}
  - id: owner_puts_on_fresh_pair
    as: owner
    request:
      method: PUT
      path: '/contexts/{{pair}}/notebook/constraints/dung'
      headers:
        content-type: 'application/json'
      body_raw: '{"content":"Đừng hẹn sớm (dữ liệu mẫu)"}'
  - id: stranger_puts_in_pair
    as: stranger
    request:
      method: PUT
      path: '/contexts/{{pair}}/notebook/constraints/dung'
      headers:
        content-type: 'application/json'
      body_raw: '{"content":"Đừng (dữ liệu mẫu)"}'
  - id: owner_puts_in_group
    as: owner
    request:
      method: PUT
      path: '/contexts/{{grp}}/notebook/constraints/dung'
      headers:
        content-type: 'application/json'
      body_raw: '{"content":"Đừng (dữ liệu mẫu)"}'
  - id: owner_puts_as_advancer
    as: owner
    request:
      method: PUT
      path: '/contexts/{{pair}}/notebook/constraints/dung'
      headers:
        x-actor-roles: 'advancer'
        content-type: 'application/json'
      body_raw: '{"content":"Đừng (dữ liệu mẫu)"}'
  - id: owner_proposes_lap_so
    as: owner
    request:
      method: POST
      path: '/contexts/{{pair}}/notebook/proposals'
      headers:
        content-type: 'application/json'
      body_raw: '{"purpose":"lap_so"}'
    bind:
      lap_so: {from: body, pointer: /id, class: uuid}
  - id: owner_puts_while_pending
    as: owner
    request:
      method: PUT
      path: '/contexts/{{pair}}/notebook/constraints/khong_an_duoc'
      headers:
        content-type: 'application/json'
      body_raw: '{"content":"Không ăn hành (dữ liệu mẫu)"}'
