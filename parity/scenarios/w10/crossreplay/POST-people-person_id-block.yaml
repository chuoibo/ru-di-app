# W10 cross replay · POST /people/{person_id}/block. A 200 stored by one side is replayed
# by the other, both ways, even after the block was lifted; another person under the key
# is reuse; a refusal (404 unknown person) frees the key. Go serves none of these routes
# yet, so both paths reach Python. Texts are sample data (dữ liệu mẫu).
id: w10/crossreplay/post-people-person_id-block
routes: ['POST /people/{person_id}/block']
auth_mode: dev
personas:
  owner: {}
  target: {}
  other: {}
steps:
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người chặn (dữ liệu mẫu)"}'
  - id: register_target
    as: target
    request:
      method: PUT
      path: '/people/{{persona.target}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người bị chặn (dữ liệu mẫu)"}'
  - id: register_other
    as: other
    request:
      method: PUT
      path: '/people/{{persona.other}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người khác (dữ liệu mẫu)"}'
  - id: python_blocks
    as: owner
    via: python
    request:
      method: POST
      path: '/people/{{persona.target}}/block'
      headers:
        idempotency-key: 'b30c0001-aaaa-4aaa-8aaa-aaaaaaaaaaa1'
  - id: front_unblocks
    as: owner
    request:
      method: DELETE
      path: '/people/{{persona.target}}/block'
  - id: front_replays_python
    as: owner
    request:
      method: POST
      path: '/people/{{persona.target}}/block'
      headers:
        idempotency-key: 'b30c0001-aaaa-4aaa-8aaa-aaaaaaaaaaa1'
  - id: front_other_person_same_key
    as: owner
    request:
      method: POST
      path: '/people/{{persona.other}}/block'
      headers:
        idempotency-key: 'b30c0001-aaaa-4aaa-8aaa-aaaaaaaaaaa1'
  - id: front_blocks_with_key
    as: owner
    request:
      method: POST
      path: '/people/{{persona.other}}/block'
      headers:
        idempotency-key: 'b30c0002-aaaa-4aaa-8aaa-aaaaaaaaaaa2'
  - id: python_replays_front
    as: owner
    via: python
    request:
      method: POST
      path: '/people/{{persona.other}}/block'
      headers:
        idempotency-key: 'b30c0002-aaaa-4aaa-8aaa-aaaaaaaaaaa2'
  - id: front_unknown_person_refused
    as: owner
    request:
      method: POST
      path: '/people/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/block'
      headers:
        idempotency-key: 'b30c0003-aaaa-4aaa-8aaa-aaaaaaaaaaa3'
  - id: python_same_key_known_person
    as: owner
    via: python
    request:
      method: POST
      path: '/people/{{persona.target}}/block'
      headers:
        idempotency-key: 'b30c0003-aaaa-4aaa-8aaa-aaaaaaaaaaa3'
  - id: front_replays_python_second
    as: owner
    request:
      method: POST
      path: '/people/{{persona.target}}/block'
      headers:
        idempotency-key: 'b30c0003-aaaa-4aaa-8aaa-aaaaaaaaaaa3'
  - id: python_lists_blocked
    as: owner
    via: python
    request:
      method: GET
      path: '/people/me/blocked'
