# W10 · POST /people/{person_id}/block (ADR-0023 §2.3). Roles, then «not yourself», then
# the person must exist; then the one live edge of the pair becomes blocked with
# decided_by the blocker, or a new blocked row is inserted when there is none (a
# declined edge does not count). Blocking again is 200 without a write, and so is the
# blocked person «blocking back». The file then reads what the wall changes elsewhere:
# friend lists, a new friend request (the silent 409), the public, friends and group
# feeds, a post and its comments, stories, the profile, opening a pair, the pair row
# and writing into the pair. Texts are sample data (dữ liệu mẫu).
id: w10/people/post-people-person_id-block
routes: ['POST /people/{person_id}/block']
auth_mode: dev
personas:
  owner: {}
  target: {}
  asker: {}
  asked: {}
  decliner: {}
  bystander: {}
  leaver: {}
steps:
  - id: anonymous_blocks
    as: anonymous
    request:
      method: POST
      path: '/people/{{persona.target}}/block'
  - id: anonymous_non_uuid
    as: anonymous
    request:
      method: POST
      path: '/people/khong-phai-uuid/block'
  - id: actor_id_not_uuid
    as: owner
    request:
      method: POST
      path: '/people/{{persona.target}}/block'
      headers:
        x-actor-id: 'khong-phai-uuid'
  - id: roles_unknown
    as: owner
    request:
      method: POST
      path: '/people/{{persona.target}}/block'
      headers:
        x-actor-roles: 'khong-co'
  - id: owner_path_not_uuid
    as: owner
    request:
      method: POST
      path: '/people/khong-phai-uuid/block'
  # self is refused before the person is looked up; an unknown id after
  - id: owner_blocks_self_unregistered
    as: owner
    request:
      method: POST
      path: '/people/{{persona.owner}}/block'
  - id: owner_blocks_self_without_roles
    as: owner
    request:
      method: POST
      path: '/people/{{persona.owner}}/block'
      headers:
        x-actor-roles: ''
  - id: owner_blocks_unknown_id
    as: owner
    request:
      method: POST
      path: '/people/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/block'
  - id: owner_blocks_unknown_as_guest
    as: owner
    request:
      method: POST
      path: '/people/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/block'
      headers:
        x-actor-roles: 'guest'
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người chặn (dữ liệu mẫu)"}'
  - id: register_target
    as: target
    request:
      method: PUT
      path: '/people/{{persona.target}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người bị chặn (dữ liệu mẫu)"}'
  - id: register_asker
    as: asker
    request:
      method: PUT
      path: '/people/{{persona.asker}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người hỏi (dữ liệu mẫu)"}'
  - id: register_asked
    as: asked
    request:
      method: PUT
      path: '/people/{{persona.asked}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người được hỏi (dữ liệu mẫu)"}'
  - id: register_decliner
    as: decliner
    request:
      method: PUT
      path: '/people/{{persona.decliner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người bị từ chối (dữ liệu mẫu)"}'
  - id: register_bystander
    as: bystander
    request:
      method: PUT
      path: '/people/{{persona.bystander}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người ngoài (dữ liệu mẫu)"}'
  - id: register_leaver
    as: leaver
    request:
      method: PUT
      path: '/people/{{persona.leaver}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Người sẽ rời (dữ liệu mẫu)"}'
  - id: owner_blocks_self
    as: owner
    request:
      method: POST
      path: '/people/{{persona.owner}}/block'
  - id: owner_blocks_target_without_roles
    as: owner
    request:
      method: POST
      path: '/people/{{persona.target}}/block'
      headers:
        x-actor-roles: 'advancer'
  # the world the wall will cut: a friendship, a group, a pair, posts, a comment, a story
  - id: owner_asks_target
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.target}}"}'
    bind:
      fr_target: {from: body, pointer: /id, class: uuid}
  - id: target_accepts
    as: target
    request:
      method: POST
      path: '/friends/requests/{{fr_target}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: owner_creates_group
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm chung (dữ liệu mẫu)"}'
    bind:
      ctx: {from: body, pointer: /id, class: uuid}
  - id: owner_invites_target
    as: owner
    request:
      method: POST
      path: '/contexts/{{ctx}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.target}}"}'
    bind:
      m_target: {from: body, pointer: /id, class: uuid}
  - id: target_joins_group
    as: target
    request:
      method: POST
      path: '/memberships/{{m_target}}/accept'
  - id: owner_opens_pair
    as: owner
    request:
      method: POST
      path: '/people/{{persona.target}}/dm'
    bind:
      pair: {from: body, pointer: /id, class: uuid}
  - id: target_uploads_photo
    as: target
    request:
      method: POST
      path: '/people/me/photos'
      headers:
        content-type: 'multipart/form-data; boundary=parityboundary'
      body_parts:
        - {name: file, filename: mau.jpg, content_type: image/jpeg, image: {format: jpeg, width: 16, height: 12, seed: 101}}
    bind:
      target_photo: {from: body, pointer: /id, class: uuid}
  - id: target_story
    as: target
    request:
      method: POST
      path: '/stories'
      headers:
        content-type: 'application/json'
      body_raw: '{"image_url":"/people/{{persona.target}}/photos/{{target_photo}}","caption":"Hoàng hôn (dữ liệu mẫu)"}'
  - id: target_posts_public
    as: target
    request:
      method: POST
      path: '/posts'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"Công khai của người bị chặn (dữ liệu mẫu)","audience":"public"}'
    bind:
      target_public: {from: body, pointer: /id, class: uuid}
  - id: target_posts_friends
    as: target
    request:
      method: POST
      path: '/posts'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"Cho bạn bè (dữ liệu mẫu)","audience":"friends"}'
  - id: target_posts_group
    as: target
    request:
      method: POST
      path: '/posts'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"Cho nhóm chung (dữ liệu mẫu)","audience":"group","context_id":"{{ctx}}"}'
    bind:
      target_group_post: {from: body, pointer: /id, class: uuid}
  - id: owner_posts_public
    as: owner
    request:
      method: POST
      path: '/posts'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"Công khai của người chặn (dữ liệu mẫu)","audience":"public"}'
    bind:
      owner_public: {from: body, pointer: /id, class: uuid}
  - id: target_comments_on_owner_post
    as: target
    request:
      method: POST
      path: '/posts/{{owner_public}}/comments'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"Bình luận trước khi bị chặn (dữ liệu mẫu)"}'
  - id: owner_reads_feed_before
    as: owner
    request:
      method: GET
      path: '/posts'
  - id: owner_reads_stories_before
    as: owner
    request:
      method: GET
      path: '/stories'
  - id: owner_lists_friends_before
    as: owner
    request:
      method: GET
      path: '/people/{{persona.owner}}/friends'
  # the block
  - id: owner_blocks_target
    as: owner
    request:
      method: POST
      path: '/people/{{persona.target}}/block'
  - id: owner_blocks_target_again
    as: owner
    request:
      method: POST
      path: '/people/{{persona.target}}/block'
  - id: owner_blocks_target_with_key
    as: owner
    request:
      method: POST
      path: '/people/{{persona.target}}/block'
      headers:
        idempotency-key: 'b10c0001-aaaa-4aaa-8aaa-aaaaaaaaaaa1'
  - id: owner_replays_key
    as: owner
    request:
      method: POST
      path: '/people/{{persona.target}}/block'
      headers:
        idempotency-key: 'b10c0001-aaaa-4aaa-8aaa-aaaaaaaaaaa1'
  - id: owner_key_other_person
    as: owner
    request:
      method: POST
      path: '/people/{{persona.bystander}}/block'
      headers:
        idempotency-key: 'b10c0001-aaaa-4aaa-8aaa-aaaaaaaaaaa1'
  - id: owner_blocks_with_json_body
    as: owner
    request:
      method: POST
      path: '/people/{{persona.target}}/block'
      headers:
        content-type: 'application/json'
      body_raw: '{"state":"declined"}'
  # the blocked side pressing block on the blocker changes nothing and says blocked
  - id: target_blocks_owner_back
    as: target
    request:
      method: POST
      path: '/people/{{persona.owner}}/block'
  - id: target_lists_own_blocks
    as: target
    request:
      method: GET
      path: '/people/me/blocked'
  - id: owner_lists_own_blocks
    as: owner
    request:
      method: GET
      path: '/people/me/blocked'
  # what the wall changes elsewhere
  - id: owner_lists_friends_after
    as: owner
    request:
      method: GET
      path: '/people/{{persona.owner}}/friends'
  - id: target_lists_friends_after
    as: target
    request:
      method: GET
      path: '/people/{{persona.target}}/friends'
  - id: target_asks_owner_again
    as: target
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.owner}}"}'
  - id: owner_asks_target_again
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.target}}"}'
  - id: owner_reads_feed_after
    as: owner
    request:
      method: GET
      path: '/posts'
  - id: target_reads_feed_after
    as: target
    request:
      method: GET
      path: '/posts'
  - id: owner_reads_target_wall_after
    as: owner
    request:
      method: GET
      path: '/people/{{persona.target}}/posts'
  - id: target_reads_owner_post_after
    as: target
    request:
      method: GET
      path: '/posts/{{owner_public}}'
  - id: target_reads_owner_post_comments_after
    as: target
    request:
      method: GET
      path: '/posts/{{owner_public}}/comments'
  - id: target_comments_after
    as: target
    request:
      method: POST
      path: '/posts/{{owner_public}}/comments'
      headers:
        content-type: 'application/json'
      body_raw: '{"body":"Bình luận sau khi bị chặn (dữ liệu mẫu)"}'
  - id: owner_reads_target_group_post_after
    as: owner
    request:
      method: GET
      path: '/posts/{{target_group_post}}'
  - id: owner_reads_target_public_post_after
    as: owner
    request:
      method: GET
      path: '/posts/{{target_public}}'
  - id: owner_reads_stories_after
    as: owner
    request:
      method: GET
      path: '/stories'
  - id: owner_reads_target_story_photo_after
    as: owner
    request:
      method: GET
      path: '/people/{{persona.target}}/photos/{{target_photo}}'
  - id: owner_reads_target_profile_after
    as: owner
    request:
      method: GET
      path: '/people/{{persona.target}}'
  - id: target_opens_pair_after
    as: target
    request:
      method: POST
      path: '/people/{{persona.owner}}/dm'
  - id: target_lists_contexts_after
    as: target
    request:
      method: GET
      path: '/people/me/contexts'
  - id: target_writes_in_pair_after
    as: target
    request:
      method: POST
      path: '/contexts/{{pair}}/messages'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"text","body":"Còn đó không? (dữ liệu mẫu)"}'
  - id: target_writes_in_group_after
    as: target
    request:
      method: POST
      path: '/contexts/{{ctx}}/messages'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"text","body":"Nhóm vẫn nói được (dữ liệu mẫu)"}'
  # the other starting edges: my pending request, a request to me, a declined one
  - id: owner_asks_asker
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.asker}}"}'
  - id: owner_blocks_own_pending
    as: owner
    request:
      method: POST
      path: '/people/{{persona.asker}}/block'
  - id: asked_asks_owner
    as: asked
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.owner}}"}'
  - id: owner_blocks_incoming_pending
    as: owner
    request:
      method: POST
      path: '/people/{{persona.asked}}/block'
  - id: decliner_asks_owner
    as: decliner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.owner}}"}'
    bind:
      fr_decliner: {from: body, pointer: /id, class: uuid}
  - id: owner_declines
    as: owner
    request:
      method: POST
      path: '/friends/requests/{{fr_decliner}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"decline"}'
  - id: owner_blocks_after_decline
    as: owner
    request:
      method: POST
      path: '/people/{{persona.decliner}}/block'
  - id: bystander_blocks_owner
    as: bystander
    request:
      method: POST
      path: '/people/{{persona.owner}}/block'
  - id: owner_blocks_bystander_back
    as: owner
    request:
      method: POST
      path: '/people/{{persona.bystander}}/block'
  - id: owner_lists_blocks_after_variants
    as: owner
    request:
      method: GET
      path: '/people/me/blocked'
  # an ended account is still a row: blocking it is 200
  - id: leaver_ends_account
    as: leaver
    request:
      method: DELETE
      path: '/people/me'
      headers:
        content-type: 'application/json'
      body_raw: '{"confirm":true}'
  - id: owner_blocks_ended_account
    as: owner
    request:
      method: POST
      path: '/people/{{persona.leaver}}/block'
  # framework doors
  - id: trailing_slash
    as: owner
    request:
      method: POST
      path: '/people/{{persona.target}}/block/'
  - id: get_not_allowed
    as: owner
    request:
      method: GET
      path: '/people/{{persona.target}}/block'
