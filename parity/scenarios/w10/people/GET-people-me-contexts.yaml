# W10 · GET /people/me/contexts: the caller's conversation list, read from the roster
# and the feed on every call (X-Actor-Contexts is not consulted). Invited and active
# rows, not left ones; newest last message first, rows without a message last by name;
# unread counts other people's messages after the read mark; member_count counts ACTIVE
# memberships. A pair is named after the other person, carries counterpart, and says
# unavailable when a block stands; when the other side ended their account the row
# loses its counterpart. Texts are sample data (dữ liệu mẫu).
id: w10/people/get-people-me-contexts
routes: ['GET /people/me/contexts']
auth_mode: dev
personas:
  owner: {}
  mate: {}
  host: {}
  friend: {}
  leaver: {}
  pending: {}
steps:
  - id: anonymous_lists
    as: anonymous
    request:
      method: GET
      path: '/people/me/contexts'
  - id: actor_id_not_uuid
    as: owner
    request:
      method: GET
      path: '/people/me/contexts'
      headers:
        x-actor-id: 'khong-phai-uuid'
  - id: roles_unknown
    as: owner
    request:
      method: GET
      path: '/people/me/contexts'
      headers:
        x-actor-roles: 'khong-co'
  - id: contexts_not_uuid
    as: owner
    request:
      method: GET
      path: '/people/me/contexts'
      headers:
        x-actor-contexts: 'khong-phai-uuid'
  - id: owner_lists_without_roles
    as: owner
    request:
      method: GET
      path: '/people/me/contexts'
      headers:
        x-actor-roles: 'advancer,recipient'
  - id: owner_lists_unregistered
    as: owner
    request:
      method: GET
      path: '/people/me/contexts'
  - id: register_owner
    as: owner
    request:
      method: PUT
      path: '/people/{{persona.owner}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ (dữ liệu mẫu)"}'
  - id: register_mate
    as: mate
    request:
      method: PUT
      path: '/people/{{persona.mate}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn cùng nhóm (dữ liệu mẫu)"}'
  - id: register_host
    as: host
    request:
      method: PUT
      path: '/people/{{persona.host}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chủ nhóm khác (dữ liệu mẫu)"}'
  - id: register_friend
    as: friend
    request:
      method: PUT
      path: '/people/{{persona.friend}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn thân (dữ liệu mẫu)"}'
  - id: register_leaver
    as: leaver
    request:
      method: PUT
      path: '/people/{{persona.leaver}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Bạn sẽ rời (dữ liệu mẫu)"}'
  - id: register_pending
    as: pending
    request:
      method: PUT
      path: '/people/{{persona.pending}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Chưa nhận lời (dữ liệu mẫu)"}'
  - id: owner_lists_nothing_yet
    as: owner
    request:
      method: GET
      path: '/people/me/contexts'
  # three groups: one owned, one to leave, one the owner is only invited to
  - id: owner_creates_alpha
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm Bê (dữ liệu mẫu)"}'
    bind:
      alpha: {from: body, pointer: /id, class: uuid}
  - id: owner_creates_beta
    as: owner
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm A (dữ liệu mẫu)"}'
    bind:
      beta: {from: body, pointer: /id, class: uuid}
  - id: host_creates_gamma
    as: host
    request:
      method: POST
      path: '/contexts'
      headers:
        content-type: 'application/json'
      body_raw: '{"display_name":"Nhóm Xê (dữ liệu mẫu)"}'
    bind:
      gamma: {from: body, pointer: /id, class: uuid}
  - id: host_invites_owner
    as: host
    request:
      method: POST
      path: '/contexts/{{gamma}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.owner}}"}'
  - id: owner_invites_mate_alpha
    as: owner
    request:
      method: POST
      path: '/contexts/{{alpha}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.mate}}"}'
    bind:
      m_mate: {from: body, pointer: /id, class: uuid}
  - id: mate_accepts_alpha
    as: mate
    request:
      method: POST
      path: '/memberships/{{m_mate}}/accept'
  - id: owner_invites_pending_alpha
    as: owner
    request:
      method: POST
      path: '/contexts/{{alpha}}/members'
      headers:
        content-type: 'application/json'
      body_raw: '{"person_id":"{{persona.pending}}"}'
  - id: owner_lists_without_messages
    as: owner
    request:
      method: GET
      path: '/people/me/contexts'
  - id: owner_lists_claiming_contexts
    as: owner
    request:
      method: GET
      path: '/people/me/contexts'
      headers:
        x-actor-contexts: 'aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee'
  # messages: order, unread, preview, author name; theme
  - id: owner_writes_beta
    as: owner
    request:
      method: POST
      path: '/contexts/{{beta}}/messages'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"text","body":"Tin đầu tiên của nhóm A (dữ liệu mẫu)"}'
  - id: mate_writes_alpha_first
    as: mate
    request:
      method: POST
      path: '/contexts/{{alpha}}/messages'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"text","body":"Một (dữ liệu mẫu)"}'
    bind:
      alpha_first: {from: body, pointer: /id, class: uuid}
  - id: mate_writes_alpha_second
    as: mate
    request:
      method: POST
      path: '/contexts/{{alpha}}/messages'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"text","body":"Hai, một câu dài hơn để xem phần xem trước có bị cắt hay không khi danh sách hiện nó ra (dữ liệu mẫu)"}'
    bind:
      alpha_second: {from: body, pointer: /id, class: uuid}
  - id: owner_themes_alpha
    as: owner
    request:
      method: PATCH
      path: '/contexts/{{alpha}}'
      headers:
        content-type: 'application/json'
      body_raw: '{"theme":"hoang-hon"}'
  - id: owner_lists_unread
    as: owner
    request:
      method: GET
      path: '/people/me/contexts'
  - id: mate_lists_own_view
    as: mate
    request:
      method: GET
      path: '/people/me/contexts'
  - id: owner_marks_first_read
    as: owner
    request:
      method: PUT
      path: '/contexts/{{alpha}}/read-mark'
      headers:
        content-type: 'application/json'
      body_raw: '{"message_id":"{{alpha_first}}"}'
  - id: owner_lists_after_mark
    as: owner
    request:
      method: GET
      path: '/people/me/contexts'
  - id: mate_deletes_second
    as: mate
    request:
      method: DELETE
      path: '/contexts/{{alpha}}/messages/{{alpha_second}}'
  - id: owner_lists_after_delete
    as: owner
    request:
      method: GET
      path: '/people/me/contexts'
  # a pair, then a block on it
  - id: owner_asks_friend
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.friend}}"}'
    bind:
      fr_friend: {from: body, pointer: /id, class: uuid}
  - id: friend_accepts
    as: friend
    request:
      method: POST
      path: '/friends/requests/{{fr_friend}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: owner_opens_pair
    as: owner
    request:
      method: POST
      path: '/people/{{persona.friend}}/dm'
  - id: owner_lists_with_pair
    as: owner
    request:
      method: GET
      path: '/people/me/contexts'
  - id: friend_blocks_owner
    as: friend
    request:
      method: POST
      path: '/people/{{persona.owner}}/block'
  - id: owner_lists_blocked_pair
    as: owner
    request:
      method: GET
      path: '/people/me/contexts'
  - id: friend_lists_blocked_pair
    as: friend
    request:
      method: GET
      path: '/people/me/contexts'
  # leaving a group removes its row; an ended counterpart leaves the pair without one
  - id: owner_leaves_beta
    as: owner
    request:
      method: DELETE
      path: '/contexts/{{beta}}/members/{{persona.owner}}'
  - id: owner_asks_leaver
    as: owner
    request:
      method: POST
      path: '/friends/requests'
      headers:
        content-type: 'application/json'
      body_raw: '{"addressee_id":"{{persona.leaver}}"}'
    bind:
      fr_leaver: {from: body, pointer: /id, class: uuid}
  - id: leaver_accepts
    as: leaver
    request:
      method: POST
      path: '/friends/requests/{{fr_leaver}}/respond'
      headers:
        content-type: 'application/json'
      body_raw: '{"decision":"accept"}'
  - id: leaver_opens_pair
    as: leaver
    request:
      method: POST
      path: '/people/{{persona.owner}}/dm'
    bind:
      leaver_pair: {from: body, pointer: /id, class: uuid}
  - id: leaver_writes_pair
    as: leaver
    request:
      method: POST
      path: '/contexts/{{leaver_pair}}/messages'
      headers:
        content-type: 'application/json'
      body_raw: '{"kind":"text","body":"Mình sắp đi (dữ liệu mẫu)"}'
  - id: leaver_ends_account
    as: leaver
    request:
      method: DELETE
      path: '/people/me'
      headers:
        content-type: 'application/json'
      body_raw: '{"confirm":true}'
  - id: owner_lists_after_counterpart_ended
    as: owner
    request:
      method: GET
      path: '/people/me/contexts'
  - id: leaver_lists_after_own_erasure
    as: leaver
    request:
      method: GET
      path: '/people/me/contexts'
  # framework doors
  - id: owner_lists_with_query
    as: owner
    request:
      method: GET
      path: '/people/me/contexts?limit=1'
  - id: trailing_slash
    as: owner
    request:
      method: GET
      path: '/people/me/contexts/'
  - id: post_not_allowed
    as: owner
    request:
      method: POST
      path: '/people/me/contexts'
