# Stack RuDi chạy trên DB và MinIO của máy vnlocal.
#
# Khác docker-compose.yml ở gốc repo (máy dev, Postgres cục bộ, seed dữ liệu
# bịa) ở ba chỗ:
#   - không có dịch vụ postgres: DB `rudi` nằm trên máy vnlocal
#     (vnlocal HANDOFF-RUDI-TRA-LOI.md), DSN lấy từ file bí mật
#   - không seed: danh mục đến từ `rudi-ingest sync`, không bao giờ từ
#     app.places.seed_catalog
#   - thêm dịch vụ `ingest`: kéo danh mục mỗi 10 phút, ghi ảnh vào cùng volume
#     mà API đọc
#
# Chạy từ gốc repo, QUA up.sh (nó phân giải tên máy vnlocal
# lakiet-Surface-Laptop-3.local — máy đó đổi mạng/IP — và truyền IP vào container):
#   deploy/vnlocal/up.sh up -d --build
#
# Bí mật (không commit, mode 600):
#   ~/.config/rudi/vnlocal.env  MOBILE_DATABASE_URL, VNLOCAL_PG_DSN, VNLOCAL_S3_*
#   ~/.config/rudi/stack.env    MOBILE_INTERNAL_TOKEN, MOBILE_PERSON_ID_KEY,
#                               MOBILE_OTP_DEBUG_CODE (chỉ khi chưa có cổng SMS)
#   ~/.config/rudi/milvus.env   MOBILE_MILVUS_USER/_PASSWORD — sinh bằng
#                               deploy/vnlocal/milvus-khoi-tao.sh (chạy một lần)
#   .env ở gốc repo             GEMINI_API_KEY, AGY_PROXY_*, OPEN_ROUTER_API_KEY
#                               — chỉ cấp cho dịch vụ AI (ADR-0049)
#
# Milvus GPU (ADR-0049): `milvus` chạy trên GPU 0; index dense HNSW mặc định,
# RUDI_MILVUS_DENSE_INDEX=GPU_CAGRA bật index GPU (chủ sản phẩm 2026-09-28). Nạp danh mục:
#   deploy/vnlocal/up.sh run --rm rag v-build place --auto
name: rudi-vnlocal

x-api-image: &api-image
  build:
    context: ../../services/api
  image: rudi-vnlocal/api:dev

x-core-image: &core-image
  build:
    context: ../../services/core
  image: rudi-vnlocal/core:dev

x-secrets: &secrets
  env_file:
    - ${HOME}/.config/rudi/vnlocal.env
    - ${HOME}/.config/rudi/stack.env
  # The vnlocal machine by name (mDNS). A container cannot resolve .local:
  # deploy/vnlocal/up.sh resolves it on the host and passes the IP here.
  extra_hosts:
    - "${RUDI_VNLOCAL_HOST:-lakiet-Surface-Laptop-3.local}:${RUDI_VNLOCAL_IP:?chạy qua deploy/vnlocal/up.sh (phân giải tên máy vnlocal)}"

# Milvus and the AI keys go only to the services that use them: Milvus
# credentials from ~/.config/rudi/milvus.env (deploy/vnlocal/milvus-khoi-tao.sh),
# the AI keys (GEMINI_API_KEY for embeddings, AGY_PROXY_URL/KEY, OPEN_ROUTER_API_KEY)
# from the repo root .env, which is gitignored (ADR-0049).
x-ai-secrets: &ai-secrets
  env_file:
    - ${HOME}/.config/rudi/vnlocal.env
    - ${HOME}/.config/rudi/stack.env
    - ${HOME}/.config/rudi/milvus.env
    - path: ../../.env
      required: false
  # The vnlocal machine by name (mDNS). A container cannot resolve .local:
  # deploy/vnlocal/up.sh resolves it on the host and passes the IP here.
  extra_hosts:
    - "${RUDI_VNLOCAL_HOST:-lakiet-Surface-Laptop-3.local}:${RUDI_VNLOCAL_IP:?chạy qua deploy/vnlocal/up.sh (phân giải tên máy vnlocal)}"

x-milvus-env: &milvus-env
  MOBILE_MILVUS_ADDR: milvus:19530
  MOBILE_MILVUS_DENSE_INDEX: ${RUDI_MILVUS_DENSE_INDEX:-HNSW}

x-env: &env
  MOBILE_AUTH_MODE: ${MOBILE_AUTH_MODE:-prod}
  MOBILE_MEDIA_ROOT: /var/lib/rudi/media

services:
  # Một lần rồi thoát, theo thứ tự: Alembic → bảng Go của chat → bảng nạp danh mục.
  migrate:
    <<: [*api-image, *secrets]
    command: ["alembic", "upgrade", "head"]
    environment: *env
    restart: "no"

  migrate-chat:
    <<: [*core-image, *secrets]
    command: ["migrate-chat"]
    environment: *env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  migrate-ingest:
    <<: [*core-image, *secrets]
    entrypoint: ["/rudi-ingest"]
    command: ["migrate"]
    environment: *env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  migrate-rag:
    <<: [*core-image, *secrets]
    command: ["migrate-rag"]
    environment: *env
    depends_on:
      migrate-chat:
        condition: service_completed_successfully
    restart: "no"

  migrate-rag-vector:
    <<: [*core-image, *secrets]
    command: ["migrate-rag-vector"]
    environment: *env
    depends_on:
      migrate-rag:
        condition: service_completed_successfully
    restart: "no"

  # Milvus standalone on the GPU (ADR-0049 §2.6): same server layout as the
  # Milvus tier (embedded etcd, local storage, woodpecker, auth on), config
  # and root password from deploy/vnlocal/milvus-khoi-tao.sh. Loopback only.
  milvus:
    image: milvusdb/milvus:v3.0.2-gpu
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    volumes:
      - ${HOME}/.config/rudi/milvus/user.yaml:/milvus/configs/user.yaml:ro
      - ${HOME}/.config/rudi/milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
      - rudi-milvus-data:/var/lib/milvus
    ports:
      - "127.0.0.1:${RUDI_MILVUS_PORT:-19530}:19530"
      - "127.0.0.1:${RUDI_MILVUS_HTTP_PORT:-9091}:9091"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9091/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30
    restart: unless-stopped

  # The vector index's only long-running writer: drains rag_dirty every
  # minute (no broker on this stack) and reconciles the aliases.
  rag-indexer:
    <<: [*core-image, *ai-secrets]
    command: ["rag-indexer"]
    environment:
      <<: [*env, *milvus-env]
      MOBILE_DB_MAX_CONNS: "2"
    healthcheck:
      disable: true
    depends_on:
      migrate-rag-vector:
        condition: service_completed_successfully
      milvus:
        condition: service_healthy
    restart: unless-stopped

  # `core rag …` one-shots (v-build, v-embed-batch, v-eval, v-promote, v-status):
  #   deploy/vnlocal/up.sh run --rm rag v-status
  rag:
    <<: [*core-image, *ai-secrets]
    profiles: ["cli"]
    entrypoint: ["/core", "rag"]
    environment:
      <<: [*env, *milvus-env]
      MOBILE_DB_MAX_CONNS: "4"
    healthcheck:
      disable: true
    depends_on:
      milvus:
        condition: service_healthy
    restart: "no"

  api:
    <<: [*api-image, *secrets]
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *env
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - rudi-media-data:/var/lib/rudi/media
    expose: ["8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)",
        ]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 30
    restart: unless-stopped

  core:
    <<: [*core-image, *secrets]
    environment:
      <<: *env
      MOBILE_PYTHON_UPSTREAM: http://api:8000
      MOBILE_BRAIN_URL: http://api:8000
      # Connection budget on the shared server (rudi_owner CONNECTION LIMIT
      # 40): core 18 + api 15 (SQLAlchemy 5 + overflow 10) + ingest 3 +
      # janitor 1 = 37,
      # leaving room for one-shot migrations and an operator's psql.
      MOBILE_DB_MAX_CONNS: "18"
      # Catalogue snapshot per destination; sync applies a batch every ~10 min.
      MOBILE_CATALOGUE_CACHE_TTL: ${RUDI_CATALOGUE_CACHE_TTL:-30s}
    # Go serves the photo bytes (GET /places/{id}/photos/{photo_id} is
    # owner: go in ownership/routes.json), so it must see the files `ingest`
    # writes -- same volume, same path.
    volumes:
      - rudi-media-data:/var/lib/rudi/media
    ports:
      - "${RUDI_API_PORT:-8124}:8000"
    depends_on:
      api:
        condition: service_healthy
      migrate-chat:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/core", "healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 3s
      retries: 30
    restart: unless-stopped

  # Kéo danh mục từ DB `vnlocal` (keyset synced_at, place_id), áp vào `places`,
  # rồi chép ảnh từ bucket `vnlocal-frames` qua bộ sanitize vào volume media.
  ingest:
    <<: [*core-image, *secrets]
    entrypoint: ["/rudi-ingest"]
    command: ["sync", "--every", "${RUDI_SYNC_EVERY:-10m}"]
    environment:
      <<: *env
      MOBILE_DB_MAX_CONNS: "3"
    volumes:
      - rudi-media-data:/var/lib/rudi/media
    # The image's HEALTHCHECK probes the core server, which this container
    # does not run; a round's success is in its log line instead.
    healthcheck:
      disable: true
    depends_on:
      migrate-ingest:
        condition: service_completed_successfully
    restart: unless-stopped

  # Removes expired OTP challenges, sessions and idempotency keys every 6h,
  # then unlinks files queued for deletion (internal/janitor); audit_events is
  # never touched.
  janitor:
    <<: [*core-image, *secrets]
    command: ["purge-expired", "--every", "6h"]
    environment:
      <<: *env
      MOBILE_DB_MAX_CONNS: "1"
    # Reaps files queued in pending_object_deletes, so it sees the same media.
    volumes:
      - rudi-media-data:/var/lib/rudi/media
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  rudi-media-data:
  rudi-milvus-data:
