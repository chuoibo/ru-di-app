[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rudi-ai-infer"
version = "0.1.0"
description = "Inference-only sidecar: MILCO sparse encoding and mem0 memory extraction (ADR-0031)"
requires-python = ">=3.12,<3.13"
# Exact pins: mem0 changes defaults and signatures between patch releases
# (research mem0.md risk 13). requirements.txt pins the full resolved tree;
# requirements-milco.txt adds the real MILCO runtime (not installed by default).
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "pydantic==2.13.5",
  "mem0ai==2.2.1",
  "google-genai==2.25.0",
  "pymilvus==3.0.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_infer*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "milvus: needs a live Milvus (AI_INFER_TEST_MILVUS_URI); skipped otherwise, a failure when AI_INFER_REQUIRE_MILVUS=1",
]
